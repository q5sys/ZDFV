<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZFS Encryption Keys</title>
<style>
:root {
  --canvas: #1f1f1f;
  --panel: #262626;
  --panel-line: #333;
  --text: #dddddd;
  --muted: #9a9a9a;
  --accent: #ffd43b;
  --node-body: #353535;
  --node-border: #161616;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
  scrollbar-color: #4a4a4a #262626;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
code { font-family: var(--mono); font-size: 0.92em; background: #ffffff12; padding: 0 3px; border-radius: 3px; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--canvas);
  color: var(--text);
  font: 13px/1.4 var(--sans);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

button, .button, select, input {
  font: inherit;
  color: var(--text);
  background: #333;
  border: 1px solid #444;
  border-radius: 5px;
  padding: 3px 9px;
}
button, .button { cursor: pointer; }
button:hover, .button:hover { background: #3d3d3d; border-color: #555; }
button.active { background: #4a4122; border-color: var(--accent); color: #fff; }
button.icon { padding: 2px 7px; }
input[type="search"] { width: 100%; }
a { color: #74c0fc; text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- top bar ---------- */
#topbar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--panel-line);
}
#topbar h1 {
  font-size: 15px;
  margin: 0 6px 0 2px;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex: 0 1 auto;
}
#topbar > * { flex-shrink: 0; }
#topbar > h1 { flex-shrink: 1; }
#topbar button, #topbar .button, #topbar a { white-space: nowrap; }
#commit-link { font-family: var(--mono); font-size: 12px; color: var(--muted); }
#topbar .spacer { flex: 1; }

/* ---------- main layout ---------- */
#layout { flex: 1; display: flex; min-height: 0; }
#left, #right {
  background: var(--panel);
  overflow-y: auto;
  flex: none;
}
#left { width: 280px; border-right: 1px solid var(--panel-line); overflow-x: hidden; }
#right { width: 360px; border-left: 1px solid var(--panel-line); padding: 10px 12px 40px; }
body.hide-left #left, body.hide-right #right { display: none; }

.panel-section { padding: 10px 12px; border-bottom: 1px solid var(--panel-line); }
.panel-section h2, #right h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 0 0 6px;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; }

/* search */
.results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 240px; overflow-y: auto; }
.results li { padding: 3px 6px; border-radius: 4px; cursor: pointer; }
.results li:hover, .results li.first { background: #333; }
.results .kind { color: var(--muted); font-size: 11px; margin-right: 6px; }

/* path list */
.path-cat { margin: 8px 0 2px; font-size: 11px; color: var(--muted); }
.path-item {
  display: block;
  width: 100%;
  white-space: normal;
  text-align: left;
  border: 1px solid transparent;
  background: none;
  padding: 3px 6px;
  border-radius: 4px;
}
.path-item:hover { background: #313131; border-color: transparent; }
.path-item.active { background: #4a4122; border-color: var(--accent); }
.path-item .pid { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; }

/* group filters */
.gfilter { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.gfilter .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.gfilter .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gfilter select { padding: 1px 4px; font-size: 12px; }

/* ---------- canvas ---------- */
#canvas-wrap { flex: 1; position: relative; min-width: 0; overflow: hidden; }
#canvas { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
#canvas.panning { cursor: grabbing; }

.group-frame { stroke-width: 1; }
.group-title { font-size: 18px; font-weight: 700; cursor: move; }
.group-summary { font-size: 11px; fill: var(--muted); pointer-events: none; }

.node { cursor: pointer; }
.node .body { fill: var(--node-body); stroke: var(--node-border); stroke-width: 1; }
.node:hover .body { stroke: #6a6a6a; }
.node .title-text { fill: #eeeeee; font-size: 13px; font-weight: 600; pointer-events: none; }
.node .pill { fill: #00000055; stroke: #ffffff30; }
.node .pill-text { fill: #ddd; font-size: 10px; font-family: var(--mono); }
.node .sock-label { fill: #bdbdbd; font-size: 10px; font-variant: small-caps; letter-spacing: 0.04em; pointer-events: none; }
.node .foot { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
.node .foot.link { cursor: pointer; }
.node .foot.link:hover { fill: #cfcfcf; text-decoration: underline; }
.node .outline { fill: none; stroke: none; pointer-events: none; }
.node.selected .outline { stroke: #fff; stroke-width: 2; }
.node.onpath .outline { stroke: var(--accent); stroke-width: 2; }
.node.current .outline { stroke: var(--accent); stroke-width: 3; }
.node.current .body { filter: url(#glow); }
.node.ctxmark .outline { stroke: #63e6be; stroke-width: 2; stroke-dasharray: 5 3; }
.node.dim { opacity: 0.15; }
.node.proxy .body { stroke-dasharray: 6 4; stroke: #888; }

.wire, .hit, .alt-outline { vector-effect: non-scaling-stroke; }
/* Stroke widths are in screen pixels (non-scaling) and are narrowed when
   zoomed out; --wire-idle and --wire-lit are set by setViewTransform(). */
.wire { fill: none; stroke-width: var(--wire-idle, 2px); opacity: 0.55; pointer-events: none; }
.wire.ctl { stroke-dasharray: 6 4; }
.wire.lit { opacity: 1; stroke-width: var(--wire-lit, 3px); stroke-dasharray: 10 6; animation: flow 0.9s linear infinite; }
.wire.dim { opacity: 0.06; }
.wire.alt { opacity: 0.35; stroke-dasharray: 3 5; }
.wire.current { stroke-width: calc(var(--wire-lit, 3px) + 2px); opacity: 1; }
.wire.cmp-both { stroke: #ffffff !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-a { stroke: #ffd43b !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-b { stroke: #4dabf7 !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
@keyframes flow { to { stroke-dashoffset: -32; } }
@media (prefers-reduced-motion: reduce) { .wire.lit { animation: none; } }

.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; pointer-events: stroke; }
.alt-outline { fill: none; stroke: var(--accent); stroke-width: 6; stroke-dasharray: 4 6; opacity: 0.35; pointer-events: none; }

.badge circle { fill: #1f1f1f; stroke: var(--accent); stroke-width: 1.5; }
.badge text { fill: var(--accent); font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.dot { fill: #fff; stroke: var(--accent); stroke-width: 3; }

#caption {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  max-width: min(760px, 90%);
  background: #262626ee;
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  pointer-events: auto;
}
#caption .ref { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }

#legend {
  position: absolute;
  left: 10px;
  bottom: 10px;
  background: #262626e6;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 12px;
}
#legend .head { cursor: pointer; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
#legend.folded .item { display: none; }
#legend.folded .head { margin-bottom: 0; }
#legend .item { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 1px 2px; border-radius: 3px; }
#legend .item:hover { background: #333; }
#legend .item.off { opacity: 0.35; }
#legend .sw { width: 22px; height: 0; border-top: 3px solid; }
#legend .sw.dashed { border-top-style: dashed; }

#minimap {
  position: absolute;
  right: 10px;
  bottom: 10px;
  background: #1a1a1ae6;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  cursor: crosshair;
}

/* ---------- details panel ---------- */
#details h3 { font-size: 16px; margin: 0 0 4px; }
#details .sub { color: var(--muted); margin-bottom: 8px; }
#details section { margin: 12px 0; }
#details ul { margin: 4px 0; padding-left: 0; list-style: none; }
#details li { margin: 3px 0; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid #0006; }
.ref-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.ref-row .sym { font-family: var(--mono); font-size: 12px; }
.ref-row a { font-family: var(--mono); font-size: 11px; }
.ref-row .copy { font-size: 10px; padding: 0 5px; }
.ref-code { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: pre-wrap; word-break: break-all; margin: 0 0 4px 0; }
.io-row { cursor: pointer; padding: 3px 4px; border-radius: 4px; }
.io-row:hover { background: #313131; }
.io-row .other { font-weight: 600; }
.io-row .lbl { color: var(--muted); display: block; font-size: 12px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 11px; }
.tbl td, .tbl th { border-bottom: 1px solid #333; padding: 3px 4px; vertical-align: top; text-align: left; }
.tbl .on { color: var(--accent); }

.transport { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.transport input[type="range"] { width: 90px; padding: 0; }
.alt-select { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 8px; }
.alt-select select { width: 100%; }
.steps { max-height: 46vh; overflow-y: auto; border: 1px solid #333; border-radius: 6px; }
.step { padding: 3px 6px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #2d2d2d; }
.step:hover { background: #303030; }
.step.cur { background: #4a4122; }
.step.skip { opacity: 0.45; padding-left: 20px; }
.step .alt-head { display: block; font-size: 10px; color: var(--accent); }
.step .n { font-family: var(--mono); color: var(--accent); margin-right: 4px; }
.step .side { font-size: 10px; color: #63e6be; margin-left: 4px; }
.step .note { display: block; color: var(--muted); font-style: italic; }

/* ---------- suite navigation ---------- */
#suite-nav { display: inline-flex; align-items: center; gap: 8px; }
#suite-nav select { max-width: 230px; }
#index-link { font-size: 12px; }
.segmented { display: inline-flex; }
.segmented button { border-radius: 0; }
.segmented button:first-child { border-radius: 5px 0 0 5px; }
.segmented button:last-child { border-radius: 0 5px 5px 0; border-left: none; }
.also-link { display: block; }

/* ---------- timeline view ---------- */
#timeline-view {
  position: absolute;
  inset: 0;
  background: var(--canvas);
  overflow: auto;
  padding: 14px 18px 40px;
}
#tl-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
#tl-title { font-size: 16px; font-weight: 650; }
#tl-strip { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.tl-chip {
  border: 1px solid #444;
  background: #2a2a2a;
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 12px;
  cursor: pointer;
  max-width: 240px;
  text-align: left;
}
.tl-chip .txg { font-family: var(--mono); color: var(--accent); margin-right: 5px; }
.tl-chip.cur { border-color: var(--accent); background: #4a4122; }
#tl-caption {
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: #262626;
  padding: 8px 12px;
  margin-bottom: 14px;
}
#tl-caption .cap { font-weight: 600; }
#tl-caption .note { color: var(--muted); display: block; margin-top: 2px; }
#tl-caption .links { margin-top: 4px; font-size: 12px; }
#tl-caption .links a { margin-right: 10px; }
.tl-row { display: grid; grid-template-columns: 200px 1fr; gap: 10px; margin-bottom: 8px; align-items: start; }
.tl-label {
  background: #2b2b2b;
  border: 1px solid #3a3a3a;
  border-radius: 6px;
  padding: 5px 8px;
  cursor: pointer;
}
.tl-label:hover { border-color: #666; }
.tl-label .name { font-family: var(--mono); font-weight: 650; }
.tl-label .kind { color: var(--muted); font-size: 11px; display: block; }
.tl-lanes { display: flex; flex-direction: column; gap: 4px; }
.tl-lane { display: flex; flex-wrap: wrap; gap: 5px; min-height: 40px; align-items: center; padding: 3px 4px; border-radius: 6px; background: #ffffff06; }
.tl-lane.dead { min-height: 30px; background: #8ce99a14; border-left: 3px solid #8CE99A; }
.tl-lane .lane-tag { font-size: 10px; color: var(--muted); margin-right: 4px; }
.tl-tile {
  width: 52px;
  height: 34px;
  border-radius: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 12px;
  color: #111;
  border: 2px solid transparent;
  cursor: default;
  position: relative;
}
.tl-tile .birth { font-size: 9px; opacity: 0.8; }
.tl-tile.small { height: 26px; }
.tl-tile.new { border-color: var(--accent); box-shadow: 0 0 6px var(--accent); }
.tl-tile.changed { border-color: #63e6be; }
.tl-tile.freed { opacity: 0.35; text-decoration: line-through; }
.tl-tile.deferred { border: 2px dashed #ddd; }
.tl-tile.async { border: 2px dotted #ddd; }
.tl-arrow { color: var(--muted); font-size: 11px; display: block; }
#tl-legend { margin-top: 18px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
#tl-legend .tl-tile { width: 38px; height: 22px; font-size: 10px; }
.tl-summary { color: var(--muted); }

/* ---------- tooltip and about ---------- */
#tooltip {
  position: fixed;
  z-index: 50;
  max-width: 520px;
  background: #111;
  border: 1px solid #555;
  border-radius: 6px;
  padding: 6px 9px;
  font-size: 12px;
  pointer-events: none;
  box-shadow: 0 4px 16px #000a;
}
#tooltip .t-ref { font-family: var(--mono); font-size: 11px; margin-top: 4px; }
#tooltip .t-ref .loc { color: #74c0fc; }
#tooltip .t-ref .code { color: #bbb; display: block; white-space: pre; overflow: hidden; text-overflow: ellipsis; }

#about {
  position: fixed;
  inset: 0;
  background: #000a;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.about-box {
  position: relative;
  background: var(--panel);
  border: 1px solid #444;
  border-radius: 10px;
  max-width: 820px;
  max-height: 100%;
  overflow-y: auto;
  padding: 18px 24px;
}
.about-box .close { position: absolute; right: 10px; top: 10px; }
.about-box h2 { font-size: 17px; margin: 4px 0 8px; }
.about-box h3 { font-size: 13px; margin: 16px 0 6px; color: var(--accent); }
.about-box li { margin: 4px 0; }

</style>
</head>
<body>
<header id="topbar">
  <button id="toggle-left" class="icon" title="Show or hide the path panel">&#9776;</button>
  <h1>ZFS Encryption Keys</h1>
  <a id="commit-link" target="_blank" rel="noopener"></a>
  <span id="suite-nav" hidden>
    <select id="graph-menu" title="Open another diagram of the suite"></select>
    <a id="index-link" href="index.html" title="All diagrams">All</a>
  </span>
  <span id="view-switch" class="segmented" hidden>
    <button id="btn-view-graph" class="active" title="Node graph">Graph</button><button id="btn-view-timeline" title="Timeline scenarios">Timeline</button>
  </span>
  <span class="spacer"></span>
  <button id="btn-fit" title="Fit everything (F)">Fit</button>
  <button id="btn-reset" title="Restore the default layout">Reset layout</button>
  <button id="btn-export" title="Export layout: save node positions to a JSON file">Export</button>
  <label class="button" title="Import layout: load node positions from a JSON file">Import<input id="file-import" type="file" accept="application/json,.json" hidden></label>
  <button id="btn-about">About</button>
  <button id="toggle-right" class="icon" title="Show or hide the details panel">&#9776;</button>
</header>

<main id="layout">
  <aside id="left">
    <div class="panel-section">
      <input id="search" type="search" placeholder="Search nodes, functions, files, tunables, wires  ( / )" autocomplete="off">
      <ul id="search-results" class="results"></ul>
    </div>
    <div class="panel-section">
      <h2>Paths</h2>
      <div id="path-list"></div>
    </div>
    <div class="panel-section" id="timeline-section" hidden>
      <h2>Timelines</h2>
      <div id="timeline-list"></div>
    </div>
    <div class="panel-section">
      <h2>Filters</h2>
      <label class="row">Context
        <select id="ctx-filter"><option value="">(none)</option></select>
      </label>
      <div id="group-filters"></div>
    </div>
  </aside>

  <section id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="12" cy="12" r="1.3" fill="#2c2c2c"></circle>
        </pattern>
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"></feDropShadow>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="160%">
          <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffd43b" flood-opacity="0.9"></feDropShadow>
        </filter>
      </defs>
      <rect id="grid-rect" x="0" y="0" width="100%" height="100%" fill="url(#grid)"></rect>
      <g id="root">
        <g id="layer-groups"></g>
        <g id="layer-wires"></g>
        <g id="layer-hits"></g>
        <g id="layer-nodes"></g>
        <g id="layer-badges"></g>
        <g id="layer-dot"></g>
      </g>
    </svg>
    <div id="caption" hidden></div>
    <div id="legend"></div>
    <canvas id="minimap" width="220" height="150"></canvas>
    <div id="timeline-view" hidden>
      <div id="tl-head">
        <div id="tl-title"></div>
        <div class="transport" id="tl-transport">
          <button id="tl-first" title="First step (Home)">|◀</button>
          <button id="tl-prev" title="Previous step (Left)">◀</button>
          <button id="tl-play" title="Play or pause (Space)">Play</button>
          <button id="tl-next" title="Next step (Right)">▶</button>
          <button id="tl-last" title="Last step (End)">▶|</button>
        </div>
      </div>
      <div id="tl-strip"></div>
      <div id="tl-caption"></div>
      <div id="tl-panel"></div>
      <div id="tl-legend"></div>
    </div>
  </section>

  <aside id="right">
    <div id="details"><p class="muted">Select a node, a wire or a path.</p></div>
  </aside>
</main>

<div id="tooltip" hidden></div>
<div id="about" hidden>
  <div class="about-box">
    <button id="about-close" class="icon close" title="Close">&#10005;</button>
    <div id="about-body"></div>
  </div>
</div>

ontaining `@` or `%`).","tunables":[],"props":[]},{"id":"dcp","group":"kentry","sub":0,"title":"dsl_crypto_params","ctx":"syscall","src":"module/zfs/dsl_crypt.c","fns":[{"name":"dsl_crypto_params_create_nvlist","ref":{"file":"module/zfs/dsl_crypt.c","line":133,"symbol":"dsl_crypto_params_create_nvlist","code":"dsl_crypto_params_create_nvlist(dcp_cmd_t cmd, nvlist_t *props,"}},{"name":"dsl_wrapping_key_create","ref":{"file":"module/zfs/dsl_crypt.c","line":109,"symbol":"dsl_wrapping_key_create","code":"dsl_wrapping_key_create(uint8_t *wkeydata, zfs_keyformat_t keyformat,"}},{"name":"dsl_crypto_params_free","ref":{"file":"module/zfs/dsl_crypt.c","line":241,"symbol":"dsl_crypto_params_free","code":"dsl_crypto_params_free(dsl_crypto_params_t *dcp, boolean_t unload)"}}],"role":"Builds a dsl_crypto_params_t from the ioctl nvlists: the command, the encryption suite (`on` means aes-256-gcm), keylocation, and a dsl_wrapping_key_t holding the 32-byte key with its keyformat, salt and iteration count. encryption, keyformat, pbkdf2salt and pbkdf2iters are removed from the property list: they live in the DSL Crypto Key, not as ordinary dataset properties.","tunables":[],"props":[]},{"id":"objset_own","group":"kentry","sub":0,"title":"Dataset opened for decryption","ctx":"syscall","src":"module/zfs/dmu_objset.c","fns":[{"name":"dmu_objset_own","ref":{"file":"module/zfs/dmu_objset.c","line":807,"symbol":"dmu_objset_own","code":"dmu_objset_own(const char *name, dmu_objset_type_t type,"}},{"name":"dsl_dataset_hold_obj_flags","ref":{"file":"module/zfs/dsl_dataset.c","line":792,"symbol":"dsl_dataset_hold_obj_flags","code":"dsl_dataset_hold_obj_flags(dsl_pool_t *dp, uint64_t dsobj,"}},{"name":"dsl_dataset_create_key_mapping","ref":{"file":"module/zfs/dsl_dataset.c","line":780,"symbol":"dsl_dataset_create_key_mapping","code":"dsl_dataset_create_key_mapping(dsl_dataset_t *ds)"}},{"name":"dsl_dataset_rele_flags","ref":{"file":"module/zfs/dsl_dataset.c","line":1023,"symbol":"dsl_dataset_rele_flags","code":"dsl_dataset_rele_flags(dsl_dataset_t *ds, ds_hold_flags_t flags,"}},{"name":"dsl_dataset_remove_key_mapping","ref":{"file":"module/zfs/dsl_dataset.c","line":1011,"symbol":"dsl_dataset_remove_key_mapping","code":"dsl_dataset_remove_key_mapping(dsl_dataset_t *ds)"}},{"name":"dmu_objset_disown","ref":{"file":"module/zfs/dmu_objset.c","line":923,"symbol":"dmu_objset_disown","code":"dmu_objset_disown(objset_t *os, boolean_t decrypt, const void *tag)"}},{"name":"zfsvfs_create","ref":{"file":"module/os/linux/zfs/zfs_vfsops.c","line":642,"symbol":"zfsvfs_create","code":"zfsvfs_create(const char *osname, boolean_t readonly, zfsvfs_t **zfvp)"}},{"name":"zfs_umount","ref":{"file":"module/os/linux/zfs/zfs_vfsops.c","line":1612,"symbol":"zfs_umount","code":"zfs_umount(struct super_block *sb)"}}],"role":"Mounting a file system (`zfsvfs_create()`) or opening a zvol owns the dataset with decrypt set. DS_HOLD_FLAG_DECRYPT creates a key mapping, which fails with EACCES when the key is not loaded. If the objset block is still unauthenticated, its MACs are checked here. Disowning at unmount removes the mapping. Raw send holds datasets without decrypt and needs no key.","tunables":[],"props":[]},{"id":"ks_load","group":"keystore","sub":0,"title":"spa_keystore_load_wkey()","ctx":"syscall","src":"module/zfs/dsl_crypt.c","fns":[{"name":"spa_keystore_load_wkey","ref":{"file":"module/zfs/dsl_crypt.c","line":754,"symbol":"spa_keystore_load_wkey","code":"spa_keystore_load_wkey(const char *dsname, dsl_crypto_params_t *dcp,"}},{"name":"spa_keystore_load_wkey_impl","ref":{"file":"module/zfs/dsl_crypt.c","line":728,"symbol":"spa_keystore_load_wkey_impl","code":"spa_keystore_load_wkey_impl(spa_t *spa, dsl_wrapping_key_t *wkey)"}}],"role":"`zfs load-key` in the kernel. The dataset must be its own encryption root (EINVAL otherwise). The offered key is proved by unwrapping this dataset's DSL Crypto Key; its keyformat, salt and iterations are then taken from that key object. With noop ( it into the header's plaintext copy for this and later hits; if the block was not yet authenticated, `arc_hdr_authenticate()` checks its MAC when the key is loaded and otherwise leaves it unauthenticated. Decryption and MAC errors reach the consumer as EIO.","tunables":[],"props":[]},{"id":"st_encrypt","group":"pipe","sub":1,"title":"ENCRYPT","ctx":"iss","src":"module/zfs/zio.c","fns":[{"name":"zio_encrypt","ref":{"file":"module/zfs/zio.c","line":5567,"symbol":"zio_encrypt","code":"zio_encrypt(zio_t *zio)"}}],"role":"Shared with the I/O flow graph. Runs after WRITE_COMPRESS, only for newly allocated blocks (and rewritten ZIL blocks). Level-0 blocks of encrypted types are encrypted; other object types in an encrypted objset are authenticated with an HMAC and stay plaintext; indirect blocks store a SHA-512 of their children's MACs; the objset block carries two HMACs. A raw write (raw receive) stores the supplied salt, IV and MAC without using a key.","tunables":[],"props":[{"name":"encryption","ref":{"file":"module/zcommon/zfs_prop.c","line":565,"symbol":"\"encryption\"","code":"zprop_register_index(ZFS_PROP_ENCRYPTION, \"encryption\","}}]},{"id":"st_read_bp_init","group":"pipe","sub":1,"title":"READ_BP_INIT","ctx":"any","src":"module/zfs/zio.c","fns":[{"name":"zio_read_bp_init","ref":{"file":"module/zfs/zio.c","line":1865,"symbol":"zio_read_bp_init","code":"zio_read_bp_init(zio_t *zio)"}}],"role":"Shared with the I/O flow graph. For a protected block read without ZIO_FLAG_RAW_ENCRYPT, and for every indirect block of an encrypted objset, pushes `zio_decrypt()` as a transform that runs when the read completes.","tunables":[],"props":[]},{"id":"st_done","group":"pipe","sub":1,"title":"DONE","ctx":"int","src":"module/zfs/zio.c","fns":[{"name":"zio_done","ref":{"file":"module/zfs/zio.c","line":6065,"symbol":"zio_done","code":"zio_done(zio_t *zio)"}},{"name":"zio_pop_transforms","ref":{"file":"module/zfs/zio.c","line":511,"symbol":"zio_pop_transforms","code":"zio_pop_transforms(zio_t *zio)"}},{"name":"zio_decrypt","ref":{"file":"module/zfs/zio.c","line":562,"symbol":"zio_decrypt","code":"zio_decrypt(zio_t *zio, abd_t *data, uint64_t size)"}}],"role":"Shared with the I/O flow graph. `zio_pop_transforms()` runs `zio_decrypt()`: an indirect block has its child-MAC checksum verified (no key needed), an authenticated block its HMAC, an encrypted block is decrypted. A MAC mismatch becomes EIO with an authentication ereport; a missing key is EACCES.","tunables":[],"props":[]},{"id":"spa_crypt","group":"crypt","sub":0,"title":"spa_do_crypt_abd() and MAC helpers","ctx":"any","src":"module/zfs/dsl_crypt.c","fns":[{"name":"spa_do_crypt_abd","ref":{"file":"module/zfs/dsl_crypt.c","line":2983,"symbol":"spa_do_crypt_abd","code":"spa_do_crypt_abd(boolean_t encrypt, spa_t *spa, const zbookmark_phys_t *zb,"}},{"name":"spa_do_crypt_mac_abd","ref":{"file":"module/zfs/dsl_crypt.c","line":2940,"symbol":"spa_do_crypt_mac_abd","code":"spa_do_crypt_mac_abd(boolean_t generate, spa_t *spa, uint64_t dsobj, abd_t *abd,"}},{"name":"spa_do_crypt_objset_mac_abd","ref":{"file":"module/zfs/dsl_crypt.c","line":2878,"symbol":"spa_do_crypt_objset_mac_abd","code":"spa_do_crypt_objset_mac_abd(boolean_t generate, spa_t *spa, uint64_t dsobj,"}}],"role":"The bridge from the zio and ARC layers to the keystore. Looks up the dataset's master key by objset id, holds it for the call, and runs the operation. When encrypting a normal block it obtains the current salt and a random IV; a dedup block gets salt and IV from an HMAC of its plaintext, so equal blocks encrypt equally; a ZIL block got its salt and IV when its log block was allocated.","tunables":[],"props":[]},{"id":"salt_iv","group":"crypt","sub":0,"title":"Salt and IV","ctx":"any","src":"module/zfs/zio_crypt.c","fns":[{"name":"zio_crypt_key_get_salt","ref":{"file":"module/zfs/zio_crypt.c","line":320,"symbol":"zio_crypt_key_get_salt","code":"zio_crypt_key_get_salt(zio_crypt_key_t *key, uint8_t *salt)"}},{"name":"zio_crypt_key_change_salt","ref":{"file":"module/zfs/zio_crypt.c","line":277,"symbol":"zio_crypt_key_change_salt","code":"zio_crypt_key_change_salt(zio_crypt_key_t *key)"}},{"name":"zio_crypt_generate_iv","ref":{"file":"module/zfs/zio_crypt.c","line":486,"symbol":"zio_crypt_generate_iv","code":"zio_crypt_generate_iv(uint8_t *ivbuf)"}},{"name":"zio_crypt_generate_iv_salt_dedup","ref":{"file":"module/zfs/zio_crypt.c","line":520,"symbol":"zio_crypt_generate_iv_salt_dedup","code":"zio_crypt_generate_iv_salt_dedup(zio_crypt_key_t *key, uint8_t *data,"}}],"role":"Data keys are per salt, not per block: one 64-bit salt and the key derived from it serve many blocks. Every use is counted; after zfs_key_max_salt_uses blocks (default 400,000,000, which is also the maximum) a new random salt is chosen and a new key derived with HKDF. Every unwrap also starts with a fresh salt. The IV is 96 random bits per block.","tunables":[{"name":"zfs_key_max_salt_uses","ref":{"file":"module/zfs/zio_crypt.c","line":1677,"symbol":"max_salt_uses","code":"ZFS_MODULE_PARAM(zfs, zfs_key_,  max_salt_uses, U64, ZMOD_RW,"}}],"props":[]},{"id":"aead","group":"crypt","sub":1,"title":"AES-GCM / AES-CCM","ctx":"any","src":"module/zfs/zio_crypt.c","fns":[{"name":"zio_do_crypt_data","ref":{"file":"module/zfs/zio_crypt.c","line":1512,"symbol":"zio_do_crypt_data","code":"zio_do_crypt_data(boolean_t encrypt, zio_crypt_key_t *key,"}},{"name":"zio_crypt_init_uios","ref":{"file":"module/zfs/zio_crypt.c","line":1472,"symbol":"zio_crypt_init_uios","code":"zio_crypt_init_uios(boolean_t encrypt, uint64_t version, dmu_object_type_t ot,"}}],"role":"Picks the data key for the block's salt: the cached current key if the salt is current, otherwise `hkdf_sha512()` of the master key and that salt. Encrypts or decrypts with AES-GCM or AES-CCM (on QAT hardware when available) and produces or checks a 128-bit MAC. In dnode blocks only the bonus buffers are encrypted; in ZIL blocks the parts needed to claim the log stay plaintext and are covered as authenticated data.","tunables":[],"props":[]},{"id":"mac","group":"crypt","sub":1,"title":"HMACs and MAC checksums","ctx":"any","src":"module/zfs/zio_crypt.c","fns":[{"name":"zio_crypt_do_hmac","ref":{"file":"module/zfs/zio_crypt.c","line":503,"symbol":"zio_crypt_do_hmac","code":"zio_crypt_do_hmac(zio_crypt_key_t *key, uint8_t *data, uint_t datalen,"}},{"name":"zio_crypt_do_objset_hmacs","ref":{"file":"module/zfs/zio_crypt.c","line":904,"symbol":"zio_crypt_do_objset_hmacs","code":"zio_crypt_do_objset_hmacs(zio_crypt_key_t *key, void *data, uint_t datalen,"}},{"name":"zio_crypt_do_indirect_mac_checksum_abd","ref":{"file":"module/zfs/zio_crypt.c","line":1101,"symbol":"zio_crypt_do_indirect_mac_checksum_abd","code":"zio_crypt_do_indirect_mac_checksum_abd(boolean_t generate, abd_t *abd,"}}],"role":"Authentication without encryption. Unencrypted object types: HMAC-SHA512 with the dataset's HMAC key, truncated to 128 bits. Objset block: a portable MAC (root of the MAC tree in the meta-dnode) and a local MAC (user accounting), 256 bits each, kept inside the block. Indirect blocks: a SHA-512 of their children's MACs, which needs no key, so a raw send can carry the tree without the master key.","tunables":[],"props":[]},{"id":"bp_crypt","group":"crypt","sub":1,"title":"Crypto fields in the block pointer","ctx":"any","src":"module/zfs/zio_crypt.c","fns":[{"name":"zio_crypt_encode_params_bp","ref":{"file":"module/zfs/zio_crypt.c","line":546,"symbol":"zio_crypt_encode_params_bp","code":"zio_crypt_encode_params_bp(blkptr_t *bp, uint8_t *salt, uint8_t *iv)"}},{"name":"zio_crypt_decode_params_bp","ref":{"file":"module/zfs/zio_crypt.c","line":571,"symbol":"zio_crypt_decode_params_bp","code":"zio_crypt_decode_params_bp(const blkptr_t *bp, uint8_t *salt, uint8_t *iv)"}},{"name":"zio_crypt_encode_mac_bp","ref":{"file":"module/zfs/zio_crypt.c","line":604,"symbol":"zio_crypt_encode_mac_bp","code":"zio_crypt_encode_mac_bp(blkptr_t *bp, uint8_t *mac)"}},{"name":"zio_crypt_d ist(drc->drc_begin_nvl, \"crypt_keydata\","}]},{"id":"E083","from":"raw_recv","to":"dck_zap","type":"key","label":"dsl_crypto_recv_raw() sync task -> dsl_crypto_recv_raw_key_sync(): a new dataset gets keylocation \"prompt\", itself as encryption root, and dsl_crypto_key_sync_impl() stores the received wrapped keys unchanged; an existing dataset gets them at the end of the receive","refs":[{"file":"module/zfs/dmu_recv.c","line":5259,"symbol":"dsl_crypto_recv_raw","code":"err = dsl_crypto_recv_raw(spa_name(drc->drc_os->os_spa),"},{"file":"module/zfs/dsl_crypt.c","line":2563,"symbol":"dsl_crypto_recv_raw_key_sync","code":"dsl_crypto_recv_raw_key_sync(ds, dcrka->dcrka_nvl, tx);"},{"file":"module/zfs/dsl_crypt.c","line":2404,"symbol":"\"prompt\"","code":"const char *keylocation = \"prompt\";"},{"file":"module/zfs/dsl_crypt.c","line":2456,"symbol":"rddobj","code":"rddobj = dd->dd_object;"},{"file":"module/zfs/dsl_crypt.c","line":2506,"symbol":"dsl_crypto_key_sync_impl","code":"dsl_crypto_key_sync_impl(mos, dd->dd_crypto_obj, crypt,"},{"file":"module/zfs/dmu_recv.c","line":5578,"symbol":"dsl_crypto_recv_raw_key_sync","code":"dsl_crypto_recv_raw_key_sync(drc->drc_ds,"}]},{"id":"E084","from":"raw_recv","to":"st_encrypt","type":"abd","label":"flush_write_batch_impl(): ZIO_FLAG_RAW and the record's salt, IV and MAC; dmu_lightweight_write_by_dnode(); at txg sync zio_encrypt() takes the ZIO_FLAG_RAW_ENCRYPT branch and uses no key","refs":[{"file":"module/zfs/dmu_recv.c","line":3888,"symbol":"ZIO_FLAG_RAW","code":"zio_flags |= ZIO_FLAG_RAW;"},{"file":"module/zfs/dmu_recv.c","line":3917,"symbol":"dmu_lightweight_write_by_dnode","code":"err = dmu_lightweight_write_by_dnode(dn,"},{"file":"module/zfs/zio.c","line":5596,"symbol":"ZIO_FLAG_RAW_ENCRYPT","code":"if (zio->io_flags & ZIO_FLAG_RAW_ENCRYPT) {"}]},{"id":"E085","from":"admin","to":"zfs_cmd","type":"ctl","label":"runs zfs create -o encryption=on -o keyformat=... -o keylocation=... dataset","refs":[{"file":"cmd/zfs/zfs_main.c","line":194,"symbol":"zfs_do_create","code":"{ \"create\",\tzfs_do_create,\t\tHELP_CREATE\t\t},"}]},{"id":"E086","from":"admin","to":"zfs_cmd","type":"ctl","label":"runs zfs load-key or zfs unload-key [-r | -a]","refs":[{"file":"cmd/zfs/zfs_main.c","line":234,"symbol":"zfs_do_load_key","code":"{ \"load-key\",\tzfs_do_load_key,\tHELP_LOAD_KEY\t\t},"},{"file":"cmd/zfs/zfs_main.c","line":235,"symbol":"zfs_do_unload_key","code":"{ \"unload-key\",\tzfs_do_unload_key,\tHELP_UNLOAD_KEY\t\t},"}]},{"id":"E087","from":"admin","to":"zfs_cmd","type":"ctl","label":"runs zfs mount [-l] or zfs unmount [-u]","refs":[{"file":"cmd/zfs/zfs_main.c","line":218,"symbol":"zfs_do_mount","code":"{ \"mount\",\tzfs_do_mount,\t\tHELP_MOUNT\t\t},"},{"file":"cmd/zfs/zfs_main.c","line":219,"symbol":"zfs_do_unmount","code":"{ \"unmount\",\tzfs_do_unmount,\t\tHELP_UNMOUNT\t\t},"}]},{"id":"E088","from":"admin","to":"zfs_cmd","type":"ctl","label":"runs zfs change-key [-l] [-o keyformat=...] or zfs change-key -i","refs":[{"file":"cmd/zfs/zfs_main.c","line":236,"symbol":"zfs_do_change_key","code":"{ \"change-key\",\tzfs_do_change_key,\tHELP_CHANGE_KEY\t\t},"}]},{"id":"E089","from":"admin","to":"zfs_cmd","type":"ctl","label":"runs zfs send -w (raw) snapshot, piped into zfs receive","refs":[{"file":"cmd/zfs/zfs_main.c","line":223,"symbol":"zfs_do_send","code":"{ \"send\",\tzfs_do_send,\t\tHELP_SEND\t\t},"}]}],"paths":[{"id":"create","category":"Key management","title":"Create an encrypted dataset","summary":"`zfs create -o encryption=on -o keyformat=passphrase pool/secret`, or a plain `zfs create pool/secret/child` under an encrypted parent. Either way the new dataset gets its own random master key; what differs is which wrapping key wraps it.","ends":"The dataset has a DSL Crypto Key object whose encryption root is itself (newroot) or the parent's root (inherit). Its wrapping key is loaded, so `zfs create` goes on to mount it (path mount).","alts":[{"id":"root","options":[{"id":"newroot","label":"New encryption root (keyformat given, own wrapping key)"},{"id":"inherit","label":"Child of an encrypted parent, wrapped with the parent's encryption root key"}]}],"steps":[{"wire":"E085"},{"wire":"E001"},{"wire":"E007","when":[{"group":"root","options":["newroot"]}]},{"wire":"E009","when":[{"group":"root","options":["newroot"]}]},{"wire":"E010","when":[{"group":"root","options":["newroot"]}]},{"wire":"E011","when":[{"group":"root","options":["inherit"]}]},{"wire":"E012"},{"wire":"E013"},{"wire":"E021"},{"wire":"E022"},{"wire":"E023","when":[{"group":"root","options":["inherit"]}]},{"wire":"E024","when":[{"group":"root","options":["inherit"]}]},{"wire":"E025"},{"wire":"E026"},{"wire":"E027"},{"wire":"E028","when":[{"group":"root","options":["newroot"]}]}]},{"id":"load_key","category":"Key management","title":"zfs load-key","summary":"Loads the wrapping key of an encryption root. Nothing is decrypted yet: the key is only proved by unwrapping the root's own master key, and that copy is thrown away again.","ends":"The wrapping key is in the keystore. keystatus is `available` for the root and for every dataset whose encryption root it is. No master key is in memory until a dataset is opened (path mount).","alts":[{"id":"fmt","options":[{"id":"passphrase","label":"keyformat=passphrase"},{"id":"rawhex","label":"keyformat=raw or keyformat=hex"}]}],"steps":[{"wire":"E086"},{"wire":"E002"},{"wire":"E008"},{"wire":"E009","when":[{"group":"fmt","options":["passphrase"]}],"note":"PBKDF2-HMAC-SHA1 over the passphrase with pbkdf2salt and pbkdf2iters: the slow step that protects against guessing"},{"wire":"E009","when":[{"group":"fmt","options":["rawhex"]}],"note":"raw: the 32 bytes are the wrapping key; hex: 64 hex digits decoded to 32 bytes"},{"wire":"E010"},{"wire":"E012"},{"wire":"E013"},{"wire":"E014"},{"wire":"E015"},{"wire":"E016"},{"wire":"E017"},{"wire":"E018"}]},{"id":"mount","category":"Key management","title":"Mount: master key unwrapped, key mapping created","summary":"Opening a dataset for decryption is where a master key is unwrapped and bound to the dataset. From then on every block I/O of the dataset finds its key by objset id.","ends":"The dataset is owned with a key mapping, its objset block is authenticated, and its master key is held by the mapping (and holds the wrapping key). Reads and writes now work (paths read and write).","alts":[{"id":"how","options":[{"id":"l","label":"zfs mount -l (loads the encryption root's key first if needed, as in path load_key)"},{"id":"loaded","label":"key already loaded"}]},{"id":"master","options":[{"id":"cold","label":"master key not in memory yet"},{"id":"warm","label":"already in memory (another open snapshot, clone or user of the same key object)"}]}],"steps":[{"wire":"E087"},{"wire":"E004"},{"wire":"E005","when":[{"group":"how","options":["l"]}]},{"wire":"E029"},{"wire":"E030"},{"wire":"E031"},{"wire":"E032","when":[{"group":"master","options":["cold"]}]},{"wire":"E033","when":[{"group":"master","options":["cold"]}]},{"wire":"E016","when":[{"group":"master","options":["cold"]}]},{"wire":"E034","when":[{"group":"master","options":["cold"]}]},{"wire":"E035"},{"wire":"E036"},{"wire":"E037"},{"wire":"E038"},{"wire":"E039"},{"wire":"E040"},{"wire":"E042"},{"wire":"E043"}]},{"id":"write","category":"Data path","title":"Write a block: encrypt or authenticate","summary":"A dirty block of an encrypted dataset on its way to disk at txg sync. What ENCRYPT does depends on the block.","ends":"The block pointer carries the salt, IV and MAC (or the MAC, or the MAC checksum); CHECKSUM_GENERATE and allocation follow as in the I/O graph's path `zfs-io-flow:txg_sync`. Without a key mapping the write cannot happen, which is why unload-key waits for a txg sync and refuses while datasets are open.","alts":[{"id":"block","options":[{"id":"data","label":"Level-0 block of an encrypted type (file data, directories, dnodes, ZIL, zvol data)"},{"id":"auth","label":"Level-0 block of an unencrypted type (for example the ZFS master node): authenticated only"},{"id":"objset","label":"The objset block: two embedded HMACs"},{"id":"indirect","label":"Indirect block: hash of the children's MACs"}]}],"steps":[{"wire":"E044","when":[{"group":"block","options":["data","auth","indirect"]}]},{"wire":"E044","when":[{"group":"block","options":["objset"]}],"note":"the objset block is written the same way, by dmu_objset_sync()"},{"wire":"E045","when":[{"group":"block","options":["data"]}]},{"wire":"E046","when":[{"group":"block","options":["auth"]}]},{"wire":"E047","when":[{"group":"block","options":["objset"]}]},{"wire":"E048","when":[{"group":"block","options":["indirect"]}]},{"wire":"E053","when":[{"group":"block","options":["indirect"]}]},{"wire":"E038","when":[{"group":"block","options":["data","auth","objset"]}]},{"wire":"E039","when":[{"group":"block","options":["data","auth","objset"]}]},{"wire":"E049","when":[{"group":"block","options":["data"]}]},{"wire":"E050","when":[{"group":"block","options":["data"]}]},{"wire":"E052","when":[{"group":"block","options":["data"]}]},{"wire":"E041","when":[{"group":"block","options":["auth"]}]},{"wire":"E040","when":[{"group":"block","options":["objset"]}]},{"wire":"E042","when":[{"group":"block","options":["auth","objset"]}]},{"wire":"E054","when":[{"group":"block","options":["data","auth","objset"]}]},{"wire":"E055","when":[{"group":"block","options":["data","auth","indirect"]}]}]},{"id":"read","category":"Data path","title":"Read a block: decrypt","summary":"A normal (not raw) read of an encrypted block. The data key is recomputed from the master key and the salt stored in the block pointer.","ends":"The consumer has plaintext and the ARC header keeps a decrypted copy. With the key unloaded, the key lookup fails with EACCES; a tampered block fails its MAC and returns EIO.","alts":[{"id":"cache","options":[{"id":"miss","label":"ARC miss: decrypted by the read pipeline"},{"id":"rawhdr","label":"ARC hit on a header that holds only ciphertext: decrypted by the ARC"}]}],"steps":[{"wire":"E056"},{"wire":"E057","when":[{"group":"cache","options":["miss"]}]},{"wire":"E058","when":[{"group":"cache","options":["miss"]}]},{"wire":"E059","when":[{"group":"cache","options":["miss"]}]},{"wire":"E060","when":[{"group":"cache","options":["miss"]}]},{"wire":"E063","when":[{"group":"cache","options":["rawhdr"]}]},{"wire":"E064","when":[{"group":"cache","options":["rawhdr"]}]},{"wire":"E038"},{"wire":"E039"},{"wire":"E051"},{"wire":"E052"},{"wire":"E061","when":[{"group":"cache","options":["miss"]}]},{"wire":"E062","when":[{"group":"cache","options":["miss"]}]},{"wire":"E065","when":[{"group":"cache","options":["rawhdr"]}]},{"wire":"E066"}]},{"id":"change_key","category":"Key management","title":"zfs change-key: new wrapping key, no data rewritten","summary":"A passphrase change, or turning a dataset that inherited its key into a new encryption root. Only the wrapped copies of the master keys are rewritten; every data block stays as it is.","ends":"The key objects of the dataset and of every descendant under the same encryption root hold the same master keys wrapped with the new key; the old wrapping key is freed from memory and no key object in the pool is wrapped with it any more. A raw send stream made earlier still carries the master key wrapped with the old key.","alts":[{"id":"target","options":[{"id":"root","label":"The dataset is already an encryption root (for example a new passphrase)"},{"id":"child","label":"The dataset inherited its key and becomes a new encryption root"}]}],"steps":[{"wire":"E088"},{"wire":"E003"},{"wire":"E007","when":[{"group":"target","options":["root"]}],"note":"keyformat and keylocation default to the current ones"},{"wire":"E007","when":[{"group":"target","options":["child"]}],"note":"keyformat is required; keylocation defaults to prompt"},{"wire":"E009"},{"wire":"E010"},{"wire":"E012"},{"wire":"E013"},{"wire":"E021"},{"wire":"E067"},{"wire":"E068"},{"wire":"E070"},{"wire":"E071"},{"wire":"E027"},{"wire":"E072"}]},{"id":"inherit_key","category":"Key management","title":"zfs change-key -i: rejoin the parent's encryption root","summary":"An encryption root gives up its own key and wraps its master keys (and those of its descendants under it) with the parent's encryption root key.","ends":"encryptionroot of the dataset and its inheriting descendants is now the parent's encryption root, keylocation is cleared, and loading the parent's root key gives access to all of them.","alts":[],"steps":[{"wire":"E088"},{"wire":"E003"},{"wire":"E011"},{"wire":"E012"},{"wire":"E013"},{"wire":"E021"},{"wire":"E067"},{"wire":"E068"},{"wire":"E069"},{"wire":"E070"},{"wire":"E071"},{"wire":"E027"},{"wire":"E072"}]},{"id":"unload_key","category":"Key management","title":"Unmount and zfs unload-key","summary":"Removing the wrapping key from memory. It only succeeds once no dataset under the encryption root still holds a master key.","ends":"keystatus is `unavailable`. The master keys in memory were zeroed when their last holder went away; the key objects on disk are unchanged.","alts":[{"id":"how","options":[{"id":"umount_u","label":"zfs unmount -u: unmount, then unload"},{"id":"unload","label":"zfs unload-key on datasets that are already unmounted (fails with EBUSY if one is still mounted)"}]}],"steps":[{"wire":"E087"},{"wire":"E004","when":[{"group":"how","options":["umount_u"]}]},{"wire":"E076","when":[{"group":"how","options":["umount_u"]}]},{"wire":"E073","when":[{"group":"how","options":["umount_u"]}]},{"wire":"E074","when":[{"group":"how","options":["umount_u"]}]},{"wire":"E075","when":[{"group":"how","options":["umount_u"]}]},{"wire":"E006","when":[{"group":"how","options":["umount_u"]}]},{"wire":"E002","when":[{"group":"how","options":["unload"]}]},{"wire":"E011"},{"wire":"E012"},{"wire":"E019"},{"wire":"E020"}]},{"id":"raw_send_recv","category":"Replication","title":"Raw send and receive (zfs send -w)","summary":"Replicating an encrypted dataset without its key: the blocks travel as stored and the master key travels still wrapped.","ends":"The received dataset is its own encryption root with keystatus `unavailable`; `zfs load-key` with the sender's passphrase or key opens it, because keyformat, pbkdf2salt and pbkdf2iters came along. Neither side decrypted anything. The stream format and receive mechanics are in the send/receive graph: `zfs-send-receive:raw_send` and `zfs-send-receive:raw_recv`.","alts":[],"steps":[{"wire":"E089"},{"wire":"E077"},{"wire":"E078"},{"wire":"E079"},{"wire":"E080"},{"wire":"E081"},{"wire":"E082"},{"wire":"E083"},{"wire":"E084"},{"wire":"E055"}]}],"stages":[],"pipelines":[],"pipelineRuntimeNote":"","about":{"model":["There are two layers of keys. Blocks are encrypted with keys derived from a dataset's master key, which is random, never changes and never leaves the kernel unwrapped. The user's key (passphrase, raw or hex) only becomes the 32-byte wrapping key, which encrypts the master key inside the dataset's DSL Crypto Key object in the pool's meta-object set (MOS).","Because only the wrapped copy of the master key depends on the user's key, `zfs change-key` rewrites a few small key objects in one txg and no data block. The new wrapping key replaces the old one; the master keys stay the same.","An encryption root is the dataset whose wrapping key is used. A child created without its own key still gets a master key of its own, but wraps it with the root's wrapping key; its key object records the root, and the keystore finds the wrapping key through that record. Snapshots share their dataset's key object and clones share their origin's. `load-key` and `unload-key` act only on encryption roots; `change-key` can turn any dataset that is not a clone into one.","`zfs load-key` only puts the wrapping key in memory, after proving it by unwrapping the root's master key. A master key is unwrapped when a dataset is opened for decryption (mount, zvol open), and the key mapping created then is what every encrypting or decrypting I/O looks up. `unload-key` fails with EBUSY while any dataset under the root is still open.","Block encryption happens in the ENCRYPT stage, after compression: AES-GCM or AES-CCM with a random 96-bit IV and a data key derived with HKDF from the master key and a 64-bit salt. A salt (and its key) is shared by many blocks and rotated after a limit. Salt, IV and MAC are stored in the block pointer.","Not everything is encrypted. The MOS (pool metadata, including the key objects) is not encrypted at all. Inside an encrypted dataset, indirect blocks, the objset block, the core of each dnode and some object types stay readable but are authenticated (HMAC, or a hash of the children's MACs), so the pool can be scrubbed and the dataset raw-sent without keys.","A raw send (`zfs send -w`) ships the blocks as stored plus the master key still wrapped; the receiver stores both unchanged and can only read the data after `zfs load-key` with the sender's key."],"simplifications":["The data paths jump over pipeline stages and the vdev layer drawn in the I/O graph: `dbuf_write()` to ENCRYPT, READ_BP_INIT to DONE and the device read in between are single wires here.","A sync task's check function runs twice, once in the calling thread and once in syncing context; the diagram draws the check where its effect matters, once.","Returns are drawn only where a result or error matters; most holds and releases of keys during a single I/O are folded into the lookup wires.","ZIL encryption (salt and IV chosen at log block allocation, MAC in the log chain header), encrypted dedup and dnode bonus-buffer encryption are described in node text only.","Snapshots and clones share a key object and are not drawn separately; `zfs promote`, `zfs rename` and the forced change-key commands are left out.","The crypto back ends (ICP, Linux kernel crypto API, FreeBSD crypto, QAT) are folded into the AES-GCM / AES-CCM node.","Raw send and receive are reduced to their key data; the stream itself belongs to the send/receive graph."]},"timelines":[],"page":{"id":"zfs-encryption-keys","title":"ZFS Encryption Keys","file":"zfs-encryption-keys.html","intro":"This spec describes a diagram of OpenZFS native encryption from the key's point of view: which key actually encrypts a block, how a passphrase becomes a wrapping key, how the wrapping key protects each dataset's master key in its DSL Crypto Key object, what `zfs load-key`, `zfs unload-key` and `zfs change-key` do in the kernel, why a passphrase change rewrites no data, what an encryption root is, how blocks are encrypted, decrypted and authenticated in the zio pipeline and the ARC, and what a raw send carries."},"suite":{"pages":[{"id":"zfs-io-flow","title":"ZFS I/O Flow","file":"zfs-io-flow.html"},{"id":"zfs-scrub-resilver","title":"ZFS Scrub, Resilver and Rebuild","file":"zfs-scrub-resilver.html"},{"id":"zfs-send-receive","title":"ZFS Send and Receive","file":"zfs-send-receive.html"},{"id":"zfs-snapshot-lifecycle","title":"ZFS Snapshots, Destroy and Rollback","file":"zfs-snapshot-lifecycle.html"},{"id":"zfs-fault-management","title":"ZFS Fault Management","file":"zfs-fault-management.html"},{"id":"zfs-encryption-keys","title":"ZFS Encryption Keys","file":"zfs-encryption-keys.html"},{"id":"zfs-pool-create","title":"ZFS Pool Creation","file":"zfs-pool-create.html"},{"id":"zfs-dataset-create","title":"ZFS Dataset Creation","file":"zfs-dataset-create.html"},{"id":"zfs-pool-import-export","title":"ZFS Pool Import and Export","file":"zfs-pool-import-export.html"},{"id":"zfs-destroy","title":"ZFS Destroy Actions","file":"zfs-destroy.html"}],"alsoIn":{"admin":["zfs-scrub-resilver","zfs-send-receive","zfs-snapshot-lifecycle","zfs-fault-management","zfs-pool-create","zfs-dataset-create","zfs-pool-import-export","zfs-destroy"],"zfs_cmd":["zfs-snapshot-lifecycle","zfs-dataset-create","zfs-destroy"],"mount_lib":["zfs-dataset-create","zfs-pool-import-export","zfs-destroy"],"lzc":["zfs-dataset-create"],"ioc_keys":["zfs-dataset-create"],"dcp":["zfs-dataset-create"],"spa_sync":["zfs-io-flow","zfs-scrub-resilver","zfs-send-receive","zfs-snapshot-lifecycle","zfs-fault-management","zfs-pool-create","zfs-dataset-create","zfs-pool-import-export","zfs-destroy"],"create_crypt":["zfs-dataset-create"],"dbuf_sync":["zfs-io-flow","zfs-send-receive"],"dbuf_read":["zfs-io-flow"],"arc_read":["zfs-io-flow","zfs-scrub-resilver","zfs-send-receive"],"arc_buf":["zfs-io-flow"],"st_encrypt":["zfs-io-flow"],"st_read_bp_init":["zfs-io-flow","zfs-scrub-resilver"],"st_done":["zfs-io-flow","zfs-scrub-resilver","zfs-fault-management"]}}}</script>
<script>
'use strict';

/*
 * ZFS I/O Flow viewer.
 *
 * The page contains no ZFS knowledge of its own: everything it shows comes
 * from the JSON block #graph-data, generated from the spec by build_graph.py.
 *
 * Function list (spec section 12, step 3). Inputs -> outputs; side effects.
 *
 * Data
 *   loadGraph()                 #graph-data -> state.graph and lookup maps. No DOM.
 *   sourceUrl(ref)              {file,line} -> GitHub URL at meta.commit.
 *   computePlayed(path, sel)    path + option selection -> played steps
 *                               [{index, n, wire, step, side}]. Pure.
 *   defaultSelection(path)      path -> {group: first option}. Pure.
 *   traceClosure(id, dir, depth, ignoreCtl) -> {nodes:Set, wires:Set}. Pure.
 *
 * Layout and geometry
 *   socketTypes(id, wires)      node id + wire list -> {ins:[type], outs:[type]}. Pure.
 *   layoutDefault()             -> {nodeId: {x,y}} from groups and node order (spec 7). Pure.
 *   computeDisplay()            filters, collapse state, positions -> state.disp
 *                               (display nodes, visible wires, sockets, sizes).
 *   groupFrames()               state.disp -> {groupId: {x,y,w,h}}. Pure.
 *   socketPoint(dn, side, type) display node + side + type -> {x,y}. Pure.
 *   wireGeometry(dw)            display wire -> SVG path string. Pure.
 *   worldBounds()               -> {x,y,w,h} enclosing every frame. Pure.
 *
 * Rendering
 *   renderAll()                 rebuilds groups, nodes, wires, then highlight + minimap.
 *   renderGroups()              draws group frames and titles into #layer-groups.
 *   renderNodes()               draws node boxes into #layer-nodes.
 *   renderWires()               draws wires and hit paths; fills state.wireEls.
 *   updatePositions()           moves node boxes, recomputes wire paths and frames.
 *   applyHighlight()            sets CSS classes on nodes and wires from the
 *                               current path / selection / trace / filters.
 *   renderBadges()              step-number badges for the active path.
 *   renderLegend(), renderGroupFilters(), renderPathList(), renderAbout()
 *                               build the static panels.
 *   renderDetails()             fills the right panel for the selection or path.
 *   renderMinimap()             draws groups and the viewport into the minimap.
 *   updateGroupLabels()         screen-space group titles when zoomed far out.
 *
 * View
 *   setViewTransform()          state.view -> root transform, grid, labels, minimap.
 *   fitView(bounds)             zooms and pans so bounds fill the canvas.
 *   screenToWorld(x, y)         canvas pixel -> graph coordinates. Pure.
 *
 * Interaction
 *   selectNode(id, center), selectWire(id, center), clearSelection()
 *   activatePath(id, sel, stepN), clearPath(), gotoStep(k), playPath(on)
 *   followStep(), showCaption(), animateDot(k)
 *   runSearch(text)             text -> result list in the left panel.
 *   showTooltip(evt, el), hideTooltip()
 *
 * Persistence
 *   saveLayout(), loadLayout(), saveView(), loadView()  browser storage, in try/catch.
 *   exportLayout(), importLayout(file)
 *   readHash(), writeHash()     URL hash <-> path/alt/step, node or wire.
 *
 * Suite (specs/zfs-viewer-suite-spec.md)
 *   pageFile(pageId)            page id -> its HTML file name, or null. Pure.
 *   renderSuiteNav()            fills the Graphs menu when the page is part of a suite.
 *   alsoInLinks(nodeId)         -> link elements to the same node on other pages.
 *
 * Timeline view (suite spec section 5)
 *   setView(mode)               'graph' | 'timeline'; shows the matching view.
 *   renderTimelineList()        scenario list in the left panel.
 *   activateTimeline(id, stepN) selects a scenario and a step (1-based).
 *   gotoTimelineStep(k)         moves to step index k; re-renders and animates.
 *   playTimeline(on)            starts or stops automatic stepping.
 *   renderTimelineStep()        draws strip, caption, dataset rows and tiles.
 *   timelineColour(birth)       birth txg -> tile colour (old dark, new bright). Pure.
 *   renderTimelineDetails(panel) right panel for the active scenario.
 *
 * init()                        wires everything together on load.
 */

// ---------------------------------------------------------------- constants

const SVG_NS = 'http://www.w3.org/2000/svg';
const NODE_W = 300;
const TITLE_H = 28;
const ROW_H = 22;
const FOOT_H = 22;
const NODE_PAD = 6;
const COL_W = 400;
const NODE_GAP = 28;
const GROUP_PAD = 28;
const GROUP_PAD_TOP = 42;
const BAND_GAP = 90;
const ZOOM_MIN = 0.1;
const ZOOM_MAX = 2.5;

// One plain state object holds everything that changes.
const state = {
  graph: null,
  nodesById: {},
  wiresById: {},
  groupsById: {},
  typesById: {},
  ctxById: {},
  pathsById: {},
  typeOrder: [],
  groupNodes: {},
  pathsByWire: {},
  stagesByNode: {},
  defaultPos: {},
  pos: {},
  collapsed: {},
  groupMode: {},
  typeOn: {},
  ctxFilter: '',
  view: { x: 0, y: 0, k: 1 },
  disp: null,
  nodeEls: {},
  wireEls: {},
  select: null,
  trace: null,
  path: null,
  compare: '',
  storageKey: '',
  playTimer: null,
  dotFrame: null,
  mode: 'graph',
  timeline: null,
  tlDataset: null,
  tlTimer: null,
};

// ---------------------------------------------------------------- helpers

function svgEl(tag, attrs, parent) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const name in attrs) {
    el.setAttribute(name, attrs[name]);
  }
  if (parent) {
    parent.appendChild(el);
  }
  return el;
}

function htmlEl(tag, attrs, children) {
  const el = document.createElement(tag);
  for (const name in attrs || {}) {
    if (name === 'text') {
      el.textContent = attrs[name];
    } else if (name === 'className') {
      el.className = attrs[name];
    } else {
      el.setAttribute(name, attrs[name]);
    }
  }
  for (const child of children || []) {
    if (child === null || child === undefined) {
      continue;
    }
    if (typeof child === 'string') {
      el.appendChild(document.createTextNode(child));
    } else {
      el.appendChild(child);
    }
  }
  return el;
}

// Text from the spec may contain `code` spans; render them as <code>.
function richText(tag, text, className) {
  const el = htmlEl(tag, className ? { className: className } : {});
  const parts = text.split('`');
  parts.forEach((part, i) => {
    // `<page id>:<path id>` names a path on another page of the suite.
    const cross = i % 2 === 1 ? part.match(/^([a-z0-9-]+):(\w+)$/) : null;
    const file = cross && state.graph && state.graph.suite ? pageFile(cross[1]) : null;
    if (file) {
      el.appendChild(htmlEl('a', { href: file + '#path=' + cross[2], text: pageTitle(cross[1]) + ': ' + cross[2] }));
    } else if (i % 2 === 1) {
      el.appendChild(htmlEl('code', { text: part }));
    } else if (part) {
      el.appendChild(document.createTextNode(part));
    }
  });
  return el;
}

function byId(id) {
  return document.getElementById(id);
}

function indexBy(list) {
  const map = {};
  for (const item of list) {
    map[item.id] = item;
  }
  return map;
}

function clamp(value, low, high) {
  return Math.max(low, Math.min(high, value));
}

function hexToRgb(hex) {
  const value = parseInt(hex.replace('#', ''), 16);
  return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
}

function mixColor(hex, baseHex, amount) {
  const a = hexToRgb(hex);
  const b = hexToRgb(baseHex);
  const mixed = a.map((v, i) => Math.round(v * amount + b[i] * (1 - amount)));
  return 'rgb(' + mixed.join(',') + ')';
}

function lighten(hex, amount) {
  return mixColor('#ffffff', hex, amount);
}

function rgba(hex, alpha) {
  const c = hexToRgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + alpha + ')';
}

const measureCtx = document.createElement('canvas').getContext('2d');

function fitText(text, font, width) {
  measureCtx.font = font;
  if (measureCtx.measureText(text).width <= width) {
    return text;
  }
  let low = 0;
  let high = text.length;
  while (low < high) {
    const mid = Math.ceil((low + high) / 2);
    if (measureCtx.measureText(text.slice(0, mid) + '…').width <= width) {
      low = mid;
    } else {
      high = mid - 1;
    }
  }
  return text.slice(0, low) + '…';
}

function baseName(path) {
  const parts = path.split('/');
  return parts[parts.length - 1];
}

function storageGet(key) {
  try {
    const text = window.localStorage.getItem(key);
    return text ? JSON.parse(text) : null;
  } catch (err) {
    return null;
  }
}

function storageSet(key, value) {
  try {
    window.localStorage.setItem(key, JSON.stringify(value));
  } catch (err) {
    // Storage unavailable: the page works without it.
  }
}

// ---------------------------------------------------------------- data

function loadGraph() {
  const graph = JSON.parse(byId('graph-data').textContent);
  state.graph = graph;
  state.nodesById = indexBy(graph.nodes);
  state.wiresById = indexBy(graph.wires);
  state.groupsById = indexBy(graph.groups);
  state.typesById = indexBy(graph.types);
  state.ctxById = indexBy(graph.contexts);
  state.pathsById = indexBy(graph.paths);
  state.typeOrder = graph.types.map((t) => t.id);
  for (const group of graph.groups) {
    state.groupNodes[group.id] = [];
    state.groupMode[group.id] = 'show';
  }
  for (const node of graph.nodes) {
    state.groupNodes[node.group].push(node.id);
  }
  for (const type of graph.types) {
    state.typeOn[type.id] = true;
  }
  for (const path of graph.paths) {
    for (const step of path.steps) {
      const list = state.pathsByWire[step.wire] || [];
      if (list.indexOf(path.id) < 0) {
        list.push(path.id);
      }
      state.pathsByWire[step.wire] = list;
    }
  }
  for (const stage of graph.stages) {
    if (stage.node) {
      const list = state.stagesByNode[stage.node] || [];
      list.push(stage);
      state.stagesByNode[stage.node] = list;
    }
  }
  // The page id keeps each suite page's layout separate; the I/O page keeps
  // its original key ("zfs-io-flow:<commit>").
  state.storageKey = (graph.page ? graph.page.id : 'zfs-io-flow') + ':' + graph.meta.commit;
}

// ---------------------------------------------------------------- suite

function pageFile(pageId) {
  const suite = state.graph.suite;
  if (!suite) {
    return null;
  }
  const page = suite.pages.find((p) => p.id === pageId);
  return page ? page.file : null;
}

function pageTitle(pageId) {
  const page = state.graph.suite.pages.find((p) => p.id === pageId);
  return page ? page.title : pageId;
}

function renderSuiteNav() {
  const suite = state.graph.suite;
  if (!suite) {
    return;
  }
  byId('suite-nav').hidden = false;
  const menu = byId('graph-menu');
  for (const page of suite.pages) {
    menu.appendChild(htmlEl('option', { value: page.file, text: page.title }));
  }
  menu.value = state.graph.page.file;
  menu.addEventListener('change', () => {
    window.location.href = menu.value;
  });
}

function alsoInLinks(nodeId) {
  const suite = state.graph.suite;
  if (!suite || !suite.alsoIn[nodeId]) {
    return [];
  }
  return suite.alsoIn[nodeId].map((pageId) => htmlEl('a', {
    className: 'also-link',
    href: pageFile(pageId) + '#node=' + encodeURIComponent(nodeId),
    text: pageTitle(pageId),
  }));
}

function sourceUrl(ref) {
  const meta = state.graph.meta;
  return meta.repo + '/blob/' + meta.commit + '/' + ref.file + '#L' + ref.line;
}

function defaultSelection(path) {
  const sel = {};
  for (const group of path.alts) {
    sel[group.id] = group.options[0].id;
  }
  return sel;
}

function stepMatches(step, sel) {
  for (const tag of step.when || []) {
    if (tag.options.indexOf(sel[tag.group]) < 0) {
      return false;
    }
  }
  return true;
}

function computePlayed(path, sel) {
  const played = [];
  const visited = new Set();
  path.steps.forEach((step, index) => {
    if (!stepMatches(step, sel)) {
      return;
    }
    const wire = state.wiresById[step.wire];
    const side = played.length > 0 && !visited.has(wire.from);
    played.push({ index: index, n: index + 1, wire: wire, step: step, side: side });
    visited.add(wire.from);
    visited.add(wire.to);
  });
  return played;
}

function traceClosure(startId, direction, depth, ignoreCtl) {
  const nodes = new Set([startId]);
  const wires = new Set();
  let frontier = [startId];
  let level = 0;
  while (frontier.length > 0 && (depth === 0 || level < depth)) {
    const next = [];
    for (const nodeId of frontier) {
      for (const wire of state.graph.wires) {
        if (ignoreCtl && wire.type === 'ctl') {
          continue;
        }
        if (!state.typeOn[wire.type]) {
          continue;
        }
        const near = direction === 'down' ? wire.from : wire.to;
        const far = direction === 'down' ? wire.to : wire.from;
        if (near !== nodeId) {
          continue;
        }
        wires.add(wire.id);
        if (!nodes.has(far)) {
          nodes.add(far);
          next.push(far);
        }
      }
    }
    frontier = next;
    level += 1;
  }
  return { nodes: nodes, wires: wires };
}

// ---------------------------------------------------------------- layout

function sortTypes(list) {
  return list.sort((a, b) => state.typeOrder.indexOf(a) - state.typeOrder.indexOf(b));
}

function socketTypes(nodeId, wires) {
  const ins = new Set();
  const outs = new Set();
  for (const wire of wires) {
    if (wire.to === nodeId) {
      ins.add(wire.type);
    }
    if (wire.from === nodeId) {
      outs.add(wire.type);
    }
  }
  return { ins: sortTypes(Array.from(ins)), outs: sortTypes(Array.from(outs)) };
}

function bodyHeight(socketRows) {
  return TITLE_H + Math.max(socketRows, 1) * ROW_H + FOOT_H + NODE_PAD;
}

function layoutDefault() {
  const pos = {};
  const bottoms = {};
  const groups = state.graph.groups.slice();
  groups.sort((a, b) => (a.band === 'bottom') - (b.band === 'bottom'));
  for (const group of groups) {
    let startY = 0;
    if (group.band === 'bottom') {
      const top = groups.find((g) => g.band === 'top' && g.col === group.col);
      if (top) {
        startY = bottoms[top.id] + GROUP_PAD + BAND_GAP + GROUP_PAD_TOP;
      }
    }
    const nextY = {};
    let bottom = startY;
    for (const nodeId of state.groupNodes[group.id]) {
      const node = state.nodesById[nodeId];
      const sockets = socketTypes(nodeId, state.graph.wires);
      const height = bodyHeight(Math.max(sockets.ins.length, sockets.outs.length));
      const y = nextY[node.sub] === undefined ? startY : nextY[node.sub];
      pos[nodeId] = { x: (group.col + node.sub) * COL_W, y: y };
      nextY[node.sub] = y + height + NODE_GAP;
      bottom = Math.max(bottom, y + height);
    }
    bottoms[group.id] = bottom;
  }
  return pos;
}

function computeDisplay() {
  const disp = { nodes: {}, list: [], map: {}, wires: [] };
  for (const node of state.graph.nodes) {
    const mode = state.groupMode[node.group];
    if (mode === 'hide') {
      disp.map[node.id] = null;
      continue;
    }
    if (mode === 'collapse') {
      const proxyId = 'group:' + node.group;
      disp.map[node.id] = proxyId;
      if (!disp.nodes[proxyId]) {
        const group = state.groupsById[node.group];
        disp.nodes[proxyId] = { id: proxyId, proxy: true, group: node.group, title: group.title, members: [] };
        disp.list.push(disp.nodes[proxyId]);
      }
      disp.nodes[proxyId].members.push(node.id);
      continue;
    }
    disp.map[node.id] = node.id;
    disp.nodes[node.id] = { id: node.id, proxy: false, group: node.group, title: node.title, node: node };
    disp.list.push(disp.nodes[node.id]);
  }
  for (const wire of state.graph.wires) {
    if (!state.typeOn[wire.type]) {
      continue;
    }
    const a = disp.map[wire.from];
    const b = disp.map[wire.to];
    if (!a || !b || a === b) {
      continue;
    }
    disp.wires.push({ id: wire.id, from: a, to: b, type: wire.type });
  }
  for (const dn of disp.list) {
    const sockets = socketTypes(dn.id, disp.wires);
    dn.ins = sockets.ins;
    dn.outs = sockets.outs;
    dn.collapsed = Boolean(state.collapsed[dn.id]);
    dn.w = NODE_W;
    dn.h = dn.collapsed ? TITLE_H : bodyHeight(Math.max(dn.ins.length, dn.outs.length));
    placeDisplayNode(dn);
  }
  state.disp = disp;
}

function placeDisplayNode(dn) {
  if (!dn.proxy) {
    dn.x = state.pos[dn.id].x;
    dn.y = state.pos[dn.id].y;
    return;
  }
  dn.x = Infinity;
  dn.y = Infinity;
  for (const memberId of dn.members) {
    dn.x = Math.min(dn.x, state.pos[memberId].x);
    dn.y = Math.min(dn.y, state.pos[memberId].y);
  }
}

function groupFrames() {
  const frames = {};
  for (const dn of state.disp.list) {
    const box = frames[dn.group] || { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity };
    box.x1 = Math.min(box.x1, dn.x);
    box.y1 = Math.min(box.y1, dn.y);
    box.x2 = Math.max(box.x2, dn.x + dn.w);
    box.y2 = Math.max(box.y2, dn.y + dn.h);
    frames[dn.group] = box;
  }
  const result = {};
  for (const groupId in frames) {
    const box = frames[groupId];
    result[groupId] = {
      x: box.x1 - GROUP_PAD,
      y: box.y1 - GROUP_PAD_TOP,
      w: box.x2 - box.x1 + 2 * GROUP_PAD,
      h: box.y2 - box.y1 + GROUP_PAD + GROUP_PAD_TOP,
    };
  }
  return result;
}

function worldBounds() {
  const frames = groupFrames();
  let x1 = Infinity;
  let y1 = Infinity;
  let x2 = -Infinity;
  let y2 = -Infinity;
  for (const id in frames) {
    const f = frames[id];
    x1 = Math.min(x1, f.x);
    y1 = Math.min(y1, f.y);
    x2 = Math.max(x2, f.x + f.w);
    y2 = Math.max(y2, f.y + f.h);
  }
  if (x1 === Infinity) {
    return { x: 0, y: 0, w: 100, h: 100 };
  }
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
}

function socketPoint(dn, side, type) {
  const list = side === 'in' ? dn.ins : dn.outs;
  const row = Math.max(list.indexOf(type), 0);
  const x = side === 'in' ? dn.x : dn.x + dn.w;
  if (dn.collapsed) {
    return { x: x, y: dn.y + TITLE_H / 2 };
  }
  return { x: x, y: dn.y + TITLE_H + row * ROW_H + ROW_H / 2 };
}

// Fan index of each wire among wires sharing the same socket, so that
// parallel wires leave and arrive with slightly different tangents.
function computeFans() {
  const outGroups = {};
  const inGroups = {};
  for (const dw of state.disp.wires) {
    const outKey = dw.from + '|' + dw.type;
    const inKey = dw.to + '|' + dw.type;
    (outGroups[outKey] = outGroups[outKey] || []).push(dw);
    (inGroups[inKey] = inGroups[inKey] || []).push(dw);
  }
  const nodes = state.disp.nodes;
  for (const key in outGroups) {
    const list = outGroups[key].sort((a, b) => nodes[a.to].y - nodes[b.to].y);
    list.forEach((dw, i) => { dw.fanOut = i - (list.length - 1) / 2; });
  }
  for (const key in inGroups) {
    const list = inGroups[key].sort((a, b) => nodes[a.from].y - nodes[b.from].y);
    list.forEach((dw, i) => { dw.fanIn = i - (list.length - 1) / 2; });
  }
}

function wireGeometry(dw) {
  const source = state.disp.nodes[dw.from];
  const target = state.disp.nodes[dw.to];
  const s = socketPoint(source, 'out', dw.type);
  const t = socketPoint(target, 'in', dw.type);
  const fanOut = dw.fanOut || 0;
  const fanIn = dw.fanIn || 0;
  const dx = t.x - s.x;
  if (dx >= 40) {
    const off = clamp(Math.abs(dx) * 0.5, 60, 320);
    return 'M' + s.x + ',' + s.y +
      ' C' + (s.x + off) + ',' + (s.y + fanOut * 5) +
      ' ' + (t.x - off) + ',' + (t.y + fanIn * 5) +
      ' ' + t.x + ',' + t.y;
  }
  // Backward wire: leave to the right, run along a lane above or below
  // both nodes, and enter from the left, so it does not cross the boxes.
  const below = t.y >= s.y;
  const lane = below
    ? Math.max(source.y + source.h, target.y + target.h) + 26 + Math.abs(fanOut) * 6
    : Math.min(source.y, target.y) - 26 - Math.abs(fanOut) * 6;
  const k = 70;
  return 'M' + s.x + ',' + s.y +
    ' C' + (s.x + k) + ',' + s.y + ' ' + (s.x + k) + ',' + lane + ' ' + s.x + ',' + lane +
    ' L' + t.x + ',' + lane +
    ' C' + (t.x - k) + ',' + lane + ' ' + (t.x - k) + ',' + t.y + ' ' + t.x + ',' + t.y;
}

// ---------------------------------------------------------------- rendering

function clearLayer(id) {
  const layer = byId(id);
  while (layer.firstChild) {
    layer.removeChild(layer.firstChild);
  }
  return layer;
}

function renderAll() {
  computeDisplay();
  computeFans();
  renderGroups();
  renderWires();
  renderNodes();
  applyHighlight();
  renderMinimap();
  updateGroupLabels();
}

function renderGroups() {
  const layer = clearLayer('layer-groups');
  const frames = groupFrames();
  state.frameEls = {};
  for (const group of state.graph.groups) {
    const frame = frames[group.id];
    if (!frame) {
      continue;
    }
    const g = svgEl('g', { 'data-group': group.id }, layer);
    const rect = svgEl('rect', {
      class: 'group-frame', rx: 12,
      fill: rgba(group.color, 0.12), stroke: rgba(group.color, 0.45),
    }, g);
    const title = svgEl('text', { class: 'group-title', fill: lighten(group.color, 0.45) }, g);
    title.textContent = group.title;
    const summary = svgEl('text', { class: 'group-summary' }, g);
    summary.textContent = fitText(group.summary, '11px ' + getComputedStyle(document.body).fontFamily, frame.w - 24);
    title.addEventListener('mousedown', (evt) => startGroupDrag(evt, group.id));
    title.addEventListener('dblclick', (evt) => {
      evt.stopPropagation();
      fitView(groupFrames()[group.id]);
    });
    state.frameEls[group.id] = { rect: rect, title: title, summary: summary, g: g };
    placeFrame(group.id, frame);
  }
}

function placeFrame(groupId, frame) {
  const els = state.frameEls[groupId];
  if (!els || !frame) {
    return;
  }
  els.rect.setAttribute('x', frame.x);
  els.rect.setAttribute('y', frame.y);
  els.rect.setAttribute('width', frame.w);
  els.rect.setAttribute('height', frame.h);
  els.title.setAttribute('x', frame.x + 12);
  els.title.setAttribute('y', frame.y + 22);
  els.summary.setAttribute('x', frame.x + 12);
  els.summary.setAttribute('y', frame.y + 36);
}

function titleBarPath(collapsed) {
  if (collapsed) {
    return 'M0,8 a8,8 0 0 1 8,-8 h' + (NODE_W - 16) + ' a8,8 0 0 1 8,8 v' + (TITLE_H - 16) +
      ' a8,8 0 0 1 -8,8 h-' + (NODE_W - 16) + ' a8,8 0 0 1 -8,-8 z';
  }
  return 'M0,8 a8,8 0 0 1 8,-8 h' + (NODE_W - 16) + ' a8,8 0 0 1 8,8 v' + (TITLE_H - 8) +
    ' h-' + NODE_W + ' z';
}

function renderNodes() {
  const layer = clearLayer('layer-nodes');
  const font = getComputedStyle(document.body).fontFamily;
  const mono = getComputedStyle(document.documentElement).getPropertyValue('--mono');
  state.nodeEls = {};
  for (const dn of state.disp.list) {
    const group = state.groupsById[dn.group];
    const g = svgEl('g', { class: 'node' + (dn.proxy ? ' proxy' : ''), 'data-id': dn.id }, layer);
    svgEl('rect', { class: 'body', width: dn.w, height: dn.h, rx: 8, filter: 'url(#shadow)' }, g);
    svgEl('path', { d: titleBarPath(dn.collapsed), fill: mixColor(group.color, '#2b2b2b', 0.55) }, g);

    // Context pill
    const pillText = dn.proxy ? 'group' : dn.node.ctx;
    measureCtx.font = '10px ' + mono;
    const pillW = measureCtx.measureText(pillText).width + 12;
    const pill = svgEl('g', {}, g);
    svgEl('rect', { class: 'pill', x: dn.w - pillW - 8, y: 6, width: pillW, height: 16, rx: 8 }, pill);
    const pt = svgEl('text', { class: 'pill-text', x: dn.w - pillW / 2 - 8, y: 17.5, 'text-anchor': 'middle' }, pill);
    pt.textContent = pillText;
    if (!dn.proxy) {
      const tip = svgEl('title', {}, pill);
      const ctx = state.ctxById[dn.node.ctx];
      tip.textContent = ctx ? ctx.id + ': ' + ctx.name : dn.node.ctx;
    }

    // Chain-link marker for nodes that also appear on other suite pages.
    let markerW = 0;
    const others = !dn.proxy && state.graph.suite ? state.graph.suite.alsoIn[dn.id] : null;
    if (others) {
      markerW = 22;
      const cx = dn.w - pillW - 22;
      const mark = svgEl('g', { class: 'shared-mark' }, g);
      svgEl('rect', { x: cx - 9, y: 6, width: 18, height: 16, fill: 'transparent' }, mark);
      svgEl('circle', { cx: cx - 3, cy: 14, r: 3.6, fill: 'none', stroke: '#eee', 'stroke-width': 1.6 }, mark);
      svgEl('circle', { cx: cx + 3, cy: 14, r: 3.6, fill: 'none', stroke: '#eee', 'stroke-width': 1.6 }, mark);
      const tip = svgEl('title', {}, mark);
      tip.textContent = 'Also in: ' + others.map(pageTitle).join(', ');
    }

    const title = svgEl('text', { class: 'title-text', x: 10, y: 18.5 }, g);
    title.textContent = fitText(dn.title, '600 13px ' + font, dn.w - pillW - 26 - markerW);

    if (!dn.collapsed) {
      renderSockets(g, dn);
      renderFoot(g, dn, mono);
    }
    svgEl('rect', { class: 'outline', width: dn.w, height: dn.h, rx: 8 }, g);
    g.setAttribute('transform', 'translate(' + dn.x + ',' + dn.y + ')');
    g.addEventListener('mousedown', (evt) => startNodeDrag(evt, dn.id));
    g.addEventListener('dblclick', (evt) => {
      const point = screenToWorld(evt.clientX, evt.clientY);
      if (point.y - dn.y <= TITLE_H) {
        evt.stopPropagation();
        toggleCollapsed(dn.id);
      }
    });
    state.nodeEls[dn.id] = g;
  }
}

function renderSockets(g, dn) {
  dn.ins.forEach((type, row) => {
    const y = TITLE_H + row * ROW_H + ROW_H / 2;
    svgEl('circle', { cx: 0, cy: y, r: 5, fill: state.typesById[type].color, stroke: '#111', 'stroke-width': 1 }, g);
    const label = svgEl('text', { class: 'sock-label', x: 11, y: y + 3.5 }, g);
    label.textContent = type;
  });
  dn.outs.forEach((type, row) => {
    const y = TITLE_H + row * ROW_H + ROW_H / 2;
    svgEl('circle', { cx: dn.w, cy: y, r: 5, fill: state.typesById[type].color, stroke: '#111', 'stroke-width': 1 }, g);
    const label = svgEl('text', { class: 'sock-label', x: dn.w - 11, y: y + 3.5, 'text-anchor': 'end' }, g);
    label.textContent = type;
  });
}

function renderFoot(g, dn, mono) {
  const rows = Math.max(dn.ins.length, dn.outs.length, 1);
  const y = TITLE_H + rows * ROW_H + 15;
  const foot = svgEl('text', { class: 'foot', x: 10, y: y }, g);
  let text;
  if (dn.proxy) {
    text = dn.members.length + ' nodes (group collapsed)';
  } else if (dn.node.fns.length > 0) {
    const first = dn.node.fns[0];
    text = first.name + '()  ' + baseName(dn.node.src || (first.ref ? first.ref.file : ''));
    if (first.ref) {
      foot.classList.add('link');
      foot.addEventListener('mouseenter', (evt) => showTooltip(evt, refTooltip(first.name + '()', [first.ref])));
      foot.addEventListener('mousemove', moveTooltip);
      foot.addEventListener('mouseleave', hideTooltip);
      foot.dataset.url = sourceUrl(first.ref);
    }
  } else {
    text = dn.node.role;
  }
  foot.textContent = fitText(text, '11px ' + mono, dn.w - 20);
}

function renderWires() {
  const layer = clearLayer('layer-wires');
  const hits = clearLayer('layer-hits');
  state.wireEls = {};
  for (const dw of state.disp.wires) {
    const type = state.typesById[dw.type];
    const d = wireGeometry(dw);
    const line = svgEl('path', { class: 'wire ' + dw.type, d: d, stroke: type.color }, layer);
    const hit = svgEl('path', { class: 'hit', d: d, 'data-id': dw.id }, hits);
    hit.addEventListener('mouseenter', (evt) => showTooltip(evt, wireTooltip(dw.id)));
    hit.addEventListener('mousemove', moveTooltip);
    hit.addEventListener('mouseleave', hideTooltip);
    hit.addEventListener('click', (evt) => {
      evt.stopPropagation();
      selectWire(dw.id, false);
    });
    state.wireEls[dw.id] = { line: line, hit: hit, dw: dw };
  }
}

function updatePositions() {
  for (const dn of state.disp.list) {
    placeDisplayNode(dn);
    const g = state.nodeEls[dn.id];
    if (g) {
      g.setAttribute('transform', 'translate(' + dn.x + ',' + dn.y + ')');
    }
  }
  computeFans();
  for (const id in state.wireEls) {
    const els = state.wireEls[id];
    const d = wireGeometry(els.dw);
    els.line.setAttribute('d', d);
    els.hit.setAttribute('d', d);
  }
  const frames = groupFrames();
  for (const groupId in frames) {
    placeFrame(groupId, frames[groupId]);
  }
  renderBadges();
  updateGroupLabels();
  renderMinimap();
}
