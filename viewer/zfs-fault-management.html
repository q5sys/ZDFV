<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZFS Fault Management</title>
<style>
:root {
  --canvas: #1f1f1f;
  --panel: #262626;
  --panel-line: #333;
  --text: #dddddd;
  --muted: #9a9a9a;
  --accent: #ffd43b;
  --node-body: #353535;
  --node-border: #161616;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
  scrollbar-color: #4a4a4a #262626;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
code { font-family: var(--mono); font-size: 0.92em; background: #ffffff12; padding: 0 3px; border-radius: 3px; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--canvas);
  color: var(--text);
  font: 13px/1.4 var(--sans);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

button, .button, select, input {
  font: inherit;
  color: var(--text);
  background: #333;
  border: 1px solid #444;
  border-radius: 5px;
  padding: 3px 9px;
}
button, .button { cursor: pointer; }
button:hover, .button:hover { background: #3d3d3d; border-color: #555; }
button.active { background: #4a4122; border-color: var(--accent); color: #fff; }
button.icon { padding: 2px 7px; }
input[type="search"] { width: 100%; }
a { color: #74c0fc; text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- top bar ---------- */
#topbar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--panel-line);
}
#topbar h1 {
  font-size: 15px;
  margin: 0 6px 0 2px;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex: 0 1 auto;
}
#topbar > * { flex-shrink: 0; }
#topbar > h1 { flex-shrink: 1; }
#topbar button, #topbar .button, #topbar a { white-space: nowrap; }
#commit-link { font-family: var(--mono); font-size: 12px; color: var(--muted); }
#topbar .spacer { flex: 1; }

/* ---------- main layout ---------- */
#layout { flex: 1; display: flex; min-height: 0; }
#left, #right {
  background: var(--panel);
  overflow-y: auto;
  flex: none;
}
#left { width: 280px; border-right: 1px solid var(--panel-line); overflow-x: hidden; }
#right { width: 360px; border-left: 1px solid var(--panel-line); padding: 10px 12px 40px; }
body.hide-left #left, body.hide-right #right { display: none; }

.panel-section { padding: 10px 12px; border-bottom: 1px solid var(--panel-line); }
.panel-section h2, #right h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 0 0 6px;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; }

/* search */
.results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 240px; overflow-y: auto; }
.results li { padding: 3px 6px; border-radius: 4px; cursor: pointer; }
.results li:hover, .results li.first { background: #333; }
.results .kind { color: var(--muted); font-size: 11px; margin-right: 6px; }

/* path list */
.path-cat { margin: 8px 0 2px; font-size: 11px; color: var(--muted); }
.path-item {
  display: block;
  width: 100%;
  white-space: normal;
  text-align: left;
  border: 1px solid transparent;
  background: none;
  padding: 3px 6px;
  border-radius: 4px;
}
.path-item:hover { background: #313131; border-color: transparent; }
.path-item.active { background: #4a4122; border-color: var(--accent); }
.path-item .pid { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; }

/* group filters */
.gfilter { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.gfilter .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.gfilter .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gfilter select { padding: 1px 4px; font-size: 12px; }

/* ---------- canvas ---------- */
#canvas-wrap { flex: 1; position: relative; min-width: 0; overflow: hidden; }
#canvas { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
#canvas.panning { cursor: grabbing; }

.group-frame { stroke-width: 1; }
.group-title { font-size: 18px; font-weight: 700; cursor: move; }
.group-summary { font-size: 11px; fill: var(--muted); pointer-events: none; }

.node { cursor: pointer; }
.node .body { fill: var(--node-body); stroke: var(--node-border); stroke-width: 1; }
.node:hover .body { stroke: #6a6a6a; }
.node .title-text { fill: #eeeeee; font-size: 13px; font-weight: 600; pointer-events: none; }
.node .pill { fill: #00000055; stroke: #ffffff30; }
.node .pill-text { fill: #ddd; font-size: 10px; font-family: var(--mono); }
.node .sock-label { fill: #bdbdbd; font-size: 10px; font-variant: small-caps; letter-spacing: 0.04em; pointer-events: none; }
.node .foot { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
.node .foot.link { cursor: pointer; }
.node .foot.link:hover { fill: #cfcfcf; text-decoration: underline; }
.node .outline { fill: none; stroke: none; pointer-events: none; }
.node.selected .outline { stroke: #fff; stroke-width: 2; }
.node.onpath .outline { stroke: var(--accent); stroke-width: 2; }
.node.current .outline { stroke: var(--accent); stroke-width: 3; }
.node.current .body { filter: url(#glow); }
.node.ctxmark .outline { stroke: #63e6be; stroke-width: 2; stroke-dasharray: 5 3; }
.node.dim { opacity: 0.15; }
.node.proxy .body { stroke-dasharray: 6 4; stroke: #888; }

.wire, .hit, .alt-outline { vector-effect: non-scaling-stroke; }
/* Stroke widths are in screen pixels (non-scaling) and are narrowed when
   zoomed out; --wire-idle and --wire-lit are set by setViewTransform(). */
.wire { fill: none; stroke-width: var(--wire-idle, 2px); opacity: 0.55; pointer-events: none; }
.wire.ctl { stroke-dasharray: 6 4; }
.wire.lit { opacity: 1; stroke-width: var(--wire-lit, 3px); stroke-dasharray: 10 6; animation: flow 0.9s linear infinite; }
.wire.dim { opacity: 0.06; }
.wire.alt { opacity: 0.35; stroke-dasharray: 3 5; }
.wire.current { stroke-width: calc(var(--wire-lit, 3px) + 2px); opacity: 1; }
.wire.cmp-both { stroke: #ffffff !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-a { stroke: #ffd43b !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-b { stroke: #4dabf7 !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
@keyframes flow { to { stroke-dashoffset: -32; } }
@media (prefers-reduced-motion: reduce) { .wire.lit { animation: none; } }

.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; pointer-events: stroke; }
.alt-outline { fill: none; stroke: var(--accent); stroke-width: 6; stroke-dasharray: 4 6; opacity: 0.35; pointer-events: none; }

.badge circle { fill: #1f1f1f; stroke: var(--accent); stroke-width: 1.5; }
.badge text { fill: var(--accent); font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.dot { fill: #fff; stroke: var(--accent); stroke-width: 3; }

#caption {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  max-width: min(760px, 90%);
  background: #262626ee;
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  pointer-events: auto;
}
#caption .ref { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }

#legend {
  position: absolute;
  left: 10px;
  bottom: 10px;
  background: #262626e6;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 12px;
}
#legend .head { cursor: pointer; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
#legend.folded .item { display: none; }
#legend.folded .head { margin-bottom: 0; }
#legend .item { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 1px 2px; border-radius: 3px; }
#legend .item:hover { background: #333; }
#legend .item.off { opacity: 0.35; }
#legend .sw { width: 22px; height: 0; border-top: 3px solid; }
#legend .sw.dashed { border-top-style: dashed; }

#minimap {
  position: absolute;
  right: 10px;
  bottom: 10px;
  background: #1a1a1ae6;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  cursor: crosshair;
}

/* ---------- details panel ---------- */
#details h3 { font-size: 16px; margin: 0 0 4px; }
#details .sub { color: var(--muted); margin-bottom: 8px; }
#details section { margin: 12px 0; }
#details ul { margin: 4px 0; padding-left: 0; list-style: none; }
#details li { margin: 3px 0; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid #0006; }
.ref-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.ref-row .sym { font-family: var(--mono); font-size: 12px; }
.ref-row a { font-family: var(--mono); font-size: 11px; }
.ref-row .copy { font-size: 10px; padding: 0 5px; }
.ref-code { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: pre-wrap; word-break: break-all; margin: 0 0 4px 0; }
.io-row { cursor: pointer; padding: 3px 4px; border-radius: 4px; }
.io-row:hover { background: #313131; }
.io-row .other { font-weight: 600; }
.io-row .lbl { color: var(--muted); display: block; font-size: 12px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 11px; }
.tbl td, .tbl th { border-bottom: 1px solid #333; padding: 3px 4px; vertical-align: top; text-align: left; }
.tbl .on { color: var(--accent); }

.transport { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.transport input[type="range"] { width: 90px; padding: 0; }
.alt-select { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 8px; }
.alt-select select { width: 100%; }
.steps { max-height: 46vh; overflow-y: auto; border: 1px solid #333; border-radius: 6px; }
.step { padding: 3px 6px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #2d2d2d; }
.step:hover { background: #303030; }
.step.cur { background: #4a4122; }
.step.skip { opacity: 0.45; padding-left: 20px; }
.step .alt-head { display: block; font-size: 10px; color: var(--accent); }
.step .n { font-family: var(--mono); color: var(--accent); margin-right: 4px; }
.step .side { font-size: 10px; color: #63e6be; margin-left: 4px; }
.step .note { display: block; color: var(--muted); font-style: italic; }

/* ---------- suite navigation ---------- */
#suite-nav { display: inline-flex; align-items: center; gap: 8px; }
#suite-nav select { max-width: 230px; }
#index-link { font-size: 12px; }
.segmented { display: inline-flex; }
.segmented button { border-radius: 0; }
.segmented button:first-child { border-radius: 5px 0 0 5px; }
.segmented button:last-child { border-radius: 0 5px 5px 0; border-left: none; }
.also-link { display: block; }

/* ---------- timeline view ---------- */
#timeline-view {
  position: absolute;
  inset: 0;
  background: var(--canvas);
  overflow: auto;
  padding: 14px 18px 40px;
}
#tl-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
#tl-title { font-size: 16px; font-weight: 650; }
#tl-strip { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.tl-chip {
  border: 1px solid #444;
  background: #2a2a2a;
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 12px;
  cursor: pointer;
  max-width: 240px;
  text-align: left;
}
.tl-chip .txg { font-family: var(--mono); color: var(--accent); margin-right: 5px; }
.tl-chip.cur { border-color: var(--accent); background: #4a4122; }
#tl-caption {
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: #262626;
  padding: 8px 12px;
  margin-bottom: 14px;
}
#tl-caption .cap { font-weight: 600; }
#tl-caption .note { color: var(--muted); display: block; margin-top: 2px; }
#tl-caption .links { margin-top: 4px; font-size: 12px; }
#tl-caption .links a { margin-right: 10px; }
.tl-row { display: grid; grid-template-columns: 200px 1fr; gap: 10px; margin-bottom: 8px; align-items: start; }
.tl-label {
  background: #2b2b2b;
  border: 1px solid #3a3a3a;
  border-radius: 6px;
  padding: 5px 8px;
  cursor: pointer;
}
.tl-label:hover { border-color: #666; }
.tl-label .name { font-family: var(--mono); font-weight: 650; }
.tl-label .kind { color: var(--muted); font-size: 11px; display: block; }
.tl-lanes { display: flex; flex-direction: column; gap: 4px; }
.tl-lane { display: flex; flex-wrap: wrap; gap: 5px; min-height: 40px; align-items: center; padding: 3px 4px; border-radius: 6px; background: #ffffff06; }
.tl-lane.dead { min-height: 30px; background: #8ce99a14; border-left: 3px solid #8CE99A; }
.tl-lane .lane-tag { font-size: 10px; color: var(--muted); margin-right: 4px; }
.tl-tile {
  width: 52px;
  height: 34px;
  border-radius: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 12px;
  color: #111;
  border: 2px solid transparent;
  cursor: default;
  position: relative;
}
.tl-tile .birth { font-size: 9px; opacity: 0.8; }
.tl-tile.small { height: 26px; }
.tl-tile.new { border-color: var(--accent); box-shadow: 0 0 6px var(--accent); }
.tl-tile.changed { border-color: #63e6be; }
.tl-tile.freed { opacity: 0.35; text-decoration: line-through; }
.tl-tile.deferred { border: 2px dashed #ddd; }
.tl-tile.async { border: 2px dotted #ddd; }
.tl-arrow { color: var(--muted); font-size: 11px; display: block; }
#tl-legend { margin-top: 18px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
#tl-legend .tl-tile { width: 38px; height: 22px; font-size: 10px; }
.tl-summary { color: var(--muted); }

/* ---------- tooltip and about ---------- */
#tooltip {
  position: fixed;
  z-index: 50;
  max-width: 520px;
  background: #111;
  border: 1px solid #555;
  border-radius: 6px;
  padding: 6px 9px;
  font-size: 12px;
  pointer-events: none;
  box-shadow: 0 4px 16px #000a;
}
#tooltip .t-ref { font-family: var(--mono); font-size: 11px; margin-top: 4px; }
#tooltip .t-ref .loc { color: #74c0fc; }
#tooltip .t-ref .code { color: #bbb; display: block; white-space: pre; overflow: hidden; text-overflow: ellipsis; }

#about {
  position: fixed;
  inset: 0;
  background: #000a;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.about-box {
  position: relative;
  background: var(--panel);
  border: 1px solid #444;
  border-radius: 10px;
  max-width: 820px;
  max-height: 100%;
  overflow-y: auto;
  padding: 18px 24px;
}
.about-box .close { position: absolute; right: 10px; top: 10px; }
.about-box h2 { font-size: 17px; margin: 4px 0 8px; }
.about-box h3 { font-size: 13px; margin: 16px 0 6px; color: var(--accent); }
.about-box li { margin: 4px 0; }

</style>
</head>
<body>
<header id="topbar">
  <button id="toggle-left" class="icon" title="Show or hide the path panel">&#9776;</button>
  <h1>ZFS Fault Management</h1>
  <a id="commit-link" target="_blank" rel="noopener"></a>
  <span id="suite-nav" hidden>
    <select id="graph-menu" title="Open another diagram of the suite"></select>
    <a id="index-link" href="index.html" title="All diagrams">All</a>
  </span>
  <span id="view-switch" class="segmented" hidden>
    <button id="btn-view-graph" class="active" title="Node graph">Graph</button><button id="btn-view-timeline" title="Timeline scenarios">Timeline</button>
  </span>
  <span class="spacer"></span>
  <button id="btn-fit" title="Fit everything (F)">Fit</button>
  <button id="btn-reset" title="Restore the default layout">Reset layout</button>
  <button id="btn-export" title="Export layout: save node positions to a JSON file">Export</button>
  <label class="button" title="Import layout: load node positions from a JSON file">Import<input id="file-import" type="file" accept="application/json,.json" hidden></label>
  <button id="btn-about">About</button>
  <button id="toggle-right" class="icon" title="Show or hide the details panel">&#9776;</button>
</header>

<main id="layout">
  <aside id="left">
    <div class="panel-section">
      <input id="search" type="search" placeholder="Search nodes, functions, files, tunables, wires  ( / )" autocomplete="off">
      <ul id="search-results" class="results"></ul>
    </div>
    <div class="panel-section">
      <h2>Paths</h2>
      <div id="path-list"></div>
    </div>
    <div class="panel-section" id="timeline-section" hidden>
      <h2>Timelines</h2>
      <div id="timeline-list"></div>
    </div>
    <div class="panel-section">
      <h2>Filters</h2>
      <label class="row">Context
        <select id="ctx-filter"><option value="">(none)</option></select>
      </label>
      <div id="group-filters"></div>
    </div>
  </aside>

  <section id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="12" cy="12" r="1.3" fill="#2c2c2c"></circle>
        </pattern>
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"></feDropShadow>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="160%">
          <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffd43b" flood-opacity="0.9"></feDropShadow>
        </filter>
      </defs>
      <rect id="grid-rect" x="0" y="0" width="100%" height="100%" fill="url(#grid)"></rect>
      <g id="root">
        <g id="layer-groups"></g>
        <g id="layer-wires"></g>
        <g id="layer-hits"></g>
        <g id="layer-nodes"></g>
        <g id="layer-badges"></g>
        <g id="layer-dot"></g>
      </g>
    </svg>
    <div id="caption" hidden></div>
    <div id="legend"></div>
    <canvas id="minimap" width="220" height="150"></canvas>
    <div id="timeline-view" hidden>
      <div id="tl-head">
        <div id="tl-title"></div>
        <div class="transport" id="tl-transport">
          <button id="tl-first" title="First step (Home)">|◀</button>
          <button id="tl-prev" title="Previous step (Left)">◀</button>
          <button id="tl-play" title="Play or pause (Space)">Play</button>
          <button id="tl-next" title="Next step (Right)">▶</button>
          <button id="tl-last" title="Last step (End)">▶|</button>
        </div>
      </div>
      <div id="tl-strip"></div>
      <div id="tl-caption"></div>
      <div id="tl-panel"></div>
      <div id="tl-legend"></div>
    </div>
  </section>

  <aside id="right">
    <div id="details"><p class="muted">Select a node, a wire or a path.</p></div>
  </aside>
</main>

<div id="tooltip" hidden></div>
<div id="about" hidden>
  <div class="about-box">
    <button id="about-close" class="icon close" title="Close">&#10005;</button>
    <div id="about-body"></div>
  </div>
</div>

vice is still there; if not, it asks for the vdev to be marked REMOVED.","tunables":[],"props":[]},{"id":"vdev_intr","group":"pipe","sub":0,"title":"I/O completion","ctx":"int","src":"module/os/linux/zfs/vdev_disk.c","fns":[{"name":"vbio_completion","ref":{"file":"module/os/linux/zfs/vdev_disk.c","line":881,"symbol":"vbio_completion","code":"vbio_completion(struct bio *bio)"}},{"name":"zio_interrupt","ref":{"file":"module/zfs/zio.c","line":2496,"symbol":"zio_interrupt","code":"zio_interrupt(void *zio)"}}],"role":"Shared with the I/O flow graph. The bio completion records the device's error in the zio and re-enters the pipeline on an interrupt taskq.","tunables":[],"props":[]},{"id":"zio_taskq","group":"pipe","sub":0,"title":"zio taskqs (issue / interrupt)","ctx":"iss","src":"module/zfs/spa.c","fns":[{"name":"zio_taskq_dispatch","ref":{"file":"module/zfs/zio.c","line":2258,"symbol":"zio_taskq_dispatch","code":"zio_taskq_dispatch(zio_t *zio, zio_taskq_type_t q, boolean_t cutinline)"}},{"name":"spa_taskq_dispatch","ref":{"file":"module/zfs/spa.c","line":1691,"symbol":"spa_taskq_dispatch","code":"spa_taskq_dispatch(spa_t *spa, zio_type_t t, zio_taskq_type_t q,"}}],"role":"Shared with the I/O flow graph. Runs completions, the single retry of a failed logical zio (at the head of the issue queue) and the re-execution of failed writes (on the claim issue taskq).","tunables":[],"props":[]},{"id":"zio_create","group":"pipe","sub":0,"title":"zio create + execute","ctx":"any","src":"module/zfs/zio.c","fns":[{"name":"zio_wait","ref":{"file":"module/zfs/zio.c","line":2841,"symbol":"zio_wait","code":"zio_wait(zio_t *zio)"}},{"name":"zio_root","ref":{"file":"module/zfs/zio.c","line":1093,"symbol":"zio_root","code":"zio_root(spa_t *spa, zio_done_func_t *done, void *private, zio_flag_t flags)"}}],"role":"Shared with the I/O flow graph. zio_wait() is where a caller waits for an I/O; it triggers the deadman after zfs_deadman_ziotime_ms. Re-executed zios (after zpool clear) start here again.","tunables":[],"props":[]},{"id":"st_vdev_io_start","group":"pipe","sub":1,"title":"VDEV_IO_START","ctx":"any","src":"module/zfs/zio.c","fns":[{"name":"zio_vdev_io_start","ref":{"file":"module/zfs/zio.c","line":5135,"symbol":"zio_vdev_io_start","code":"zio_vdev_io_start(zio_t *zio)"}}],"role":"Shared with the I/O flow graph. For a leaf that is not accessible (dead, removal pending, or known unable to read or write) the zio fails at once with ENXIO and never reaches the disk.","tunables":[],"props":[]},{"id":"st_vdev_io_done","group":"pipe","sub":1,"title":"VDEV_IO_DONE","ctx":"int","src":"module/zfs/zio.c","fns":[{"name":"zio_vdev_io_done","ref":{"file":"module/zfs/zio.c","line":5320,"symbol":"zio_vdev_io_done","code":"zio_vdev_io_done(zio_t *zio)"}}],"role":"Shared with the I/O flow graph. Lets the vdev type react (mirror: try another side; raidz: verify and reconstruct). An unexpected error on a leaf that still looks accessible starts a device probe.","tunables":[],"props":[]},{"id":"st_vdev_io_assess","group":"pipe","sub":1,"title":"VDEV_IO_ASSESS","ctx":"int","src":"module/zfs/zio.c","fns":[{"name":"zio_vdev_io_assess","ref":{"file":"module/zfs/zio.c","line":5436,"symbol":"zio_vdev_io_assess","code":"zio_vdev_io_assess(zio_t *zio)"}}],"role":"Shared with the I/O flow graph. Only a logical zio is retried, once. A leaf error becomes ENXIO when the disk is no longer accessible, so it is blamed on the device rather than on the I/O.","tunables":[],"props":[]},{"id":"st_cksum_verify","group":"pipe","sub":1,"title":"CHECKSUM_VERIFY","ctx":"int","src":"module/zfs/zio.c","fns":[{"name":"zio_checksum_verify","ref":{"file":"module/zfs/zio.c","line":5747,"symbol":"zio_checksum_verify","code":"zio_checksum_verify(zio_t *zio)"}},{"name":"zio_checksum_error","ref":{"file":"module/zfs/zio_checksum.c","line":554,"symbol":"zio_checksum_error","code":"zio_checksum_error(zio_t *zio, zio_bad_cksum_t *info)"}}],"role":"Shared with the I/O flow graph. A mismatch on a non-speculative read is counted against the leaf at once and a checksum ereport is started; the error is passed up so redundancy can supply another copy.","tunables":[],"props":[]},{"id":"vdev_mirror","group":"pipe","sub":1,"title":"Mirror vdev","ctx":"any","src":"module/zfs/vdev_mirror.c","fns":[{"name":"vdev_mirror_io_done","ref":{"file":"module/zfs/vdev_mirror.c","line":734,"symbol":"vdev_mirror_io_done","code":"vdev_mirror_io_done(zio_t *zio)"}},{"name":"vdev_mirror_child_select","ref":{"file":"module/zfs/vdev_mirror.c","line":524,"symbol":"vdev_mirror_child_select","code":"vdev_mirror_child_select(zio_t *zio)"}}],"role":"Shared with the I/O flow graph. On a read error or bad checksum it reads the next child and then rewrites the children that failed. A write to a mirror counts as successful when at least one child succeeded (extra DVA copies all have to succeed).","tunables":[],"props":[]},{"id":"vdev_raidz","group":"pipe","sub":1,"title":"RAIDZ / dRAID vdev","ctx":"any","src":"module/zfs/vdev_raidz.c","fns":[{"name":"vdev_raidz_io_done","ref":{"file":"module/zfs/vdev_raidz.c","line":4044,"symbol":"vdev_raidz_io_done","code":"vdev_raidz_io_done(zio_t *zio)"}},{"name":"raidz_checksum_verify","ref":{"file":"module/zfs/vdev_raidz.c","line":2956,"symbol":"raidz_checksum_verify","code":"raidz_checksum_verify(zio_t *zio)"}},{"name":"vdev_raidz_checksum_error","ref":{"file":"module/zfs/vdev_raidz.c","line":2930,"symbol":"vdev_raidz_checksum_error","code":"vdev_raidz_checksum_error(zio_t *zio, raidz_col_t *rc, abd_t *bad_data)"}}],"role":"Shared with the I/O flow graph. When the block does not verify, parity reconstruction finds which column was wrong; that child disk gets the checksum count and an ereport carrying both the good and the bad data, and the column is rewritten.","tunables":[],"props":[]},{"id":"st_done","group":"pipe","sub":1,"title":"DONE","ctx":"int","src":"module/zfs/zio.c","fns":[{"name":"zio_done","ref":{"file":"module/zfs/zio.c","line":6065,"symbol":"zio_done","code":"zio_done(zio_t *zio)"}}],"role":"Shared with the I/O flow graph. The main bookkeeping point: per-vdev statistics, slow I/O detection, io ereports and error counters for leaves, the error log and data ereport for failed logical zios, finishing checksum reports, and the decision to re-execute or to suspend the pool.","tunables":[{"name":"zio_slow_io_ms","ref":{"file":"module/zfs/zio.c","line":6717,"symbol":"slow_io_ms","code":"ZFS_MODULE_PARAM(zfs_zio, zio_, slow_io_ms, INT, ZMOD_RW,"}}],"props":[]},{"id":"vdev_stat","group":"record","sub":0,"title":"Per-vdev counters (vdev_stat_t)","ctx":"any","src":"module/zfs/vdev.c","fns":[{"name":"vdev_stat_update","ref":{"file":"module/zfs/vdev.c","line":5348,"symbol":"vdev_stat_update","code":"vdev_stat_update(zio_t *zio, uint64_t psize)"}},{"name":"vdev_get_stats_ex","ref":{"file":"module/zfs/vdev.c","line":5233,"symbol":"vdev_get_stats_ex","code":"vdev_get_stats_ex(vdev_t *vd, vdev_stat_t *vs, vdev_stat_ex_t *vsx)"}}],"role":"In-memory statistics of each vdev: operations, bytes, latency histograms, repaired bytes, and the error counters vs_read_errors, vs_write_errors, vs_checksum_errors and vs_slow_ios that zpool status shows as READ, WRITE, CKSUM and SLOW. They are not stored on disk, start at zero when the pool is imported, are zeroed by zpool clear and when a disk is marked REMOVED. vdev_stat_update() also records failed writes in the DTL.","tunables":[],"props":[]},{"id":"dtl","group":"record","sub":0,"title":"Dirty time logs (DTL)","ctx":"any","src":"module/zfs/vdev.c","fns":[{"name":"vdev_dtl_dirty","ref":{"file":"module/zfs/vdev.c","line":3229,"symbol":"vdev_dtl_dirty","code":"vdev_dtl_dirty(vdev_t *vd, vdev_dtl_type_t t, uint64_t txg, uint64_t size)"}},{"name":"vdev_dtl_contains","ref":{"file":"module/zfs/vdev.c","line":3247,"symbol":"vdev_dtl_contains","code":"vdev_dtl_contains(vdev_t *vd, vdev_dtl_type_t t, uint64_t txg, uint64_t size)"}},{"name":"vdev_dtl_sync","ref":{"file":"module/zfs/vdev.c","line":3791,"symbol":"vdev_dtl_sync","code":"vdev_dtl_sync(vdev_t *vd, uint64_t txg)"}},{"name":"vdev_dtl_reassess","ref":{"file":"module/zfs/vdev.c","line":3630,"symbol":"vdev_dtl_reassess","code":"vdev_dtl_reassess(vdev_t *vd, uint64_t txg, uint64_t scrub_txg,"}},{"name":"vdev_dtl_required","ref":{"file":"module/zfs/vdev.c","line":3875,"symbol":"vdev_dtl_required","code":"vdev_dtl_required(vdev_t *vd)"}}],"role":"Per-vdev range trees of txgs whose writes a device missed. A leaf's DTL_MISSING is persisted as a space map in syncing context; parents' DTLs are derived from their children. Used to skip reads from a disk that lacks the data, to decide whether a disk holds the only copy (vdev_dtl_required()), and to bound a resilver.","tunables":[],"props":[]},{"id":"errlog","group":"record","sub":0,"title":"Persistent error log","ctx":"any","src":"module/zfs/spa_errlog.c","fns":[{"name":"spa_log_error","ref":{"file":"module/zfs/spa_errlog.c","line":174,"symbol":"spa_log_error","code":"spa_log_error(spa_t *spa, const zbookmark_phys_t *zb, const uint64_t birth)"}},{"name":"spa_errlog_sync","ref":{"file":"module/zfs/spa_errlog.c","line":1316,"symbol":"spa_errlog_sync","code":"spa_errlog_sync(spa_t *spa, uint64_t txg)"}},{"name":"sync_error_list","ref":{"file":"module/zfs/spa_errlog.c","line":1220,"symbol":"sync_error_list","code":"sync_error_list(spa_t *spa, avl_tree_t *t, uint64_t *obj, dmu_tx_t *tx)"}},{"name":"spa_errlog_rotate","ref":{"file":"module/zfs/spa_errlog.c","line":1185,"symbol":"spa_errlog_rotate","code":"spa_errlog_rotate(spa_t *spa)"}},{"name":"spa_get_errlog","ref":{"file":"module/zfs/spa_errlog.c","line":1141,"symbol":"spa_get_errlog","code":"spa_get_errlog(spa_t *spa, void *uaddr, uint64_t *count)"}},{"name":"spa_approx_errlog_size","ref":{"file":"module/zfs/spa_errlog.c","line":782,"symbol":"spa_approx_errlog_size","code":"spa_approx_errlog_size(spa_t *spa)"}}],"role":"Bookmarks (objset, object, level, blkid; with the head_errlog feature also the birth txg, per head dataset) of logical blocks that failed. New entries collect in memory (spa_errlist_last, or spa_errlist_scrub while a scrub runs) and are written to ZAP objects in the MOS by spa_errlog_sync(). There are two on-disk logs, last and scrub; when a scan ends the scrub log replaces the last log.","tunables":[],"props":[]},{"id":"probe","group":"record","sub":0,"title":"Device probe","ctx":"int","src":"module/zfs/vdev.c","fns":[{"name":"vdev_probe","ref":{"file":"module/zfs/vdev.c","line":1942,"symbol":"vdev_probe","code":"vdev_probe(vdev_t *vd, zio_t *zio)"}},{"name":"vdev_probe_done","ref":{"file":"module/zfs/vdev.c","line":1863,"symbol":"vdev_probe_done","code":"vdev_probe_done(zio_t *zio)"}}],"role":"Reads, and if the pool is writable rewrites, the pad areas of labels 1 to 3 of a leaf. Only one probe per disk runs at a time; other zios that want one wait for it. If the disk cannot be both read and (on a writable pool) written, it is marked unable to read or write, a probe_failure ereport is posted and, for probes started by the pipeline, the kernel asks for the disk to be faulted.","tunables":[],"props":[]},{"id":"deadman","group":"record","sub":0,"title":"Deadman (hung I/O detector)","ctx":"thr","src":"module/zfs/spa_misc.c","fns":[{"name":"spa_deadman","ref":{"file":"module/zfs/spa_misc.c","line":780,"symbol":"spa_deadman","code":"spa_deadman(void *arg)"}},{"name":"vdev_deadman","ref":{"file":"module/zfs/vdev.c","line":6082,"symbol":"vdev_deadman","code":"vdev_deadman(vdev_t *vd, const char *tag)"}},{"name":"zio_deadman","ref":{"file":"module/zfs/zio.c","line":2622,"symbol":"zio_deadman","code":"zio_deadman(zio_t *pio, const char *tag)"}},{"name":"zio_deadman_impl","ref":{"file":"module/zfs/zio.c","line":2564,"symbol":"zio_deadman_impl","code":"zio_deadman_impl(zio_t *pio, int ziodepth)"}}],"role":"Finds I/O that never completes. spa_deadman() runs when a txg sync lasts longer than zfs_deadman_synctime_ms and repeats every zfs_deadman_checktime_ms; vdev_deadman() then looks at the oldest active zio of every leaf. zio_wait() calls zio_deadman() for a waiter older than zfs_deadman_ziotime_ms. It logs and posts deadman ereports; zfs_deadman_failmode (wait, continue, panic) decides what else happens. Nothing is done while the pool is suspended.","tunables":[{"name":"zfs_deadman_enabled","ref":{"file":"module/zfs/spa_misc.c","line":3490,"symbol":"enabled","code":"ZFS_MODULE_PARAM(zfs_deadman, zfs_deadman_, enabled, INT, ZMOD_RW,"}},{"name":"zfs_deadman_synctime_ms","ref":{"file":"module/zfs/spa_misc.c","line":3506,"symbol":"synctime_ms","code":"ZFS_MODULE_PARAM_CALL(zfs_deadman, zfs_deadman_, synctime_ms,"}},{"name":"zfs_deadman_ziotime_ms","ref":{"file":"module/zfs/spa_misc.c","line":3510,"symbol":"ziotime_ms","code":"ZFS_MODULE_PARAM_CALL(zfs_deadman, zfs_deadman_, ziotime_ms,"}},{"name":"zfs_deadman_checktime_ms","ref":{"file":"module/zfs/spa_misc.c","line":3487,"symbol":"checktime_ms","code":"ZFS_MODULE_PARAM(zfs_deadman, zfs_deadman_, checktime_ms, U64, ZMOD_RW,"}},{"name":"zfs_deadman_failmode","ref":{"file":"module/zfs/spa_misc.c","line":3502,"symbol":"failmode","code":"ZFS_MODULE_PARAM_CALL(zfs_deadman, zfs_deadman_, failmode,"}},{"name":"zio_deadman_log_all","ref":{"file":"module/zfs/zio.c","line":6738,"symbol":"deadman_log_all","code":"ZFS_MODULE_PARAM(zfs_zio, zio_, deadman_log_all, INT, ZMOD_RW,"}}],"props":[]},{"id":"suspend","group":"record","sub":0,"title":"Pool suspend / resume","ctx":"any","src":"module/zfs/zio.c","fns":[{"name":"zio_suspend","ref":{"file":"module/zfs/zio.c","line":3016,"symbol":"zio_suspend","code":"zio_suspend(spa_t *spa, zio_t *zio, zio_suspend_reason_t reason)"}},{"name":"zio_resume","ref":{"file":"module/zfs/zio.c","line":3060,"symbol":"zio_resume","code":"zio_resume(spa_t *spa)"}},{"name":"zio_resume_wait","ref":{"file":"module/zfs/zio.c","line":3092,"symbol":"zio_resume_wait","code":"zio_resume_wait(spa_t *spa)"}},{"name":"zio_reexecute","ref":{"file":"module/zfs/zio.c","line":2930,"symbol":"zio_reexecute","code":"zio_reexecute(void *arg)"}},{"name":"spa_suspended","ref":{"file":"module/zfs/spa_misc.c","line":2165,"symbol":"spa_suspended","code":"spa_suspended(spa_t *spa)"}}],"role":"zio_suspend() panics if failmode=panic; otherwise it logs a warning, posts an io_failure ereport, marks the pool suspended and parks the failed root zio under a \"godfather\" zio. New transactions then wait or fail depending on failmode. zio_resume() (from zpool clear) clears the state, wakes waiters and re-executes every parked zio from the start.","tunables":[],"props":[{"name":"failmode","ref":{"file":"module/zcommon/zpool_prop.c","line":213,"symbol":"\"failmode\"","code":"zprop_register_index(ZPOOL_PROP_FAILUREMODE, \"failmode\","}}]},{"id":"ereport_post","group":"fm","sub":0,"title":"Ereport admission (zfs_ereport_post)","ctx":"any","src":"module/zfs/zfs_fm.c","fns":[{"name":"zfs_ereport_post","ref":{"file":"module/zfs/zfs_fm.c","line":1157,"symbol":"zfs_ereport_post","code":"zfs_ereport_post(const char *subclass, spa_t *spa, vdev_t *vd,"}},{"name":"zfs_ereport_is_valid","ref":{"file":"module/zfs/zfs_fm.c","line":1076,"symbol":"zfs_ereport_is_valid","code":"zfs_ereport_is_valid(const char *subclass, spa_t *spa, vdev_t *vd, zio_t *zio)"}},{"name":"zfs_ereport_is_duplicate","ref":{"file":"module/zfs/zfs_fm.c","line":331,"symbol":"zfs_ereport_is_duplicate","code":"zfs_ereport_is_duplicate(const char *subclass, spa_t *spa, vdev_t *vd,"}},{"name":"zfs_is_ratelimiting_event","ref":{"file":"module/zfs/zfs_fm.c","line":437,"symbol":"zfs_is_ratelimiting_event","code":"zfs_is_ratelimiting_event(const char *subclass, vdev_t *vd)"}},{"name":"zfs_ereport_clear","ref":{"file":"module/zfs/zfs_fm.c","line":289,"symbol":"zfs_ereport_clear","code":"zfs_ereport_clear(spa_t *spa, vdev_t *vd)"}}],"role":"Every ereport passes three checks. Valid: not during tryimport or recovery, only read and write zios, not for a disk already known inaccessible, not a checksum error in a range the disk is known to be missing. Not a duplicate: an io or checksum ereport for a vdev and zio with the same pool, vdev, error, priority, offset, size and bookmark as one seen within zfs_zevent_retain_expire_secs is dropped (EALREADY); data ereports name no vdev and are never treated as duplicates. Not rate limited: delay, deadman and checksum ereports are limited per disk per second; dropped events are added to the readers' dropped count. zfs_ereport_clear() forgets the duplicate history (zpool clear, completed scrub). Delay ereports are only posted while the vdev property slow_io_events is on.","tunables":[{"name":"zfs_zevent_retain_max","ref":{"file":"module/zfs/zfs_fm.c","line":1604,"symbol":"retain_max","code":"ZFS_MODULE_PARAM(zfs_zevent, zfs_zevent_, retain_max, UINT, ZMOD_RW,"}},{"name":"zfs_zevent_retain_expire_secs","ref":{"file":"module/zfs/zfs_fm.c","line":1606,"symbol":"retain_expire_secs","code":"ZFS_MODULE_PARAM(zfs_zevent, zfs_zevent_, retain_expire_secs, UINT, ZMOD_RW,"}},{"name":"zfs_checksum_events_per_second","ref":{"file":"module/zfs/vdev.c","line":7393,"symbol":"checksum_events_per_second","code":"ZFS_MODULE_PARAM(zfs, zfs_, checksum_events_per_second, UINT, ZMOD_RW,"}},{"name":"zfs_slow_io_events_per_second","ref":{"file":"module/zfs/vdev.c","line":7380,"symbol":"slow_io_events_per_second","code":"ZFS_MODULE_PARAM(zfs, zfs_, slow_io_events_per_second, UINT, ZMOD_RW,"}},{"name":"zfs_deadman_events_per_second","ref":{"file":"module/zfs/vdev.c","line":7383,"symbol":"deadman_events_per_second","code":"ZFS_MODULE_PARAM(zfs, zfs_, deadman_events_per_second, UINT, ZMOD_RW,"}}],"props":[{"name":"slow_io_events","ref":{"file":"module/zcommon/zpool_prop.c","line":565,"symbol":"\"slow_io_events\"","code":"zprop_register_index(VDEV_PROP_SLOW_IO_EVENTS, \"slow_io_events\","}}]},{"id":"ereport_build","group":"fm","sub":0,"title":"Ereport payload (zfs_ereport_start)","ctx":"any","src":"module/zfs/zfs_fm.c","fns":[{"name":"zfs_ereport_start","ref":{"file":"module/zfs/zfs_fm.c","line":464,"symbol":"zfs_ereport_start","code":"zfs_ereport_start(nvlist_t **ereport_out, nvlist_t **detector_out,"}},{"name":"fm_ereport_set","ref":{"file":"module/zfs/fm.c","line":751,"symbol":"fm_ereport_set","code":"fm_ereport_set(nvlist_t *ereport, int version, const char *erpt_class,"}},{"name":"fm_payload_set","ref":{"file":"module/zfs/fm.c","line":715,"symbol":"fm_payload_set","code":"fm_payload_set(nvlist_t *payload, ...)"}},{"name":"fm_ena_generate","ref":{"file":"module/zfs/fm.c","line":1218,"symbol":"fm_ena_generate","code":"fm_ena_generate(uint64_t timestamp, uchar_t format)"}}],"role":"Builds the nvlist: class ereport.fs.zfs. followed by the subclass (io, checksum, data, delay, deadman, probe_failure, io_failure, vdev.open_failed and the other vdev.* classes ...), an ENA shared by all ereports of one logical I/O, a detector naming pool and vdev, and the payload: pool name, state and failmode; vdev guid, type, path, devid, the vdev's error counters and the spares; zio error, flags, stage, priority, offset, size, delay; the bookmark. For checksum, io and delay ereports it adds the vdev's checksum_n / checksum_t, io_n / io_t or slow_io_n / slow_io_t when they differ from the default, which is how zed learns per-disk SERD thresholds.","tunables":[],"props":[{"name":"checksum_n","ref":{"file":"module/zcommon/zpool_prop.c","line":522,"symbol":"\"checksum_n\"","code":"zprop_register_number(VDEV_PROP_CHECKSUM_N, \"checksum_n\", UINT64_MAX,"}},{"name":"checksum_t","ref":{"file":"module/zcommon/zpool_prop.c","line":525,"symbol":"\"checksum_t\"","code":"zprop_register_number(VDEV_PROP_CHECKSUM_T, \"checksum_t\", UINT64_MAX,"}},{"name":"io_n","ref":{"file":"module/zcommon/zpool_prop.c","line":528,"symbol":"\"io_n\"","code":"zprop_register_number(VDEV_PROP_IO_N, \"io_n\", UINT64_MAX,"}},{"name":"io_t","ref":{"file":"module/zcommon/zpool_prop.c","line":531,"symbol":"\"io_t\"","code":"zprop_register_number(VDEV_PROP_IO_T, \"io_t\", UINT64_MAX,"}},{"name":"slow_io_n","ref":{"file":"module/zcommon/zpool_prop.c","line":534,"symbol":"\"slow_io_n\"","code":"zprop_register_number(VDEV_PROP_SLOW_IO_N, \"slow_io_n\", UINT64_MAX,"}},{"name":"slow_io_t","ref":{"file":"module/zcommon/zpool_prop.c","line":537,"symbol":"\"slow_io_t\"","code":"zprop_register_number(VDEV_PROP_SLOW_IO_T, \"slow_io_t\", UINT64_MAX,"}}]},{"id":"cksum_report","group":"fm","sub":0,"title":"Checksum ereport (start / finish)","ctx":"any","src":"module/zfs/zfs_fm.c","fns":[{"name":"zfs_ereport_start_checksum","ref":{"file":"module/zfs/zfs_fm.c","line":1200,"symbol":"zfs_ereport_start_checksum","code":"zfs_ereport_start_checksum(spa_t *spa, vdev_t *vd, const zbookmark_phys_t *zb,"}},{"name":"zfs_ereport_finish_checksum","ref":{"file":"module/zfs/zfs_fm.c","line":1252,"symbol":"zfs_ereport_finish_checksum","code":"zfs_ereport_finish_checksum(zio_cksum_report_t *report, const abd_t *good_data,"}},{"name":"zfs_ereport_post_checksum","ref":{"file":"module/zfs/zfs_fm.c","line":1304,"symbol":"zfs_ereport_post_checksum","code":"zfs_ereport_post_checksum(spa_t *spa, vdev_t *vd, const zbookmark_phys_t *zb,"}},{"name":"annotate_ecksum","ref":{"file":"module/zfs/zfs_fm.c","line":916,"symbol":"annotate_ecksum","code":"annotate_ecksum(nvlist_t *ereport, zio_bad_cksum_t *info,"}}],"role":"Checksum ereports carry a description of the damage, which needs the good data. For a mirror or single disk the ereport and a copy of the bad data are attached to the logical zio and finished when it completes; RAIDZ already has both buffers and posts at once. annotate_ecksum() records the bad byte ranges and how many bits were set and cleared.","tunables":[],"props":[]},{"id":"sysevent","group":"fm","sub":0,"title":"Resource and sysevent posts","ctx":"any","src":"module/zfs/zfs_fm.c","fns":[{"name":"zfs_post_state_change","ref":{"file":"module/zfs/zfs_fm.c","line":1468,"symbol":"zfs_post_state_change","code":"zfs_post_state_change(spa_t *spa, vdev_t *vd, uint64_t laststate)"}},{"name":"zfs_post_remove","ref":{"file":"module/zfs/zfs_fm.c","line":1431,"symbol":"zfs_post_remove","code":"zfs_post_remove(spa_t *spa, vdev_t *vd, boolean_t by_kernel)"}},{"name":"zfs_event_create","ref":{"file":"module/zfs/zfs_fm.c","line":1350,"symbol":"zfs_event_create","code":"zfs_event_create(spa_t *spa, vdev_t *vd, const char *type, const char *name,"}},{"name":"spa_event_notify","ref":{"file":"module/zfs/spa.c","line":12303,"symbol":"spa_event_notify","code":"spa_event_notify(spa_t *spa, vdev_t *vd, nvlist_t *hist_nvl, const char *name)"}}],"role":"Events that are not errors: resource.fs.zfs.statechange (a leaf changed state), resource.fs.zfs.removed, resource.fs.zfs.autoreplace, and sysevent.fs.zfs.* notices such as vdev_spare, vdev_attach, vdev_clear, resilver_finish and scrub_finish. Each carries pool and vdev guid, path and state.","tunables":[],"props":[]},{"id":"zevent_q","group":"fm","sub":0,"title":"zevent queue","ctx":"any","src":"module/zfs/fm.c","fns":[{"name":"zfs_zevent_post","ref":{"file":"module/zfs/fm.c","line":191,"symbol":"zfs_zevent_post","code":"zfs_zevent_post(nvlist_t *nvl, nvlist_t *detector, zevent_cb_t *cb)"}},{"name":"zfs_zevent_insert","ref":{"file":"module/zfs/fm.c","line":172,"symbol":"zfs_zevent_insert","code":"zfs_zevent_insert(zevent_t *ev)"}},{"name":"zfs_zevent_drain","ref":{"file":"module/zfs/fm.c","line":134,"symbol":"zfs_zevent_drain","code":"zfs_zevent_drain(zevent_t *ev)"}},{"name":"zfs_zevent_next","ref":{"file":"module/zfs/fm.c","line":303,"symbol":"zfs_zevent_next","code":"zfs_zevent_next(zfs_zevent_t *ze, nvlist_t **event, uint64_t *event_size,"}},{"name":"zfs_zevent_wait","ref":{"file":"module/zfs/fm.c","line":360,"symbol":"zfs_zevent_wait","code":"zfs_zevent_wait(zfs_zevent_t *ze)"}}],"role":"One in-kernel list of events for all pools. zfs_zevent_post() adds a time and an event id (eid), inserts at the head and wakes waiting readers; when the list holds zfs_zevent_len_max events the oldest is dropped and every reader positioned on it is told how many it missed. Each open /dev/zfs file has its own cursor, so zed and zpool events read independently.","tunables":[{"name":"zfs_zevent_len_max","ref":{"file":"module/zfs/fm.c","line":1362,"symbol":"len_max","code":"ZFS_MODULE_PARAM(zfs_zevent, zfs_zevent_, len_max, UINT, ZMOD_RW,"}}],"props":[]},{"id":"ioc_events","group":"fm","sub":0,"title":"Event ioctls (/dev/zfs)","ctx":"syscall","src":"module/zfs/zfs_ioctl.c","fns":[{"name":"zfs_ioc_events_next","ref":{"file":"module/zfs/zfs_ioctl.c","line":7182,"symbol":"zfs_ioc_events_next","code":"zfs_ioc_events_next(zfs_cmd_t *zc)"}},{"name":"zfs_ioc_events_seek","ref":{"file":"module/zfs/zfs_ioctl.c","line":7240,"symbol":"zfs_ioc_events_seek","code":"zfs_ioc_events_seek(zfs_cmd_t *zc)"}},{"name":"zfs_ioc_events_clear","ref":{"file":"module/zfs/zfs_ioctl.c","line":7224,"symbol":"zfs_ioc_events_clear","code":"zfs_ioc_events_clear(zfs_cmd_t *zc)"}}],"role":"ZFS_IOC_EVENTS_NEXT returns the next event after the caller's cursor and the dropped count, and blocks until one arrives unless the caller asked not to. SEEK repositions the cursor (zed uses it to start over when its last processed eid is no longer in the queue); CLEAR empties the queue (zpool events -c).","tunables":[],"props":[]},{"id":"udev","group":"zed","sub":0,"title":"Disk monitor (udev)","ctx":"zed","src":"cmd/zed/zed_disk_event.c","fns":[{"name":"zed_udev_monitor","ref":{"file":"cmd/zed/zed_disk_event.c","line":179,"symbol":"zed_udev_monitor","code":"zed_udev_monitor(void *arg)"}},{"name":"zed_udev_event","ref":{"file":"cmd/zed/zed_disk_event.c","line":61,"symbol":"zed_udev_event","code":"zed_udev_event(const char *class, const char *subclass, nvlist_t *nvl)"}}],"role":"A zed thread listening to udev. Disk and partition add and remove uevents (including multipath and scsi_debug special cases) become EC_dev_add / EC_dev_remove events for the agents. They never pass through the kernel zevent queue.","tunables":[],"props":[]},{"id":"zed_ finish before later ones start; the others run in parallel. They report; the fault decisions are made by the agents.","tunables":[],"props":[]},{"id":"agents","group":"zed","sub":0,"title":"Agent dispatcher","ctx":"zed","src":"cmd/zed/agents/zfs_agents.c","fns":[{"name":"zfs_agent_post_event","ref":{"file":"cmd/zed/agents/zfs_agents.c","line":185,"symbol":"zfs_agent_post_event","code":"zfs_agent_post_event(const char *class, const char *subclass, nvlist_t *nvl)"}},{"name":"zfs_agent_consumer_thread","ref":{"file":"cmd/zed/agents/zfs_agents.c","line":357,"symbol":"zfs_agent_consumer_thread","code":"zfs_agent_consumer_thread(void *arg)"}},{"name":"zfs_agent_dispatch","ref":{"file":"cmd/zed/agents/zfs_agents.c","line":308,"symbol":"zfs_agent_dispatch","code":"zfs_agent_dispatch(const char *class, const char *subclass, nvlist_t *nvl)"}}],"role":"A queue and one thread that hand each event to the agents subscribed to its class. Agents can post events to it too (the diagnosis engine's fault lists). A udev disk-remove event is rewritten here into resource.fs.zfs.removed.","tunables":[],"props":[]},{"id":"diagnosis","group":"zed","sub":1,"title":"Diagnosis engine (zfs-diagnosis)","ctx":"zed","src":"cmd/zed/agents/zfs_diagnosis.c","fns":[{"name":"zfs_fm_recv","ref":{"file":"cmd/zed/agents/zfs_diagnosis.c","line":554,"symbol":"zfs_fm_recv","code":"zfs_fm_recv(fmd_hdl_t *hdl, fmd_event_t *ep, nvlist_t *nvl, const char *class)"}},{"name":"zfs_fm_serd_record","ref":{"file":"cmd/zed/agents/zfs_diagnosis.c","line":531,"symbol":"zfs_fm_serd_record","code":"zfs_fm_serd_record(fmd_hdl_t *hdl, const char *name, fmd_event_t *ep,"}},{"name":"zfs_other_serd_cases","ref":{"file":"cmd/zed/agents/zfs_diagnosis.c","line":175,"symbol":"zfs_other_serd_cases","code":"zfs_other_serd_cases(fmd_hdl_t *hdl, const zfs_case_data_t *zfs_case)"}},{"name":"zfs_case_solve","ref":{"file":"cmd/zed/agents/zfs_diagnosis.c","line":456,"symbol":"zfs_case_solve","code":"zfs_case_solve(fmd_hdl_t *hdl, zfs_case_t *zcp, const char *faultname)"}},{"name":"zfs_fm_timeout","ref":{"file":"cmd/zed/agents/zfs_diagnosis.c","line":1058,"symbol":"zfs_fm_timeout","code":"zfs_fm_timeout(fmd_hdl_t *hdl, id_t id, void *data)"}}],"role":"Keeps one case per disk. Ignores ereports from before the pool was loaded, during import, io and checksum ereports during pool open, ereports for vdevs other than disks and files, and checksum ereports from scrub or resilver I/O. io and checksum ereports feed SERD engines; when one fires (and no other disk under the same parent has an active case) it solves the case: checksum and slow_io at once, io after a 15 second wait for a removal event. A removal resets the engines; a statechange to HEALTHY closes the case. A pool io_failure ereport is turned into a pool fault directly.","tunables":[],"props":[]},{"id":"serd","group":"zed","sub":1,"title":"SERD engines","ctx":"zed","src":"cmd/zed/agents/fmd_serd.c","fns":[{"name":"fmd_serd_create","ref":{"file":"cmd/zed/agents/fmd_api.c","line":459,"symbol":"fmd_serd_create","code":"fmd_serd_create(fmd_hdl_t *hdl, const char *name, uint_t n, hrtime_t t)"}},{"name":"fmd_serd_record","ref":{"file":"cmd/zed/agents/fmd_api.c","line":518,"symbol":"fmd_serd_record","code":"fmd_serd_record(fmd_hdl_t *hdl, const char *name, fmd_event_t *ep)"}},{"name":"fmd_serd_reset","ref":{"file":"cmd/zed/agents/fmd_api.c","line":504,"symbol":"fmd_serd_reset","code":"fmd_serd_reset(fmd_hdl_t *hdl, const char *name)"}},{"name":"fmd_serd_eng_record","ref":{"file":"cmd/zed/agents/fmd_serd.c","line":229,"symbol":"fmd_serd_eng_record","code":"fmd_serd_eng_record(fmd_serd_eng_t *sgp, hrtime_t hrt)"}}],"role":"Soft Error Rate Discrimination: an engine remembers the times of its last N events and fires when N of them fall within T. Defaults: 10 io or checksum events within 600 seconds. A slow_io engine exists only when the disk has both slow_io_n and slow_io_t set. Once fired, an engine ignores events until it is reset.","tunables":[],"props":[]},{"id":"fmd_case","group":"zed","sub":1,"title":"Fault cases (list.suspect)","ctx":"zed","src":"cmd/zed/agents/fmd_api.c","fns":[{"name":"fmd_case_open","ref":{"file":"cmd/zed/agents/fmd_api.c","line":229,"symbol":"fmd_case_open","code":"fmd_case_open(fmd_hdl_t *hdl, void *data)"}},{"name":"fmd_case_add_suspect","ref":{"file":"cmd/zed/agents/fmd_api.c","line":371,"symbol":"fmd_case_add_suspect","code":"fmd_case_add_suspect(fmd_hdl_t *hdl, fmd_case_t *cp, nvlist_t *fault)"}},{"name":"fmd_case_solve","ref":{"file":"cmd/zed/agents/fmd_api.c","line":254,"symbol":"fmd_case_solve","code":"fmd_case_solve(fmd_hdl_t *hdl, fmd_case_t *cp)"}},{"name":"fmd_fault_mkcode","ref":{"file":"cmd/zed/agents/fmd_api.c","line":342,"symbol":"fmd_fault_mkcode","code":"fmd_fault_mkcode(nvlist_t *fault)"}}],"role":"zed's small implementation of the illumos fault manager API. Solving a case builds a fault (fault.fs.zfs.vdev.io, vdev.checksum, vdev.slow_io, io_failure_wait / _continue, ...), logs it with its ZFS-8000 message code and posts a list.suspect event back to the agent queue.","tunables":[],"props":[]},{"id":"retire","group":"zed","sub":1,"title":"Retire agent (zfs-retire)","ctx":"zed","src":"cmd/zed/agents/zfs_retire.c","fns":[{"name":"zfs_retire_recv","ref":{"file":"cmd/zed/agents/zfs_retire.c","line":567,"symbol":"zfs_retire_recv","code":"zfs_retire_recv(fmd_hdl_t *hdl, fmd_event_t *ep, nvlist_t *nvl,"}},{"name":"replace_with_spare","ref":{"file":"cmd/zed/agents/zfs_retire.c","line":414,"symbol":"replace_with_spare","code":"replace_with_spare(fmd_hdl_t *hdl, zpool_handle_t *zhp, nvlist_t *vdev)"}},{"name":"zfs_vdev_repair","ref":{"file":"cmd/zed/agents/zfs_retire.c","line":529,"symbol":"zfs_vdev_repair","code":"zfs_vdev_repair(fmd_hdl_t *hdl, nvlist_t *nvl)"}}],"role":"Acts on fault lists: fault.fs.zfs.vdev.io faults the disk, vdev.checksum and vdev.slow_io degrade it, both with aux \"too many errors\", then it tries to attach a hot spare. On resource.fs.zfs.removed it requests removal if the kernel has not marked the disk REMOVED yet; on that event or a statechange to REMOVED or FAULTED it attaches a spare when spare_on_remove is set (default on). Spares are tried in order of preference (same rotational type, size, ...) until one attaches.","tunables":[],"props":[]},{"id":"slm","group":"zed","sub":1,"title":"Hotplug agent (zfs_mod)","ctx":"zed","src":"cmd/zed/agents/zfs_mod.c","fns":[{"name":"zfs_slm_event","ref":{"file":"cmd/zed/agents/zfs_mod.c","line":1414,"symbol":"zfs_slm_event","code":"zfs_slm_event(const char *class, const char *subclass, nvlist_t *nvl)"}},{"name":"zfs_slm_deliver_event","ref":{"file":"cmd/zed/agents/zfs_mod.c","line":1298,"symbol":"zfs_slm_deliver_event","code":"zfs_slm_deliver_event(const char *class, const char *subclass, nvlist_t *nvl)"}},{"name":"zfs_deliver_add","ref":{"file":"cmd/zed/agents/zfs_mod.c","line":906,"symbol":"zfs_deliver_add","code":"zfs_deliver_add(nvlist_t *nvl)"}},{"name":"zfs_deliver_check","ref":{"file":"cmd/zed/agents/zfs_mod.c","line":965,"symbol":"zfs_deliver_check","code":"zfs_deliver_check(nvlist_t *nvl)"}},{"name":"zfs_process_add","ref":{"file":"cmd/zed/agents/zfs_mod.c","line":187,"symbol":"zfs_process_add","code":"zfs_process_add(zpool_handle_t *zhp, nvlist_t *vdev, boolean_t labeled)"}}],"role":"Handles disk-add events and the vdev_check sysevent (a device failed to open at import while autoreplace is on). It looks for a pool vdev with the same devid, physical path, guid or by-vdev path, skips healthy and plainly offlined ones, and onlines it; if that fails and the pool has autoreplace=on and the vdev was a whole disk in a bad state, it labels the new disk and replaces the old one with it. Without autoreplace it onlines again with ZFS_ONLINE_FORCEFAULT so that the failure is reported.","tunables":[],"props":[{"name":"autoreplace","ref":{"file":"module/zcommon/zpool_prop.c","line":196,"symbol":"\"autoreplace\"","code":"zprop_register_index(ZPOOL_PROP_AUTOREPLACE, \"autoreplace\", 0,"} 62,"symbol":"zpool_events_next","code":"zpool_events_next(libzfs_handle_t *hdl, nvlist_t **nvp,"}}],"role":"Wraps ZFS_IOC_EVENTS_NEXT on a caller-supplied /dev/zfs file descriptor, growing the buffer when an event does not fit. Used by zed and by zpool events.","tunables":[],"props":[]},{"id":"libzfs_status","group":"user","sub":0,"title":"libzfs status readers","ctx":"user","src":"lib/libzfs/libzfs_config.c","fns":[{"name":"zpool_refresh_stats","ref":{"file":"lib/libzfs/libzfs_config.c","line":208,"symbol":"zpool_refresh_stats","code":"zpool_refresh_stats(zpool_handle_t *zhp, boolean_t *missing)"}},{"name":"zpool_get_errlog","ref":{"file":"lib/libzfs/libzfs_pool.c","line":5197,"symbol":"zpool_get_errlog","code":"zpool_get_errlog(zpool_handle_t *zhp, nvlist_t **nverrlistp)"}},{"name":"zpool_obj_to_path","ref":{"file":"lib/libzfs/libzfs_pool.c","line":5688,"symbol":"zpool_obj_to_path","code":"zpool_obj_to_path(zpool_handle_t *zhp, uint64_t dsobj, uint64_t obj,"}}],"role":"Fetches the pool configuration with statistics (ZFS_IOC_POOL_STATS) and the error log as an array of bookmarks (ZFS_IOC_ERROR_LOG), and turns dataset and object numbers into path names for display.","tunables":[],"props":[]},{"id":"libzfs_state","group":"user","sub":0,"title":"libzfs vdev state calls","ctx":"user","src":"lib/libzfs/libzfs_pool.c","fns":[{"name":"zpool_vdev_fault","ref":{"file":"lib/libzfs/libzfs_pool.c","line":3767,"symbol":"zpool_vdev_fault","code":"zpool_vdev_fault(zpool_handle_t *zhp, uint64_t guid, vdev_aux_t aux)"}},{"name":"zpool_vdev_degrade","ref":{"file":"lib/libzfs/libzfs_pool.c","line":3871,"symbol":"zpool_vdev_degrade","code":"zpool_vdev_degrade(zpool_handle_t *zhp, uint64_t guid, vdev_aux_t aux)"}},{"name":"zpool_vdev_online","ref":{"file":"lib/libzfs/libzfs_pool.c","line":3594,"symbol":"zpool_vdev_online","code":"zpool_vdev_online(zpool_handle_t *zhp, const char *path, int flags,"}},{"name":"zpool_vdev_remove_wanted","ref":{"file":"lib/libzfs/libzfs_pool.c","line":3737,"symbol":"zpool_vdev_remove_wanted","code":"zpool_vdev_remove_wanted(zpool_handle_t *zhp, const char *path)"}},{"name":"zpool_clear","ref":{"file":"lib/libzfs/libzfs_pool.c","line":4655,"symbol":"zpool_clear","code":"zpool_clear(zpool_handle_t *zhp, const char *path, nvlist_t *rewindnvl)"}}],"role":"Thin wrappers that send ZFS_IOC_VDEV_SET_STATE (faulted, degraded, online, removed) or ZFS_IOC_CLEAR. Used by zed's agents and by zpool online, offline -f and clear.","tunables":[],"props":[]},{"id":"libzfs_attach","group":"user","sub":0,"title":"libzfs replace / spare attach","ctx":"user","src":"lib/libzfs/libzfs_pool.c","fns":[{"name":"zpool_vdev_attach","ref":{"file":"lib/libzfs/libzfs_pool.c","line":3920,"symbol":"zpool_vdev_attach","code":"zpool_vdev_attach(zpool_handle_t *zhp, const char *old_disk,"}}],"role":"zpool attach and zpool replace, and the agents' spare activation and autoreplace: sends ZFS_IOC_VDEV_ATTACH with the new device and the replacing flag.","tunables":[],"props":[]},{"id":"ioc_status","group":"kstate","sub":0,"title":"Status ioctls","ctx":"syscall","src":"module/zfs/zfs_ioctl.c","fns":[{"name":"zfs_ioc_pool_stats","ref":{"file":"module/zfs/zfs_ioctl.c","line":1869,"symbol":"zfs_ioc_pool_stats","code":"zfs_ioc_pool_stats(zfs_cmd_t *zc)"}},{"name":"spa_get_stats","ref":{"file":"module/zfs/spa.c","line":7029,"symbol":"spa_get_stats","code":"spa_get_stats(const char *name, nvlist_t **config,"}},{"name":"zfs_ioc_error_log","ref":{"file":"module/zfs/zfs_ioctl.c","line":6555,"symbol":"zfs_ioc_error_log","code":"zfs_ioc_error_log(zfs_cmd_t *zc)"}}],"role":"Returns the pool configuration with each vdev's vdev_stat_t, the approximate error count and the suspended flag, and copies the error log out as bookmarks.","tunables":[],"props":[]},{"id":"ioc_state","group":"kstate","sub":0,"title":"Vdev change ioctls","ctx":"syscall","src":"module/zfs/zfs_ioctl.c","fns":[{"name":"zfs_ioc_vdev_set_state","ref":{"file":"module/zfs/zfs_ioctl.c","line":2344,"symbol":"zfs_ioc_vdev_set_state","code":"zfs_ioc_vdev_set_state(zfs_cmd_t *zc)"}},{"name":"zfs_ioc_vdev_attach","ref":{"file":"module/zfs/zfs_ioctl.c","line":2391,"symbol":"zfs_ioc_vdev_attach","code":"zfs_ioc_vdev_attach(zfs_cmd_t *zc)"}}],"role":"Dispatches a requested state (online, offline, faulted, degraded, removed) to the vdev code, and attach / replace requests to spa_vdev_attach(). A fault or degrade with an unknown aux reason is treated as \"too many errors\".","tunables":[],"props":[]},{"id":"ioc_clear","group":"kstate","sub":0,"title":"zfs_ioc_clear()","ctx":"syscall","src":"module/zfs/zfs_ioctl.c","fns":[{"name":"zfs_ioc_clear","ref":{"file":"module/zfs/zfs_ioctl.c","line":6572,"symbol":"zfs_ioc_clear","code":"zfs_ioc_clear(zfs_cmd_t *zc)"}}],"role":"zpool clear: optionally rewinds a pool that failed to open, refuses to resume when multihost sees another host, clears the vdev errors under the vdev state lock and resumes suspended I/O. It does not touch the error log.","tunables":[],"props":[]},{"id":"vdev_fault","group":"kstate","sub":0,"title":"vdev_fault() / vdev_degrade()","ctx":"syscall","src":"module/zfs/vdev.c","fns":[{"name":"vdev_fault","ref":{"file":"module/zfs/vdev.c","line":4587,"symbol":"vdev_fault","code":"vdev_fault(spa_t *spa, uint64_t guid, vdev_aux_t aux)"}},{"name":"vdev_degrade","ref":{"file":"module/zfs/vdev.c","line":4675,"symbol":"vdev_degrade","code":"vdev_degrade(spa_t *spa, uint64_t guid, vdev_aux_t aux)"}}],"role":"Fault: the leaf is closed and gets no more I/O. The flag is written to the config, but when the pool is opened or imported again only a persistent forced fault (zpool offline -f, aux \"external\") is kept; a fault requested by zed is dropped and the disk is tried again. If the disk holds the only copy of some data it is reopened and left DEGRADED instead. Degrade: only a flag for the administrator; I/O continues normally. Only leaf vdevs can be faulted or degraded.","tunables":[],"props":[]},{"id":"vdev_online","group":"kstate","sub":0,"title":"vdev_online() / vdev_remove_wanted()","ctx":"syscall","src":"module/zfs/vdev.c","fns":[{"name":"vdev_online","ref":{"file":"module/zfs/vdev.c","line":4740,"symbol":"vdev_online","code":"vdev_online(spa_t *spa, uint64_t guid, uint64_t flags, vdev_state_t *newstate)"}},{"name":"vdev_remove_wanted","ref":{"file":"module/zfs/vdev.c","line":4702,"symbol":"vdev_remove_wanted","code":"vdev_remove_wanted(spa_t *spa, uint64_t guid)"}}],"role":"Online clears the offline flags and reopens the top-level vdev; with ZFS_ONLINE_UNSPARE a spare attached in its place is detached after the resilver. Remove-wanted first probes the disk and refuses (EEXIST) if it still answers, then lets the async thread mark it REMOVED.","tunables":[],"props":[]},{"id":"vdev_clear","group":"kstate","sub":0,"title":"vdev_clear()","ctx":"syscall","src":"module/zfs/vdev.c","fns":[{"name":"vdev_clear","ref":{"file":"module/zfs/vdev.c","line":4971,"symbol":"vdev_clear","code":"vdev_clear(spa_t *spa, vdev_t *vd)"}}],"role":"Zeroes the error counters of a vdev and all its children. A faulted, degraded or unreachable vdev gets its flags cleared and is reopened; a still-broken disk fails to open and, because vdev_forcefault is set, its ereport is posted again. Also forgets the vdev's duplicate-ereport history.","tunables":[],"props":[]},{"id":"vdev_state","group":"kstate","sub":1,"title":"vdev_set_state()","ctx":"any","src":"module/zfs/vdev.c","fns":[{"name":"vdev_set_state","ref":{"file":"module/zfs/vdev.c","line":5827,"symbol":"vdev_set_state","code":"vdev_set_state(vdev_t *vd, boolean_t isopen, vdev_state_t state, vdev_aux_t aux)"}},{"name":"vdev_propagate_state","ref":{"file":"module/zfs/vdev.c","line":5762,"symbol":"vdev_propagate_state","code":"vdev_propagate_state(vdev_t *vd)"}}],"role":"Sets a vdev's state and aux reason, closes a leaf that is now dead, posts a statechange event for a leaf (and an ereport.fs.zfs.vdev.* ereport such as vdev.open_failed when it cannot be opened), and propagates upwards: a mirror or raidz with some unhealthy children becomes DEGRADED, with too many it can no longer be opened.","tunables":[],"props":[]},{"id":"vdev_open","group":"kstate","sub":1,"title":"vdev_open() / vdev_reopen()","ctx":"any","src":"module/zfs/vdev.c","fns":[{"name":"vdev_reopen","ref":{"file":"module/zfs/vdev.c","line":3001,"symbol":"vdev_reopen","code":"vdev_reopen(vdev_t *vd)"}},{"name":"vdev_open","ref":{"file":"module/zfs/vdev.c","line":2216,"symbol":"vdev_open","code":"vdev_open(vdev_t *vd, cred_t *cred)"}}],"role":"Closes and reopens a vdev tree. A faulted or offline leaf stays so; a missing one stays REMOVED; otherwise it becomes HEALTHY or DEGRADED. A leaf that opened successfully is checked for a needed resilver.","tunables":[],"props":[]},{"id":"async","group":"kstate","sub":1,"title":"SPA async thread","ctx":"thr","src":"module/zfs/spa.c","fns":[{"name":"spa_async_request","ref":{"file":"module/zfs/spa.c","line":10506,"symbol":"spa_async_request","code":"spa_async_request(spa_t *spa, int task)"}},{"name":"spa_async_thread","ref":{"file":"module/zfs/spa.c","line":10239,"symbol":"spa_async_thread","code":"spa_async_thread(void *arg)"}},{"name":"spa_async_remove","ref":{"file":"module/zfs/spa.c","line":10171,"symbol":"spa_async_remove","code":"spa_async_remove(spa_t *spa, vdev_t *vd, boolean_t by_kernel)"}},{"name":"spa_async_fault_vdev","ref":{"file":"module/zfs/spa.c","line":10199,"symbol":"spa_async_fault_vdev","code":"spa_async_fault_vdev(vdev_t *vd, boolean_t *suspend)"}}],"role":"Work that cannot be done in the I/O completion path: marking vdevs REMOVED (counters zeroed, removed event posted), faulting vdevs whose probe failed (DEGRADED and pool suspend instead when the disk holds the only copy), starting a resilver, detaching finished replacements and spares.","tunables":[],"props":[]},{"id":"spa_attach","group":"kstate","sub":1,"title":"spa_vdev_attach()","ctx":"syscall","src":"module/zfs/spa.c","fns":[{"name":"spa_vdev_attach","ref":{"file":"module/zfs/spa.c","line":8545,"symbol":"spa_vdev_attach","code":"spa_vdev_attach(spa_t *spa, uint64_t guid, nvlist_t *nvroot, int replacing,"}},{"name":"spa_spare_activate","ref":{"file":"module/zfs/spa_misc.c","line":1279,"symbol":"spa_spare_activate","code":"spa_spare_activate(vdev_t *vd)"}}],"role":"Inserts a spare vdev (for a hot spare) or a replacing vdev above the old disk, adds the new disk with a DTL covering every txg, marks a hot spare active, posts vdev_spare and vdev_attach events and starts a resilver (or a sequential rebuild for a dRAID spare, or defers it while another resilver runs).","tunables":[],"props":[]},{"id":"resilver_start","group":"kstate","sub":1,"title":"Resilver trigger","ctx":"any","src":"module/zfs/dsl_scan.c","fns":[{"name":"dsl_scan_assess_vdev","ref":{"file":"module/zfs/dsl_scan.c","line":5493,"symbol":"dsl_scan_assess_vdev","code":"dsl_scan_assess_vdev(dsl_pool_t *dp, vdev_t *vd)"}},{"name":"vdev_resilver_needed","ref":{"file":"module/zfs/vdev.c","line":3911,"symbol":"vdev_resilver_needed","code":"vdev_resilver_needed(vdev_t *vd, uint64_t *minp, uint64_t *maxp)"}},{"name":"dsl_scan_restart_resilver","ref":{"file":"module/zfs/dsl_scan.c","line":1560,"symbol":"dsl_scan_restart_resilver","code":"dsl_scan_restart_resilver(dsl_pool_t *dp, uint64_t txg)"}}],"role":"Decides whether a reopened leaf needs a resilver (its DTL is not empty) and asks the async thread to start one, unless a running resilver already covers its txgs; with resilver_defer a newer gap is deferred instead of restarting. dsl_scan_restart_resilver() starts the scan, which continues in the scrub and resilver graph.","tunables":[],"props":[]},{"id":"dmu_tx","group":"sync","sub":0,"title":"dmu_tx (transaction)","ctx":"open","src":"module/zfs/dmu_tx.c","fns":[{"name":"dmu_tx_assign","ref":{"file":"module/zfs/dmu_tx.c","line":1239,"symbol":"dmu_tx_assign","code":"dmu_tx_assign(dmu_tx_t *tx, dmu_tx_flag_t flags)"}},{"name":"dmu_tx_try_assign","ref":{"file":"mo o long"},{"id":"wait","label":"A zio_wait() caller waits too long"}]},{"id":"dmode","options":[{"id":"wait","label":"zfs_deadman_failmode=wait (default): only report"},{"id":"continue","label":"zfs_deadman_failmode=continue: the hung leaf zio is completed with EINTR"}]}],"steps":[{"wire":"E039","when":[{"group":"trigger","options":["sync"]}]},{"wire":"E040","when":[{"group":"trigger","options":["wait"]}]},{"wire":"E041"},{"wire":"E043","note":"at most zfs_deadman_events_per_second per disk"},{"wire":"E044"},{"wire":"E042","when":[{"group":"dmode","options":["continue"]}]},{"wire":"E003","when":[{"group":"dmode","options":["continue"]}],"note":"the hung zio completes with EINTR"},{"wire":"E054"},{"wire":"E053"},{"wire":"E051"},{"wire":"E050"},{"wire":"E052"},{"wire":"E055"},{"wire":"E058","note":"for example deadman-sync-slot_off.sh, which can power off the slot"}]},{"id":"zed_fault","category":"Diagnosis","title":"Repeated I/O errors: zed faults the disk, a hot spare takes over","summary":"The io SERD engine of a disk fires (ten io ereports within ten minutes by default). After a 15 second grace period for a removal event, the diagnosis engine solves fault.fs.zfs.vdev.io, the retire agent faults the disk through libzfs, and a hot spare is attached as a replacement.","ends":"The disk is FAULTED (or DEGRADED if it held the only copy of some data) and no longer receives I/O. With a spare, a spare vdev holds the failed disk and the spare, and a resilver copies everything onto the spare; it continues in the scrub and resilver graph (`zfs-scrub-resilver:resilver`). The spare stays attached until the failed disk is replaced or brought back. A fault requested by zed is not kept when the pool is next imported; the disk is then opened again.","alts":[{"id":"spare","options":[{"id":"yes","label":"The pool has an available hot spare"},{"id":"no","label":"No spare: the disk stays FAULTED and the vdev above it DEGRADED"}]}],"steps":[{"wire":"E054","note":"another io ereport for t {"wire":"E087"},{"wire":"E090"},{"wire":"E120"}]},{"id":"kernel_fault","category":"Diagnosis","title":"The kernel faults an unreachable disk (probe failure)","summary":"An I/O fails on a disk that still looks present, the probe of its label areas fails too, and the kernel itself marks the disk FAULTED from the SPA async thread. zed's retire agent then sees the state change and attaches a spare.","ends":"The disk is FAULTED without any SERD diagnosis. If a spare was attached, the resilver starts as in path zed_fault. When the only copy is affected the pool suspends instead (path suspend_clear, cause dead_disk).","alts":[],"steps":[{"wire":"E001","note":"the disk stops answering correctly"},{"wire":"E002"},{"wire":"E003"},{"wire":"E006","note":"the label pad reads or writes fail"},{"wire":"E032"},{"wire":"E043"},{"wire":"E044"},{"wire":"E033"},{"wire":"E034","note":"FAULTED, because the other mirror side still has the data"},{"wire":"E049"},{"wire":"E048"},{"wire":"E054"},{"wire":"E053"},{"wire":"E051"},{"wire":"E050"},{"wire":"E052"},{"wire":"E055"},{"wire":"E057"},{"wire":"E062","note":"statechange to FAULTED"},{"wire":"E073","note":"spare_on_remove: try the spares"},{"wire":"E087"},{"wire":"E090"}]},{"id":"device_removed","category":"Device state","title":"Device removed and returning (DTL, resilver)","summary":"A disk of a mirror disappears. It is marked REMOVED, earlier errors are forgiven, writes skip it and record their txgs in its DTL. When the disk is plugged back in, zed onlines it and a resilver copies exactly the missed txgs. A different blank disk in the same slot is used as a replacement when autoreplace is on.","ends":"A resilver starts that copies the txgs in the DTL to the returned disk (or everything to the new one); it continues in the scrub and resilver graph (`zfs-scrub-resilver:resilver`). In both detection cases the retire agent also attaches a spare when one is available (spare_on_remove); when the original disk is onlined with ZFS_ONLINE_UNSPARE, that spare is detached again after the resilver.","alts":[{"id":"detect","options":[{"id":"kernel","label":"Linux sees an EIO and the disk gone (vdev_disk_io_done)"},{"id":"udev","label":"zed sees the udev remove event first"}]},{"id":"back","options":[{"id":"same","label":"The same disk comes back"},{"id":"new","label":"A new disk in the same slot, pool property autoreplace=on"}]}],"steps":[{"wire":"E001","when":[{"group":"detect","options":["kernel"]}],"note":"an I/O fails with EIO: the disk was pulled"},{"wire":"E002","when":[{"group":"detect","options":["kernel"]}]},{"wire":"E003","when":[{"group":"detect","options":["kernel"]}]},{"wire":"E007","when":[{"group":"detect","options":["kernel"]}]},{"wire":"E008","when":[{"group":"detect","options":["kernel"]}]},{"wire":"E059","when":[{"group":"detect","options":["udev"]}],"note":"the udev remove event"},{"wire":"E060","when":[{"group":"detect","options":["udev"]}]},{"wire":"E062","when":[{"group":"detect","options":["udev"]}]},{"wire":"E072","when":[{"group":"detect","options":["udev"]}]},{"wire":"E085","when":[{"group":"detect","options":["udev"]}]},{"wire":"E089","when":[{"group":"detect","options":["udev"]}],"note":"VDEV_STATE_REMOVED"},{"wire":"E094","when":[{"group":"detect","options":["udev"]}]},{"wire":"E095","when":[{"group":"detect","options":["udev"]}]},{"wire":"E036","note":"REMOVED; the mirror above becomes DEGRADED"},{"wire":"E049"},{"wire":"E037"},{"wire":"E048"},{"wire":"E054"},{"wire":"E053"},{"wire":"E051"},{"wire":"E050"},{"wire":"E052"},{"wire":"E055"},{"wire":"E057"},{"wire":"E061"},{"wire":"E069","note":"errors just before the removal are blamed on it"},{"wire":"E004","note":"txg sync writes to the mirror: the missing side fails with ENXIO at once"},{"wire":"E003"},{"wire":"E005"},{"wire":"E010"},{"wire":"E023","note":"no READ or WRITE count and no ereport: the disk is dead"},{"wire":"E031","note":"the txg is added to the disk's DTL_MISSING"},{"wire":"E112"},{"wire":"E059","note":"a disk is plugged into the slot"},{"wire":"E060"},{"wire":"E063"},{"wire":"E074"},{"wire":"E085"},{"wire":"E089","note":"VDEV_STATE_ONLINE"},{"wire":"E093","when":[{"group":"back","options":["same"]}]},{"wire":"E096","when":[{"group":"back","options":["same"]}],"note":"HEALTHY again"},{"wire":"E097","when":[{"group":"back","options":["same"]}]},{"wire":"E098","when":[{"group":"back","options":["same"]}]},{"wire":"E099","when":[{"group":"back","options":["same"]}]},{"wire":"E038","when":[{"group":"back","options":["same"]}]},{"wire":"E075","when":[{"group":"back","options":["new"]}],"note":"the online failed: not the same disk"},{"wire":"E087","when":[{"group":"back","options":["new"]}]},{"wire":"E090","when":[{"group":"back","options":["new"]}]},{"wire":"E118","when":[{"group":"back","options":["new"]}]},{"wire":"E120","when":[{"group":"back","options":["new"]}]}]},{"id":"suspend_clear","category":"Pool failure","title":"Pool suspend and zpool clear","summary":"Some I/O cannot be completed and must not be dropped, so the pool suspends: new transactions wait (failmode=wait) or fail with EIO (failmode=continue), or the system panics (failmode=panic). After the administrator restores the devices, zpool clear clears the errors, reopens the devices and re-executes the held I/O.","ends":"The pool runs again and every held zio has been re-executed from the start. If a device is still unusable the I/O fails again and the pool suspends again. With failmode=panic the system panicked in zio_suspend() and none of the later steps happen.","alts":[{"id":"cause","options":[{"id":"labels","label":"spa_sync() cannot write the vdev labels"},{"id":"missing_read","label":"A read finds every copy on missing disks"},{"id":"dead_disk","label":"The kernel faults the disk that holds the only copy"}]}],"steps":[{"wire":"E109","when":[{"group":"cause","options":["labels"]}]},{"wire":"E110","when":[{"group":"cause","options":["labels"]}]},{"wire":"E005","when":[{"group":"cause","options":["missing_read"]}],"note":"the logical read failed: every child returned ENXIO"},{"wire":"E011","when":[{"group":"cause","options":["missing_read"]}]},{"wire":"E012","when":[{"group":"cause","options":["missing_read"]}]},{"wire":"E004","when":[{"group":"cause","options":["missing_read"]}],"note":"every child fails with ENXIO again"},{"wire":"E003","when":[{"group":"cause","options":["missing_read"]}]},{"wire":"E005","when":[{"group":"cause","options":["missing_read"]}]},{"wire":"E010","when":[{"group":"cause","options":["missing_read"]}]},{"wire":"E029","when":[{"group":"cause","options":["missing_read"]}],"note":"ENXIO on a read, failmode is not continue"},{"wire":"E001","when":[{"group":"cause","options":["dead_disk"]}],"note":"the disk of a single-disk top-level vdev stops working"},{"wire":"E002","when":[{"group":"cause","options":["dead_disk"]}]},{"wire":"E003","when":[{"group":"cause","options":["dead_disk"]}]},{"wire":"E006","when":[{"group":"cause","options":["dead_disk"]}]},{"wire":"E033","when":[{"group":"cause","options":["dead_disk"]}]},{"wire":"E034","when":[{"group":"cause","options":["dead_disk"]}],"note":"DEGRADED, not FAULTED: it holds the only copy"},{"wire":"E035","when":[{"group":"cause","options":["dead_disk"]}]},{"wire":"E005","when":[{"group":"cause","options":["dead_disk"]}],"note":"meanwhile a txg write to that disk failed"},{"wire":"E010","when":[{"group":"cause","options":["dead_disk"]}]},{"wire":"E030","when":[{"group":"cause","options":["dead_disk"]}],"note":"the write tree is re-executed, and fails again"},{"wire":"E107"},{"wire":"E043"},{"wire":"E044"},{"wire":"E108","note":"failmode=wait: writers block; continue: EIO"},{"wire":"E054"},{"wire":"E053"},{"wire":"E051"},{"wire":"E050"},{"wire":"E052"},{"wire":"E055"},{"wire":"E057"},{"wire":"E061"},{"wire":"E068"},{"wire":"E084","note":"the administrator restores the disks and runs zpool clear"},{"wire":"E086"},{"wire":"E100"},{"wire":"E101"},{"wire":"E102"},{"wire":"E096"},{"wire":"E103"},{"wire":"E104"},{"wire":"E105"},{"wire":"E106"}]},{"id":"permanent_error","category":"Error log","title":"Permanent error recorded and listed","summary":"A block cannot be read from any copy. The logical zio fails, its bookmark goes into the error log, which is written to the pool in the next txg, and zpool status -v lists the affected file. The entry goes away only when a later scrub completes without finding the error again.","ends":"The error stays listed across zpool clear and reboots until a scrub or resilver ends without having seen it again. If the damaged block is still referenced, the scrub reads it, logs it again, and it stays listed.","alts":[],"steps":[{"wire":"E001","note":"the last copy of a block returns wrong data"},{"wire":"E002"},{"wire":"E003"},{"wire":"E005"},{"wire":"E009"},{"wire":"E013"},{"wire":"E014"},{"wire":"E015","note":"no other copy is left: the logical read fails with ECKSUM"},{"wire":"E028","note":"finished without good data"},{"wire":"E047"},{"wire":"E027"},{"wire":"E026"},{"wire":"E043"},{"wire":"E044"},{"wire":"E054"},{"wire":"E053"},{"wire":"E051"},{"wire":"E050"},{"wire":"E052"},{"wire":"E055"},{"wire":"E058","note":"data-notify.sh mails the administrator if configured"},{"wire":"E111","note":"the entry is written in the next txg"},{"wire":"E078","note":"zpool status -v"},{"wire":"E079"},{"wire":"E081"},{"wire":"E082"},{"wire":"E083"},{"wire":"E113","note":"later: the file was restored or deleted, and a scrub completes"},{"wire":"E114"},{"wire":"E111","note":"the next sync deletes the old log; the scrub's log becomes the last log"},{"wire":"E115"},{"wire":"E116"},{"wire":"E048"}]},{"id":"status_events","category":"Reporting","title":"Where zpool status and zpool events get their data","summary":"zpool status reads the pool configuration with the per-vdev counters and the error count; zpool events reads the zevent queue through its own /dev/zfs cursor, exactly as zed does.","ends":"zpool status shows READ, WRITE and CKSUM (and SLOW with -s) per vdev from in-memory counters that start at zero at import and are reset by zpool clear; zpool events shows the events still in the queue (at most zfs_zevent_len_max).","alts":[{"id":"cmd","options":[{"id":"status","label":"zpool status"},{"id":"events","label":"zpool events"}]}],"steps":[{"wire":"E121"},{"wire":"E078","when":[{"group":"cmd","options":["status"]}]},{"wire":"E079","when":[{"group":"cmd","options":["status"]}]},{"wire":"E080","when":[{"group":"cmd","options":["status"]}]},{"wire":"E081","when":[{"group":"cmd","options":["status"]}],"note":"without -v only the approximate count"},{"wire":"E082","when":[{"group":"cmd","options":["status"]}]},{"wire":"E083","when":[{"group":"cmd","options":["status"]}]},{"wire":"E076","when":[{"group":"cmd","options":["events"]}]},{"wire":"E053","when":[{"group":"cmd","options":["events"]}]},{"wire":"E051","when":[{"group":"cmd","options":["events"]}]},{"wire":"E050","when":[{"group":"cmd","options":["events"]}]},{"wire":"E052","when":[{"group":"cmd","options":["events"]}]},{"wire":"E077","when":[{"group":"cmd","options":["events"]}]}]}],"stages":[],"pipelines":[],"pipelineRuntimeNote":"","about":{"model":["Errors are detected inside the zio pipeline when an I/O completes (VDEV_IO_DONE, VDEV_IO_ASSESS, CHECKSUM_VERIFY, DONE). Each problem is recorded in up to three separate places: an in-memory counter on the vdev (the READ, WRITE, CKSUM and SLOW columns of zpool status), an event in the kernel zevent queue, and, only when a logical read or write failed after all redundancy, an entry in the persistent error log.","The records are filtered. A disk that is already dead gets no counts and no ereports; an io or checksum ereport identical to one posted for the same disk within zfs_zevent_retain_expire_secs is a duplicate and dropped, and a duplicate io ereport does not raise the READ or WRITE counter either; checksum, delay and deadman ereports are rate limited per disk. The counters live only in memory and are reset by zpoo
