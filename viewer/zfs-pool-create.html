<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZFS Pool Creation</title>
<style>
:root {
  --canvas: #1f1f1f;
  --panel: #262626;
  --panel-line: #333;
  --text: #dddddd;
  --muted: #9a9a9a;
  --accent: #ffd43b;
  --node-body: #353535;
  --node-border: #161616;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
  scrollbar-color: #4a4a4a #262626;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
code { font-family: var(--mono); font-size: 0.92em; background: #ffffff12; padding: 0 3px; border-radius: 3px; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--canvas);
  color: var(--text);
  font: 13px/1.4 var(--sans);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

button, .button, select, input {
  font: inherit;
  color: var(--text);
  background: #333;
  border: 1px solid #444;
  border-radius: 5px;
  padding: 3px 9px;
}
button, .button { cursor: pointer; }
button:hover, .button:hover { background: #3d3d3d; border-color: #555; }
button.active { background: #4a4122; border-color: var(--accent); color: #fff; }
button.icon { padding: 2px 7px; }
input[type="search"] { width: 100%; }
a { color: #74c0fc; text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- top bar ---------- */
#topbar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--panel-line);
}
#topbar h1 {
  font-size: 15px;
  margin: 0 6px 0 2px;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex: 0 1 auto;
}
#topbar > * { flex-shrink: 0; }
#topbar > h1 { flex-shrink: 1; }
#topbar button, #topbar .button, #topbar a { white-space: nowrap; }
#commit-link { font-family: var(--mono); font-size: 12px; color: var(--muted); }
#topbar .spacer { flex: 1; }

/* ---------- main layout ---------- */
#layout { flex: 1; display: flex; min-height: 0; }
#left, #right {
  background: var(--panel);
  overflow-y: auto;
  flex: none;
}
#left { width: 280px; border-right: 1px solid var(--panel-line); overflow-x: hidden; }
#right { width: 360px; border-left: 1px solid var(--panel-line); padding: 10px 12px 40px; }
body.hide-left #left, body.hide-right #right { display: none; }

.panel-section { padding: 10px 12px; border-bottom: 1px solid var(--panel-line); }
.panel-section h2, #right h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 0 0 6px;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; }

/* search */
.results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 240px; overflow-y: auto; }
.results li { padding: 3px 6px; border-radius: 4px; cursor: pointer; }
.results li:hover, .results li.first { background: #333; }
.results .kind { color: var(--muted); font-size: 11px; margin-right: 6px; }

/* path list */
.path-cat { margin: 8px 0 2px; font-size: 11px; color: var(--muted); }
.path-item {
  display: block;
  width: 100%;
  white-space: normal;
  text-align: left;
  border: 1px solid transparent;
  background: none;
  padding: 3px 6px;
  border-radius: 4px;
}
.path-item:hover { background: #313131; border-color: transparent; }
.path-item.active { background: #4a4122; border-color: var(--accent); }
.path-item .pid { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; }

/* group filters */
.gfilter { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.gfilter .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.gfilter .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gfilter select { padding: 1px 4px; font-size: 12px; }

/* ---------- canvas ---------- */
#canvas-wrap { flex: 1; position: relative; min-width: 0; overflow: hidden; }
#canvas { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
#canvas.panning { cursor: grabbing; }

.group-frame { stroke-width: 1; }
.group-title { font-size: 18px; font-weight: 700; cursor: move; }
.group-summary { font-size: 11px; fill: var(--muted); pointer-events: none; }

.node { cursor: pointer; }
.node .body { fill: var(--node-body); stroke: var(--node-border); stroke-width: 1; }
.node:hover .body { stroke: #6a6a6a; }
.node .title-text { fill: #eeeeee; font-size: 13px; font-weight: 600; pointer-events: none; }
.node .pill { fill: #00000055; stroke: #ffffff30; }
.node .pill-text { fill: #ddd; font-size: 10px; font-family: var(--mono); }
.node .sock-label { fill: #bdbdbd; font-size: 10px; font-variant: small-caps; letter-spacing: 0.04em; pointer-events: none; }
.node .foot { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
.node .foot.link { cursor: pointer; }
.node .foot.link:hover { fill: #cfcfcf; text-decoration: underline; }
.node .outline { fill: none; stroke: none; pointer-events: none; }
.node.selected .outline { stroke: #fff; stroke-width: 2; }
.node.onpath .outline { stroke: var(--accent); stroke-width: 2; }
.node.current .outline { stroke: var(--accent); stroke-width: 3; }
.node.current .body { filter: url(#glow); }
.node.ctxmark .outline { stroke: #63e6be; stroke-width: 2; stroke-dasharray: 5 3; }
.node.dim { opacity: 0.15; }
.node.proxy .body { stroke-dasharray: 6 4; stroke: #888; }

.wire, .hit, .alt-outline { vector-effect: non-scaling-stroke; }
/* Stroke widths are in screen pixels (non-scaling) and are narrowed when
   zoomed out; --wire-idle and --wire-lit are set by setViewTransform(). */
.wire { fill: none; stroke-width: var(--wire-idle, 2px); opacity: 0.55; pointer-events: none; }
.wire.ctl { stroke-dasharray: 6 4; }
.wire.lit { opacity: 1; stroke-width: var(--wire-lit, 3px); stroke-dasharray: 10 6; animation: flow 0.9s linear infinite; }
.wire.dim { opacity: 0.06; }
.wire.alt { opacity: 0.35; stroke-dasharray: 3 5; }
.wire.current { stroke-width: calc(var(--wire-lit, 3px) + 2px); opacity: 1; }
.wire.cmp-both { stroke: #ffffff !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-a { stroke: #ffd43b !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-b { stroke: #4dabf7 !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
@keyframes flow { to { stroke-dashoffset: -32; } }
@media (prefers-reduced-motion: reduce) { .wire.lit { animation: none; } }

.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; pointer-events: stroke; }
.alt-outline { fill: none; stroke: var(--accent); stroke-width: 6; stroke-dasharray: 4 6; opacity: 0.35; pointer-events: none; }

.badge circle { fill: #1f1f1f; stroke: var(--accent); stroke-width: 1.5; }
.badge text { fill: var(--accent); font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.dot { fill: #fff; stroke: var(--accent); stroke-width: 3; }

#caption {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  max-width: min(760px, 90%);
  background: #262626ee;
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  pointer-events: auto;
}
#caption .ref { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }

#legend {
  position: absolute;
  left: 10px;
  bottom: 10px;
  background: #262626e6;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 12px;
}
#legend .head { cursor: pointer; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
#legend.folded .item { display: none; }
#legend.folded .head { margin-bottom: 0; }
#legend .item { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 1px 2px; border-radius: 3px; }
#legend .item:hover { background: #333; }
#legend .item.off { opacity: 0.35; }
#legend .sw { width: 22px; height: 0; border-top: 3px solid; }
#legend .sw.dashed { border-top-style: dashed; }

#minimap {
  position: absolute;
  right: 10px;
  bottom: 10px;
  background: #1a1a1ae6;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  cursor: crosshair;
}

/* ---------- details panel ---------- */
#details h3 { font-size: 16px; margin: 0 0 4px; }
#details .sub { color: var(--muted); margin-bottom: 8px; }
#details section { margin: 12px 0; }
#details ul { margin: 4px 0; padding-left: 0; list-style: none; }
#details li { margin: 3px 0; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid #0006; }
.ref-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.ref-row .sym { font-family: var(--mono); font-size: 12px; }
.ref-row a { font-family: var(--mono); font-size: 11px; }
.ref-row .copy { font-size: 10px; padding: 0 5px; }
.ref-code { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: pre-wrap; word-break: break-all; margin: 0 0 4px 0; }
.io-row { cursor: pointer; padding: 3px 4px; border-radius: 4px; }
.io-row:hover { background: #313131; }
.io-row .other { font-weight: 600; }
.io-row .lbl { color: var(--muted); display: block; font-size: 12px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 11px; }
.tbl td, .tbl th { border-bottom: 1px solid #333; padding: 3px 4px; vertical-align: top; text-align: left; }
.tbl .on { color: var(--accent); }

.transport { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.transport input[type="range"] { width: 90px; padding: 0; }
.alt-select { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 8px; }
.alt-select select { width: 100%; }
.steps { max-height: 46vh; overflow-y: auto; border: 1px solid #333; border-radius: 6px; }
.step { padding: 3px 6px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #2d2d2d; }
.step:hover { background: #303030; }
.step.cur { background: #4a4122; }
.step.skip { opacity: 0.45; padding-left: 20px; }
.step .alt-head { display: block; font-size: 10px; color: var(--accent); }
.step .n { font-family: var(--mono); color: var(--accent); margin-right: 4px; }
.step .side { font-size: 10px; color: #63e6be; margin-left: 4px; }
.step .note { display: block; color: var(--muted); font-style: italic; }

/* ---------- suite navigation ---------- */
#suite-nav { display: inline-flex; align-items: center; gap: 8px; }
#suite-nav select { max-width: 230px; }
#index-link { font-size: 12px; }
.segmented { display: inline-flex; }
.segmented button { border-radius: 0; }
.segmented button:first-child { border-radius: 5px 0 0 5px; }
.segmented button:last-child { border-radius: 0 5px 5px 0; border-left: none; }
.also-link { display: block; }

/* ---------- timeline view ---------- */
#timeline-view {
  position: absolute;
  inset: 0;
  background: var(--canvas);
  overflow: auto;
  padding: 14px 18px 40px;
}
#tl-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
#tl-title { font-size: 16px; font-weight: 650; }
#tl-strip { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.tl-chip {
  border: 1px solid #444;
  background: #2a2a2a;
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 12px;
  cursor: pointer;
  max-width: 240px;
  text-align: left;
}
.tl-chip .txg { font-family: var(--mono); color: var(--accent); margin-right: 5px; }
.tl-chip.cur { border-color: var(--accent); background: #4a4122; }
#tl-caption {
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: #262626;
  padding: 8px 12px;
  margin-bottom: 14px;
}
#tl-caption .cap { font-weight: 600; }
#tl-caption .note { color: var(--muted); display: block; margin-top: 2px; }
#tl-caption .links { margin-top: 4px; font-size: 12px; }
#tl-caption .links a { margin-right: 10px; }
.tl-row { display: grid; grid-template-columns: 200px 1fr; gap: 10px; margin-bottom: 8px; align-items: start; }
.tl-label {
  background: #2b2b2b;
  border: 1px solid #3a3a3a;
  border-radius: 6px;
  padding: 5px 8px;
  cursor: pointer;
}
.tl-label:hover { border-color: #666; }
.tl-label .name { font-family: var(--mono); font-weight: 650; }
.tl-label .kind { color: var(--muted); font-size: 11px; display: block; }
.tl-lanes { display: flex; flex-direction: column; gap: 4px; }
.tl-lane { display: flex; flex-wrap: wrap; gap: 5px; min-height: 40px; align-items: center; padding: 3px 4px; border-radius: 6px; background: #ffffff06; }
.tl-lane.dead { min-height: 30px; background: #8ce99a14; border-left: 3px solid #8CE99A; }
.tl-lane .lane-tag { font-size: 10px; color: var(--muted); margin-right: 4px; }
.tl-tile {
  width: 52px;
  height: 34px;
  border-radius: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 12px;
  color: #111;
  border: 2px solid transparent;
  cursor: default;
  position: relative;
}
.tl-tile .birth { font-size: 9px; opacity: 0.8; }
.tl-tile.small { height: 26px; }
.tl-tile.new { border-color: var(--accent); box-shadow: 0 0 6px var(--accent); }
.tl-tile.changed { border-color: #63e6be; }
.tl-tile.freed { opacity: 0.35; text-decoration: line-through; }
.tl-tile.deferred { border: 2px dashed #ddd; }
.tl-tile.async { border: 2px dotted #ddd; }
.tl-arrow { color: var(--muted); font-size: 11px; display: block; }
#tl-legend { margin-top: 18px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
#tl-legend .tl-tile { width: 38px; height: 22px; font-size: 10px; }
.tl-summary { color: var(--muted); }

/* ---------- tooltip and about ---------- */
#tooltip {
  position: fixed;
  z-index: 50;
  max-width: 520px;
  background: #111;
  border: 1px solid #555;
  border-radius: 6px;
  padding: 6px 9px;
  font-size: 12px;
  pointer-events: none;
  box-shadow: 0 4px 16px #000a;
}
#tooltip .t-ref { font-family: var(--mono); font-size: 11px; margin-top: 4px; }
#tooltip .t-ref .loc { color: #74c0fc; }
#tooltip .t-ref .code { color: #bbb; display: block; white-space: pre; overflow: hidden; text-overflow: ellipsis; }

#about {
  position: fixed;
  inset: 0;
  background: #000a;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.about-box {
  position: relative;
  background: var(--panel);
  border: 1px solid #444;
  border-radius: 10px;
  max-width: 820px;
  max-height: 100%;
  overflow-y: auto;
  padding: 18px 24px;
}
.about-box .close { position: absolute; right: 10px; top: 10px; }
.about-box h2 { font-size: 17px; margin: 4px 0 8px; }
.about-box h3 { font-size: 13px; margin: 16px 0 6px; color: var(--accent); }
.about-box li { margin: 4px 0; }

</style>
</head>
<body>
<header id="topbar">
  <button id="toggle-left" class="icon" title="Show or hide the path panel">&#9776;</button>
  <h1>ZFS Pool Creation</h1>
  <a id="commit-link" target="_blank" rel="noopener"></a>
  <span id="suite-nav" hidden>
    <select id="graph-menu" title="Open another diagram of the suite"></select>
    <a id="index-link" href="index.html" title="All diagrams">All</a>
  </span>
  <span id="view-switch" class="segmented" hidden>
    <button id="btn-view-graph" class="active" title="Node graph">Graph</button><button id="btn-view-timeline" title="Timeline scenarios">Timeline</button>
  </span>
  <span class="spacer"></span>
  <button id="btn-fit" title="Fit everything (F)">Fit</button>
  <button id="btn-reset" title="Restore the default layout">Reset layout</button>
  <button id="btn-export" title="Export layout: save node positions to a JSON file">Export</button>
  <label class="button" title="Import layout: load node positions from a JSON file">Import<input id="file-import" type="file" accept="application/json,.json" hidden></label>
  <button id="btn-about">About</button>
  <button id="toggle-right" class="icon" title="Show or hide the details panel">&#9776;</button>
</header>

<main id="layout">
  <aside id="left">
    <div class="panel-section">
      <input id="search" type="search" placeholder="Search nodes, functions, files, tunables, wires  ( / )" autocomplete="off">
      <ul id="search-results" class="results"></ul>
    </div>
    <div class="panel-section">
      <h2>Paths</h2>
      <div id="path-list"></div>
    </div>
    <div class="panel-section" id="timeline-section" hidden>
      <h2>Timelines</h2>
      <div id="timeline-list"></div>
    </div>
    <div class="panel-section">
      <h2>Filters</h2>
      <label class="row">Context
        <select id="ctx-filter"><option value="">(none)</option></select>
      </label>
      <div id="group-filters"></div>
    </div>
  </aside>

  <section id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="12" cy="12" r="1.3" fill="#2c2c2c"></circle>
        </pattern>
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"></feDropShadow>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="160%">
          <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffd43b" flood-opacity="0.9"></feDropShadow>
        </filter>
      </defs>
      <rect id="grid-rect" x="0" y="0" width="100%" height="100%" fill="url(#grid)"></rect>
      <g id="root">
        <g id="layer-groups"></g>
        <g id="layer-wires"></g>
        <g id="layer-hits"></g>
        <g id="layer-nodes"></g>
        <g id="layer-badges"></g>
        <g id="layer-dot"></g>
      </g>
    </svg>
    <div id="caption" hidden></div>
    <div id="legend"></div>
    <canvas id="minimap" width="220" height="150"></canvas>
    <div id="timeline-view" hidden>
      <div id="tl-head">
        <div id="tl-title"></div>
        <div class="transport" id="tl-transport">
          <button id="tl-first" title="First step (Home)">|◀</button>
          <button id="tl-prev" title="Previous step (Left)">◀</button>
          <button id="tl-play" title="Play or pause (Space)">Play</button>
          <button id="tl-next" title="Next step (Right)">▶</button>
          <button id="tl-last" title="Last step (End)">▶|</button>
        </div>
      </div>
      <div id="tl-strip"></div>
      <div id="tl-caption"></div>
      <div id="tl-panel"></div>
      <div id="tl-legend"></div>
    </div>
  </section>

  <aside id="right">
    <div id="details"><p class="muted">Select a node, a wire or a path.</p></div>
  </aside>
</main>

<div id="tooltip" hidden></div>
<div id="about" hidden>
  <div class="about-box">
    <button id="about-close" class="icon close" title="Close">&#10005;</button>
    <div id="about-body"></div>
  </div>
</div>

d":"full","subcols":1,"summary":"ZFS_IOC_POOL_CREATE and the root file system properties set afterwards."},{"id":"spa","title":"SPA - spa_create()","color":"#0C8599","col":3,"band":"full","subcols":1,"summary":"The orchestrator: namespace, activation, property checks, rollback and the cache file."},{"id":"vtree","title":"Vdev tree - parse, open, label","color":"#C2255C","col":4,"band":"full","subcols":2,"summary":"nvlist to vdev_t, per-type open and size, first labels, spares and cache devices."},{"id":"alloc","title":"Space - metaslabs and classes","color":"#846358","col":6,"band":"full","subcols":1,"summary":"Metaslab size and count, allocation classes, space maps."},{"id":"dsl","title":"MOS and root dataset (txg 4)","color":"#D9480F","col":7,"band":"full","subcols":2,"summary":"Everything created in memory for the first txg."},{"id":"txg","title":"First txg sync","color":"#E67700","col":9,"band":"full","subcols":2,"summary":"spa_sync() of txg 4: config object, MOS, labels, uberblock."},{"id":"io","title":"Shared - zio and leaf driver","color":"#1971C2","col":11,"band":"full","subcols":1,"summary":"The I/O graph's nodes that carry label and block writes to the devices."},{"id":"dev","title":"Physical devices","color":"#495057","col":12,"band":"full","subcols":1,"summary":"What ends up on each kind of device."}],"nodes":[{"id":"admin","group":"ucmd","sub":0,"title":"Administrator","ctx":"user","src":"","fns":[],"role":"The person or script typing the command. Every path in this graph that a command starts begins with a wire from this node; the arrows that come back into a command node are its results, errors and refusals.","tunables":[],"props":[]},{"id":"zpool_cmd","group":"ucmd","sub":0,"title":"zpool(8) command","ctx":"user","src":"cmd/zpool/zpool_main.c","fns":[{"name":"zpool_do_create","ref":{"file":"cmd/zpool/zpool_main.c","line":1977,"symbol":"zpool_do_create","code":"zpool_do_create(int argc, char **argv)"}},{"name":"add_prop_list","ref":{"file":"cmd/zpool/zpool_main.c","line":1274,"symbol":"add_prop_list","code":"add_prop_list(const char *propname, const char *propval, nvlist_t **props,"}}],"role":"`zpool create` parses the options: `-f` force, `-n` dry run (print the layout, touch nothing), `-d` no features by default, `-o` pool properties and `feature@name=`, `-O` and `-m` root file system properties, `-R` altroot and `-t` temporary name (both default `cachefile=none`). A pool name containing `/` is refused. Hands the vdev arguments to make_root_vdev(), refuses a default mountpoint directory that exists and is not empty, builds the feature list, calls zpool_create() and on success opens, mounts and shares the root file system.","tunables":[],"props":[{"name":"altroot","ref":{"file":"module/zcommon/zpool_prop.c","line":98,"symbol":"\"altroot\"","code":"zprop_register_string(ZPOOL_PROP_ALTROOT, \"altroot\", NULL, PROP_DEFAULT,"}}]},{"id":"vdev_spec","group":"ucmd","sub":0,"title":"make_root_vdev() / construct_spec()","ctx":"user","src":"cmd/zpool/zpool_vdev.c","fns":[{"name":"make_root_vdev","ref":{"file":"cmd/zpool/zpool_vdev.c","line":2171,"symbol":"make_root_vdev","code":"make_root_vdev(zpool_handle_t *zhp, nvlist_t *props, int force, int check_rep,"}},{"name":"construct_spec","ref":{"file":"cmd/zpool/zpool_vdev.c","line":1650,"symbol":"construct_spec","code":"construct_spec(nvlist_t *props, int argc, char **argv)"}},{"name":"is_grouping","ref":{"file":"cmd/zpool/zpool_vdev.c","line":1332,"symbol":"is_grouping","code":"is_grouping(const char *type, int *mindev, int *maxdev)"}},{"name":"get_parity","ref":{"file":"cmd/zpool/zpool_vdev.c","line":1260,"symbol":"get_parity","code":"get_parity(const char *type)"}},{"name":"draid_config_by_type","ref":{"file":"cmd/zpool/zpool_vdev.c","line":1445,"symbol":"draid_config_by_type","code":"draid_config_by_type(nvlist_t *nv, const char *type, uint64_t width,"}},{"name":"num_normal_vdevs","ref":{"file":"cmd/zpool/zpool_vdev.c","line":2137,"symbol":"num_normal_vdevs","code":"num_normal_vdevs(nvlist_t *nvroot)"}}],"role":"The vdev grammar. `mirror`, `raidz[1-3]`, `draid[p][:Nd][:Nc][:Ns][:Nw]` (and `anymirror`) start a top-level vdev whose children are the following devices up to the next keyword; a bare device is a top-level vdev by itself. `special`, `dedup` and `log` mark the following top-level vdevs with an allocation bias (log accepts only disks and mirrors); `spare` and `cache` start lists that are not top-level vdevs. Each keyword checks its minimum device count. Without `:Nd`, a dRAID group gets at most 8 data disks. `-o ashift=` (9 to 16) is copied into every top-level vdev. At least one normal top-level vdev is required. Then, in order: in-use check, replication check unless `-f`, partitioning unless `-n`.","tunables":[],"props":[{"name":"ashift","ref":{"file":"module/zcommon/zpool_prop.c","line":185,"symbol":"\"ashift\"","code":"zprop_register_number(ZPOOL_PROP_ASHIFT, \"ashift\", 0, PROP_DEFAULT,"}}]},{"id":"leaf_spec","group":"ucmd","sub":0,"title":"make_leaf_vdev()","ctx":"user","src":"cmd/zpool/zpool_vdev.c","fns":[{"name":"make_leaf_vdev","ref":{"file":"cmd/zpool/zpool_vdev.c","line":263,"symbol":"make_leaf_vdev","code":"make_leaf_vdev(const char *arg, boolean_t is_primary, uint64_t ashift)"}},{"name":"is_shorthand_path","ref":{"file":"cmd/zpool/zpool_vdev.c","line":176,"symbol":"is_shorthand_path","code":"is_shorthand_path(const char *arg, char *path, size_t path_size,"}},{"name":"check_sector_size_database","ref":{"file":"cmd/zpool/os/linux/zpool_vdev_os.c","line":208,"symbol":"check_sector_size_database","code":"check_sector_size_database(char *path, int *sector_size)"}}],"role":"Turns one device argument into a leaf nvlist. A full path keeps the name given (so udev by-id names survive) but is resolved to decide whether it is a whole disk; a short name is looked up in the default device directories. A block device or whole disk becomes type `disk` with `whole_disk` set accordingly, a regular file type `file`; anything else is refused. Without `-o ashift`, drives known to misreport their sector size get an ashift from a built-in table.","tunables":[],"props":[]},{"id":"rep_check","group":"ucmd","sub":0,"title":"Replication-level check","ctx":"user","src":"cmd/zpool/zpool_vdev.c","fns":[{"name":"check_replication","ref":{"file":"cmd/zpool/zpool_vdev.c","line":844,"symbol":"check_replication","code":"check_replication(nvlist_t *config, nvlist_t *newroot)"}},{"name":"get_replication","ref":{"file":"cmd/zpool/zpool_vdev.c","line":582,"symbol":"get_replication","code":"get_replication(nvlist_t *nvroot, boolean_t fatal,"}},{"name":"rep_consistent","ref":{"file":"cmd/zpool/zpool_vdev.c","line":490,"symbol":"rep_consistent","code":"rep_consistent(replication_level_t *lastrep, replication_level_t *rep,"}},{"name":"is_bias_more_redundant","ref":{"file":"cmd/zpool/zpool_vdev.c","line":469,"symbol":"is_bias_more_redundant","code":"is_bias_more_redundant(const replication_level_t *a,"}},{"name":"vdev_error","ref":{"file":"cmd/zpool/zpool_vdev.c","line":81,"symbol":"vdev_error","code":"vdev_error(const char *fmt, ...)"}}],"role":"Skipped with `-f`. All normal top-level vdevs must have the same type and redundancy (raidz and dRAID may mix at equal parity; raidz and mirror at equal failure tolerance); a mirror or raidz must not mix files and devices or devices whose sizes differ by more than 16 MiB. Special and dedup vdevs need not match as long as they survive at least as many device failures as the normal vdevs. Log vdevs are not checked.","tunables":[],"props":[]},{"id":"inuse_check","group":"ucmd","sub":0,"title":"Device in-use checks","ctx":"user","src":"cmd/zpool/zpool_vdev.c","fns":[{"name":"is_device_in_use","ref":{"file":"cmd/zpool/zpool_vdev.c","line":1186,"symbol":"is_device_in_use","code":"is_device_in_use(nvlist_t *config, nvlist_t *nv, boolean_t force,"}},{"name":"check_device","ref":{"file":"cmd/zpool/os/linux/zpool_vdev_os.c","line":380,"symbol":"check_device","code":"check_device(const char *path, boolean_t force,"}},{"name":"check_disk","ref":{"file":"cmd/zpool/os/linux/zpool_vdev_os.c","line":301,"symbol":"check_disk","code":"check_disk(const char *path, blkid_cache cache, int force,"}},{"name":"check_slice","ref":{"file":"cmd/zpool/os/linux/zpool_vdev_os.c","line":256,"symbol":"check_slice","code":"check_slice(const char *path, blkid_cache cache, int force, boolean_t isspare)"}},{"name":"check_file_generic","ref":{"file":"cmd/zpool/zpool_vdev.c","line":106,"symbol":"check_file_generic","code":"check_file_generic(const char *file, boolean_t force, boolean_t isspare)"}}],"role":"Runs for every leaf, spare and cache device, even with `-f`. A whole disk must open with O_EXCL; its GPT partitions are each probed with libblkid. A ZFS label is checked with zpool_in_use(): a member of an active pool, or a hot spare of another pool (unless this device is also a spare here), can never be used; an exported or possibly active pool, or any other filesystem signature, is refused unless `-f`. A corrupt primary GPT is refused unless `-f`.","tunables":[],"props":[]},{"id":"make_disks","group":"ucmd","sub":1,"title":"make_disks(): prepare disks","ctx":"user","src":"cmd/zpool/zpool_vdev.c","fns":[{"name":"make_disks","ref":{"file":"cmd/zpool/zpool_vdev.c","line":1009,"symbol":"make_disks","code":"make_disks(zpool_handle_t *zhp, nvlist_t *nv, boolean_t replacing)"}},{"name":"zero_label","ref":{"file":"cmd/zpool/zpool_vdev.c","line":957,"symbol":"zero_label","code":"zero_label(const char *path)"}},{"name":"zpool_prepare_and_label_disk","ref":{"file":"lib/libzfs/libzfs_util.c","line":2514,"symbol":"zpool_prepare_and_label_disk","code":"zpool_prepare_and_label_disk(libzfs_handle_t *hdl, zpool_handle_t *zhp,"}}],"role":"Skipped with `-n`. A disk leaf that is a partition only has its first 4 KiB zeroed (unless it is a spare). A whole disk (not held open exclusively as an existing spare) is relabelled: the udev partition link is removed, the zfs_prepare_disk script runs, a GPT is written, `zpool` waits for udev to recreate the `-part1` link, zeroes its first 4 KiB, and from then on the leaf's path names partition 1. Files are left alone.","tunables":[],"props":[]},{"id":"efi_label","group":"ucmd","sub":1,"title":"zpool_label_disk(): GPT","ctx":"user","src":"lib/libzfs/os/linux/libzfs_pool_os.c","fns":[{"name":"zpool_label_disk","ref":{"file":"lib/libzfs/os/linux/libzfs_pool_os.c","line":201,"symbol":"zpool_label_disk","code":"zpool_label_disk(libzfs_handle_t *hdl, zpool_handle_t *zhp, const char *name)"}},{"name":"zpool_label_name","ref":{"file":"lib/libzfs/os/linux/libzfs_pool_os.c","line":177,"symbol":"zpool_label_name","code":"zpool_label_name(char *label_name, int label_size)"}},{"name":"zpool_label_disk_check","ref":{"file":"lib/libzfs/os/linux/libzfs_pool_os.c","line":146,"symbol":"zpool_label_disk_check","code":"zpool_label_disk_check(char *path)"}}],"role":"Writes a new GPT with libefi. Partition 1 (type V_USR, name `zfs-` plus 16 random hex digits) starts at 1 MiB and runs to the end of the disk less 8 MiB, rounded down to a 2048-sector boundary; partition 9 is an 8 MiB reserved partition after it. The same byte offsets are used on 512-byte and 4K-sector disks. A partition under 64 MiB fails. The label is read back and checked after udev settles.","tunables":[],"props":[]},{"id":"features_compat","group":"ucmd","sub":1,"title":"Feature set and compatibility","ctx":"user","src":"cmd/zpool/zpool_main.c","fns":[{"name":"zpool_do_load_compat","ref":{"file":"cmd/zpool/zpool_main.c","line":14308,"symbol":"zpool_do_load_compat","code":"zpool_do_load_compat(const char *compat, boolean_t *list)"}},{"name":"zpool_load_compat","ref":{"file":"lib/libzfs/libzfs_pool.c","line":5823,"symbol":"zpool_load_compat","code":"zpool_load_compat(const char *compat, boolean_t *features, char *report,"}}],"role":"Reads the `compatibility` property: unset, empty or `off` means every feature, `legacy` none, otherwise the features present in all of the named files (from /etc/zfs/compatibility.d or /usr/share/zfs/compatibility.d). Unknown names in an /etc file are an error. `zpool_do_create()` then enables every feature the kernel module supports that the set allows, unless `-d` or `-o version` below 5000; `-o feature@x=disabled` removes one, and enabling one outside the set only warns.","tunables":[],"props":[{"name":"compatibility","ref":{"file":"module/zcommon/zpool_prop.c","line":108,"symbol":"\"compatibility\"","code":"zprop_register_string(ZPOOL_PROP_COMPATIBILITY, \"compatibility\","}}]},{"id":"libzfs","group":"ucmd","sub":1,"title":"libzfs / libzfs_core","ctx":"user","src":"lib/libzfs/libzfs_pool.c","fns":[{"name":"zpool_create","ref":{"file":"lib/libzfs/libzfs_pool.c","line":1598,"symbol":"zpool_create","code":"zpool_create(libzfs_handle_t *hdl, const char *pool, nvlist_t *nvroot,"}},{"name":"zpool_valid_proplist","ref":{"file":"lib/libzfs/libzfs_pool.c","line":577,"symbol":"zpool_valid_proplist","code":"zpool_valid_proplist(libzfs_handle_t *hdl, const char *poolname,"}},{"name":"zpool_create_error_from_info","ref":{"file":"lib/libzfs/libzfs_pool.c","line":1564,"symbol":"zpool_create_error_from_info","code":"zpool_create_error_from_info(libzfs_handle_t *hdl, zfs_cmd_t *zc)"}},{"name":"zpool_standard_error_fmt","ref":{"file":"lib/libzfs/libzfs_util.c","line":644,"symbol":"zpool_standard_error_fmt","code":"zpool_standard_error_fmt(libzfs_handle_t *hdl, int error, const char *fmt, ...)"}},{"name":"zfs_ioctl","ref":{"file":"lib/libzfs/libzfs_util.c","line":794,"symbol":"zfs_ioctl","code":"zfs_ioctl(libzfs_handle_t *hdl, int request, zfs_cmd_t *zc)"}}],"role":"zpool_create() checks the pool name and property values (`feature@` values become the number 0), validates the `-O` properties as file system properties and, for `-O encryption`, prepares the wrapping key. Packs the vdev tree, the pool properties (with the root file system properties nested inside) into a zfs_cmd_t and issues ZFS_IOC_POOL_CREATE directly, not through libzfs_core. Turns errors into messages, using the device and pool names the kernel returns for EBUSY and ENXIO.","tunables":[],"props":[]},{"id":"ioc_pool_create","group":"kentry","sub":0,"title":"zfs_ioc_pool_create()","ctx":"syscall","src":"module/zfs/zfs_ioctl.c","fns":[{"name":"zfs_ioc_pool_create","ref":{"file":"module/zfs/zfs_ioctl.c","line":1691,"symbol":"zfs_ioc_pool_create","code":"zfs_ioc_pool_create(zfs_cmd_t *zc)"}},{"name":"zfs_fill_zplprops_root","ref":{"file":"module/zfs/zfs_ioctl.c","line":3938,"symbol":"zfs_fill_zplprops_root","code":"zfs_fill_zplprops_root(uint64_t spa_vers, nvlist_t *createprops,"}},{"name":"spa_destroy","ref":{"file":"module/zfs/spa.c","line":8175,"symbol":"spa_destroy","code":"spa_destroy(const char *pool)"}}],"role":"Kernel entry for ZFS_IOC_POOL_CREATE. Unpacks the config and properties, rejects an unsupported `version`, separates the root file system properties, builds the encryption parameters and the ZPL creation properties (normalization, utf8only, casesensitivity, ZPL version) for the root dataset, and calls spa_create(). Afterwards sets the remaining root properties; if that fails, spa_destroy() removes the new pool again and the ioctl returns the error.","tunables":[],"props":[]},{"id":"set_props","group":"kentry","sub":0,"title":"zfs_set_prop_nvlist()","ctx":"syscall","src":"module/zfs/zfs_ioctl.c","fns":[{"name":"zfs_set_prop_nvlist","ref":{"file":"module/zfs/zfs_ioctl.c","line":3129,"symbol":"zfs_set_prop_nvlist","code":"zfs_set_prop_nvlist(const char *dsname, zprop_source_t source, nvlist_t *nvl,"}}],"role":"After the pool exists, the `-O` and `-m` properties are set on the root dataset with source local, as `zfs set` would.","tunables":[],"props":[]},{"id":"spa_create","group":"spa","sub":0,"title":"spa_create()","ctx":"syscall","src":"module/zfs/spa.c","fns":[{"name":"spa_create","ref":{"file":"module/zfs/spa.c","line":7290,"symbol":"spa_create","code":"spa_create(const char *pool, nvlist_t *nvroot, nvlist_t *props,"}},{"name":"spa_create_check_encryption_params","ref":{"file":"module/zfs/spa.c","line":7275,"symbol":"spa_create_check_encryption_params","code":"spa_create_check_encryption_params(dsl_crypto_params_t *dcp,"}}],"role":"Builds a pool from nothing while holding the namespace lock. In order: name check and spa_t, activation, property and encryption checks (special or dedup vdevs need `feature@allocation_classes`), vdev tree parse, create (open and label), dRAID spares and their feature gates, aux devices, metaslabs; then the DSL pool, dedup and BRT tables, the pool objects and properties for txg 4, feature refcounts for dRAID and AnyRAID; then it starts the txg threads, waits for txg 4 to sync, writes the cache file and returns. The version is SPA_VERSION (5000, feature flags) unless `-o version` was given without features.","tunables":[],"props":[]},{"id":"spa_ns","group":"spa","sub":0,"title":"SPA namespace","ctx":"syscall","src":"module/zfs/spa_misc.c","fns":[{"name":"spa_lookup","ref":{"file":"module/zfs/spa_misc.c","line":757,"symbol":"spa_lookup","code":"spa_lookup(const char *name)"}},{"name":"spa_add","ref":{"file":"module/zfs/spa_misc.c","line":814,"symbol":"spa_add","code":"spa_add(const char *name, nvlist_t *config, const char *altroot)"}},{"name":"spa_namespace_enter","ref":{"file":"module/zfs/spa_misc.c","line":656,"symbol":"spa_namespace_enter","code":"spa_namespace_enter(const void *tag)"}},{"name":"spa_namespace_exit","ref":{"file":"module/zfs/spa_misc.c","line":680,"symbol":"spa_namespace_exit","code":"spa_namespace_exit(const void *tag)"}}],"role":"The system-wide table of pools. spa_create() holds its lock from the name check to the end, so no other pool operation runs meanwhile. spa_add() creates the in-memory spa_t with the altroot and a cache file entry for /etc/zfs/zpool.cache (none when an altroot is set).","tunables":[],"props":[]},{"id":"spa_activate","group":"spa","sub":0,"title":"spa_activate()","ctx":"syscall","src":"module/zfs/spa.c","fns":[{"name":"spa_activate","ref":{"file":"module/zfs/spa.c","line":1810,"symbol":"spa_activate","code":"spa_activate(spa_t *spa, spa_mode_t mode)"}},{"name":"spa_create_zio_taskqs","ref":{"file":"module/zfs/spa.c","line":1722,"symbol":"spa_create_zio_taskqs","code":"spa_create_zio_taskqs(spa_t *spa)"}},{"name":"metaslab_class_create","ref":{"file":"module/zfs/metaslab.c","line":431,"symbol":"metaslab_class_create","code":"metaslab_class_create(spa_t *spa, const char *name,"}}],"role":"Makes the spa_t usable: state ACTIVE, the six metaslab classes (normal, log, embedded_log, special, special_embedded_log, dedup), the zio taskqs and the per-txg lists.","tunables":[],"props":[]},{"id":"prop_validate","group":"spa","sub":0,"title":"spa_prop_validate()","ctx":"syscall","src":"module/zfs/spa.c","fns":[{"name":"spa_prop_validate","ref":{"file":"module/zfs/spa.c","line":731,"symbol":"spa_prop_validate","code":"spa_prop_validate(spa_t *spa, nvlist_t *props)"}}],"role":"Checks each pool property: `feature@` names must be known features with value 0, `version` must not be combined with features, booleans 0 or 1, `cachefile` an absolute path, empty or `none`, `multihost` needs a host id, `comment` must be printable.","tunables":[],"props":[]},{"id":"spa_unload","group":"spa","sub":0,"title":"spa_unload()","ctx":"syscall","src":"module/zfs/spa.c","fns":[{"name":"spa_unload","ref":{"file":"module/zfs/spa.c","line":2317,"symbol":"spa_unload","code":"spa_unload(spa_t *spa)"}},{"name":"spa_deactivate","ref":{"file":"module/zfs/spa.c","line":1941,"symbol":"spa_deactivate","code":"spa_deactivate(spa_t *spa)"}},{"name":"spa_remove","ref":{"file":"module/zfs/spa_misc.c","line":956,"symbol":"spa_remove","code":"spa_remove(spa_t *spa)"}}],"role":"Any error inside spa_create() unwinds what exists so far: spa_unload() closes and frees the vdev tree (once there is one), spa_deactivate() frees classes and taskqs, spa_remove() takes the name out of the namespace. Nothing reaches the cache file. Labels already written stay on disk, but with pool txg 0 they do not describe an importable pool.","tunables":[],"props":[]},{"id":"cachefile","group":"spa","sub":0,"title":"Pool cache file (zpool.cache)","ctx":"syscall","src":"module/zfs/spa_config.c","fns":[{"name":"spa_write_cachefile","ref":{"file":"module/zfs/spa_config.c","line":142,"symbol":"spa_write_cachefile","code":"spa_write_cachefile(spa_t *target, boolean_t removing, boolean_t postsysevent,"}},{"name":"spa_config_write","ref":{"file":"module/zfs/spa_config.c","line":85,"symbol":"spa_config_write","code":"spa_config_write(spa_config_dirent_t *dp, nvlist_t *nvl)"}}],"role":"After txg 4 has synced, writes the config of every pool that uses the same cache file into it (default /etc/zfs/zpool.cache), truncating and rewriting in place with O_SYNC. Nothing is written for `cachefile=none` or an altroot without a cache file. Posts a config sync sysevent and udev change events for the new devices. Failures are retried asynchronously.","tunables":[{"name":"spa_config_path","ref":{"file":"module/zfs/spa_config.c","line":536,"symbol":"config_path","code":"ZFS_MODULE_PARAM(zfs_spa, spa_, config_path, STRING, ZMOD_RD,"}}],"props":[{"name":"cachefile","ref":{"file":"module/zcommon/zpool_prop.c","line":102,"symbol":"\"cachefile\"","code":"zprop_register_string(ZPOOL_PROP_CACHEFILE, \"cachefile\", NULL,"}}]},{"id":"config_parse","group":"vtree","sub":0,"title":"spa_config_parse()","ctx":"syscall","src":"module/zfs/spa.c","fns":[{"name":"spa_config_parse","ref":{"file":"module/zfs/spa.c","line":2064,"symbol":"spa_config_parse","code":"spa_config_parse(spa_t *spa, vdev_t **vdp, nvlist_t *nv, vdev_t *parent,"}}],"role":"Recursive walk of the nvlist: one vdev_alloc() per nvlist, then its ZPOOL_CONFIG_CHILDREN. It follows only `children`: the `spares` and `l2cache` arrays beside them are not parsed into the tree. Holds every config lock (SCL_ALL) as writer.","tunables":[],"props":[]},{"id":"vdev_alloc","group":"vtree","sub":0,"title":"vdev_alloc()","ctx":"syscall","src":"module/zfs/vdev.c","fns":[{"name":"vdev_alloc","ref":{"file":"module/zfs/vdev.c","line":839,"symbol":"vdev_alloc","code":"vdev_alloc(spa_t *spa, vdev_t **vdp, nvlist_t *nv, vdev_t *parent, uint_t id,"}},{"name":"vdev_getops","ref":{"file":"module/zfs/vdev.c","line":282,"symbol":"vdev_getops","code":"vdev_getops(const char *type)"}},{"name":"vdev_alloc_common","ref":{"file":"module/zfs/vdev.c","line":715,"symbol":"vdev_alloc_common","code":"vdev_alloc_common(spa_t *spa, uint_t id, uint64_t guid, vdev_ops_t *ops)"}},{"name":"vdev_derive_alloc_bias","ref":{"file":"module/zfs/vdev.c","line":327,"symbol":"vdev_derive_alloc_bias","code":"vdev_derive_alloc_bias(const char *bias)"}},{"name":"vdev_add_child","ref":{"file":"module/zfs/vdev.c","line":589,"symbol":"vdev_add_child","code":"vdev_add_child(vdev_t *pvd, vdev_t *cvd)"}}],"role":"Creates one vdev_t: picks the ops vector by type (root, mirror, raidz, draid, disk, file, anymirror ...), runs the type's init hook, assigns a random guid (the root vdev's guid becomes the pool guid; others are unique within the pool), records path, devid, whole_disk and the requested ashift, sets the allocation bias of a top-level vdev from its nvlist and `vdev_islog` for log vdevs, and links it to its parent.","tunables":[],"props":[]},{"id":"vdev_create","group":"vtree","sub":0,"title":"vdev_create()","ctx":"syscall","src":"module/zfs/vdev.c","fns":[{"name":"vdev_create","ref":{"file":"module/zfs/vdev.c","line":3056,"symbol":"vdev_create","code":"vdev_create(vdev_t *vd, uint64_t txg, boolean_t isreplacing)"}}],"role":"Opens the whole tree and labels it. Unlike an import, a create allows no partial open: every vdev must come up HEALTHY.","tunables":[],"props":[]},{"id":"vdev_open","group":"vtree","sub":0,"title":"vdev_open() / vdev_reopen()","ctx":"any","src":"module/zfs/vdev.c","fns":[{"name":"vdev_open","ref":{"file":"module/zfs/vdev.c","line":2216,"symbol":"vdev_open","code":"vdev_open(vdev_t *vd, cred_t *cred)"}},{"name":"vdev_ashift_optimize","ref":{"file":"module/zfs/vdev.c","line":2186,"symbol":"vdev_ashift_optimize","code":"vdev_ashift_optimize(vdev_t *vd)"}},{"name":"vdev_open_children","ref":{"file":"module/zfs/vdev.c","line":2128,"symbol":"vdev_open_children","code":"vdev_open_children(vdev_t *vd, cred_t *cred)"}}],"role":"Calls the type's open, which for interior vdevs opens the children first. A leaf below 64 MiB fails with EOVERFLOW. Usable size (asize) is the device size less 4 MiB in front (two labels plus the 3.5 MiB boot area) and 512 KiB at the end. On the first open of a top-level vdev, ashift is the requested value or else the logical ashift, raised toward the physical ashift (up to zfs_vdev_max_auto_ashift, at least zfs_vdev_min_auto_ashift) by vdev_ashift_optimize(); it is fixed from then on. Each leaf is probed with label-area reads (vdev_probe()) before the open succeeds.","tunables":[{"name":"zfs_vdev_min_auto_ashift","ref":{"file":"module/zfs/vdev.c","line":7409,"symbol":"min_auto_ashift","code":"ZFS_MODULE_PARAM_CALL(zfs_vdev, zfs_vdev_, min_auto_ashift,"}},{"name":"zfs_vdev_max_auto_ashift","ref":{"file":"module/zfs/vdev.c","line":7413,"symbol":"max_auto_ashift","code":"ZFS_MODULE_PARAM_CALL(zfs_vdev, zfs_vdev_, max_auto_ashift,"}}],"props":[]},{"id":"label_init","group":"vtree","sub":0,"title":"vdev_label_init(): first labels","ctx":"syscall","src":"module/zfs/vdev_label.c","fns":[{"name":"vdev_label_init","ref":{"file":"module/zfs/vdev_label.c","line":1154,"symbol":"vdev_label_init","code":"vdev_label_init(vdev_t *vd, uint64_t crtxg, vdev_labeltype_t reason)"}},{"name":"vdev_inuse","ref":{"file":"module/zfs/vdev_label.c","line":976,"symbol":"vdev_inuse","code":"vdev_inuse(vdev_t *vd, uint64_t crtxg, vdev_labeltype_t reason,"}},{"name":"vdev_aux_label_generate","ref":{"file":"module/zfs/vdev_label.c","line":1105,"symbol":"vdev_aux_label_generate","code":"vdev_aux_label_generate(vdev_t *vd, boolean_t reason_spare)"}},{"name":"spa_config_generate","ref":{"file":"module/zfs/spa_config.c","line":314,"symbol":"spa_config_generate","code":"spa_config_generate(spa_t *spa, vdev_t *vd, uint64_t txg, int getstats)"}}],"role":"Walks the tree leaf by leaf, deliberately one at a time. Reads any existing label: one of an active pool, of a spare or cache device, or one written moments ago by this same create (the same disk listed twice) means EBUSY, with the device and the pool it belongs to recorded for the error message. Otherwise writes all four labels: the config of the pool and of this leaf's top-level vdev marked as pool txg 0 (not yet a real pool) with create_txg 4, a zeroed bootenv area, and an uberblock ring holding only a template with txg 0. Spares and cache devices get a short aux label instead.","tunables":[],"props":[]},{"id":"vdev_mirror","group":"vtree","sub":1,"title":"Mirror vdev","ctx":"any","src":"module/zfs/vdev_mirror.c","fns":[{"name":"vdev_mirror_open","ref":{"file":"module/zfs/vdev_mirror.c","line":361,"symbol":"vdev_mirror_open","code":"vdev_mirror_open(vdev_t *vd, uint64_t *asize, uint64_t *max_asize,"}}],"role":"Shared with the I/O flow graph. At create, opening a mirror opens each side; its size is that of the smallest side and its logical ashift the largest of the sides. All sides must open, as for every create.","tunables":[],"props":[]},{"id":"vdev_raidz","group":"vtree","sub":1,"title":"RAIDZ / dRAID vdev","ctx":"any","src":"module/zfs/vdev_raidz.c","fns":[{"name":"vdev_raidz_init","ref":{"file":"module/zfs/vdev_raidz.c","line":5618,"symbol":"vdev_raidz_init","code":"vdev_raidz_init(spa_t *spa, nvlist_t *nv, void **tsd)"}},{"name":"vdev_raidz_open","ref":{"file":"module/zfs/vdev_raidz.c","line":2218,"symbol":"vdev_raidz_open","code":"vdev_raidz_open(vdev_t *vd, uint64_t *asize, uint64_t *max_asize,"}},{"name":"vdev_draid_init","ref":{"file":"module/zfs/vdev_draid.c","line":2427,"symbol":"vdev_draid_init","code":"vdev_draid_init(spa_t *spa, nvlist_t *nv, void **tsd)"}},{"name":"vdev_draid_open","ref":{"file":"module/zfs/vdev_draid.c","line":1694,"symbol":"vdev_draid_open","code":"vdev_draid_open(vdev_t *vd, uint64_t *asize, uint64_t *max_asize,"}},{"name":"vdev_draid_metaslab_init","ref":{"file":"module/zfs/vdev_draid.c","line":1841,"symbol":"vdev_draid_metaslab_init","code":"vdev_draid_metaslab_init(vdev_t *vd, uint64_t *ms_start, uint64_t *ms_size)"}}],"role":"Shared with the I/O flow graph. raidz: init reads the parity (1 to 3); open needs at least parity + 1 children, and the size is the smallest child times the number of children, parity included. dRAID: init reads data disks, parity, distributed spares and groups and builds the permuted mapping of groups to children; open opens the data children, then the distributed spares, and sizes the vdev as the smallest child less a 32 MiB reserve, times the children that are not spares, rounded down to whole groups. Each dRAID metaslab is aligned to the group width.","tunables":[],"props":[]},{"id":"draid_spares","group":"vtree","sub":1,"title":"dRAID distributed spares","ctx":"syscall","src":"module/zfs/vdev_draid.c","fns":[{"name":"vdev_draid_spare_create","ref":{"file":"module/zfs/vdev_draid.c","line":1864,"symbol":"vdev_draid_spare_create","code":"vdev_draid_spare_create(nvlist_t *nvroot, vdev_t *vd, uint64_t *ndraidp,"}}],"role":"For every distributed spare of every dRAID top-level vdev, appends a leaf nvlist of type `dspare` named `draid<parity>-<vdev id>-<spare id>` to the pool's spare list. From here on they are ordinary hot spares in the aux list, backed by space reserved on every child of their dRAID. Counts dRAID vdevs (and those with failure groups) for the feature checks.","tunables":[],"props":[]},{"id":"aux_validate","group":"vtree","sub":1,"title":"spa_validate_aux()","ctx":"syscall","src":"module/zfs/spa.c","fns":[{"name":"spa_validate_aux","ref":{"file":"module/zfs/spa.c","line":7189,"symbol":"spa_validate_aux","code":"spa_validate_aux(spa_t *spa, nvlist_t *nvroot, uint64_t crtxg, int mode)"}},{"name":"spa_validate_aux_devs","ref":{"file":"module/zfs/spa.c","line":7120,"symbol":"spa_validate_aux_devs","code":"spa_validate_aux_devs(spa_t *spa, nvlist_t *nvroot, uint64_t crtxg, int mode,"}}],"role":"Checks the `spares` and then the `l2cache` arrays: each entry must parse as a single leaf, which is made its own top-level vdev, opened and given an aux label; its new guid is written back into the nvlist and the temporary vdev_t is freed. At create any failure aborts.","tunables":[],"props":[]},{"id":"aux_load","group":"vtree","sub":1,"title":"Spare and cache lists (sav)","ctx":"syscall","src":"module/zfs/spa.c","fns":[{"name":"spa_load_spares","ref":{"file":"module/zfs/spa.c","line":2488,"symbol":"spa_load_spares","code":"spa_load_spares(spa_t *spa)"}},{"name":"spa_load_l2cache","ref":{"file":"module/zfs/spa.c","line":2618,"symbol":"spa_load_l2cache","code":"spa_load_l2cache(spa_t *spa)"}},{"name":"spa_spare_add","ref":{"file":"module/zfs/spa_misc.c","line":1247,"symbol":"spa_spare_add","code":"spa_spare_add(vdev_t *vd)"}},{"name":"spa_l2cache_add","ref":{"file":"module/zfs/spa_misc.c","line":1300,"symbol":"spa_l2cache_add","code":"spa_l2cache_add(vdev_t *vd)"}},{"name":"l2arc_add_vdev","ref":{"file":"module/zfs/arc.c","line":10471,"symbol":"l2arc_add_vdev","code":"l2arc_add_vdev(spa_t *spa, vdev_t *vd)"}}],"role":"Builds the pool's auxiliary vdev lists from the nvlist: each spare and cache device becomes a standalone vdev_t (not part of the root vdev's tree), is opened, and is registered system-wide by guid so other pools see it as a spare or cache device. Cache devices join the L2ARC. The lists are marked to be written to the MOS in the first sync.","tunables":[],"props":[]},{"id":"ms_size","group":"alloc","sub":0,"title":"vdev_metaslab_set_size()","ctx":"syscall","src":"module/zfs/vdev.c","fns":[{"name":"vdev_metaslab_set_size","ref":{"file":"module/zfs/vdev.c","line":3086,"symbol":"vdev_metaslab_set_size","code":"vdev_metaslab_set_size(vdev_t *vd)"}}],"role":"Chooses the metaslab size of a top-level vdev from its asize: aim for zfs_vdev_default_ms_count (200) metaslabs of at least 2^zfs_vdev_default_ms_shift (512 MiB), at least zfs_vdev_min_ms_count (16) metaslabs, at most 2^zfs_vdev_max_ms_shift (16 GiB) each until zfs_vdev_ms_count_limit (131072) would be exceeded, never below 16 MiB. Roughly: under 8 GB about 16 metaslabs, 8 to 100 GB one per 512 MiB, 100 GB to 3 TB about 200, larger ones 16 GiB each.","tunables":[{"name":"zfs_vdev_default_ms_count","ref":{"file":"module/zfs/vdev.c","line":7359,"symbol":"default_ms_count","code":"ZFS_MODULE_PARAM(zfs_vdev, zfs_vdev_, default_ms_count, UINT, ZMOD_RW,"}},{"name":"zfs_vdev_min_ms_count","ref":{"file":"module/zfs/vdev.c","line":7368,"symbol":"min_ms_count","code":"ZFS_MODULE_PARAM(zfs_vdev, zfs_vdev_, min_ms_count, UINT, ZMOD_RW,"}},{"name":"zfs_vdev_ms_count_limit","ref":{"file":"module/zfs/vdev.c","line":7371,"symbol":"ms_count_limit","code":"ZFS_MODULE_PARAM(zfs_vdev, zfs_vdev_, ms_count_limit, UINT, ZMOD_RW,"}},{"name":"zfs_vdev_default_ms_shift","ref":{"file":"module/zfs/vdev.c","line":7362,"symbol":"default_ms_shift","code":"ZFS_MODULE_PARAM(zfs_vdev, zfs_vdev_, default_ms_shift, UINT, ZMOD_RW,"}},{"name":"zfs_vdev_max_ms_shift","ref":{"file":"module/zfs/vdev.c","line":7365,"symbol":"max_ms_shift","code":"ZFS_MODULE_PARAM(zfs_vdev, zfs_vdev_, max_ms_shift, UINT, ZMOD_RW,"}}],"props":[]},{"id":"ms_init","group":"alloc","sub":0,"title":"vdev_expand() / vdev_metaslab_init()","ctx":"syscall","src":"module/zfs/vdev.c","fns":[{"name":"vdev_expand","ref":{"file":"module/zfs/vdev.c","line":6040,"symbol":"vdev_expand","code":"vdev_expand(vdev_t *vd, uint64_t txg)"}},{"name":"vdev_metaslab_init","ref":{"file":"module/zfs/vdev.c","line":1663,"symbol":"vdev_metaslab_init","code":"vdev_metaslab_init(vdev_t *vd, uint64_t txg)"}},{"name":"metaslab_init","ref":{"file":"module/zfs/metaslab.c","line":2932,"symbol":"metaslab_i e":"vdev_inuse(vd, crtxg, reason, &spare_guid, &l2cache_guid)) {"},{"file":"module/zfs/vdev_label.c","line":1037,"symbol":"vdtxg","code":"txg == 0 && vdtxg == crtxg)"},{"file":"module/zfs/vdev_label.c","line":1218,"symbol":"spa_create_info","code":"spa->spa_create_info = nv;"},{"file":"module/zfs/vdev_label.c","line":1220,"symbol":"EBUSY","code":"return (SET_ERROR(EBUSY));"}]},{"id":"E094","from":"set_props","to":"ioc_pool_create","type":"ctl","label":"a root property fails: spa_destroy() of the new pool, error returned","refs":[{"file":"module/zfs/zfs_ioctl.c","line":1768,"symbol":"spa_destroy","code":"(void) spa_destroy(spa_name);"}]},{"id":"E095","from":"admin","to":"zpool_cmd","type":"ctl","label":"runs zpool create [-f] [-o property=value] [-O fs-property=value] pool vdev-spec ...","refs":[{"file":"cmd/zpool/zpool_main.c","line":375,"symbol":"zpool_do_create","code":"{ \"create\",\tzpool_do_create,\tHELP_CREATE\t\t},"}]}],"paths":[{"id":"create_disk","category":"Create","title":"Create a pool on one whole disk","summary":"`zpool create tank /dev/disk/by-id/ata-X` from the command line to the mounted file system. The first txg is drawn as one wait here; path `first_txg` opens it up.","ends":"The disk has a GPT with ZFS in partition 1, four labels describing a one-vdev pool at txg 4, about 200 metaslabs with space maps (fewer on a small disk), and a MOS holding the pool directory, the root, `$MOS`, `$FREE` and `$ORIGIN` directories, the root dataset and the feature objects. The pool is in zpool.cache and its file system is mounted at /tank. The writes themselves follow `zfs-io-flow:txg_sync`.","alts":[],"steps":[{"wire":"E095"},{"wire":"E001"},{"wire":"E002","note":"one device, no keyword: it is top-level vdev 0 by itself"},{"wire":"E003"},{"wire":"E004"},{"wire":"E005"},{"wire":"E006","note":"a single top-level vdev has nothing to be compared with"},{"wire":"E007"},{"wire":"E008"},{"wire":"E009","note":"whatever partitions the disk had are gone from here on"},{"wire":"E010"},{"wire":"E011"},{"wire":"E012"},{"wire":"E013"},{"wire":"E014"},{"wire":"E015"},{"wire":"E016"},{"wire":"E017"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E021"},{"wire":"E022","note":"root vdev (its guid is the pool guid), then the disk"},{"wire":"E024"},{"wire":"E025"},{"wire":"E026"},{"wire":"E027"},{"wire":"E028"},{"wire":"E029","note":"a 4K-sector disk normally gets ashift 12"},{"wire":"E030"},{"wire":"E031"},{"wire":"E032"},{"wire":"E033"},{"wire":"E058","note":"no spares or cache devices: nothing to check"},{"wire":"E034"},{"wire":"E035"},{"wire":"E036","note":"normal class"},{"wire":"E037"},{"wire":"E038"},{"wire":"E039"},{"wire":"E040"},{"wire":"E041"},{"wire":"E042"},{"wire":"E043"},{"wire":"E044"},{"wire":"E046","note":"txg 4 is written now (path first_txg)"},{"wire":"E047"},{"wire":"E048"},{"wire":"E049"},{"wire":"E050","note":"only when -O or -m was given"},{"wire":"E051"},{"wire":"E052"}]},{"id":"vdev_types","category":"Vdev layout","title":"Choosing the top-level vdev type","summary":"What changes between a single disk, a file, a mirror, a raidz and a dRAID: the grammar, the in-use and replication checks, partitioning, the type's init and open, the size of the top-level vdev, dRAID's distributed spares and its feature.","ends":"One top-level vdev of the chosen type in the normal class, sized as its type dictates, with labels on every leaf. A dRAID pool also has its distributed spares in the spare list and the draid feature active.","alts":[{"id":"vdev","options":[{"id":"disk","label":"Single disk (no extra steps)"},{"id":"file","label":"File vdev"},{"id":"mirror","label":"Mirror"},{"id":"raidz","label":"RAIDZ1, RAIDZ2 or RAIDZ3"},{"id":"draid","label":"dRAID"}]}],"steps":[{"wire":"E095"},{"wire":"E001"},{"wire":"E002","note":"after mirror, raidzN or draid... the following devices are the children, up to the next keyword"},{"wire":"E003"},{"wire":"E004","note":"a file is only checked for a ZFS label of another pool"},{"wire":"E005","when":[{"group":"vdev","options":["disk","mirror","raidz","draid"]}]},{"wire":"E006","note":"a mirror, raidz or dRAID must not mix files and devices, nor sizes more than 16 MiB apart"},{"wire":"E007","note":"files are left untouched"},{"wire":"E008","when":[{"group":"vdev","options":["disk","mirror","raidz","draid"]}]},{"wire":"E009","when":[{"group":"vdev","options":["disk","mirror","raidz","draid"]}]},{"wire":"E010","when":[{"group":"vdev","options":["disk","mirror","raidz","draid"]}]},{"wire":"E011","when":[{"group":"vdev","options":["disk","mirror","raidz","draid"]}]},{"wire":"E012","note":"raidz carries nparity; dRAID carries nparity, ndata, nspares, ngroups and children from draid_config_by_type()"},{"wire":"E015"},{"wire":"E016"},{"wire":"E017"},{"wire":"E021"},{"wire":"E022","note":"mirror, raidz and dRAID are interior top-level vdevs with their leaves as children"},{"wire":"E023","when":[{"group":"vdev","options":["raidz","draid"]}]},{"wire":"E024"},{"wire":"E025"},{"wire":"E053","when":[{"group":"vdev","options":["mirror"]}]},{"wire":"E054","when":[{"group":"vdev","options":["mirror"]}]},{"wire":"E055","when":[{"group":"vdev","options":["raidz","draid"]}]},{"wire":"E056","when":[{"group":"vdev","options":["raidz","draid"]}]},{"wire":"E026","note":"each leaf"},{"wire":"E027","note":"a file vdev opens a regular file instead"},{"wire":"E028"},{"wire":"E029","note":"ashift is chosen once per top-level vdev, from the largest sector size of its children"},{"wire":"E030"},{"wire":"E031"},{"wire":"E032"},{"wire":"E033","note":"every leaf gets its own labels; each describes the whole top-level vdev it belongs to"},{"wire":"E057","when":[{"group":"vdev","options":["draid"]}]},{"wire":"E064","when":[{"group":"vdev","options":["draid"]}],"note":"the distributed spares become the pool's hot spares"},{"wire":"E034"},{"wire":"E035","note":"dRAID metaslabs are aligned to the group width"},{"wire":"E036"},{"wire":"E045","when":[{"group":"vdev","options":["draid"]}]}]},{"id":"alloc_classes","category":"Vdev layout","title":"Special, dedup and log vdevs","summary":"`zpool create tank mirror A B special mirror C D` (or `dedup ...`, `log ...`): the keyword gives the following top-level vdevs an allocation bias, which decides the metaslab class their space joins.","ends":"The pool has top-level vdevs in two classes. Special and dedup vdevs have their bias recorded in their top-level ZAP and the allocation_classes feature active; a log vdev is recorded through is_log in the config. Which blocks go where is decided at write time (`zfs-io-flow:txg_sync`).","alts":[{"id":"class","options":[{"id":"special","label":"Special vdev (metadata, optionally small blocks)"},{"id":"dedup","label":"Dedup vdev (dedup tables)"},{"id":"log","label":"Log vdev (separate intent log)"}]}],"steps":[{"wire":"E095"},{"wire":"E001"},{"wire":"E002","note":"special, dedup and log set allocation_bias on each following top-level vdev"},{"wire":"E003"},{"wire":"E006","when":[{"group":"class","options":["special","dedup"]}],"note":"must survive at least as many device failures as the normal vdevs; log vdevs are not checked"},{"wire":"E012"},{"wire":"E015"},{"wire":"E016"},{"wire":"E017","note":"special and dedup need feature@allocation_classes (path fail_kernel)"},{"wire":"E021"},{"wire":"E022","note":"vdev_derive_alloc_bias() sets the bias; a log vdev also gets vdev_islog"},{"wire":"E024"},{"wire":"E025"},{"wire":"E026"},{"wire":"E067","when":[{"group":"class","options":["special"]}]},{"wire":"E068","when":[{"group":"class","options":["dedup"]}]},{"wire":"E069","when":[{"group":"class","options":["log"]}]},{"wire":"E028"},{"wire":"E029","note":"the pool's ashift range is tracked over normal vdevs only"},{"wire":"E030"},{"wire":"E031"},{"wire":"E032"},{"wire":"E033"},{"wire":"E034"},{"wire":"E035"},{"wire":"E036","note":"special: special class and special embedded log; dedup: dedup class and embedded log; log: log class only"},{"wire":"E037","when":[{"group":"class","options":["special"]}]},{"wire":"E046"},{"wire":"E070"},{"wire":"E071"},{"wire":"E072","when":[{"group":"class","options":["special","dedup"]}]}]},{"id":"aux_vdevs","category":"Vdev layout","title":"Hot spares and cache devices","summary":"`zpool create tank raidz A B C spare D cache E`. Spares and cache devices are labelled and remembered, but never become part of the vdev tree and get no metaslabs.","ends":"The spare or cache device carries an aux label and is listed in its own MOS object, not in the vdev tree. A spare waits to be attached (`zfs-fault-management:zed_fault`); a cache device is part of the L2ARC at once.","alts":[{"id":"aux","options":[{"id":"spare","label":"Hot spare"},{"id":"cache","label":"Cache device (L2ARC)"}]}],"steps":[{"wire":"E095"},{"wire":"E001"},{"wire":"E002","note":"spare and cache start lists, each allowed once, not top-level vdevs"},{"wire":"E003"},{"wire":"E004","note":"a spare may be a spare of another pool too"},{"wire":"E007","note":"spare and cache disks are partitioned like data disks"},{"wire":"E008"},{"wire":"E009"},{"wire":"E011"},{"wire":"E012","note":"spares and l2cache arrays sit beside the children"},{"wire":"E015"},{"wire":"E016"},{"wire":"E017"},{"wire":"E021","note":"only children are parsed into the tree"},{"wire":"E024","note":"the main tree is opened and labelled as in create_disk"},{"wire":"E058"},{"wire":"E059"},{"wire":"E060"},{"wire":"E026"},{"wire":"E062","when":[{"group":"aux","options":["spare"]}]},{"wire":"E063","when":[{"group":"aux","options":["cache"]}]},{"wire":"E028"},{"wire":"E061"},{"wire":"E031","note":"aux label: state spare or l2cache, the device guid and path; no pool guid, no vdev tree"},{"wire":"E032"},{"wire":"E033"},{"wire":"E064"},{"wire":"E065"},{"wire":"E066","when":[{"group":"aux","options":["cache"]}]},{"wire":"E046"},{"wire":"E070"},{"wire":"E073"}]},{"id":"first_txg","category":"First txg","title":"The first txg: what is written where","summary":"spa_create() has built txg 4 in memory; now the sync thread writes it. This is the moment the pool starts to exist on disk.","ends":"On disk: the MOS and the root dataset, the config object, one space map per metaslab, and on every leaf labels with the real config and an uberblock for txg 4 pointing at the MOS. The pool can be imported from here on. The same commit sequence runs for every later txg (`zfs-io-flow:txg_sync`).","alts":[{"id":"meta","options":[{"id":"normal","label":"No special vdev"},{"id":"special","label":"With a special vdev"}]}],"steps":[{"wire":"E046"},{"wire":"E070"},{"wire":"E071"},{"wire":"E073","note":"only with spares or cache devices"},{"wire":"E074"},{"wire":"E075"},{"wire":"E032"},{"wire":"E076","when":[{"group":"meta","options":["normal"]}]},{"wire":"E077","when":[{"group":"meta","options":["special"]}]},{"wire":"E078"},{"wire":"E079"},{"wire":"E080"},{"wire":"E081"},{"wire":"E082"},{"wire":"E083"},{"wire":"E032"},{"wire":"E033"},{"wire":"E084"},{"wire":"E047"},{"wire":"E048"}]},{"id":"features_props","category":"Features and properties","title":"Features, compatibility and properties","summary":"Where `-d`, `-o feature@...`, `-o compatibility=...`, the other `-o` pool properties and the `-O` file system properties end up.","ends":"Features are enabled (most not yet active), pool properties are in the pool properties ZAP or the config, and the root dataset has its creation-time ZPL properties plus the `-O` properties set as local. With `-O encryption=on` the root dataset becomes an encryption root (`zfs-encryption-keys:create`).","alts":[],"steps":[{"wire":"E095"},{"wire":"E013"},{"wire":"E014"},{"wire":"E015","note":"props: -o pool properties and feature@ entries; fsprops: -O and -m"},{"wire":"E016"},{"wire":"E017","note":"the -O properties travel nested in props and are split off here"},{"wire":"E018","note":"altroot is taken from props"},{"wire":"E020"},{"wire":"E038"},{"wire":"E040"},{"wire":"E041","note":"zplprops from zfs_fill_zplprops_root() shape the root file system"},{"wire":"E043"},{"wire":"E044"},{"wire":"E045","note":"only with dRAID or AnyRAID vdevs"},{"wire":"E046"},{"wire":"E070"},{"wire":"E074","note":"the feature ZAPs and the pool properties ZAP are written with the MOS"},{"wire":"E047"},{"wire":"E048","note":"nothing is written for cachefile=none"},{"wire":"E049"},{"wire":"E050"}]},{"id":"fail_exists","category":"Failures","title":"Failure: the pool name exists","summary":"`zpool create tank ...` while a pool named tank is imported. The kernel refuses at once, but only after zpool has already repartitioned the disks.","ends":"No kernel state changed, but whole disks named in the command now carry a fresh GPT; what they held before is no longer reachable through their old partition table.","alts":[],"steps":[{"wire":"E095"},{"wire":"E001"},{"wire":"E007","note":"the disks are prepared before the kernel is asked"},{"wire":"E008"},{"wire":"E009"},{"wire":"E012"},{"wire":"E015"},{"wire":"E016"},{"wire":"E017"},{"wire":"E018"},{"wire":"E085"},{"wire":"E086"},{"wire":"E051"},{"wire":"E087","note":"cannot create 'tank': pool already exists"}]},{"id":"fail_userspace","category":"Failures","title":"Failure caught by zpool","summary":"The checks in make_root_vdev() refuse a device in use or a layout with mismatched redundancy before anything is written; `-f` skips the replication check entirely but not the in-use check.","ends":"inuse or replication: nothing was written and no ioctl was issued. forced: the create goes on as in `create_disk`, with a pool whose top-level vdevs differ in redundancy.","alts":[{"id":"check","options":[{"id":"inuse","label":"Device in use"},{"id":"replication","label":"Mismatched replication level"},{"id":"forced","label":"Mismatched replication with -f (create continues)"}]}],"steps":[{"wire":"E095"},{"wire":"E001"},{"wire":"E002"},{"wire":"E003"},{"wire":"E004"},{"wire":"E005"},{"wire":"E088","when":[{"group":"check","options":["inuse"]}]},{"wire":"E006","when":[{"group":"check","options":["replication"]}],"note":"for example a mirror beside a raidz2, or raidz1 beside raidz2"},{"wire":"E089","when":[{"group":"check","options":["replication"]}]},{"wire":"E090","when":[{"group":"check","options":["inuse","replication"]}]},{"wire":"E007","when":[{"group":"check","options":["forced"]}],"note":"with -f, check_replication() is never called"},{"wire":"E012","when":[{"group":"check","options":["forced"]}]},{"wire":"E015","when":[{"group":"check","options":["forced"]}]}]},{"id":"fail_kernel","category":"Failures","title":"Failure inside the kernel, and rollback","summary":"Errors that only the kernel can see: a label that marks the device as in use (including the same disk named twice under different paths), a device too small, special or dedup vdevs without the allocation_classes feature, or a root file system property that cannot be set after the pool exists.","ends":"busy, small, feature: the spa_t, vdev tree and classes are freed and the name is free again; labels written before the failure say pool txg 0 and do not form an importable pool. rootprop: the pool had been fully created and is destroyed again.","alts":[{"id":"error","options":[{"id":"busy","label":"Device label in use (EBUSY)"},{"id":"small","label":"Device below 64 MiB (EOVERFLOW)"},{"id":"feature","label":"Special or dedup vdev without feature@allocation_classes (ENOTSUP)"},{"id":"rootprop","label":"A -O property fails after the pool was created"}]}],"steps":[{"wire":"E095"},{"wire":"E015"},{"wire":"E016"},{"wire":"E017"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E021","when":[{"group":"error","options":["busy","small"]}]},{"wire":"E022","when":[{"group":"error","options":["busy","small"]}]},{"wire":"E024","when":[{"group":"error","options":["busy","small"]}]},{"wire":"E025","when":[{"group":"error","options":["busy","small"]}]},{"wire":"E026","when":[{"group":"error","options":["busy","small"]}]},{"wire":"E027","when":[{"group":"error","options":["busy","small"]}]},{"wire":"E028","when":[{"group":"error","options":["busy","small"]}]},{"wire":"E092","when":[{"group":"error","options":["small"]}]},{"wire":"E029","when":[{"group":"error","options":["busy"]}]},{"wire":"E030","when":[{"group":"error","options":["busy"]}]},{"wire":"E093","when":[{"group":"error","options":["busy"]}]},{"wire":"E091","when":[{"group":"error","options":["busy","small","feature"]}]},{"wire":"E086","when":[{"group":"error","options":["busy","small","feature"]}]},{"wire":"E049","when":[{"group":"error","options":["rootprop"]}]},{"wire":"E050","when":[{"group":"error","options":["rootprop"]}]},{"wire":"E094","when":[{"group":"error","options":["rootprop"]}]},{"wire":"E051"},{"wire":"E087"}]}],"stages":[],"pipelines":[],"pipelineRuntimeNote":"","about":{"model":["Most of the checking happens in userspace before the kernel is asked. `zpool` parses the vdev grammar into an nvlist tree, refuses devices that are in use and (unless `-f`) layouts with mismatched redundancy, and on Linux gives every whole disk a new GPT label: partition 1 for ZFS from 1 MiB, an 8 MiB reserved partition 9 at the end. Only then is one ioctl, ZFS_IOC_POOL_CREATE, issued.","The kernel builds a tree of vdev_t from that nvlist: a root vdev (its guid becomes the pool guid), top-level vdevs (a disk, a file, a mirror, a raidz or a dRAID), and leaves. Each top-level vdev belongs to one allocation class: normal, special, dedup or log. Hot spares and cache devices are not in the tree; they are separate auxiliary lists.","Sizes and ashift are settled at the first open. Each leaf reports its capacity and sector sizes; a mirror is as large as its smallest side, a raidz is its smallest child times its width (parity included), a dRAID leaves out its distributed spares and a reserve. The ashift chosen for each top-level vdev is kept for its life.","Every leaf carries four 256 KiB labels, two at the front and two at the end. Create writes provisional labels (pool txg 0) first, leaf by leaf, so a disk that belongs to an active pool, or the same disk named twice, fails with EBUSY before anything else is written.","The whole initial pool (MOS, pool directory, root, `$MOS`, `$FREE` and `$ORIGIN` directories, the root dataset with its file system objects, feature ZAPs, pool properties, history) is built in memory by the ioctl thread inside txg 4 (TXG_INITIAL), before the txg sync thread even exists.","The first txg sync writes it all: the pool config object, one space map per metaslab, the MOS and root dataset blocks, then the labels with the real config and the first uberblock. Only when that txg is on disk does `spa_create()` write `zpool.cache`, the root file system properties get set and `zpool` mount the new file system.","Each top-level vdev is cut into metaslabs when it is created: about 200 by default, each 512 MiB to 16 GiB; normal and special vdevs with more than 64 metaslabs give one of them to an embedded log class.","A failure in userspace leaves no pool, but whole disks may already have been repartitioned. A failure inside `spa_create()` unwinds everything in memory; a failure to set the root properties destroys the just-created pool again."],"simplifications":["Label and block writes jump from `zio_create` to the leaf driver; the pipeline stages and the per-disk queue between them are drawn in the I/O graph.","The vdev tree is recursive: vdev_open() and vdev_label_init() run once per vdev, and spa_config_parse() once per nvlist. Each is drawn once.","Return wires are drawn only where a size, an ashift or an error matters; most returns to `spa_create` are implied by the next step.","Leaf opens for the normal class, special, dedup, log, spare and cache devices are separate wires into separate device nodes; they are the same call (`vdev_disk_open()`).","dRAID is folded into the RAIDZ node, as in the I/O graph; AnyRAID (`anymirror`) appears only in node text.","The first txg is shown as one sync with its main writes; the second and later passes of spa_sync(), deferred frees, the log space map and MMP are left out.","`zpool create -n` (dry run), `-t` (temporary name), boot environments and encryption key handling are described in node text only."]},"timelines":[],"page":{"id":"zfs-pool-create","title":"ZFS Pool Creation","file":"zfs-pool-create.html","intro":"This spec describes a diagram of `zpool create`: how the command line becomes a vdev specification, which checks can refuse the disks, how Linux whole disks are repartitioned, how the kernel turns the specification into a vdev tree (single disk, file, mirror, raidz, dRAID, special, dedup, log, plus the spare and cache lists that stay outside the tree), how sizes, ashift and metaslabs are decided, what labels are written at once, how the meta-object set (MOS), the root dataset and the feature objects are built for the first txg, and what is on disk once that txg has synced."},"suite":{"pages":[{"id":"zfs-io-flow","title":"ZFS I/O Flow","file":"zfs-io-flow.html"},{"id":"zfs-scrub-resilver","title":"ZFS Scrub, Resilver and Rebuild","file":"zfs-scrub-resilver.html"},{"id":"zfs-send-receive","title":"ZFS Send and Receive","file":"zfs-send-receive.html"},{"id":"zfs-snapshot-lifecycle","title":"ZFS Snapshots, Destroy and Rollback","file":"zfs-snapshot-lifecycle.html"},{"id":"zfs-fault-management","title":"ZFS Fault Management","file":"zfs-fault-management.html"},{"id":"zfs-encryption-keys","title":"ZFS Encryption Keys","file":"zfs-encryption-keys.html"},{"id":"zfs-pool-create","title":"ZFS Pool Creation","file":"zfs-pool-create.html"},{"id":"zfs-dataset-create","title":"ZFS Dataset Creation","file":"zfs-dataset-create.html"},{"id":"zfs-pool-import-export","title":"ZFS Pool Import and Export","file":"zfs-pool-import-export.html"},{"id":"zfs-destroy","title":"ZFS Destroy Actions","file":"zfs-destroy.html"}],"alsoIn":{"admin":["zfs-scrub-resilver","zfs-send-receive","zfs-snapshot-lifecycle","zfs-fault-management","zfs-encryption-keys","zfs-dataset-create","zfs-pool-import-export","zfs-destroy"],"zpool_cmd":["zfs-pool-import-export","zfs-destroy"],"libzfs":["zfs-snapshot-lifecycle","zfs-destroy"],"set_props":["zfs-dataset-create"],"spa_ns":["zfs-pool-import-export"],"spa_unload":["zfs-pool-import-export","zfs-destroy"],"cachefile":["zfs-pool-import-export","zfs-destroy"],"vdev_open":["zfs-fault-management","zfs-pool-import-export"],"vdev_mirror":["zfs-io-flow","zfs-scrub-resilver","zfs-fault-management"],"vdev_raidz":["zfs-io-flow","zfs-scrub-resilver","zfs-fault-management"],"space_map":["zfs-io-flow"],"txg_sync":["zfs-io-flow","zfs-scrub-resilver","zfs-send-receive","zfs-snapshot-lifecycle","zfs-dataset-create","zfs-pool-import-export","zfs-destroy"],"spa_sync":["zfs-io-flow","zfs-scrub-resilver","zfs-send-receive","zfs-snapshot-lifecycle","zfs-fault-management","zfs-encryption-keys","zfs-dataset-create","zfs-pool-import-export","zfs-destroy"],"dsl_pool_sync":["zfs-io-flow","zfs-send-receive","zfs-snapshot-lifecycle","zfs-dataset-create","zfs-destroy"],"uberblock":["zfs-io-flow","zfs-fault-management","zfs-pool-import-export","zfs-destroy"],"vdev_label":["zfs-io-flow","zfs-pool-import-export"],"zio_create":["zfs-io-flow","zfs-scrub-resilver","zfs-send-receive","zfs-snapshot-lifecycle","zfs-fault-management"],"vdev_leaf":["zfs-io-flow","zfs-scrub-resilver","zfs-fault-management","zfs-pool-import-export"],"dev_normal":["zfs-io-flow","zfs-scrub-resilver","zfs-fault-management","zfs-pool-import-export"],"dev_special":["zfs-io-flow"],"dev_dedup":["zfs-io-flow"],"dev_slog":["zfs-io-flow","zfs-pool-import-export"],"dev_l2arc":["zfs-io-flow"],"dev_labels":["zfs-io-flow","zfs-pool-import-export","zfs-destroy"]}}}</script>
<script>
'use strict';

/*
 * ZFS I/O Flow viewer.
 *
 * The page contains no ZFS knowledge of its own: everything it shows comes
 * from the JSON block #graph-data, generated from the spec by build_graph.py.
 *
 * Function list (spec section 12, step 3). Inputs -> outputs; side effects.
 *
 * Data
 *   loadGraph()                 #graph-data -> state.graph and lookup maps. No DOM.
 *   sourceUrl(ref)              {file,line} -> GitHub URL at meta.commit.
 *   computePlayed(path, sel)    path + option selection -> played steps
 *                               [{index, n, wire, step, side}]. Pure.
 *   defaultSelection(path)      path -> {group: first option}. Pure.
 *   traceClosure(id, dir, depth, ignoreCtl) -> {nodes:Set, wires:Set}. Pure.
 *
 * Layout and geometry
 *   socketTypes(id, wires)      node id + wire list -> {ins:[type], outs:[type]}. Pure.
 *   layoutDefault()             -> {nodeId: {x,y}} from groups and node order (spec 7). Pure.
 *   computeDisplay()            filters, collapse state, positions -> state.disp
 *                               (display nodes, visible wires, sockets, sizes).
 *   groupFrames()               state.disp -> {groupId: {x,y,w,h}}. Pure.
 *   socketPoint(dn, side, type) display node + side + type -> {x,y}. Pure.
 *   wireGeometry(dw)            display wire -> SVG path string. Pure.
 *   worldBounds()               -> {x,y,w,h} enclosing every frame. Pure.
 *
 * Rendering
 *   renderAll()                 rebuilds groups, nodes, wires, then highlight + minimap.
 *   renderGroups()              draws group frames and titles into #layer-groups.
 *   renderNodes()               draws node boxes into #layer-nodes.
 *   renderWires()               draws wires and hit paths; fills state.wireEls.
 *   updatePositions()           moves node boxes, recomputes wire paths and frames.
 *   applyHighlight()            sets CSS classes on nodes and wires from the
 *                               current path / selection / trace / filters.
 *   renderBadges()              step-number badges for the active path.
 *   renderLegend(), renderGroupFilters(), renderPathList(), renderAbout()
 *                               build the static panels.
 *   renderDetails()             fills the right panel for the selection or path.
 *   renderMinimap()             draws groups and the viewport into the minimap.
 *   updateGroupLabels()         screen-space group titles when zoomed far out.
 *
 * View
 *   setViewTransform()          state.view -> root transform, grid, labels, minimap.
 *   fitView(bounds)             zooms and pans so bounds fill the canvas.
 *   screenToWorld(x, y)         canvas pixel -> graph coordinates. Pure.
 *
 * Interaction
 *   selectNode(id, center), selectWire(id, center), clearSelection()
 *   activatePath(id, sel, stepN), clearPath(), gotoStep(k), playPath(on)
 *   followStep(), showCaption(), animateDot(k)
 *   runSearch(text)             text -> result list in the left panel.
 *   showTooltip(evt, el), hideTooltip()
 *
 * Persistence
 *   saveLayout(), loadLayout(), saveView(), loadView()  browser storage, in try/catch.
 *   exportLayout(), importLayout(file)
