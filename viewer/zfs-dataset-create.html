<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZFS Dataset Creation</title>
<style>
:root {
  --canvas: #1f1f1f;
  --panel: #262626;
  --panel-line: #333;
  --text: #dddddd;
  --muted: #9a9a9a;
  --accent: #ffd43b;
  --node-body: #353535;
  --node-border: #161616;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
  scrollbar-color: #4a4a4a #262626;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
code { font-family: var(--mono); font-size: 0.92em; background: #ffffff12; padding: 0 3px; border-radius: 3px; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--canvas);
  color: var(--text);
  font: 13px/1.4 var(--sans);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

button, .button, select, input {
  font: inherit;
  color: var(--text);
  background: #333;
  border: 1px solid #444;
  border-radius: 5px;
  padding: 3px 9px;
}
button, .button { cursor: pointer; }
button:hover, .button:hover { background: #3d3d3d; border-color: #555; }
button.active { background: #4a4122; border-color: var(--accent); color: #fff; }
button.icon { padding: 2px 7px; }
input[type="search"] { width: 100%; }
a { color: #74c0fc; text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- top bar ---------- */
#topbar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--panel-line);
}
#topbar h1 {
  font-size: 15px;
  margin: 0 6px 0 2px;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex: 0 1 auto;
}
#topbar > * { flex-shrink: 0; }
#topbar > h1 { flex-shrink: 1; }
#topbar button, #topbar .button, #topbar a { white-space: nowrap; }
#commit-link { font-family: var(--mono); font-size: 12px; color: var(--muted); }
#topbar .spacer { flex: 1; }

/* ---------- main layout ---------- */
#layout { flex: 1; display: flex; min-height: 0; }
#left, #right {
  background: var(--panel);
  overflow-y: auto;
  flex: none;
}
#left { width: 280px; border-right: 1px solid var(--panel-line); overflow-x: hidden; }
#right { width: 360px; border-left: 1px solid var(--panel-line); padding: 10px 12px 40px; }
body.hide-left #left, body.hide-right #right { display: none; }

.panel-section { padding: 10px 12px; border-bottom: 1px solid var(--panel-line); }
.panel-section h2, #right h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 0 0 6px;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; }

/* search */
.results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 240px; overflow-y: auto; }
.results li { padding: 3px 6px; border-radius: 4px; cursor: pointer; }
.results li:hover, .results li.first { background: #333; }
.results .kind { color: var(--muted); font-size: 11px; margin-right: 6px; }

/* path list */
.path-cat { margin: 8px 0 2px; font-size: 11px; color: var(--muted); }
.path-item {
  display: block;
  width: 100%;
  white-space: normal;
  text-align: left;
  border: 1px solid transparent;
  background: none;
  padding: 3px 6px;
  border-radius: 4px;
}
.path-item:hover { background: #313131; border-color: transparent; }
.path-item.active { background: #4a4122; border-color: var(--accent); }
.path-item .pid { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; }

/* group filters */
.gfilter { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.gfilter .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.gfilter .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gfilter select { padding: 1px 4px; font-size: 12px; }

/* ---------- canvas ---------- */
#canvas-wrap { flex: 1; position: relative; min-width: 0; overflow: hidden; }
#canvas { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
#canvas.panning { cursor: grabbing; }

.group-frame { stroke-width: 1; }
.group-title { font-size: 18px; font-weight: 700; cursor: move; }
.group-summary { font-size: 11px; fill: var(--muted); pointer-events: none; }

.node { cursor: pointer; }
.node .body { fill: var(--node-body); stroke: var(--node-border); stroke-width: 1; }
.node:hover .body { stroke: #6a6a6a; }
.node .title-text { fill: #eeeeee; font-size: 13px; font-weight: 600; pointer-events: none; }
.node .pill { fill: #00000055; stroke: #ffffff30; }
.node .pill-text { fill: #ddd; font-size: 10px; font-family: var(--mono); }
.node .sock-label { fill: #bdbdbd; font-size: 10px; font-variant: small-caps; letter-spacing: 0.04em; pointer-events: none; }
.node .foot { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
.node .foot.link { cursor: pointer; }
.node .foot.link:hover { fill: #cfcfcf; text-decoration: underline; }
.node .outline { fill: none; stroke: none; pointer-events: none; }
.node.selected .outline { stroke: #fff; stroke-width: 2; }
.node.onpath .outline { stroke: var(--accent); stroke-width: 2; }
.node.current .outline { stroke: var(--accent); stroke-width: 3; }
.node.current .body { filter: url(#glow); }
.node.ctxmark .outline { stroke: #63e6be; stroke-width: 2; stroke-dasharray: 5 3; }
.node.dim { opacity: 0.15; }
.node.proxy .body { stroke-dasharray: 6 4; stroke: #888; }

.wire, .hit, .alt-outline { vector-effect: non-scaling-stroke; }
/* Stroke widths are in screen pixels (non-scaling) and are narrowed when
   zoomed out; --wire-idle and --wire-lit are set by setViewTransform(). */
.wire { fill: none; stroke-width: var(--wire-idle, 2px); opacity: 0.55; pointer-events: none; }
.wire.ctl { stroke-dasharray: 6 4; }
.wire.lit { opacity: 1; stroke-width: var(--wire-lit, 3px); stroke-dasharray: 10 6; animation: flow 0.9s linear infinite; }
.wire.dim { opacity: 0.06; }
.wire.alt { opacity: 0.35; stroke-dasharray: 3 5; }
.wire.current { stroke-width: calc(var(--wire-lit, 3px) + 2px); opacity: 1; }
.wire.cmp-both { stroke: #ffffff !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-a { stroke: #ffd43b !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-b { stroke: #4dabf7 !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
@keyframes flow { to { stroke-dashoffset: -32; } }
@media (prefers-reduced-motion: reduce) { .wire.lit { animation: none; } }

.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; pointer-events: stroke; }
.alt-outline { fill: none; stroke: var(--accent); stroke-width: 6; stroke-dasharray: 4 6; opacity: 0.35; pointer-events: none; }

.badge circle { fill: #1f1f1f; stroke: var(--accent); stroke-width: 1.5; }
.badge text { fill: var(--accent); font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.dot { fill: #fff; stroke: var(--accent); stroke-width: 3; }

#caption {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  max-width: min(760px, 90%);
  background: #262626ee;
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  pointer-events: auto;
}
#caption .ref { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }

#legend {
  position: absolute;
  left: 10px;
  bottom: 10px;
  background: #262626e6;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 12px;
}
#legend .head { cursor: pointer; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
#legend.folded .item { display: none; }
#legend.folded .head { margin-bottom: 0; }
#legend .item { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 1px 2px; border-radius: 3px; }
#legend .item:hover { background: #333; }
#legend .item.off { opacity: 0.35; }
#legend .sw { width: 22px; height: 0; border-top: 3px solid; }
#legend .sw.dashed { border-top-style: dashed; }

#minimap {
  position: absolute;
  right: 10px;
  bottom: 10px;
  background: #1a1a1ae6;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  cursor: crosshair;
}

/* ---------- details panel ---------- */
#details h3 { font-size: 16px; margin: 0 0 4px; }
#details .sub { color: var(--muted); margin-bottom: 8px; }
#details section { margin: 12px 0; }
#details ul { margin: 4px 0; padding-left: 0; list-style: none; }
#details li { margin: 3px 0; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid #0006; }
.ref-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.ref-row .sym { font-family: var(--mono); font-size: 12px; }
.ref-row a { font-family: var(--mono); font-size: 11px; }
.ref-row .copy { font-size: 10px; padding: 0 5px; }
.ref-code { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: pre-wrap; word-break: break-all; margin: 0 0 4px 0; }
.io-row { cursor: pointer; padding: 3px 4px; border-radius: 4px; }
.io-row:hover { background: #313131; }
.io-row .other { font-weight: 600; }
.io-row .lbl { color: var(--muted); display: block; font-size: 12px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 11px; }
.tbl td, .tbl th { border-bottom: 1px solid #333; padding: 3px 4px; vertical-align: top; text-align: left; }
.tbl .on { color: var(--accent); }

.transport { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.transport input[type="range"] { width: 90px; padding: 0; }
.alt-select { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 8px; }
.alt-select select { width: 100%; }
.steps { max-height: 46vh; overflow-y: auto; border: 1px solid #333; border-radius: 6px; }
.step { padding: 3px 6px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #2d2d2d; }
.step:hover { background: #303030; }
.step.cur { background: #4a4122; }
.step.skip { opacity: 0.45; padding-left: 20px; }
.step .alt-head { display: block; font-size: 10px; color: var(--accent); }
.step .n { font-family: var(--mono); color: var(--accent); margin-right: 4px; }
.step .side { font-size: 10px; color: #63e6be; margin-left: 4px; }
.step .note { display: block; color: var(--muted); font-style: italic; }

/* ---------- suite navigation ---------- */
#suite-nav { display: inline-flex; align-items: center; gap: 8px; }
#suite-nav select { max-width: 230px; }
#index-link { font-size: 12px; }
.segmented { display: inline-flex; }
.segmented button { border-radius: 0; }
.segmented button:first-child { border-radius: 5px 0 0 5px; }
.segmented button:last-child { border-radius: 0 5px 5px 0; border-left: none; }
.also-link { display: block; }

/* ---------- timeline view ---------- */
#timeline-view {
  position: absolute;
  inset: 0;
  background: var(--canvas);
  overflow: auto;
  padding: 14px 18px 40px;
}
#tl-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
#tl-title { font-size: 16px; font-weight: 650; }
#tl-strip { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.tl-chip {
  border: 1px solid #444;
  background: #2a2a2a;
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 12px;
  cursor: pointer;
  max-width: 240px;
  text-align: left;
}
.tl-chip .txg { font-family: var(--mono); color: var(--accent); margin-right: 5px; }
.tl-chip.cur { border-color: var(--accent); background: #4a4122; }
#tl-caption {
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: #262626;
  padding: 8px 12px;
  margin-bottom: 14px;
}
#tl-caption .cap { font-weight: 600; }
#tl-caption .note { color: var(--muted); display: block; margin-top: 2px; }
#tl-caption .links { margin-top: 4px; font-size: 12px; }
#tl-caption .links a { margin-right: 10px; }
.tl-row { display: grid; grid-template-columns: 200px 1fr; gap: 10px; margin-bottom: 8px; align-items: start; }
.tl-label {
  background: #2b2b2b;
  border: 1px solid #3a3a3a;
  border-radius: 6px;
  padding: 5px 8px;
  cursor: pointer;
}
.tl-label:hover { border-color: #666; }
.tl-label .name { font-family: var(--mono); font-weight: 650; }
.tl-label .kind { color: var(--muted); font-size: 11px; display: block; }
.tl-lanes { display: flex; flex-direction: column; gap: 4px; }
.tl-lane { display: flex; flex-wrap: wrap; gap: 5px; min-height: 40px; align-items: center; padding: 3px 4px; border-radius: 6px; background: #ffffff06; }
.tl-lane.dead { min-height: 30px; background: #8ce99a14; border-left: 3px solid #8CE99A; }
.tl-lane .lane-tag { font-size: 10px; color: var(--muted); margin-right: 4px; }
.tl-tile {
  width: 52px;
  height: 34px;
  border-radius: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 12px;
  color: #111;
  border: 2px solid transparent;
  cursor: default;
  position: relative;
}
.tl-tile .birth { font-size: 9px; opacity: 0.8; }
.tl-tile.small { height: 26px; }
.tl-tile.new { border-color: var(--accent); box-shadow: 0 0 6px var(--accent); }
.tl-tile.changed { border-color: #63e6be; }
.tl-tile.freed { opacity: 0.35; text-decoration: line-through; }
.tl-tile.deferred { border: 2px dashed #ddd; }
.tl-tile.async { border: 2px dotted #ddd; }
.tl-arrow { color: var(--muted); font-size: 11px; display: block; }
#tl-legend { margin-top: 18px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
#tl-legend .tl-tile { width: 38px; height: 22px; font-size: 10px; }
.tl-summary { color: var(--muted); }

/* ---------- tooltip and about ---------- */
#tooltip {
  position: fixed;
  z-index: 50;
  max-width: 520px;
  background: #111;
  border: 1px solid #555;
  border-radius: 6px;
  padding: 6px 9px;
  font-size: 12px;
  pointer-events: none;
  box-shadow: 0 4px 16px #000a;
}
#tooltip .t-ref { font-family: var(--mono); font-size: 11px; margin-top: 4px; }
#tooltip .t-ref .loc { color: #74c0fc; }
#tooltip .t-ref .code { color: #bbb; display: block; white-space: pre; overflow: hidden; text-overflow: ellipsis; }

#about {
  position: fixed;
  inset: 0;
  background: #000a;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.about-box {
  position: relative;
  background: var(--panel);
  border: 1px solid #444;
  border-radius: 10px;
  max-width: 820px;
  max-height: 100%;
  overflow-y: auto;
  padding: 18px 24px;
}
.about-box .close { position: absolute; right: 10px; top: 10px; }
.about-box h2 { font-size: 17px; margin: 4px 0 8px; }
.about-box h3 { font-size: 13px; margin: 16px 0 6px; color: var(--accent); }
.about-box li { margin: 4px 0; }

</style>
</head>
<body>
<header id="topbar">
  <button id="toggle-left" class="icon" title="Show or hide the path panel">&#9776;</button>
  <h1>ZFS Dataset Creation</h1>
  <a id="commit-link" target="_blank" rel="noopener"></a>
  <span id="suite-nav" hidden>
    <select id="graph-menu" title="Open another diagram of the suite"></select>
    <a id="index-link" href="index.html" title="All diagrams">All</a>
  </span>
  <span id="view-switch" class="segmented" hidden>
    <button id="btn-view-graph" class="active" title="Node graph">Graph</button><button id="btn-view-timeline" title="Timeline scenarios">Timeline</button>
  </span>
  <span class="spacer"></span>
  <button id="btn-fit" title="Fit everything (F)">Fit</button>
  <button id="btn-reset" title="Restore the default layout">Reset layout</button>
  <button id="btn-export" title="Export layout: save node positions to a JSON file">Export</button>
  <label class="button" title="Import layout: load node positions from a JSON file">Import<input id="file-import" type="file" accept="application/json,.json" hidden></label>
  <button id="btn-about">About</button>
  <button id="toggle-right" class="icon" title="Show or hide the details panel">&#9776;</button>
</header>

<main id="layout">
  <aside id="left">
    <div class="panel-section">
      <input id="search" type="search" placeholder="Search nodes, functions, files, tunables, wires  ( / )" autocomplete="off">
      <ul id="search-results" class="results"></ul>
    </div>
    <div class="panel-section">
      <h2>Paths</h2>
      <div id="path-list"></div>
    </div>
    <div class="panel-section" id="timeline-section" hidden>
      <h2>Timelines</h2>
      <div id="timeline-list"></div>
    </div>
    <div class="panel-section">
      <h2>Filters</h2>
      <label class="row">Context
        <select id="ctx-filter"><option value="">(none)</option></select>
      </label>
      <div id="group-filters"></div>
    </div>
  </aside>

  <section id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="12" cy="12" r="1.3" fill="#2c2c2c"></circle>
        </pattern>
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"></feDropShadow>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="160%">
          <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffd43b" flood-opacity="0.9"></feDropShadow>
        </filter>
      </defs>
      <rect id="grid-rect" x="0" y="0" width="100%" height="100%" fill="url(#grid)"></rect>
      <g id="root">
        <g id="layer-groups"></g>
        <g id="layer-wires"></g>
        <g id="layer-hits"></g>
        <g id="layer-nodes"></g>
        <g id="layer-badges"></g>
        <g id="layer-dot"></g>
      </g>
    </svg>
    <div id="caption" hidden></div>
    <div id="legend"></div>
    <canvas id="minimap" width="220" height="150"></canvas>
    <div id="timeline-view" hidden>
      <div id="tl-head">
        <div id="tl-title"></div>
        <div class="transport" id="tl-transport">
          <button id="tl-first" title="First step (Home)">|◀</button>
          <button id="tl-prev" title="Previous step (Left)">◀</button>
          <button id="tl-play" title="Play or pause (Space)">Play</button>
          <button id="tl-next" title="Next step (Right)">▶</button>
          <button id="tl-last" title="Last step (End)">▶|</button>
        </div>
      </div>
      <div id="tl-strip"></div>
      <div id="tl-caption"></div>
      <div id="tl-panel"></div>
      <div id="tl-legend"></div>
    </div>
  </section>

  <aside id="right">
    <div id="details"><p class="muted">Select a node, a wire or a path.</p></div>
  </aside>
</main>

<div id="tooltip" hidden></div>
<div id="about" hidden>
  <div class="about-box">
    <button id="about-close" class="icon close" title="Close">&#10005;</button>
    <div id="about-body"></div>
  </div>
</div>

te_fix_auto_resv","ref":{"file":"lib/libzfs/libzfs_dataset.c","line":1530,"symbol":"zfs_create_fix_auto_resv","code":"zfs_create_fix_auto_resv(zpool_handle_t *zph, nvlist_t *nvl)"}}],"role":"Volume sizing done in userspace. volblocksize defaults to 16K, or to the largest power of 2 that fits in the pool's minimum allocation size when that is 32K or more (wide dRAID stripes, large sectors); a smaller `-b` only prints a warning. volsize is rounded up to a multiple of volblocksize. Unless `-s` or an explicit value, `zfs create` adds refreservation (reservation on pools older than version 9) of zvol_volsize_to_reservation(): volsize, scaled up when the least space-efficient raidz or dRAID top-level vdev stores the volume's blocks less efficiently than 128K blocks, times copies, plus room for the meta-dnode and every indirect block. refreservation=auto computes the same value.","tunables":[],"props":[{"name":"volsize","ref":{"file":"module/zcommon/zfs_prop.c","line":695,"symbol":"\"volsize\"","code":"zprop_register_number(ZFS_PROP_VOLSIZE, \"volsize\", 0, PROP_DEFAULT,"}},{"name":"volblocksize","ref":{"file":"module/zcommon/zfs_prop.c","line":640,"symbol":"\"volblocksize\"","code":"zprop_register_number(ZFS_PROP_VOLBLOCKSIZE, \"volblocksize\","}},{"name":"refreservation","ref":{"file":"module/zcommon/zfs_prop.c","line":701,"symbol":"\"refreservation\"","code":"zprop_register_number(ZFS_PROP_REFRESERVATION, \"refreservation\", 0,"}}]},{"id":"mount_lib","group":"user","sub":0,"title":"libzfs mount / unmount","ctx":"user","src":"lib/libzfs/libzfs_mount.c","fns":[{"name":"zfs_mount","ref":{"file":"lib/libzfs/libzfs_mount.c","line":375,"symbol":"zfs_mount","code":"zfs_mount(zfs_handle_t *zhp, const char *options, int flags)"}},{"name":"zfs_mount_at","ref":{"file":"lib/libzfs/libzfs_mount.c","line":390,"symbol":"zfs_mount_at","code":"zfs_mount_at(zfs_handle_t *zhp, const char *options, int flags,"}},{"name":"zfs_is_mountable","ref":{"file":"lib/libzfs/libzfs_mount.c","line":27 ue","ref":{"file":"lib/libzfs/libzfs_util.c","line":1819,"symbol":"zprop_parse_value","code":"zprop_parse_value(libzfs_handle_t *hdl, nvpair_t *elem, int prop,"}}],"role":"Turns the strings from the command line into a typed nvlist and rejects what the kernel would reject. Each name must be a known property that applies to this dataset type, a user property (a name with a colon) or a userquota@ style name. Read-only properties are refused, except set-once ones on a new dataset (normalization, utf8only, casesensitivity, volblocksize) and encryption key parameters. Values are parsed (sizes such as 10G, on and off, names such as lz4). recordsize and volblocksize must be a power of 2 from 512 bytes to the pool's maxblocksize; mountpoint must be an absolute path, none or legacy; sharenfs and sharesmb options are checked; normalization without utf8only adds utf8only=on, and normalization with utf8only=off is an error.","tunables":[],"props":[{"name":"recordsize","ref":{"file":"module/zcommon/zfs_prop.c","line":734,"symbol":"\"recordsize\"","code":"zprop_register_number(ZFS_PROP_RECORDSIZE, \"recordsize\","}},{"name":"volblocksize","ref":{"file":"module/zcommon/zfs_prop.c","line":640,"symbol":"\"volblocksize\"","code":"zprop_register_number(ZFS_PROP_VOLBLOCKSIZE, \"volblocksize\","}},{"name":"mountpoint","ref":{"file":"module/zcommon/zfs_prop.c","line":582,"symbol":"\"mountpoint\"","code":"zprop_register_string(ZFS_PROP_MOUNTPOINT, \"mountpoint\", \"/\","}},{"name":"normalization","ref":{"file":"module/zcommon/zfs_prop.c","line":552,"symbol":"\"normalization\"","code":"zprop_register_index(ZFS_PROP_NORMALIZE, \"normalization\", 0,"}},{"name":"utf8only","ref":{"file":"module/zcommon/zfs_prop.c","line":572,"symbol":"\"utf8only\"","code":"zprop_register_index(ZFS_PROP_UTF8ONLY, \"utf8only\", 0, PROP_ONETIME,"}},{"name":"sharenfs","ref":{"file":"module/zcommon/zfs_prop.c","line":585,"symbol":"\"sharenfs\"","code":"zprop_register_string(ZFS_PROP_SHARENFS, \"sharenfs\", \"off\","}}]},{"id":"lzc","group":"user","sub":1,"title":"libzfs_core","ctx":"user","src":"lib/libzfs_core/libzfs_core.c","fns":[{"name":"lzc_create","ref":{"file":"lib/libzfs_core/libzfs_core.c","line":296,"symbol":"lzc_create","code":"lzc_create(const char *fsname, enum lzc_dataset_type type, nvlist_t *props,"}},{"name":"lzc_clone","ref":{"file":"lib/libzfs_core/libzfs_core.c","line":321,"symbol":"lzc_clone","code":"lzc_clone(const char *fsname, const char *origin, nvlist_t *props)"}},{"name":"lzc_ioctl","ref":{"file":"lib/libzfs_core/libzfs_core.c","line":212,"symbol":"lzc_ioctl","code":"lzc_ioctl(zfs_ioc_t ioc, const char *name,"}}],"role":"The thin ioctl layer. lzc_create() packs {type, props} and, for a new encryption root, the wrapping key in hidden_args; lzc_clone() packs {origin, props}; lzc_ioctl() sends the request to /dev/zfs.","tunables":[],"props":[]},{"id":"ioc_keys","group":"kentry","sub":0,"title":"Create and key ioctls","ctx":"syscall","src":"module/zfs/zfs_ioctl.c","fns":[{"name":"zfs_ioc_create","ref":{"file":"module/zfs/zfs_ioctl.c","line":3973,"symbol":"zfs_ioc_create","code":"zfs_ioc_create(const char *fsname, nvlist_t *innvl, nvlist_t *outnvl)"}},{"name":"zfs_ioc_clone","ref":{"file":"module/zfs/zfs_ioctl.c","line":4113,"symbol":"zfs_ioc_clone","code":"zfs_ioc_clone(const char *fsname, nvlist_t *innvl, nvlist_t *outnvl)"}},{"name":"zfsdev_ioctl_common","ref":{"file":"module/zfs/zfs_ioctl.c","line":8595,"symbol":"zfsdev_ioctl_common","code":"zfsdev_ioctl_common(uint_t vecnum, zfs_cmd_t *zc, int flag)"}},{"name":"zfs_secpolicy_create_clone","ref":{"file":"module/zfs/zfs_ioctl.c","line":1231,"symbol":"zfs_secpolicy_create_clone","code":"zfs_secpolicy_create_clone(zfs_cmd_t *zc, nvlist_t *innvl, cred_t *cr)"}}],"role":"Kernel entry for ZFS_IOC_CREATE and ZFS_IOC_CLONE (the encryption graph shows the same handlers carrying wrapping keys). zfsdev_ioctl_common() checks the nvlist keys and the permission policy: create and mount permission on the parent, plus clone permission on the origin for a clone. zfs_ioc_create() refuses names with @ or %, fills the ZPL create-time properties or checks the volume size, builds the crypto parameters, runs dmu_objset_create(), and only then sets the remaining properties; a property failure destroys the new dataset again. A successful call is logged to the pool history.","tunables":[],"props":[]},{"id":"zpl_props","group":"kentry","sub":0,"title":"ZPL create-time properties","ctx":"syscall","src":"module/zfs/zfs_ioctl.c","fns":[{"name":"zfs_fill_zplprops","ref":{"file":"module/zfs/zfs_ioctl.c","line":3902,"symbol":"zfs_fill_zplprops","code":"zfs_fill_zplprops(const char *dataset, nvlist_t *createprops,"}},{"name":"zfs_fill_zplprops_impl","ref":{"file":"module/zfs/zfs_ioctl.c","line":3749,"symbol":"zfs_fill_zplprops_impl","code":"zfs_fill_zplprops_impl(objset_t *os, uint64_t zplver,"}},{"name":"zfs_get_zplprop","ref":{"file":"module/zfs/zfs_znode.c","line":352,"symbol":"zfs_get_zplprop","code":"zfs_get_zplprop(objset_t *os, zfs_prop_t prop, uint64_t *value)"}},{"name":"zfs_zpl_version_map","ref":{"file":"module/zcommon/zfs_comutil.c","line":152,"symbol":"zfs_zpl_version_map","code":"zfs_zpl_version_map(int spa_version)"}}],"role":"File systems only. These are not DSL properties: zfs_fill_zplprops() takes version, normalization, utf8only, casesensitivity and the default user, group and project quotas out of the property list and puts them in zplprops for the new master node. Values not given are copied now from the parent's master node (or the default), so they are inherited once, at create time. A ZPL version above what the pool version allows, or one of these properties on a pre-normalization version, is refused with ENOTSUP. normalization forces utf8only on. casesensitivity=insensitive marks the dataset DS_FLAG_CI_DATASET.","tunables":[],"props":[{"name":"normalization","ref":{"file":"module/zcommon/zfs_prop.c","line":552,"symbol":"\"normalization\"","code":"zprop_register_index(ZFS_PROP_NORMALIZE, \"normalization\", 0,"}},{"name":"utf8only","ref":{"file":"module/zcommon/zfs_prop.c","line":572,"symbol":"\"utf8only\"","code":"zprop_register_index(ZFS_PROP_UTF8ONLY, \"utf8only\", 0, PROP_ONETIME,"}},{"name":"casesensitivity","ref":{"file":"module/zcommon/zfs_prop.c","line":556,"symbol":"\"casesensitivity\"","code":"zprop_register_index(ZFS_PROP_CASE, \"casesensitivity\","}},{"name":"version","ref":{"file":"module/zcommon/zfs_prop.c","line":532,"symbol":"\"version\"","code":"zprop_register_index(ZFS_PROP_VERSION, \"version\", 0, PROP_DEFAULT,"}}]},{"id":"zvol_checks","group":"kentry","sub":0,"title":"Volume checks","ctx":"syscall","src":"module/zfs/zvol.c","fns":[{"name":"zvol_check_volblocksize","ref":{"file":"module/zfs/zvol.c","line":481,"symbol":"zvol_check_volblocksize","code":"zvol_check_volblocksize(const char *name, uint64_t volblocksize)"}},{"name":"zvol_check_volsize","ref":{"file":"module/zfs/zvol.c","line":282,"symbol":"zvol_check_volsize","code":"zvol_check_volsize(uint64_t volsize, uint64_t blocksize)"}}],"role":"Kernel checks for a new volume, before anything is created: volsize must be in the property list; volblocksize (default 16K) must be a power of 2 from 512 bytes to 16M, and above 128K needs the large_blocks feature and must not exceed zfs_max_recordsize; volsize must be a nonzero multiple of volblocksize.","tunables":[{"name":"zfs_max_recordsize","ref":{"file":"module/zfs/dsl_dataset.c","line":5329,"symbol":"max_recordsize","code":"ZFS_MODULE_PARAM(zfs, zfs_, max_recordsize, UINT, ZMOD_RW,"}}],"props":[{"name":"volblocksize","ref":{"file":"module/zcommon/zfs_prop.c","line":640,"symbol":"\"volblocksize\"","code":"zprop_register_number(ZFS_PROP_VOLBLOCKSIZE, \"volblocksize\","}},{"name":"volsize","ref":{"file":"module/zcommon/zfs_prop.c","line":695,"symbol":"\"volsize\"","code":"zprop_register_number(ZFS_PROP_VOLSIZE, \"volsize\", 0, PROP_DEFAULT,"}}]},{"id":"dcp","group":"kentry","sub":0,"title":"dsl_crypto_params","ctx":"sy ller waits until that txg has synced. In syncing context dsl_sync_task_sync() checks pool space, re-runs the check with the pool config lock held as writer, and then calls the sync function. The create and each later property change are separate sync tasks, each with its own txg wait.","tunables":[],"props":[]},{"id":"dmu_tx","group":"kentry","sub":1,"title":"dmu_tx (transaction)","ctx":"open","src":"module/zfs/dmu_tx.c","fns":[{"name":"dmu_tx_create_dd","ref":{"file":"module/zfs/dmu_tx.c","line":58,"symbol":"dmu_tx_create_dd","code":"dmu_tx_create_dd(dsl_dir_t *dd)"}},{"name":"dmu_tx_assign","ref":{"file":"module/zfs/dmu_tx.c","line":1239,"symbol":"dmu_tx_assign","code":"dmu_tx_assign(dmu_tx_t *tx, dmu_tx_flag_t flags)"}},{"name":"dmu_tx_commit","ref":{"file":"module/zfs/dmu_tx.c","line":1454,"symbol":"dmu_tx_commit","code":"dmu_tx_commit(dmu_tx_t *tx)"}}],"role":"Shared with the I/O flow graph. Here a transaction on the MOS directory only pins the sync task to the currently open txg.","tunables":[],"props":[]},{"id":"txg_sync","group":"txg","sub":0,"title":"TXG: syncing (txg_sync_thread)","ctx":"thr","src":"module/zfs/txg.c","fns":[{"name":"txg_sync_thread","ref":{"file":"module/zfs/txg.c","line":510,"symbol":"txg_sync_thread","code":"txg_sync_thread(void *arg)"}},{"name":"txg_wait_synced","ref":{"file":"module/zfs/txg.c","line":764,"symbol":"txg_wait_synced","code":"txg_wait_synced(dsl_pool_t *dp, uint64_t txg)"}}],"role":"Shared with the I/O flow graph. Syncs the txg the create task joined. txg_wait_synced() is why `zfs create` returns only when the new dataset is on disk.","tunables":[],"props":[]},{"id":"spa_sync","group":"txg","sub":0,"title":"spa_sync()","ctx":"sync","src":"module/zfs/spa.c","fns":[{"name":"spa_sync","ref":{"file":"module/zfs/spa.c","line":11405,"symbol":"spa_sync","code":"spa_sync(spa_t *spa, uint64_t txg)"}},{"name":"spa_sync_iterate_to_convergence","ref":{"file":"module/zfs/spa.c","line":11192,"symbol":"spa_sync_iterate_to_convergence","c ode and root directory","ctx":"sync","src":"module/os/linux/zfs/zfs_znode_os.c","fns":[{"name":"zfs_create_cb","ref":{"file":"module/zfs/zfs_ioctl.c","line":3719,"symbol":"zfs_create_cb","code":"zfs_create_cb(objset_t *os, void *arg, cred_t *cr, dmu_tx_t *tx)"}},{"name":"zfs_create_fs","ref":{"file":"module/os/linux/zfs/zfs_znode_os.c","line":1970,"symbol":"zfs_create_fs","code":"zfs_create_fs(objset_t *os, cred_t *cr, nvlist_t *zplprops, dmu_tx_t *tx)"}}],"role":"What makes an object set a file system. zfs_create_fs() claims object 1 as the master node ZAP and stores the zplprops in it (normalization, utf8only, casesensitivity, default quotas) and the ZPL version (the requested one if lower than the pool allows). With ZPL version 5 (system attributes) it creates the SA attribute registry; it always creates the unlinked set (files removed while still open) and, with zfs_mknode(), the root directory: mode 0755, owned by the uid and gid of the creating process. Their object numbers go into the master node. dsl_pool_create() runs zfs_create_fs() for the pool's root file system too.","tunables":[],"props":[]},{"id":"zvol_init","group":"objset","sub":0,"title":"zvol_create_cb()","ctx":"sync","src":"module/zfs/zvol.c","fns":[{"name":"zvol_create_cb","ref":{"file":"module/zfs/zvol.c","line":217,"symbol":"zvol_create_cb","code":"zvol_create_cb(objset_t *os, void *arg, cred_t *cr, dmu_tx_t *tx)"}}],"role":"What makes an object set a volume: object 1 (DMU_OT_ZVOL) holds the data, with volblocksize as its block size, and object 2 is a ZAP whose \"size\" entry is volsize. Both values are removed from the property list here, so they are never stored as DSL properties; `zfs get` reads them back from these objects. No data block is written: the volume is all holes until written.","tunables":[],"props":[{"name":"volsize","ref":{"file":"module/zcommon/zfs_prop.c","line":695,"symbol":"\"volsize\"","code":"zprop_register_number(ZFS_PROP_VOLSIZE, \"volsize\", 0, PROP_DEFAULT,"}},{"name  zprop_source_t source, nvlist_t *props)"}},{"name":"dsl_props_set_check","ref":{"file":"module/zfs/dsl_prop.c","line":934,"symbol":"dsl_props_set_check","code":"dsl_props_set_check(void *arg, dmu_tx_t *tx)"}},{"name":"dsl_props_set_sync","ref":{"file":"module/zfs/dsl_prop.c","line":1012,"symbol":"dsl_props_set_sync","code":"dsl_props_set_sync(void *arg, dmu_tx_t *tx)"}},{"name":"dsl_prop_set_sync_impl","ref":{"file":"module/zfs/dsl_prop.c","line":713,"symbol":"dsl_prop_set_sync_impl","code":"dsl_prop_set_sync_impl(dsl_dataset_t *ds, const char *propname,"}}],"role":"Sets a batch of ordinary properties all-or-nothing, as one sync task (space for 2 blocks per property, reserved-space check). Check: name and string value lengths. Sync: for a local value dsl_prop_set_sync_impl() writes propname into the props ZAP and removes any propname$inherit entry; integer properties are pushed to the callbacks of open datasets that inherit them; each change is recorded in the pool history.","tunables":[],"props":[]},{"id":"quota","group":"props","sub":0,"title":"quota / reservation (dsl_dir)","ctx":"sync","src":"module/zfs/dsl_dir.c","fns":[{"name":"dsl_dir_set_quota","ref":{"file":"module/zfs/dsl_dir.c","line":1794,"symbol":"dsl_dir_set_quota","code":"dsl_dir_set_quota(const char *ddname, zprop_source_t source, uint64_t quota)"}},{"name":"dsl_dir_set_quota_check","ref":{"file":"module/zfs/dsl_dir.c","line":1719,"symbol":"dsl_dir_set_quota_check","code":"dsl_dir_set_quota_check(void *arg, dmu_tx_t *tx)"}},{"name":"dsl_dir_set_quota_sync","ref":{"file":"module/zfs/dsl_dir.c","line":1764,"symbol":"dsl_dir_set_quota_sync","code":"dsl_dir_set_quota_sync(void *arg, dmu_tx_t *tx)"}},{"name":"dsl_dir_set_reservation","ref":{"file":"module/zfs/dsl_dir.c","line":1916,"symbol":"dsl_dir_set_reservation","code":"dsl_dir_set_reservation(const char *ddname, zprop_source_t source,"}},{"name":"dsl_dir_set_reservation_check","ref":{"file":"module/zfs/dsl_dir.c","line":1808,"symbol":"dsl_dir_set_reservation_check","code":"dsl_dir_set_reservation_check(void *arg, dmu_tx_t *tx)"}},{"name":"dsl_dir_set_reservation_sync_impl","ref":{"file":"module/zfs/dsl_dir.c","line":1866,"symbol":"dsl_dir_set_reservation_sync_impl","code":"dsl_dir_set_reservation_sync_impl(dsl_dir_t *dd, uint64_t value, dmu_tx_t *tx)"}}],"role":"Space limits of a DSL directory: they cover the dataset, its snapshots and all its descendants. Each is its own sync task with the extra-reserved space check. quota: a new quota below the reservation or below the space already used plus pending writes fails with ENOSPC. reservation: checked only in syncing context; its growth must fit in what the parent can still provide and stay within the quota (ENOSPC). The value goes to the props ZAP and to dd_quota or dd_reserved. The part of a reservation above the space used is charged to the parent as reserved child space (part of usedbychildren), and from there up the tree, so siblings see less available space.","tunables":[],"props":[{"name":"quota","ref":{"file":"module/zcommon/zfs_prop.c","line":690,"symbol":"\"quota\"","code":"zprop_register_number(ZFS_PROP_QUOTA, \"quota\", 0, PROP_DEFAULT,"}},{"name":"reservation","ref":{"file":"module/zcommon/zfs_prop.c","line":692,"symbol":"\"reservation\"","code":"zprop_register_number(ZFS_PROP_RESERVATION, \"reservation\", 0,"}}]},{"id":"refquota","group":"props","sub":0,"title":"refquota / refreservation (dsl_dataset)","ctx":"sync","src":"module/zfs/dsl_dataset.c","fns":[{"name":"dsl_dataset_set_refquota","ref":{"file":"module/zfs/dsl_dataset.c","line":4715,"symbol":"dsl_dataset_set_refquota","code":"dsl_dataset_set_refquota(const char *dsname, zprop_source_t source,"}},{"name":"dsl_dataset_set_refquota_check","ref":{"file":"module/zfs/dsl_dataset.c","line":4646,"symbol":"dsl_dataset_set_refquota_check","code":"dsl_dataset_set_refquota_check(void *arg, dmu_tx_t *tx)"}},{"name":"dsl_dataset_set_refreservation","ref":{"file":"module/zfs/dsl_dataset.c","line":4831,"symbol":"dsl_dataset_set_refreservation","code":"dsl_dataset_set_refreservation(const char *dsname, zprop_source_t source,"}},{"name":"dsl_dataset_set_refreservation_check","ref":{"file":"module/zfs/dsl_dataset.c","line":4730,"symbol":"dsl_dataset_set_refreservation_check","code":"dsl_dataset_set_refreservation_check(void *arg, dmu_tx_t *tx)"}},{"name":"dsl_dataset_set_refreservation_sync_impl","ref":{"file":"module/zfs/dsl_dataset.c","line":4790,"symbol":"dsl_dataset_set_refreservation_sync_impl","code":"dsl_dataset_set_refreservation_sync_impl(dsl_dataset_t *ds,"}}],"role":"Limits of the head dataset alone, not its snapshots or descendants. refquota: refused below the bytes the dataset already references or below its refreservation (ENOSPC); cached as ds_quota. refreservation: checked in syncing context; the part not already covered by the dataset's unique bytes must fit in the space available to its directory and must not exceed refquota (ENOSPC). That part is charged at once as usedbyrefreservation (DD_USED_REFRSRV), which counts in the used of every ancestor; later writes are absorbed by it instead of growing the parents' used. For a thick volume this is how its whole size is set aside at create time.","tunables":[],"props":[{"name":"refquota","ref":{"file":"module/zcommon/zfs_prop.c","line":698,"symbol":"\"refquota\"","code":"zprop_register_number(ZFS_PROP_REFQUOTA, \"refquota\", 0, PROP_DEFAULT,"}},{"name":"refreservation","ref":{"file":"module/zcommon/zfs_prop.c","line":701,"symbol":"\"refreservation\"","code":"zprop_register_number(ZFS_PROP_REFRESERVATION, \"refreservation\", 0,"}}]},{"id":"props_zap","group":"props","sub":1,"title":"DSL props ZAP and inheritance","ctx":"any","src":"module/zfs/dsl_prop.c","fns":[{"name":"dsl_prop_get_dd","ref":{"file":"module/zfs/dsl_prop.c","line":77,"symbol":"dsl_prop_get_dd","code":"dsl_prop_get_dd(dsl_dir_t *dd, const char *propname,"}},{"name":"dsl_prop_get_ds","ref":{"file":"module/zfs/dsl_prop.c","line":182,"symbol":"dsl_prop_get_ds","code":"dsl_prop_get_ds(dsl_dataset_t *ds, const char *propname,"}},{"name":"dsl_prop_register","ref":{"file":"module/zfs/dsl_prop.c","line":301,"symbol":"dsl_prop_register","code":"dsl_prop_register(dsl_dataset_t *ds, const char *propname,"}},{"name":"dsl_prop_changed_notify","ref":{"file":"module/zfs/dsl_prop.c","line":595,"symbol":"dsl_prop_changed_notify","code":"dsl_prop_changed_notify(dsl_pool_t *dp, uint64_t ddobj,"}},{"name":"dsl_prop_get_integer","ref":{"file":"module/zfs/dsl_prop.c","line":362,"symbol":"dsl_prop_get_integer","code":"dsl_prop_get_integer(const char *ddname, const char *propname,"}}],"role":"Each DSL directory's props ZAP holds only what was set on it: propname for a local value, propname$recvd for a received one, propname$inherit for an explicit inherit over a received value. A new dataset's ZAP starts empty, so every property it did not get with `-o` is inherited. Reading a value (dsl_prop_get_dd()) looks in this directory, then in each parent up to the root, and falls back to the default; where it was found is the source `zfs get` shows. Non-inheritable properties are looked up in this directory only. dsl_prop_register() reads a value and keeps a callback; when a value is set on an ancestor, dsl_prop_changed_notify() walks the child directories, skips any subtree that sets the property itself, and calls the callbacks.","tunables":[],"props":[]},{"id":"dir_space","group":"props","sub":1,"title":"dsl_dir space accounting","ctx":"any","src":"module/zfs/dsl_dir.c","fns":[{"name":"dsl_dir_space_available","ref":{"file":"module/zfs/dsl_dir.c","line":1196,"symbol":"dsl_dir_space_available","code":"dsl_dir_space_available(dsl_dir_t *dd,"}},{"name":"dsl_dir_diduse_space","ref":{"file":"module/zfs/dsl_dir.c","line":1622,"symbol":"dsl_dir_diduse_space","code":"dsl_dir_diduse_space(dsl_dir_t *dd, dd_used_t type, int64_t used,"}},{"name":"dsl_dir_diduse_space_impl","ref":{"file":"module/zfs/dsl_dir.c","line":1567,"symbol":"dsl_dir_diduse_space_impl","code":"dsl_dir_diduse_space_impl(dsl_dir_t *dd, dd_used_t type,"}},{"name":"dsl_dataset_apply_deltas","ref":{"file":"module/zfs/dsl_dataset.c","line":2330,"symbol":"dsl_dataset_apply_deltas","code":"dsl_dataset_apply_deltas(dsl_dataset_t *ds, dmu_tx_t *tx)"}}],"role":"Each DSL directory tracks its used bytes (broken down into head, snapshots, children, refreservation and child reservations), its quota and its reservation. Changes are applied in syncing context and rolled up into every ancestor, adjusted so that space inside a reservation is not counted twice. dsl_dir_space_available() is what a check sees: the smaller of what the parent can provide (plus this directory's unused reservation) and the room left under its own quota, capped by the pool size at the root. A new dataset starts with only its first metadata blocks charged.","tunables":[],"props":[]},{"id":"zpl_mount","group":"after","sub":0,"title":"zpl mount (zfs_domount)","ctx":"syscall","src":"module/os/linux/zfs/zfs_vfsops.c","fns":[{"name":"zfs_domount","ref":{"file":"module/os/linux/zfs/zfs_vfsops.c","line":1428,"symbol":"zfs_domount","code":"zfs_domount(struct super_block *sb, const char *osname,"}},{"name":"zpl_get_tree","ref":{"file":"module/os/linux/zfs/zpl_super.c","line":839,"symbol":"zpl_get_tree","code":"zpl_get_tree(struct fs_context *fc)"}},{"name":"zfsvfs_create","ref":{"file":"module/os/linux/zfs/zfs_vfsops.c","line":642,"symbol":"zfsvfs_create","code":"zfsvfs_create(const char *osname, boolean_t readonly, zfsvfs_t **zfvp)"}},{"name":"zfsvfs_init","ref":{"file":"module/os/linux/zfs/zfs_vfsops.c","line":438,"symbol":"zfsvfs_init","code":"zfsvfs_init(zfsvfs_t *zfsvfs, objset_t *os)"}},{"name":"zfsvfs_setup","ref":{"file":"module/os/linux/zfs/zfs_vfsops.c","line":716,"symbol":"zfsvfs_setup","code":"zfsvfs_setup(zfsvfs_t *zfsvfs, boolean_t mounting)"}},{"name":"zfs_register_callbacks","ref":{"file":"module/os/linux/zfs/zfs_vfsops.c","line":264,"symbol":"zfs_register_callbacks","co
