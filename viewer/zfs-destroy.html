<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZFS Destroy Actions</title>
<style>
:root {
  --canvas: #1f1f1f;
  --panel: #262626;
  --panel-line: #333;
  --text: #dddddd;
  --muted: #9a9a9a;
  --accent: #ffd43b;
  --node-body: #353535;
  --node-border: #161616;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
  scrollbar-color: #4a4a4a #262626;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
code { font-family: var(--mono); font-size: 0.92em; background: #ffffff12; padding: 0 3px; border-radius: 3px; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--canvas);
  color: var(--text);
  font: 13px/1.4 var(--sans);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

button, .button, select, input {
  font: inherit;
  color: var(--text);
  background: #333;
  border: 1px solid #444;
  border-radius: 5px;
  padding: 3px 9px;
}
button, .button { cursor: pointer; }
button:hover, .button:hover { background: #3d3d3d; border-color: #555; }
button.active { background: #4a4122; border-color: var(--accent); color: #fff; }
button.icon { padding: 2px 7px; }
input[type="search"] { width: 100%; }
a { color: #74c0fc; text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- top bar ---------- */
#topbar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--panel-line);
}
#topbar h1 {
  font-size: 15px;
  margin: 0 6px 0 2px;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex: 0 1 auto;
}
#topbar > * { flex-shrink: 0; }
#topbar > h1 { flex-shrink: 1; }
#topbar button, #topbar .button, #topbar a { white-space: nowrap; }
#commit-link { font-family: var(--mono); font-size: 12px; color: var(--muted); }
#topbar .spacer { flex: 1; }

/* ---------- main layout ---------- */
#layout { flex: 1; display: flex; min-height: 0; }
#left, #right {
  background: var(--panel);
  overflow-y: auto;
  flex: none;
}
#left { width: 280px; border-right: 1px solid var(--panel-line); overflow-x: hidden; }
#right { width: 360px; border-left: 1px solid var(--panel-line); padding: 10px 12px 40px; }
body.hide-left #left, body.hide-right #right { display: none; }

.panel-section { padding: 10px 12px; border-bottom: 1px solid var(--panel-line); }
.panel-section h2, #right h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 0 0 6px;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; }

/* search */
.results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 240px; overflow-y: auto; }
.results li { padding: 3px 6px; border-radius: 4px; cursor: pointer; }
.results li:hover, .results li.first { background: #333; }
.results .kind { color: var(--muted); font-size: 11px; margin-right: 6px; }

/* path list */
.path-cat { margin: 8px 0 2px; font-size: 11px; color: var(--muted); }
.path-item {
  display: block;
  width: 100%;
  white-space: normal;
  text-align: left;
  border: 1px solid transparent;
  background: none;
  padding: 3px 6px;
  border-radius: 4px;
}
.path-item:hover { background: #313131; border-color: transparent; }
.path-item.active { background: #4a4122; border-color: var(--accent); }
.path-item .pid { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; }

/* group filters */
.gfilter { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.gfilter .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.gfilter .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gfilter select { padding: 1px 4px; font-size: 12px; }

/* ---------- canvas ---------- */
#canvas-wrap { flex: 1; position: relative; min-width: 0; overflow: hidden; }
#canvas { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
#canvas.panning { cursor: grabbing; }

.group-frame { stroke-width: 1; }
.group-title { font-size: 18px; font-weight: 700; cursor: move; }
.group-summary { font-size: 11px; fill: var(--muted); pointer-events: none; }

.node { cursor: pointer; }
.node .body { fill: var(--node-body); stroke: var(--node-border); stroke-width: 1; }
.node:hover .body { stroke: #6a6a6a; }
.node .title-text { fill: #eeeeee; font-size: 13px; font-weight: 600; pointer-events: none; }
.node .pill { fill: #00000055; stroke: #ffffff30; }
.node .pill-text { fill: #ddd; font-size: 10px; font-family: var(--mono); }
.node .sock-label { fill: #bdbdbd; font-size: 10px; font-variant: small-caps; letter-spacing: 0.04em; pointer-events: none; }
.node .foot { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
.node .foot.link { cursor: pointer; }
.node .foot.link:hover { fill: #cfcfcf; text-decoration: underline; }
.node .outline { fill: none; stroke: none; pointer-events: none; }
.node.selected .outline { stroke: #fff; stroke-width: 2; }
.node.onpath .outline { stroke: var(--accent); stroke-width: 2; }
.node.current .outline { stroke: var(--accent); stroke-width: 3; }
.node.current .body { filter: url(#glow); }
.node.ctxmark .outline { stroke: #63e6be; stroke-width: 2; stroke-dasharray: 5 3; }
.node.dim { opacity: 0.15; }
.node.proxy .body { stroke-dasharray: 6 4; stroke: #888; }

.wire, .hit, .alt-outline { vector-effect: non-scaling-stroke; }
/* Stroke widths are in screen pixels (non-scaling) and are narrowed when
   zoomed out; --wire-idle and --wire-lit are set by setViewTransform(). */
.wire { fill: none; stroke-width: var(--wire-idle, 2px); opacity: 0.55; pointer-events: none; }
.wire.ctl { stroke-dasharray: 6 4; }
.wire.lit { opacity: 1; stroke-width: var(--wire-lit, 3px); stroke-dasharray: 10 6; animation: flow 0.9s linear infinite; }
.wire.dim { opacity: 0.06; }
.wire.alt { opacity: 0.35; stroke-dasharray: 3 5; }
.wire.current { stroke-width: calc(var(--wire-lit, 3px) + 2px); opacity: 1; }
.wire.cmp-both { stroke: #ffffff !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-a { stroke: #ffd43b !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-b { stroke: #4dabf7 !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
@keyframes flow { to { stroke-dashoffset: -32; } }
@media (prefers-reduced-motion: reduce) { .wire.lit { animation: none; } }

.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; pointer-events: stroke; }
.alt-outline { fill: none; stroke: var(--accent); stroke-width: 6; stroke-dasharray: 4 6; opacity: 0.35; pointer-events: none; }

.badge circle { fill: #1f1f1f; stroke: var(--accent); stroke-width: 1.5; }
.badge text { fill: var(--accent); font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.dot { fill: #fff; stroke: var(--accent); stroke-width: 3; }

#caption {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  max-width: min(760px, 90%);
  background: #262626ee;
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  pointer-events: auto;
}
#caption .ref { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }

#legend {
  position: absolute;
  left: 10px;
  bottom: 10px;
  background: #262626e6;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 12px;
}
#legend .head { cursor: pointer; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
#legend.folded .item { display: none; }
#legend.folded .head { margin-bottom: 0; }
#legend .item { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 1px 2px; border-radius: 3px; }
#legend .item:hover { background: #333; }
#legend .item.off { opacity: 0.35; }
#legend .sw { width: 22px; height: 0; border-top: 3px solid; }
#legend .sw.dashed { border-top-style: dashed; }

#minimap {
  position: absolute;
  right: 10px;
  bottom: 10px;
  background: #1a1a1ae6;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  cursor: crosshair;
}

/* ---------- details panel ---------- */
#details h3 { font-size: 16px; margin: 0 0 4px; }
#details .sub { color: var(--muted); margin-bottom: 8px; }
#details section { margin: 12px 0; }
#details ul { margin: 4px 0; padding-left: 0; list-style: none; }
#details li { margin: 3px 0; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid #0006; }
.ref-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.ref-row .sym { font-family: var(--mono); font-size: 12px; }
.ref-row a { font-family: var(--mono); font-size: 11px; }
.ref-row .copy { font-size: 10px; padding: 0 5px; }
.ref-code { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: pre-wrap; word-break: break-all; margin: 0 0 4px 0; }
.io-row { cursor: pointer; padding: 3px 4px; border-radius: 4px; }
.io-row:hover { background: #313131; }
.io-row .other { font-weight: 600; }
.io-row .lbl { color: var(--muted); display: block; font-size: 12px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 11px; }
.tbl td, .tbl th { border-bottom: 1px solid #333; padding: 3px 4px; vertical-align: top; text-align: left; }
.tbl .on { color: var(--accent); }

.transport { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.transport input[type="range"] { width: 90px; padding: 0; }
.alt-select { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 8px; }
.alt-select select { width: 100%; }
.steps { max-height: 46vh; overflow-y: auto; border: 1px solid #333; border-radius: 6px; }
.step { padding: 3px 6px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #2d2d2d; }
.step:hover { background: #303030; }
.step.cur { background: #4a4122; }
.step.skip { opacity: 0.45; padding-left: 20px; }
.step .alt-head { display: block; font-size: 10px; color: var(--accent); }
.step .n { font-family: var(--mono); color: var(--accent); margin-right: 4px; }
.step .side { font-size: 10px; color: #63e6be; margin-left: 4px; }
.step .note { display: block; color: var(--muted); font-style: italic; }

/* ---------- suite navigation ---------- */
#suite-nav { display: inline-flex; align-items: center; gap: 8px; }
#suite-nav select { max-width: 230px; }
#index-link { font-size: 12px; }
.segmented { display: inline-flex; }
.segmented button { border-radius: 0; }
.segmented button:first-child { border-radius: 5px 0 0 5px; }
.segmented button:last-child { border-radius: 0 5px 5px 0; border-left: none; }
.also-link { display: block; }

/* ---------- timeline view ---------- */
#timeline-view {
  position: absolute;
  inset: 0;
  background: var(--canvas);
  overflow: auto;
  padding: 14px 18px 40px;
}
#tl-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
#tl-title { font-size: 16px; font-weight: 650; }
#tl-strip { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.tl-chip {
  border: 1px solid #444;
  background: #2a2a2a;
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 12px;
  cursor: pointer;
  max-width: 240px;
  text-align: left;
}
.tl-chip .txg { font-family: var(--mono); color: var(--accent); margin-right: 5px; }
.tl-chip.cur { border-color: var(--accent); background: #4a4122; }
#tl-caption {
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: #262626;
  padding: 8px 12px;
  margin-bottom: 14px;
}
#tl-caption .cap { font-weight: 600; }
#tl-caption .note { color: var(--muted); display: block; margin-top: 2px; }
#tl-caption .links { margin-top: 4px; font-size: 12px; }
#tl-caption .links a { margin-right: 10px; }
.tl-row { display: grid; grid-template-columns: 200px 1fr; gap: 10px; margin-bottom: 8px; align-items: start; }
.tl-label {
  background: #2b2b2b;
  border: 1px solid #3a3a3a;
  border-radius: 6px;
  padding: 5px 8px;
  cursor: pointer;
}
.tl-label:hover { border-color: #666; }
.tl-label .name { font-family: var(--mono); font-weight: 650; }
.tl-label .kind { color: var(--muted); font-size: 11px; display: block; }
.tl-lanes { display: flex; flex-direction: column; gap: 4px; }
.tl-lane { display: flex; flex-wrap: wrap; gap: 5px; min-height: 40px; align-items: center; padding: 3px 4px; border-radius: 6px; background: #ffffff06; }
.tl-lane.dead { min-height: 30px; background: #8ce99a14; border-left: 3px solid #8CE99A; }
.tl-lane .lane-tag { font-size: 10px; color: var(--muted); margin-right: 4px; }
.tl-tile {
  width: 52px;
  height: 34px;
  border-radius: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 12px;
  color: #111;
  border: 2px solid transparent;
  cursor: default;
  position: relative;
}
.tl-tile .birth { font-size: 9px; opacity: 0.8; }
.tl-tile.small { height: 26px; }
.tl-tile.new { border-color: var(--accent); box-shadow: 0 0 6px var(--accent); }
.tl-tile.changed { border-color: #63e6be; }
.tl-tile.freed { opacity: 0.35; text-decoration: line-through; }
.tl-tile.deferred { border: 2px dashed #ddd; }
.tl-tile.async { border: 2px dotted #ddd; }
.tl-arrow { color: var(--muted); font-size: 11px; display: block; }
#tl-legend { margin-top: 18px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
#tl-legend .tl-tile { width: 38px; height: 22px; font-size: 10px; }
.tl-summary { color: var(--muted); }

/* ---------- tooltip and about ---------- */
#tooltip {
  position: fixed;
  z-index: 50;
  max-width: 520px;
  background: #111;
  border: 1px solid #555;
  border-radius: 6px;
  padding: 6px 9px;
  font-size: 12px;
  pointer-events: none;
  box-shadow: 0 4px 16px #000a;
}
#tooltip .t-ref { font-family: var(--mono); font-size: 11px; margin-top: 4px; }
#tooltip .t-ref .loc { color: #74c0fc; }
#tooltip .t-ref .code { color: #bbb; display: block; white-space: pre; overflow: hidden; text-overflow: ellipsis; }

#about {
  position: fixed;
  inset: 0;
  background: #000a;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.about-box {
  position: relative;
  background: var(--panel);
  border: 1px solid #444;
  border-radius: 10px;
  max-width: 820px;
  max-height: 100%;
  overflow-y: auto;
  padding: 18px 24px;
}
.about-box .close { position: absolute; right: 10px; top: 10px; }
.about-box h2 { font-size: 17px; margin: 4px 0 8px; }
.about-box h3 { font-size: 13px; margin: 16px 0 6px; color: var(--accent); }
.about-box li { margin: 4px 0; }

</style>
</head>
<body>
<header id="topbar">
  <button id="toggle-left" class="icon" title="Show or hide the path panel">&#9776;</button>
  <h1>ZFS Destroy Actions</h1>
  <a id="commit-link" target="_blank" rel="noopener"></a>
  <span id="suite-nav" hidden>
    <select id="graph-menu" title="Open another diagram of the suite"></select>
    <a id="index-link" href="index.html" title="All diagrams">All</a>
  </span>
  <span id="view-switch" class="segmented" hidden>
    <button id="btn-view-graph" class="active" title="Node graph">Graph</button><button id="btn-view-timeline" title="Timeline scenarios">Timeline</button>
  </span>
  <span class="spacer"></span>
  <button id="btn-fit" title="Fit everything (F)">Fit</button>
  <button id="btn-reset" title="Restore the default layout">Reset layout</button>
  <button id="btn-export" title="Export layout: save node positions to a JSON file">Export</button>
  <label class="button" title="Import layout: load node positions from a JSON file">Import<input id="file-import" type="file" accept="application/json,.json" hidden></label>
  <button id="btn-about">About</button>
  <button id="toggle-right" class="icon" title="Show or hide the details panel">&#9776;</button>
</header>

<main id="layout">
  <aside id="left">
    <div class="panel-section">
      <input id="search" type="search" placeholder="Search nodes, functions, files, tunables, wires  ( / )" autocomplete="off">
      <ul id="search-results" class="results"></ul>
    </div>
    <div class="panel-section">
      <h2>Paths</h2>
      <div id="path-list"></div>
    </div>
    <div class="panel-section" id="timeline-section" hidden>
      <h2>Timelines</h2>
      <div id="timeline-list"></div>
    </div>
    <div class="panel-section">
      <h2>Filters</h2>
      <label class="row">Context
        <select id="ctx-filter"><option value="">(none)</option></select>
      </label>
      <div id="group-filters"></div>
    </div>
  </aside>

  <section id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="12" cy="12" r="1.3" fill="#2c2c2c"></circle>
        </pattern>
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"></feDropShadow>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="160%">
          <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffd43b" flood-opacity="0.9"></feDropShadow>
        </filter>
      </defs>
      <rect id="grid-rect" x="0" y="0" width="100%" height="100%" fill="url(#grid)"></rect>
      <g id="root">
        <g id="layer-groups"></g>
        <g id="layer-wires"></g>
        <g id="layer-hits"></g>
        <g id="layer-nodes"></g>
        <g id="layer-badges"></g>
        <g id="layer-dot"></g>
      </g>
    </svg>
    <div id="caption" hidden></div>
    <div id="legend"></div>
    <canvas id="minimap" width="220" height="150"></canvas>
    <div id="timeline-view" hidden>
      <div id="tl-head">
        <div id="tl-title"></div>
        <div class="transport" id="tl-transport">
          <button id="tl-first" title="First step (Home)">|◀</button>
          <button id="tl-prev" title="Previous step (Left)">◀</button>
          <button id="tl-play" title="Play or pause (Space)">Play</button>
          <button id="tl-next" title="Next step (Right)">▶</button>
          <button id="tl-last" title="Last step (End)">▶|</button>
        </div>
      </div>
      <div id="tl-strip"></div>
      <div id="tl-caption"></div>
      <div id="tl-panel"></div>
      <div id="tl-legend"></div>
    </div>
  </section>

  <aside id="right">
    <div id="details"><p class="muted">Select a node, a wire or a path.</p></div>
  </aside>
</main>

<div id="tooltip" hidden></div>
<div id="about" hidden>
  <div class="about-box">
    <button id="about-close" class="icon close" title="Close">&#10005;</button>
    <div id="about-body"></div>
  </div>
</div>

_disown(dsl_dataset_t *ds, ds_hold_flags_t flags, const void *tag)"}},{"name":"dsl_dataset_has_owner","ref":{"file":"module/zfs/dsl_dataset.c","line":1079,"symbol":"dsl_dataset_has_owner","code":"dsl_dataset_has_owner(dsl_dataset_t *ds)"}}],"role":"A long hold keeps a dataset from being destroyed while it is in use. Owners take one (a mounted file system, an open volume, a receive), and so do other long operations such as a send. Any long hold makes a destroy fail with EBUSY; only a snapshot whose holder is a mount can be marked with -d instead.","tunables":[],"props":[]},{"id":"dsl_entry","group":"entry","sub":1,"title":"DSL request functions","ctx":"syscall","src":"module/zfs/dsl_destroy.c","fns":[{"name":"dsl_destroy_snapshots_nvl","ref":{"file":"module/zfs/dsl_destroy.c","line":611,"symbol":"dsl_destroy_snapshots_nvl","code":"dsl_destroy_snapshots_nvl(nvlist_t *snaps, boolean_t defer,"}},{"name":"dsl_destroy_snapshot","ref":{"file":"module/zfs/dsl_destroy.c","line":645,"symbol":"dsl_destroy_snapshot","code":"dsl_destroy_snapshot(const char *name, boolean_t defer)"}},{"name":"dsl_destroy_head","ref":{"file":"module/zfs/dsl_destroy.c","line":1264,"symbol":"dsl_destroy_head","code":"dsl_destroy_head(const char *name)"}}],"role":"dsl_destroy_snapshots_nvl() runs one sync task per snapshot, in list order, and stops at the first error, so a failed request can leave the earlier snapshots destroyed. dsl_destroy_head() runs one sync task for the file system or volume (two, with an open-context pre-free in between, on pools without async_destroy).","tunables":[],"props":[]},{"id":"sync_task","group":"entry","sub":1,"title":"dsl_sync_task()","ctx":"syscall","src":"module/zfs/dsl_synctask.c","fns":[{"name":"dsl_sync_task","ref":{"file":"module/zfs/dsl_synctask.c","line":126,"symbol":"dsl_sync_task","code":"dsl_sync_task(const char *pool, dsl_checkfunc_t *checkfunc,"}},{"name":"dsl_sync_task_common","ref":{"file":"module/zfs/dsl_synctask.c","line":34,"symbol":"dsl_sync_task_  snapshot is gone when the command returns. Its unique blocks are freed in the following txgs (see `zfs-snapshot-lifecycle:free_drain`); the pool property freeing shows what is left, and the space is allocatable two txgs after it is freed.","alts":[],"steps":[{"wire":"E075"},{"wire":"E001"},{"wire":"E002","note":"no clones: the snapshot goes into the list"},{"wire":"E009"},{"wire":"E010"},{"wire":"E011"},{"wire":"E012"},{"wire":"E013"},{"wire":"E014"},{"wire":"E015"},{"wire":"E016"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E021"},{"wire":"E022","note":"no long hold"},{"wire":"E023"},{"wire":"E025"},{"wire":"E026"},{"wire":"E027"},{"wire":"E028","note":"the command has already returned"},{"wire":"E029"},{"wire":"E030"},{"wire":"E031","note":"large frees continue over several txgs"}]},{"id":"destroy_batch","category":"Snapshot","title":"Snapshot range or -r: one request, one sync task per snapshot","summary":"zfs destroy -r pool/fs@a%c collects every matching snapshot of fs and its descendants into one nvlist and one ioctl. The kernel still destroys them one sync task at a time, each waiting for its txg, so the request is not atomic: if a later snapshot is refused, the earlier ones stay destroyed.","ends":"With `ok` every snapshot is gone, one txg each, and their blocks wait on the pool free list (`zfs-snapshot-lifecycle:free_drain`). With `fail` the command reports the held snapshot, and the snapshots before it in the list are destroyed.","alts":[{"id":"outcome","options":[{"id":"ok","label":"Every snapshot can be destroyed"},{"id":"fail","label":"The second snapshot has a user hold"}]}],"steps":[{"wire":"E075"},{"wire":"E001","note":"with -r the spec is applied to every descendant"},{"wire":"E002"},{"wire":"E009","note":"one nvlist with every snapshot"},{"wire":"E010"},{"wire":"E011","note":"every name is unmounted first"},{"wire":"E013"},{"wire":"E014"},{"wire":"E015","note":"snapshot 1"},{"wire":"E016"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E021"},{"wire":"E023"},{"wire":"E025"},{"wire":"E026"},{"wire":"E015","note":"snapshot 2: a new sync task, after snapshot 1's txg is on disk"},{"wire":"E016"},{"wire":"E017","when":[{"group":"outcome","options":["fail"]}],"note":"snapshot 1 is already destroyed; the rest of the list is not tried"},{"wire":"E018","when":[{"group":"outcome","options":["ok"]}]},{"wire":"E019","when":[{"group":"outcome","options":["ok"]}]},{"wire":"E020","when":[{"group":"outcome","options":["ok"]}]},{"wire":"E021","when":[{"group":"outcome","options":["ok"]}]},{"wire":"E023","when":[{"group":"outcome","options":["ok"]}]},{"wire":"E025","when":[{"group":"outcome","options":["ok"]}]},{"wire":"E026","when":[{"group":"outcome","options":["ok"]}],"note":"and so on for each further snapshot"}]},{"id":"snap_refused","category":"Snapshot","title":"Refused: a clone or a hold, and -d instead","summary":"Why a snapshot destroy is refused, and what -d does instead. A clone is caught by zfs(8) before any request is sent; a user hold is caught by the kernel's open-context check, before any txg; with -d both checks are skipped and the snapshot is only marked.","ends":"With `clone` and `hold` nothing has changed. With `defer` the snapshot stays, marked defer_destroy; it is destroyed by the last zfs release (`zfs-snapshot-lifecycle:holds_defer`) or together with its last clone (path defer_clone).","alts":[{"id":"case","options":[{"id":"clone","label":"The snapshot has a clone"},{"id":"hold","label":"The snapshot has a user hold"},{"id":"defer","label":"zfs destroy -d on a held or cloned snapshot"}]}],"steps":[{"wire":"E075"},{"wire":"E001"},{"wire":"E002","when":[{"group":"case","options":["clone","hold"]}],"note":"skipped with -d"},{"wire":"E003","when":[{"group":"case","options":["clone"]}],"note":"has dependent clones: use -R, or -d"},{"wire":"E009","when":[{"group":"case","options":["hold","defer"]}]},{"wire":"E010","when":[{"group":"case","options":["hold","defer"]}]},{"wire":"E011","when":[{"group":"case","options":["hold","defer"]}]},{"wire":"E014","when":[{"group":"case","options":["hold","defer"]}]},{"wire":"E015","when":[{"group":"case","options":["hold","defer"]}]},{"wire":"E016","when":[{"group":"case","options":["hold","defer"]}]},{"wire":"E017","when":[{"group":"case","options":["hold"]}],"note":"EBUSY: run zfs holds -r to see the tags"},{"wire":"E018","when":[{"group":"case","options":["defer"]}]},{"wire":"E019","when":[{"group":"case","options":["defer"]}]},{"wire":"E020","when":[{"group":"case","options":["defer"]}]},{"wire":"E021","when":[{"group":"case","options":["defer"]}],"note":"with -d holds and clones are not checked"},{"wire":"E023","when":[{"group":"case","options":["defer"]}]},{"wire":"E024","when":[{"group":"case","options":["defer"]}],"note":"defer_destroy=on; nothing is freed yet"}]},{"id":"dry_run","category":"Snapshot","title":"Dry run with space estimate (zfs destroy -nv)","summary":"zfs destroy -nv pool/fs@a%c lists what would be destroyed and how much space that would free, without changing anything.","ends":"Nothing has changed. The estimate is what destroying exactly these snapshots would free at this moment; blocks also held by snapshots outside the list are not counted, and a later destroy of those snapshots can free more. Without -n, -v prints the same and then destroys (path destroy_batch).","alts":[],"steps":[{"wire":"E075"},{"wire":"E001"},{"wire":"E002"},{"wire":"E004"},{"wire":"E005"},{"wire":"E006"},{"wire":"E007"},{"wire":"E008","note":"-n: stop here"}]},{"id":"destroy_filesystem","category":"Dataset","title":"Destroy a file system or a volume","summary":"zfs destroy pool/fs, for a file system or volume without children or snapshots: the dependency check, the unmount, one sync task, and the background freeing. The block-level detail is in `zfs-snapshot-lifecycle:destroy_filesystem`.","ends":"The dataset is gone after one txg (two, plus the pre-free, on old pools). With async_destroy its blocks come back over the following txgs while freeing counts down.","alts":[{"id":"type","options":[{"id":"fs","label":"File system (mounted)"},{"id":"vol","label":"Volume (not open)"}]},{"id":"method","options":[{"id":"bptree","label":"Pool with async_destroy (normal)"},{"id":"old","label":"Pool without async_destroy"}]}],"steps":[{"wire":"E075"},{"wire":"E032","note":"no children, snapshots or clones"},{"wire":"E033"},{"wire":"E034","note":"no dependents: only the target itself"},{"wire":"E036","when":[{"group":"type","options":["fs"]}]},{"wire":"E037","when":[{"group":"type","options":["fs"]}]},{"wire":"E038","when":[{"group":"type","options":["fs"]}]},{"wire":"E040"},{"wire":"E041"},{"wire":"E042"},{"wire":"E044","when":[{"group":"method","options":["old"]}]},{"wire":"E045"},{"wire":"E046"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E047"},{"wire":"E048","note":"no mount and no open volume left"},{"wire":"E050"},{"wire":"E051","when":[{"group":"method","options":["bptree"]}]},{"wire":"E053","when":[{"group":"method","options":["old"]}],"note":"the whole tree in this one txg"},{"wire":"E054","when":[{"group":"type","options":["vol"]}]},{"wire":"E058","when":[{"group":"type","options":["fs"]}]},{"wire":"E028","when":[{"group":"method","options":["bptree"]}],"note":"the command has already returned"},{"wire":"E056","when":[{"group":"method","options":["bptree"]}]},{"wire":"E030","when":[{"group":"method","options":["bptree"]}]},{"wire":"E031","when":[{"group":"method","options":["bptree"]}]}]},{"id":"fs_refused","category":"Dataset","title":"Refused: children, clones or busy","summary":"The reasons zfs destroy pool/fs stops. Children, snapshots and outside clones are found by zfs(8) before anything changes; a file system in use fails to unmount; a volume that is open (or any other long hold) is refused by the kernel check.","ends":"Nothing is destroyed. Close the files or the volume, or use -r, -R or -f as the message says.","alts":[{"id":"case","options":[{"id":"children","label":"Has child datasets or snapshots, no -r"},{"id":"clones","label":"-r, but a snapshot has a clone outside the tree"},{"id":"busy","label":"Mounted file system in use"},{"id":"held","label":"Open volume"}]}],"steps":[{"wire":"E075"},{"wire":"E032"},{"wire":"E003","when":[{"group":"case","options":["children","clones"]}],"note":"the message says use -r or use -R and lists the datasets"},{"wire":"E033","when":[{"group":"case","options":["busy","held"]}]},{"wire":"E034","when":[{"group":"case","options":["busy","held"]}]},{"wire":"E036","when":[{"group":"case","options":["busy"]}]},{"wire":"E037","when":[{"group":"case","options":["busy"]}],"note":"umount2() fails with EBUSY"},{"wire":"E039","when":[{"group":"case","options":["busy"]}],"note":"-f forces the unmount"},{"wire":"E040","when":[{"group":"case","options":["held"]}],"note":"a volume has nothing to unmount"},{"wire":"E041","when":[{"group":"case","options":["held"]}]},{"wire":"E042","when":[{"group":"case","options":["held"]}]},{"wire":"E045","when":[{"group":"case","options":["held"]}]},{"wire":"E046","when":[{"group":"case","options":["held"]}]},{"wire":"E048","when":[{"group":"case","options":["held"]}],"note":"the open volume owns the dataset"},{"wire":"E049","when":[{"group":"case","options":["held"]}],"note":"EBUSY: dataset is busy"}]},{"id":"destroy_recursive","category":"Dataset","title":"zfs destroy -R: descendants and clones, in order","summary":"zfs destroy -R pool/fs, where fs has a snapshot fs@s1 that is the origin of a clone pool/c elsewhere in the pool. zfs(8) destroys the clone first, then the batched snapshot, then fs itself. Each file system or volume is its own ioctl and its own txg.","ends":"The clone, the snapshot and the file system are gone, in three requests and at least three txgs. Their blocks are freed in the background from the livelist, the pool free list and the bptree (`zfs-snapshot-lifecycle:destroy_filesystem`). With -r instead of -R the same command is refused, because the clone is outside pool/fs (path fs_refused).","alts":[],"steps":[{"wire":"E075"},{"wire":"E033","note":"-R skips the dependency check"},{"wire":"E034","note":"first the clone pool/c, reached through fs@s1"},{"wire":"E036","note":"unmount pool/c"},{"wire":"E037"},{"wire":"E040","note":"destroy pool/c"},{"wire":"E041"},{"wire":"E042"},{"wire":"E045"},{"wire":"E046"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E047"},{"wire":"E050"},{"wire":"E052","note":"the clone's own blocks"},{"wire":"E057"},{"wire":"E034","note":"then fs@s1, which only joins the batch; then the target fs"},{"wire":"E035","note":"the batch is sent before fs is unmounted"},{"wire":"E010"},{"wire":"E014"},{"wire":"E015"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E021","note":"no clone any more"},{"wire":"E023"},{"wire":"E025"},{"wire":"E026"},{"wire":"E036","note":"unmount fs"},{"wire":"E040","note":"destroy fs"},{"wire":"E041"},{"wire":"E042"},{"wire":"E045"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E047"},{"wire":"E050"},{"wire":"E051"}]},{"id":"defer_clone","category":"Snapshot","title":"zfs destroy -d on a cloned snapshot, then destroy the clone","summary":"zfs destroy -d pool/fs@s1 while pool/c is a clone of it only marks the snapshot. Destroying the clone later takes the marked origin with it, in the same sync task.","ends":"The clone and its origin snapshot are both gone after one txg; their blocks are freed in the background (`zfs-snapshot-lifecycle:free_drain`).","alts":[],"steps":[{"wire":"E075"},{"wire":"E001","note":"zfs destroy -d pool/fs@s1"},{"wire":"E009"},{"wire":"E010"},{"wire":"E014"},{"wire":"E015"},{"wire":"E016"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E021"},{"wire":"E023"},{"wire":"E024","note":"the clone keeps it: only marked"},{"wire":"E032","note":"later: zfs destroy pool/c"},{"wire":"E036"},{"wire":"E040"},{"wire":"E041"},{"wire":"E042"},{"wire":"E043","note":"the marked origin may go too"},{"wire":"E045"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E047"},{"wire":"E050"},{"wire":"E052"},{"wire":"E055"},{"wire":"E025"},{"wire":"E026"},{"wire":"E057"}]},{"id":"zpool_destroy","category":"Pool","title":"zpool destroy, and the way back with import -D","summary":"zpool destroy pool: every file system is unmounted, the kernel marks the pool destroyed in every label, syncs the final txgs and forgets the pool. No block is freed. zpool import -D can find it again later.","ends":"With `ok` the pool is gone from the system and from zpool.cache, but every disk still carries a complete pool marked destroyed. Creating a new pool on the disks or zpool labelclear makes that permanent. With `busy` or `held` the pool is still imported (its file systems may be partly unmounted with `held`).","alts":[{"id":"outcome","options":[{"id":"ok","label":"Destroyed"},{"id":"busy","label":"A file system cannot be unmounted"},{"id":"held","label":"A volume of the pool is open"}]},{"id":"later","options":[{"id":"none","label":"Nothing more (no steps)"},{"id":"import","label":"Later zpool import -D"}]}],"steps":[{"wire":"E076"},{"wire":"E059"},{"wire":"E037","note":"for each mounted file system"},{"wire":"E060","when":[{"group":"outcome","options":["busy"]}]},{"wire":"E061","when":[{"group":"outcome","options":["ok","held"]}]},{"wire":"E062","when":[{"group":"outcome","options":["ok","held"]}]},{"wire":"E063","when":[{"group":"outcome","options":["ok","held"]}]},{"wire":"E064","when":[{"group":"outcome","options":["ok","held"]}]},{"wire":"E065","when":[{"group":"outcome","options":["held"]}],"note":"an open volume is not closed for you"},{"wire":"E066","when":[{"group":"outcome","options":["ok"]}]},{"wire":"E067","when":[{"group":"outcome","options":["ok"]}]},{"wire":"E068","when":[{"group":"outcome","options":["ok"]}]},{"wire":"E069","when":[{"group":"outcome","options":["ok"]}]},{"wire":"E019","when":[{"group":"outcome","options":["ok"]}]},{"wire":"E070","when":[{"group":"outcome","options":["ok"]}]},{"wire":"E071","when":[{"group":"outcome","options":["ok"]}]},{"wire":"E072","when":[{"group":"outcome","options":["ok"]}]},{"wire":"E073","when":[{"group":"outcome","options":["ok"]}]},{"wire":"E074","when":[{"group":"outcome","options":["ok"]},{"group":"later","options":["import"]}],"note":"the pool comes back with its data"}]}],"stages":[],"pipelines":[],"pipelineRuntimeNote":"","about":{"model":["`zfs destroy` is mostly a userspace program. zfs(8) works out what to destroy and in which order, refuses children and clones itself before anything changes, and unmounts file systems. The kernel destroys one file system or volume per call, or a list of snapshots, and refuses only what it can see: user holds, clones and datasets still in use.","The order is post-order: descendants before their parent, a snapshot's clones before the snapshot, a file system's snapshots before the file system. Contiguous snapshots are batched into one request, and the batch is sent before the next file system is unmounted and destroyed.","A list of snapshots is one ioctl but not one transaction. The kernel runs one sync task per snapshot, each waiting for its own txg; the first refusal stops the list, and the snapshots before it stay destroyed.","\"Busy\" means a long hold on the dataset: a mount, an open volume, a running send. A mounted file system is unmounted by zfs(8) first (`-f` forces it); an open volume is not closed for you. `zfs destroy -d` turns a refusal caused by holds, clones or a snapshot mount into a mark (`defer_destroy`), and the snapshot goes when the last of them does.","The command returns once the destroy is on disk, but the space returns later. A snapshot's unique blocks go to the pool free list, a file system's tree to the bptree and a clone's blocks to its livelist; `dsl_scan_sync()` frees a time-limited slice of them each txg (pool property `freeing`), and freed space is reusable TXG_DEFER_SIZE (2) txgs later.","`zpool destroy` frees nothing. It unmounts every file system, refuses while anything still holds the pool, writes `POOL_STATE_DESTROYED` into every label, unloads the pool and drops it from the cache file. The data stays on the disks, and `zpool import -D` can bring the pool back until they are reused."],"simplifications":["The block-level freeing is summarised in one column. Deadlist splitting, bptree traversal, livelists, free zios for gang, dedup and cloned blocks, and space accounting are drawn in the snapshot lifecycle graph.","Recursive destroys are drawn with one clone and one snapshot. Real walks repeat the same steps per dataset; with -r an error on one dataset is reported and the walk continues.","The deferred-destroy sweep after a mounted snapshot is unmounted (`dsl_destroy_snapshot_deferred()` on the async thread) and the release of the last hold are not drawn here; see the snapshot lifecycle graph.","Bookmark destroy, channel-program destroys, `zfs destroy -p` output and the history and sysevent records are left out.","On a pool with a checkpoint, destroys free nothing until the checkpoint is discarded; this is not drawn.","Destroying an encryption root also destroys its key object and unloads its wrapping key (`dsl_dir_destroy_sync()`); zoned datasets are detached from their zone. Neither is drawn.","zpool destroy is drawn for an imported, healthy pool. Initialize, trim, rebuild and L2ARC rebuild stops, the ARC flush and log space map handling during unload are summarised."]},"timelines":[],"page":{"id":"zfs-destroy","title":"ZFS Destroy Actions","file":"zfs-destroy.html","intro":"This diagram follows the destroy commands end to end: what `zfs destroy` does, and in what order, for a snapshot, a snapshot range, a file system or a volume (with `-r`, `-R`, `-f`, `-d`, `-n` and `-v`), what `zpool destroy` does to a pool, why each of them refuses (children, clones, holds, busy), and when the space actually comes back. The block-level freeing that a destroy starts (deadlists, the pool free list, the bptree, livelists) is drawn in detail in the snapshot lifecycle graph; this graph hands off to it."},"suite":{"pages":[{"id":"zfs-io-flow","title":"ZFS I/O Flow","file":"zfs-io-flow.html"},{"id":"zfs-scrub-resilver","title":"ZFS Scrub, Resilver and Rebuild","file":"zfs-scrub-resilver.html"},{"id":"zfs-send-receive","title":"ZFS Send and Receive","file":"zfs-send-receive.html"},{"id":"zfs-snapshot-lifecycle","title":"ZFS Snapshots, Destroy and Rollback","file":"zfs-snapshot-lifecycle.html"},{"id":"zfs-fault-management","title":"ZFS Fault Management","file":"zfs-fault-management.html"},{"id":"zfs-encryption-keys","title":"ZFS Encryption Keys","file":"zfs-encryption-keys.html"},{"id":"zfs-pool-create","title":"ZFS Pool Creation","file":"zfs-pool-create.html"},{"id":"zfs-dataset-create","title":"ZFS Dataset Creation","file":"zfs-dataset-create.html"},{"id":"zfs-pool-import-export","title":"ZFS Pool Import and Export","file":"zfs-pool-import-export.html"},{"id":"zfs-destroy","title":"ZFS Destroy Actions","file":"zfs-destroy.html"}],"alsoIn":{"admin":["zfs-scrub-resilver","zfs-send-receive","zfs-snapshot-lifecycle","zfs-fault-management","zfs-encryption-keys","zfs-pool-create","zfs-dataset-create","zfs-pool-import-export"],"zfs_cmd":["zfs-snapshot-lifecycle","zfs-encryption-keys","zfs-dataset-create"],"zpool_cmd":["zfs-pool-create","zfs-pool-import-export"],"libzfs":["zfs-snapshot-lifecycle","zfs-pool-create"],"mount_lib":["zfs-encryption-keys","zfs-dataset-create","zfs-pool-import-export"],"zfs_ioctl":["zfs-snapshot-lifecycle"],"vfs_umount":["zfs-pool-import-export"],"dsl_entry":["zfs-snapshot-lifecycle"],"sync_task":["zfs-send-receive","zfs-snapshot-lifecycle","zfs-dataset-create"],"txg_sync":["zfs-io-flow","zfs-scrub-resilver","zfs-send-receive","zfs-snapshot-lifecycle","zfs-pool-create","zfs-dataset-create","zfs-pool-import-export"],"spa_sync":["zfs-io-flow","zfs-scrub-resilver","zfs-send-receive","zfs-snapshot-lifecycle","zfs-fault-management","zfs-encryption-keys","zfs-pool-create","zfs-dataset-create","zfs-pool-import-export"],"dsl_pool_sync":["zfs-io-flow","zfs-send-receive","zfs-snapshot-lifecycle","zfs-pool-create","zfs-dataset-create"],"destroy_snap":["zfs-snapshot-lifecycle"],"hold_sync":["zfs-snapshot-lifecycle"],"destroy_head":["zfs-snapshot-lifecycle"],"deadlist_split":["zfs-snapshot-lifecycle"],"free_bpobj":["zfs-snapshot-lifecycle"],"bptree":["zfs-snapshot-lifecycle"],"livelist_del":["zfs-snapshot-lifecycle"],"async_destroy":["zfs-snapshot-lifecycle"],"metaslab_free":["zfs-io-flow","zfs-snapshot-lifecycle"],"spa_export":["zfs-pool-import-export"],"spa_unload":["zfs-pool-create","zfs-pool-import-export"],"cachefile":["zfs-pool-create","zfs-pool-import-export"],"uberblock":["zfs-io-flow","zfs-fault-management","zfs-pool-create","zfs-pool-import-export"],"dev_labels":["zfs-io-flow","zfs-pool-create","zfs-pool-import-export"]}}}</script>
<script>
'use strict';

/*
 * ZFS I/O Flow viewer.
 *
 * The page contains no ZFS knowledge of its own: everything it shows comes
 * from the JSON block #graph-data, generated from the spec by build_graph.py.
 *
 * Function list (spec section 12, step 3). Inputs -> outputs; side effects.
 *
 * Data
 *   loadGraph()                 #graph-data -> state.graph and lookup maps. No DOM.
 *   sourceUrl(ref)              {file,line} -> GitHub URL at meta.commit.
 *   computePlayed(path, sel)    path + option selection -> played steps
 *                               [{index, n, wire, step, side}]. Pure.
 *   defaultSelection(path)      path -> {group: first option}. Pure.
 *   traceClosure(id, dir, depth, ignoreCtl) -> {nodes:Set, wires:Set}. Pure.
 *
 * Layout and geometry
 *   socketTypes(id, wires)      node id + wire list -> {ins:[type], outs:[type]}. Pure.
 *   layoutDefault()             -> {nodeId: {x,y}} from groups and node order (spec 7). Pure.
 *   computeDisplay()            filters, collapse state, positions -> state.disp
 *                               (display nodes, visible wires, sockets, sizes).
 *   groupFrames()               state.disp -> {groupId: {x,y,w,h}}. Pure.
 *   socketPoint(dn, side, type) display node + side + type -> {x,y}. Pure.
 *   wireGeometry(dw)            display wire -> SVG path string. Pure.
 *   worldBounds()               -> {x,y,w,h} enclosing every frame. Pure.
 *
 * Rendering
 *   renderAll()                 rebuilds groups, nodes, wires, then highlight + minimap.
 *   renderGroups()              draws group frames and titles into #layer-groups.
 *   renderNodes()               draws node boxes into #layer-nodes.
 *   renderWires()               draws wires and hit paths; fills state.wireEls.
 *   updatePositions()           moves node boxes, recomputes wire paths and frames.
 *   applyHighlight()            sets CSS classes on nodes and wires from the
 *                               current path / selection / trace / filters.
 *   renderBadges()              step-number badges for the active path.
 *   renderLegend(), renderGroupFilters(), renderPathList(), renderAbout()
 *                               build the static panels.
 *   renderDetails()             fills the right panel for the selection or path.
 *   renderMinimap()             draws groups and the viewport into the minimap.
 *   updateGroupLabels()         screen-space group titles when zoomed far out.
 *
 * View
 *   setViewTransform()          state.view -> root transform, grid, labels, minimap.
 *   fitView(bounds)             zooms and pans so bounds fill the canvas.
 *   screenToWorld(x, y)         canvas pixel -> graph coordinates. Pure.
 *
 * Interaction
 *   selectNode(id, center), selectWire(id, center), clearSelection()
 *   activatePath(id, sel, stepN), clearPath(), gotoStep(k), playPath(on)
 *   followStep(), showCaption(), animateDot(k)
 *   runSearch(text)             text -> result list in the left panel.
 *   showTooltip(evt, el), hideTooltip()
 *
 * Persistence
 *   saveLayout(), loadLayout(), saveView(), loadView()  browser storage, in try/catch.
 *   exportLayout(), importLayout(file)
 *   readHash(), writeHash()     URL hash <-> path/alt/step, node or wire.
 *
 * Suite (specs/zfs-viewer-suite-spec.md)
 *   pageFile(pageId)            page id -> its HTML file name, or null. Pure.
 *   renderSuiteNav()            fills the Graphs menu when the page is part of a suite.
 *   alsoInLinks(nodeId)         -> link elements to the same node on other pages.
 *
 * Timeline view (suite spec section 5)
 *   setView(mode)               'graph' | 'timeline'; shows the matching view.
 *   renderTimelineList()        scenario list in the left panel.
 *   activateTimeline(id, stepN) selects a scenario and a step (1-based).
 *   gotoTimelineStep(k)         moves to step index k; re-renders and animates.
 *   playTimeline(on)            starts or stops automatic stepping.
 *   renderTimelineStep()        draws strip, caption, dataset rows and tiles.
 *   timelineColour(birth)       birth txg -> tile colour (old dark, new bright). Pure.
 *   renderTimelineDetails(panel) right panel for the active scenario.
 *
 * init()                        wires everything together on load.
 */

// ---------------------------------------------------------------- constants

const SVG_NS = 'http://www.w3.org/2000/svg';
const NODE_W = 300;
const TITLE_H = 28;
const ROW_H = 22;
const FOOT_H = 22;
const NODE_PAD = 6;
const COL_W = 400;
const NODE_GAP = 28;
const GROUP_PAD = 28;
const GROUP_PAD_TOP = 42;
const BAND_GAP = 90;
const ZOOM_MIN = 0.1;
const ZOOM_MAX = 2.5;

// One plain state object holds everything that changes.
const state = {
  graph: null,
  nodesById: {},
  wiresById: {},
  groupsById: {},
  typesById: {},
  ctxById: {},
  pathsById: {},
  typeOrder: [],
  groupNodes: {},
  pathsByWire: {},
  stagesByNode: {},
  defaultPos: {},
  pos: {},
  collapsed: {},
  groupMode: {},
  typeOn: {},
  ctxFilter: '',
  view: { x: 0, y: 0, k: 1 },
  disp: null,
  nodeEls: {},
  wireEls: {},
  select: null,
  trace: null,
  path: null,
  compare: '',
  storageKey: '',
  playTimer: null,
  dotFrame: null,
  mode: 'graph',
  timeline: null,
  tlDataset: null,
  tlTimer: null,
};

// ---------------------------------------------------------------- helpers

function svgEl(tag, attrs, parent) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const name in attrs) {
    el.setAttribute(name, attrs[name]);
  }
  if (parent) {
    parent.appendChild(el);
  }
  return el;
}

function htmlEl(tag, attrs, children) {
  const el = document.createElement(tag);
  for (const name in attrs || {}) {
    if (name === 'text') {
      el.textContent = attrs[name];
    } else if (name === 'className') {
      el.className = attrs[name];
    } else {
      el.setAttribute(name, attrs[name]);
    }
  }
  for (const child of children || []) {
    if (child === null || child === undefined) {
      continue;
    }
    if (typeof child === 'string') {
      el.appendChild(document.createTextNode(child));
    } else {
      el.appendChild(child);
    }
  }
  return el;
}

// Text from the spec may contain `code` spans; render them as <code>.
function richText(tag, text, className) {
  const el = htmlEl(tag, className ? { className: className } : {});
  const parts = text.split('`');
  parts.forEach((part, i) => {
    // `<page id>:<path id>` names a path on another page of the suite.
    const cross = i % 2 === 1 ? part.match(/^([a-z0-9-]+):(\w+)$/) : null;
    const file = cross && state.graph && state.graph.suite ? pageFile(cross[1]) : null;
    if (file) {
      el.appendChild(htmlEl('a', { href: file + '#path=' + cross[2], text: pageTitle(cross[1]) + ': ' + cross[2] }));
    } else if (i % 2 === 1) {
      el.appendChild(htmlEl('code', { text: part }));
    } else if (part) {
      el.appendChild(document.createTextNode(part));
    }
  });
  return el;
}

function byId(id) {
  return document.getElementById(id);
}

function indexBy(list) {
  const map = {};
  for (const item of list) {
    map[item.id] = item;
  }
  return map;
}

function clamp(value, low, high) {
  return Math.max(low, Math.min(high, value));
}

function hexToRgb(hex) {
  const value = parseInt(hex.replace('#', ''), 16);
  return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
}

function mixColor(hex, baseHex, amount) {
  const a = hexToRgb(hex);
  const b = hexToRgb(baseHex);
  const mixed = a.map((v, i) => Math.round(v * amount + b[i] * (1 - amount)));
  return 'rgb(' + mixed.join(',') + ')';
}

function lighten(hex, amount) {
  return mixColor('#ffffff', hex, amount);
}

function rgba(hex, alpha) {
  const c = hexToRgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + alpha + ')';
}

const measureCtx = document.createElement('canvas').getContext('2d');

function fitText(text, font, width) {
  measureCtx.font = font;
  if (measureCtx.measureText(text).width <= width) {
    return text;
  }
  let low = 0;
  let high = text.length;
  while (low < high) {
    const mid = Math.ceil((low + high) / 2);
    if (measureCtx.measureText(text.slice(0, mid) + '…').width <= width) {
      low = mid;
    } else {
      high = mid - 1;
    }
  }
  return text.slice(0, low) + '…';
}

function baseName(path) {
  const parts = path.split('/');
  return parts[parts.length - 1];
}

function storageGet(key) {
  try {
    const text = window.localStorage.getItem(key);
    return text ? JSON.parse(text) : null;
  } catch (err) {
    return null;
  }
}

function storageSet(key, value) {
  try {
    window.localStorage.setItem(key, JSON.stringify(value));
  } catch (err) {
    // Storage unavailable: the page works without it.
  }
}

// ---------------------------------------------------------------- data

function loadGraph() {
  const graph = JSON.parse(byId('graph-data').textContent);
  state.graph = graph;
  state.nodesById = indexBy(graph.nodes);
  state.wiresById = indexBy(graph.wires);
  state.groupsById = indexBy(graph.groups);
  state.typesById = indexBy(graph.types);
  state.ctxById = indexBy(graph.contexts);
  state.pathsById = indexBy(graph.paths);
  state.typeOrder = graph.types.map((t) => t.id);
  for (const group of graph.groups) {
    state.groupNodes[group.id] = [];
    state.groupMode[group.id] = 'show';
  }
  for (const node of graph.nodes) {
    state.groupNodes[node.group].push(node.id);
  }
  for (const type of graph.types) {
    state.typeOn[type.id] = true;
  }
  for (const path of graph.paths) {
    for (const step of path.steps) {
      const list = state.pathsByWire[step.wire] || [];
      if (list.indexOf(path.id) < 0) {
        list.push(path.id);
      }
      state.pathsByWire[step.wire] = list;
    }
  }
  for (const stage of graph.stages) {
    if (stage.node) {
      const list = state.stagesByNode[stage.node] || [];
      list.push(stage);
      state.stagesByNode[stage.node] = list;
    }
  }
  // The page id keeps each suite page's layout separate; the I/O page keeps
  // its original key ("zfs-io-flow:<commit>").
  state.storageKey = (graph.page ? graph.page.id : 'zfs-io-flow') + ':' + graph.meta.commit;
}

// ---------------------------------------------------------------- suite

function pageFile(pageId) {
  const suite = state.graph.suite;
  if (!suite) {
    return null;
  }
  const page = suite.pages.find((p) => p.id === pageId);
  return page ? page.file : null;
}

function pageTitle(pageId) {
  const page = state.graph.suite.pages.find((p) => p.id === pageId);
  return page ? page.title : pageId;
}

function renderSuiteNav() {
  const suite = state.graph.suite;
  if (!suite) {
    return;
  }
  byId('suite-nav').hidden = false;
  const menu = byId('graph-menu');
  for (const page of suite.pages) {
    menu.appendChild(htmlEl('option', { value: page.file, text: page.title }));
  }
  menu.value = state.graph.page.file;
  menu.addEventListener('change', () => {
    window.location.href = menu.value;
  });
}

function alsoInLinks(nodeId) {
  const suite = state.graph.suite;
  if (!suite || !suite.alsoIn[nodeId]) {
    return [];
  }
  return suite.alsoIn[nodeId].map((pageId) => htmlEl('a', {
    className: 'also-link',
    href: pageFile(pageId) + '#node=' + encodeURIComponent(nodeId),
    text: pageTitle(pageId),
  }));
}

function sourceUrl(ref) {
  const meta = state.graph.meta;
  return meta.repo + '/blob/' + meta.commit + '/' + ref.file + '#L' + ref.line;
}

function defaultSelection(path) {
  const sel = {};
  for (const group of path.alts) {
    sel[group.id] = group.options[0].id;
  }
  return sel;
}

function stepMatches(step, sel) {
  for (const tag of step.when || []) {
    if (tag.options.indexOf(sel[tag.group]) < 0) {
      return false;
    }
  }
  return true;
}

function computePlayed(path, sel) {
  const played = [];
  const visited = new Set();
  path.steps.forEach((step, index) => {
    if (!stepMatches(step, sel)) {
      return;
    }
    const wire = state.wiresById[step.wire];
    const side = played.length > 0 && !visited.has(wire.from);
    played.push({ index: index, n: index + 1, wire: wire, step: step, side: side });
    visited.add(wire.from);
    visited.add(wire.to);
  });
  return played;
}

function traceClosure(startId, direction, depth, ignoreCtl) {
  const nodes = new Set([startId]);
  const wires = new Set();
  let frontier = [startId];
  let level = 0;
  while (frontier.length > 0 && (depth === 0 || level < depth)) {
    const next = [];
    for (const nodeId of frontier) {
      for (const wire of state.graph.wires) {
        if (ignoreCtl && wire.type === 'ctl') {
          continue;
        }
        if (!state.typeOn[wire.type]) {
          continue;
        }
        const near = direction === 'down' ? wire.from : wire.to;
        const far = direction === 'down' ? wire.to : wire.from;
        if (near !== nodeId) {
          continue;
        }
        wires.add(wire.id);
        if (!nodes.has(far)) {
          nodes.add(far);
          next.push(far);
        }
      }
    }
    frontier = next;
    level += 1;
  }
  return { nodes: nodes, wires: wires };
}

// ---------------------------------------------------------------- layout

function sortTypes(list) {
  return list.sort((a, b) => state.typeOrder.indexOf(a) - state.typeOrder.indexOf(b));
}

function socketTypes(nodeId, wires) {
  const ins = new Set();
  const outs = new Set();
  for (const wire of wires) {
    if (wire.to === nodeId) {
      ins.add(wire.type);
    }
    if (wire.from === nodeId) {
      outs.add(wire.type);
    }
  }
  return { ins: sortTypes(Array.from(ins)), outs: sortTypes(Array.from(outs)) };
}

function bodyHeight(socketRows) {
  return TITLE_H + Math.max(socketRows, 1) * ROW_H + FOOT_H + NODE_PAD;
}

function layoutDefault() {
  const pos = {};
  const bottoms = {};
  const groups = state.graph.groups.slice();
  groups.sort((a, b) => (a.band === 'bottom') - (b.band === 'bottom'));
  for (const group of groups) {
    let startY = 0;
    if (group.band === 'bottom') {
      const top = groups.find((g) => g.band === 'top' && g.col === group.col);
      if (top) {
        startY = bottoms[top.id] + GROUP_PAD + BAND_GAP + GROUP_PAD_TOP;
      }
    }
    const nextY = {};
    let bottom = startY;
    for (const nodeId of state.groupNodes[group.id]) {
      const node = state.nodesById[nodeId];
      const sockets = socketTypes(nodeId, state.graph.wires);
      const height = bodyHeight(Math.max(sockets.ins.length, sockets.outs.length));
      const y = nextY[node.sub] === undefined ? startY : nextY[node.sub];
      pos[nodeId] = { x: (group.col + node.sub) * COL_W, y: y };
      nextY[node.sub] = y + height + NODE_GAP;
      bottom = Math.max(bottom, y + height);
    }
    bottoms[group.id] = bottom;
  }
  return pos;
}

function computeDisplay() {
  const disp = { nodes: {}, list: [], map: {}, wires: [] };
  for (const node of state.graph.nodes) {
    const mode = state.groupMode[node.group];
    if (mode === 'hide') {
      disp.map[node.id] = null;
      continue;
    }
    if (mode === 'collapse') {
      const proxyId = 'group:' + node.group;
      disp.map[node.id] = proxyId;
      if (!disp.nodes[proxyId]) {
        const group = state.groupsById[node.group];
        disp.nodes[proxyId] = { id: proxyId, proxy: true, group: node.group, title: group.title, members: [] };
        disp.list.push(disp.nodes[proxyId]);
      }
      disp.nodes[proxyId].members.push(node.id);
      continue;
    }
    disp.map[node.id] = node.id;
    disp.nodes[node.id] = { id: node.id, proxy: false, group: node.group, title: node.title, node: node };
    disp.list.push(disp.nodes[node.id]);
  }
  for (const wire of state.graph.wires) {
    if (!state.typeOn[wire.type]) {
      continue;
    }
    const a = disp.map[wire.from];
    const b = disp.map[wire.to];
    if (!a || !b || a === b) {
      continue;
    }
    disp.wires.push({ id: wire.id, from: a, to: b, type: wire.type });
  }
  for (const dn of disp.list) {
    const sockets = socketTypes(dn.id, disp.wires);
    dn.ins = sockets.ins;
    dn.outs = sockets.outs;
    dn.collapsed = Boolean(state.collapsed[dn.id]);
    dn.w = NODE_W;
    dn.h = dn.collapsed ? TITLE_H : bodyHeight(Math.max(dn.ins.length, dn.outs.length));
    placeDisplayNode(dn);
  }
  state.disp = disp;
}

function placeDisplayNode(dn) {
  if (!dn.proxy) {
    dn.x = state.pos[dn.id].x;
    dn.y = state.pos[dn.id].y;
    return;
  }
  dn.x = Infinity;
  dn.y = Infinity;
  for (const memberId of dn.members) {
    dn.x = Math.min(dn.x, state.pos[memberId].x);
    dn.y = Math.min(dn.y, state.pos[memberId].y);
  }
}

function groupFrames() {
  const frames = {};
  for (const dn of state.disp.list) {
    const box = frames[dn.group] || { x1: Infinity, y1: Infinity, x2: -Infinity, y2: -Infinity };
    box.x1 = Math.min(box.x1, dn.x);
    box.y1 = Math.min(box.y1, dn.y);
    box.x2 = Math.max(box.x2, dn.x + dn.w);
    box.y2 = Math.max(box.y2, dn.y + dn.h);
    frames[dn.group] = box;
  }
  const result = {};
  for (const groupId in frames) {
    const box = frames[groupId];
    result[groupId] = {
      x: box.x1 - GROUP_PAD,
      y: box.y1 - GROUP_PAD_TOP,
      w: box.x2 - box.x1 + 2 * GROUP_PAD,
      h: box.y2 - box.y1 + GROUP_PAD + GROUP_PAD_TOP,
    };
  }
  return result;
}

function worldBounds() {
  const frames = groupFrames();
  let x1 = Infinity;
  let y1 = Infinity;
  let x2 = -Infinity;
  let y2 = -Infinity;
  for (const id in frames) {
    const f = frames[id];
    x1 = Math.min(x1, f.x);
    y1 = Math.min(y1, f.y);
    x2 = Math.max(x2, f.x + f.w);
    y2 = Math.max(y2, f.y + f.h);
  }
  if (x1 === Infinity) {
    return { x: 0, y: 0, w: 100, h: 100 };
  }
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
}

function socketPoint(dn, side, type) {
  const list = side === 'in' ? dn.ins : dn.outs;
  const row = Math.max(list.indexOf(type), 0);
  const x = side === 'in' ? dn.x : dn.x + dn.w;
  if (dn.collapsed) {
    return { x: x, y: dn.y + TITLE_H / 2 };
  }
  return { x: x, y: dn.y + TITLE_H + row * ROW_H + ROW_H / 2 };
}

// Fan index of each wire among wires sharing the same socket, so that
// parallel wires leave and arrive with slightly different tangents.
function computeFans() {
  const outGroups = {};
  const inGroups = {};
  for (const dw of state.disp.wires) {
    const outKey = dw.from + '|' + dw.type;
    const inKey = dw.to + '|' + dw.type;
    (outGroups[outKey] = outGroups[outKey] || []).push(dw);
    (inGroups[inKey] = inGroups[inKey] || []).push(dw);
  }
  const nodes = state.disp.nodes;
  for (const key in outGroups) {
    const list = outGroups[key].sort((a, b) => nodes[a.to].y - nodes[b.to].y);
    list.forEach((dw, i) => { dw.fanOut = i - (list.length - 1) / 2; });
  }
  for (const key in inGroups) {
    const list = inGroups[key].sort((a, b) => nodes[a.from].y - nodes[b.from].y);
    list.forEach((dw, i) => { dw.fanIn = i - (list.length - 1) / 2; });
  }
}

function wireGeometry(dw) {
  const source = state.disp.nodes[dw.from];
  const target = state.disp.nodes[dw.to];
  const s = socketPoint(source, 'out', dw.type);
  const t = socketPoint(target, 'in', dw.type);
  const fanOut = dw.fanOut || 0;
  const fanIn = dw.fanIn || 0;
  const dx = t.x - s.x;
  if (dx >= 40) {
    const off = clamp(Math.abs(dx) * 0.5, 60, 320);
    return 'M' + s.x + ',' + s.y +
      ' C' + (s.x + off) + ',' + (s.y + fanOut * 5) +
      ' ' + (t.x - off) + ',' + (t.y + fanIn * 5) +
      ' ' + t.x + ',' + t.y;
  }
  // Backward wire: leave to the right, run along a lane above or below
  // both nodes, and enter from the left, so it does not cross the boxes.
  const below = t.y >= s.y;
  const lane = below
    ? Math.max(source.y + source.h, target.y + target.h) + 26 + Math.abs(fanOut) * 6
    : Math.min(source.y, target.y) - 26 - Math.abs(fanOut) * 6;
  const k = 70;
  return 'M' + s.x + ',' + s.y +
    ' C' + (s.x + k) + ',' + s.y + ' ' + (s.x + k) + ',' + lane + ' ' + s.x + ',' + lane +
    ' L' + t.x + ',' + lane +
    ' C' + (t.x - k) + ',' + lane + ' ' + (t.x - k) + ',' + t.y + ' ' + t.x + ',' + t.y;
}

// ---------------------------------------------------------------- rendering

function clearLayer(id) {
  const layer = byId(id);
  while (layer.firstChild) {
    layer.removeChild(layer.firstChild);
  }
  return layer;
}

function renderAll() {
  computeDisplay();
  computeFans();
  renderGroups();
  renderWires();
  renderNodes();
  applyHighlight();
  renderMinimap();
  updateGroupLabels();
}

function renderGroups() {
  const layer = clearLayer('layer-groups');
  const frames = groupFrames();
  state.frameEls = {};
  for (const group of state.graph.groups) {
    const frame = frames[group.id];
    if (!frame) {
      continue;
    }
    const g = svgEl('g', { 'data-group': group.id }, layer);
    const rect = svgEl('rect', {
      class: 'group-frame', rx: 12,
      fill: rgba(group.color, 0.12), stroke: rgba(group.color, 0.45),
    }, g);
    const title = svgEl('text', { class: 'group-title', fill: lighten(group.color, 0.45) }, g);
    title.textContent = group.title;
    const summary = svgEl('text', { class: 'group-summary' }, g);
    summary.textContent = fitText(group.summary, '11px ' + getComputedStyle(document.body).fontFamily, frame.w - 24);
    title.addEventListener('mousedown', (evt) => startGroupDrag(evt, group.id));
    title.addEventListener('dblclick', (evt) => {
      evt.stopPropagation();
      fitView(groupFrames()[group.id]);
    });
    state.frameEls[group.id] = { rect: rect, title: title, summary: summary, g: g };
    placeFrame(group.id, frame);
  }
}

function placeFrame(groupId, frame) {
  const els = state.frameEls[groupId];
  if (!els || !frame) {
    return;
  }
  els.rect.setAttribute('x', frame.x);
  els.rect.setAttribute('y', frame.y);
  els.rect.setAttribute('width', frame.w);
  els.rect.setAttribute('height', frame.h);
  els.title.setAttribute('x', frame.x + 12);
  els.title.setAttribute('y', frame.y + 22);
  els.summary.setAttribute('x', frame.x + 12);
  els.summary.setAttribute('y', frame.y + 36);
}

function titleBarPath(collapsed) {
  if (collapsed) {
    return 'M0,8 a8,8 0 0 1 8,-8 h' + (NODE_W - 16) + ' a8,8 0 0 1 8,8 v' + (TITLE_H - 16) +
      ' a8,8 0 0 1 -8,8 h-' + (NODE_W - 16) + ' a8,8 0 0 1 -8,-8 z';
  }
  return 'M0,8 a8,8 0 0 1 8,-8 h' + (NODE_W - 16) + ' a8,8 0 0 1 8,8 v' + (TITLE_H - 8) +
    ' h-' + NODE_W + ' z';
}

function renderNodes() {
  const layer = clearLayer('layer-nodes');
  const font = getComputedStyle(document.body).fontFamily;
  const mono = getComputedStyle(document.documentElement).getPropertyValue('--mono');
  state.nodeEls = {};
  for (const dn of state.disp.list) {
    const group = state.groupsById[dn.group];
    const g = svgEl('g', { class: 'node' + (dn.proxy ? ' proxy' : ''), 'data-id': dn.id }, layer);
    svgEl('rect', { class: 'body', width: dn.w, height: dn.h, rx: 8, filter: 'url(#shadow)' }, g);
    svgEl('path', { d: titleBarPath(dn.collapsed), fill: mixColor(group.color, '#2b2b2b', 0.55) }, g);

    // Context pill
    const pillText = dn.proxy ? 'group' : dn.node.ctx;
    measureCtx.font = '10px ' + mono;
    const pillW = measureCtx.measureText(pillText).width + 12;
    const pill = svgEl('g', {}, g);
    svgEl('rect', { class: 'pill', x: dn.w - pillW - 8, y: 6, width: pillW, height: 16, rx: 8 }, pill);
    const pt = svgEl('text', { class: 'pill-text', x: dn.w - pillW / 2 - 8, y: 17.5, 'text-anchor': 'middle' }, pill);
    pt.textContent = pillText;
    if (!dn.proxy) {
      const tip = svgEl('title', {}, pill);
      const ctx = state.ctxById[dn.node.ctx];
      tip.textContent = ctx ? ctx.id + ': ' + ctx.name : dn.node.ctx;
    }

    // Chain-link marker for nodes that also appear on other suite pages.
    let markerW = 0;
    const others = !dn.proxy && state.graph.suite ? state.graph.suite.alsoIn[dn.id] : null;
    if (others) {
      markerW = 22;
      const cx = dn.w - pillW - 22;
      const mark = svgEl('g', { class: 'shared-mark' }, g);
      svgEl('rect', { x: cx - 9, y: 6, width: 18, height: 16, fill: 'transparent' }, mark);
      svgEl('circle', { cx: cx - 3, cy: 14, r: 3.6, fill: 'none', stroke: '#eee', 'stroke-width': 1.6 }, mark);
      svgEl('circle', { cx: cx + 3, cy: 14, r: 3.6, fill: 'none', stroke: '#eee', 'stroke-width': 1.6 }, mark);
      const tip = svgEl('title', {}, mark);
      tip.textContent = 'Also in: ' + others.map(pageTitle).join(', ');
    }

    const title = svgEl('text', { class: 'title-text', x: 10, y: 18.5 }, g);
    title.textContent = fitText(dn.title, '600 13px ' + font, dn.w - pillW - 26 - markerW);

    if (!dn.collapsed) {
      renderSockets(g, dn);
      renderFoot(g, dn, mono);
    }
    svgEl('rect', { class: 'outline', width: dn.w, height: dn.h, rx: 8 }, g);
    g.setAttribute('transform', 'translate(' + dn.x + ',' + dn.y + ')');
    g.addEventListener('mousedown', (evt) => startNodeDrag(evt, dn.id));
    g.addEventListener('dblclick', (evt) => {
      const point = screenToWorld(evt.clientX, evt.clientY);
      if (point.y - dn.y <= TITLE_H) {
        evt.stopPropagation();
        toggleCollapsed(dn.id);
      }
    });
    state.nodeEls[dn.id] = g;
  }
}

function renderSockets(g, dn) {
  dn.ins.forEach((type, row) => {
    const y = TITLE_H + row * ROW_H + ROW_H / 2;
    svgEl('circle', { cx: 0, cy: y, r: 5, fill: state.typesById[type].color, stroke: '#111', 'stroke-width': 1 }, g);
    const label = svgEl('text', { class: 'sock-label', x: 11, y: y + 3.5 }, g);
    label.textContent = type;
  });
  dn.outs.forEach((type, row) => {
    const y = TITLE_H + row * ROW_H + ROW_H / 2;
    svgEl('circle', { cx: dn.w, cy: y, r: 5, fill: state.typesById[type].color, stroke: '#111', 'stroke-width': 1 }, g);
    const label = svgEl('text', { class: 'sock-label', x: dn.w - 11, y: y + 3.5, 'text-anchor': 'end' }, g);
    label.textContent = type;
  });
}

function renderFoot(g, dn, mono) {
  const rows = Math.max(dn.ins.length, dn.outs.length, 1);
  const y = TITLE_H + rows * ROW_H + 15;
  const foot = svgEl('text', { class: 'foot', x: 10, y: y }, g);
  let text;
  if (dn.proxy) {
    text = dn.members.length + ' nodes (group collapsed)';
  } else if (dn.node.fns.length > 0) {
    const first = dn.node.fns[0];
    text = first.name + '()  ' + baseName(dn.node.src || (first.ref ? first.ref.file : ''));
    if (first.ref) {
      foot.classList.add('link');
      foot.addEventListener('mouseenter', (evt) => showTooltip(evt, refTooltip(first.name + '()', [first.ref])));
      foot.addEventListener('mousemove', moveTooltip);
      foot.addEventListener('mouseleave', hideTooltip);
      foot.dataset.url = sourceUrl(first.ref);
    }
  } else {
    text = dn.node.role;
  }
  foot.textContent = fitText(text, '11px ' + mono, dn.w - 20);
}

function renderWires() {
  const layer = clearLayer('layer-wires');
  const hits = clearLayer('layer-hits');
  state.wireEls = {};
  for (const dw of state.disp.wires) {
    const type = state.typesById[dw.type];
    const d = wireGeometry(dw);
    const line = svgEl('path', { class: 'wire ' + dw.type, d: d, stroke: type.color }, layer);
    const hit = svgEl('path', { class: 'hit', d: d, 'data-id': dw.id }, hits);
    hit.addEventListener('mouseenter', (evt) => showTooltip(evt, wireTooltip(dw.id)));
    hit.addEventListener('mousemove', moveTooltip);
    hit.addEventListener('mouseleave', hideTooltip);
    hit.addEventListener('click', (evt) => {
      evt.stopPropagation();
      selectWire(dw.id, false);
    });
    state.wireEls[dw.id] = { line: line, hit: hit, dw: dw };
  }
}

function updatePositions() {
  for (const dn of state.disp.list) {
    placeDisplayNode(dn);
    const g = state.nodeEls[dn.id];
    if (g) {
      g.setAttribute('transform', 'translate(' + dn.x + ',' + dn.y + ')');
    }
  }
  computeFans();
  for (const id in state.wireEls) {
    const els = state.wireEls[id];
    const d = wireGeometry(els.dw);
    els.line.setAttribute('d', d);
    els.hit.setAttribute('d', d);
  }
  const frames = groupFrames();
  for (const groupId in frames) {
    placeFrame(groupId, frames[groupId]);
  }
  renderBadges();
  updateGroupLabels();
  renderMinimap();
}

// ---------------------------------------------------------------- highlight

function displayIdOf(nodeId) {
  return state.disp.map[nodeId];
}

function highlightSets() {
  // Returns {nodes, wires} that stay at full strength, or null for no dimming.
  if (state.path) {
    const nodes = new Set();
    const wires = new Set();
    for (const p of state.path.played) {
      wires.add(p.wire.id);
      nodes.add(displayIdOf(p.wire.from));
      nodes.add(displayIdOf(p.wire.to));
    }
    return { nodes: nodes, wires: wires };
  }
  if (state.trace) {
    const nodes = new Set();
    for (const id of state.trace.result.nodes) {
      nodes.add(displayIdOf(id));
    }
    return { nodes: nodes, wires: state.trace.result.wires };
  }
  if (state.select && state.select.kind === 'node') {
    const id = state.select.id;
    const nodes = new Set([id]);
    const wires = new Set();
    for (const dw of state.disp.wires) {
      if (dw.from === id || dw.to === id) {
        wires.add(dw.id);
        nodes.add(dw.from);
        nodes.add(dw.to);
      }
    }
    return { nodes: nodes, wires: wires };
  }
  if (state.select && state.select.kind === 'wire') {
    const els = state.wireEls[state.select.id];
    const nodes = new Set();
    if (els) {
      nodes.add(els.dw.from);
      nodes.add(els.dw.to);
    }
    return { nodes: nodes, wires: new Set([state.select.id]) };
  }
  if (state.ctxFilter) {
    const nodes = new Set();
    for (const dn of state.disp.list) {
      if (!dn.proxy && dn.node.ctx === state.ctxFilter) {
        nodes.add(dn.id);
      }
    }
    const wires = new Set();
    for (const dw of state.disp.wires) {
      if (nodes.has(dw.from) && nodes.has(dw.to)) {
        wires.add(dw.id);
      }
    }
    return { nodes: nodes, wires: wires };
  }
  return null;
}

function currentStep() {
  if (!state.path || state.path.cur < 0) {
    return null;
  }
  return state.path.played[state.path.cur];
}

function applyHighlight() {
  const sets = highlightSets();
  const step = currentStep();
  const currentNodes = new Set();
  if (step) {
    currentNodes.add(displayIdOf(step.wire.from));
    currentNodes.add(displayIdOf(step.wire.to));
  }
  const selectedNode = state.select && state.select.kind === 'node' ? state.select.id : null;
  for (const dn of state.disp.list) {
    const g = state.nodeEls[dn.id];
    const lit = sets ? sets.nodes.has(dn.id) : false;
    g.classList.toggle('dim', Boolean(sets) && !lit && dn.id !== selectedNode);
    g.classList.toggle('onpath', Boolean(state.path) && lit);
    g.classList.toggle('current', currentNodes.has(dn.id));
    g.classList.toggle('selected', dn.id === selectedNode);
    g.classList.toggle('ctxmark', Boolean(state.ctxFilter) && !dn.proxy && dn.node.ctx === state.ctxFilter);
  }

  const altWires = new Set();
  if (state.path) {
    const path = state.pathsById[state.path.id];
    for (const s of path.steps) {
      if (!sets.wires.has(s.wire)) {
        altWires.add(s.wire);
      }
    }
  }
  const compare = compareSets();
  const layer = byId('layer-wires');
  const raised = [];
  for (const id in state.wireEls) {
    const line = state.wireEls[id].line;
    const lit = sets ? sets.wires.has(id) : false;
    line.classList.toggle('lit', lit);
    line.classList.toggle('dim', Boolean(sets) && !lit && !altWires.has(id));
    line.classList.toggle('alt', altWires.has(id));
    line.classList.toggle('current', Boolean(step) && step.wire.id === id);
    line.classList.toggle('cmp-both', Boolean(compare) && compare.both.has(id));
    line.classList.toggle('cmp-a', Boolean(compare) && compare.onlyA.has(id));
    line.classList.toggle('cmp-b', Boolean(compare) && compare.onlyB.has(id));
    if (lit) {
      raised.push(line);
    }
  }
  for (const line of raised) {
    layer.appendChild(line);
  }
  if (step && state.wireEls[step.wire.id]) {
    layer.appendChild(state.wireEls[step.wire.id].line);
  }
  renderAltOutlines(altWires);
  renderBadges();
}

function renderAltOutlines(altWires) {
  const layer = byId('layer-wires');
  for (const old of Array.from(layer.querySelectorAll('.alt-outline'))) {
    layer.removeChild(old);
  }
  for (const id of altWires) {
    const els = state.wireEls[id];
    if (!els) {
      continue;
    }
    const outline = svgEl('path', { class: 'alt-outline', d: els.line.getAttribute('d') }, null);
    layer.insertBefore(outline, layer.firstChild);
  }
}

function compareSets() {
  if (!state.path || !state.compare) {
    return null;
  }
  const a = new Set(state.path.played.map((p) => p.wire.id));
  const other = state.pathsById[state.compare];
  const b = new Set(computePlayed(other, defaultSelection(other)).map((p) => p.wire.id));
  const both = new Set();
  const onlyA = new Set();
  const onlyB = new Set();
  for (const id of a) {
    (b.has(id) ? both : onlyA).add(id);
  }
  for (const id of b) {
    if (!a.has(id)) {
      onlyB.add(id);
    }
  }
  return { both: both, onlyA: onlyA, onlyB: onlyB };
}

function wireMidpoint(id) {
  const els = state.wireEls[id];
  if (!els) {
    return null;
  }
  const length = els.line.getTotalLength();
  return els.line.getPointAtLength(length / 2);
}

function renderBadges() {
  const layer = clearLayer('layer-badges');
  if (!state.path) {
    return;
  }
  const seen = new Set();
  for (const p of state.path.played) {
    if (seen.has(p.wire.id)) {
      continue;
    }
    seen.add(p.wire.id);
    const mid = wireMidpoint(p.wire.id);
    if (!mid) {
      continue;
    }
    const g = svgEl('g', { class: 'badge', transform: 'translate(' + mid.x + ',' + mid.y + ')' }, layer);
    const label = String(p.n);
    svgEl('circle', { r: label.length > 1 ? 10 : 8 }, g);
    const text = svgEl('text', {}, g);
    text.textContent = label;
  }
}

// ---------------------------------------------------------------- view

function canvasSize() {
  const rect = byId('canvas').getBoundingClientRect();
  return { w: rect.width, h: rect.height, left: rect.left, top: rect.top };
}

function screenToWorld(clientX, clientY) {
  const size = canvasSize();
  return {
    x: (clientX - size.left - state.view.x) / state.view.k,
    y: (clientY - size.top - state.view.y) / state.view.k,
  };
}

function setViewTransform() {
  const v = state.view;
  const canvas = byId('canvas');
  canvas.style.setProperty('--wire-idle', clamp(2 * v.k, 0.7, 2) + 'px');
  canvas.style.setProperty('--wire-lit', clamp(3 * v.k, 2, 3) + 'px');
  byId('root').setAttribute('transform', 'translate(' + v.x + ',' + v.y + ') scale(' + v.k + ')');
  byId('grid').setAttribute('patternTransform', 'translate(' + v.x + ',' + v.y + ') scale(' + v.k + ')');
  updateGroupLabels();
  renderMinimap();
  saveViewSoon();
}

function fitView(bounds) {
  if (!bounds) {
    return;
  }
  const size = canvasSize();
  const margin = 30;
  const k = clamp(Math.min((size.w - 2 * margin) / bounds.w, (size.h - 2 * margin) / bounds.h), ZOOM_MIN, ZOOM_MAX);
  state.view.k = k;
  state.view.x = size.w / 2 - (bounds.x + bounds.w / 2) * k;
  state.view.y = size.h / 2 - (bounds.y + bounds.h / 2) * k;
  setViewTransform();
}

function boundsOfNodes(ids) {
  let x1 = Infinity;
  let y1 = Infinity;
  let x2 = -Infinity;
  let y2 = -Infinity;
  for (const id of ids) {
    const dn = state.disp.nodes[id];
    if (!dn) {
      continue;
    }
    x1 = Math.min(x1, dn.x);
    y1 = Math.min(y1, dn.y);
    x2 = Math.max(x2, dn.x + dn.w);
    y2 = Math.max(y2, dn.y + dn.h);
  }
  if (x1 === Infinity) {
    return null;
  }
  return { x: x1 - 40, y: y1 - 40, w: x2 - x1 + 80, h: y2 - y1 + 80 };
}

function centerOn(ids) {
  const box = boundsOfNodes(ids);
  if (!box) {
    return;
  }
  const size = canvasSize();
  if (box.w * state.view.k > size.w || box.h * state.view.k > size.h || state.view.k < 0.5) {
    fitView(box);
    if (state.view.k > 1) {
      state.view.k = 1;
      state.view.x = size.w / 2 - (box.x + box.w / 2);
      state.view.y = size.h / 2 - (box.y + box.h / 2);
      setViewTransform();
    }
    return;
  }
  state.view.x = size.w / 2 - (box.x + box.w / 2) * state.view.k;
  state.view.y = size.h / 2 - (box.y + box.h / 2) * state.view.k;
  setViewTransform();
}

function isVisible(box) {
  const size = canvasSize();
  const v = state.view;
  const x1 = box.x * v.k + v.x;
  const y1 = box.y * v.k + v.y;
  const x2 = (box.x + box.w) * v.k + v.x;
  const y2 = (box.y + box.h) * v.k + v.y;
  return x1 >= 0 && y1 >= 0 && x2 <= size.w && y2 <= size.h;
}

function updateGroupLabels() {
  let overlay = byId('group-labels');
  if (!overlay) {
    overlay = htmlEl('div', { id: 'group-labels' });
    overlay.style.cssText = 'position:absolute;inset:0;pointer-events:none;overflow:hidden;';
    byId('canvas-wrap').insertBefore(overlay, byId('caption'));
  }
  while (overlay.firstChild) {
    overlay.removeChild(overlay.firstChild);
  }
  const small = state.view.k * 18 < 12;
  for (const groupId in state.frameEls || {}) {
    const els = state.frameEls[groupId];
    els.title.style.visibility = small ? 'hidden' : 'visible';
    els.summary.style.visibility = small ? 'hidden' : 'visible';
  }
  if (!small || !state.disp) {
    return;
  }
  // Zoomed far out the frames are too narrow for their titles, so the titles
  // are drawn in screen space and stacked in rows above (or, for a group that
  // sits under another one, below) their frame, with a short leader line.
  const frames = groupFrames();
  const v = state.view;
  measureCtx.font = '700 12px ' + getComputedStyle(document.body).fontFamily;
  let topmost = Infinity;
  for (const id in frames) {
    topmost = Math.min(topmost, frames[id].y);
  }
  const groups = state.graph.groups.filter((g) => frames[g.id]);
