<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZFS Flow Diagrams</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #1f1f1f;
  color: #dddddd;
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
}
main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }
h1 { font-size: 24px; margin: 0 0 4px; }
.sub { color: #9a9a9a; margin: 0 0 24px; }
.sub a { color: #74c0fc; text-decoration: none; font-family: ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.card {
  display: block;
  background: #262626;
  border: 1px solid #383838;
  border-radius: 10px;
  padding: 16px 18px;
  color: inherit;
  text-decoration: none;
}
.card:hover { border-color: #ffd43b; background: #2b2b2b; }
.card h2 { font-size: 17px; margin: 0 0 8px; color: #fff; }
.card p { margin: 0 0 10px; }
.card .counts { color: #9a9a9a; font-size: 12px; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>ZFS Flow Diagrams</h1>
  <p class="sub">Interactive diagrams of OpenZFS {{VERSION}} at commit
    <a href="{{REPO}}/tree/{{COMMIT}}" target="_blank" rel="noopener">{{COMMIT}}</a>.
    Every box, wire and step links to the source line it describes. Boxes that appear in several diagrams link to each other.</p>
  <div class="grid">
{{CARDS}}
  </div>
</main>
</body>
</html>
