<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZFS Snapshots, Destroy and Rollback</title>
<style>
:root {
  --canvas: #1f1f1f;
  --panel: #262626;
  --panel-line: #333;
  --text: #dddddd;
  --muted: #9a9a9a;
  --accent: #ffd43b;
  --node-body: #353535;
  --node-border: #161616;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
  scrollbar-color: #4a4a4a #262626;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
code { font-family: var(--mono); font-size: 0.92em; background: #ffffff12; padding: 0 3px; border-radius: 3px; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--canvas);
  color: var(--text);
  font: 13px/1.4 var(--sans);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

button, .button, select, input {
  font: inherit;
  color: var(--text);
  background: #333;
  border: 1px solid #444;
  border-radius: 5px;
  padding: 3px 9px;
}
button, .button { cursor: pointer; }
button:hover, .button:hover { background: #3d3d3d; border-color: #555; }
button.active { background: #4a4122; border-color: var(--accent); color: #fff; }
button.icon { padding: 2px 7px; }
input[type="search"] { width: 100%; }
a { color: #74c0fc; text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- top bar ---------- */
#topbar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--panel-line);
}
#topbar h1 {
  font-size: 15px;
  margin: 0 6px 0 2px;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex: 0 1 auto;
}
#topbar > * { flex-shrink: 0; }
#topbar > h1 { flex-shrink: 1; }
#topbar button, #topbar .button, #topbar a { white-space: nowrap; }
#commit-link { font-family: var(--mono); font-size: 12px; color: var(--muted); }
#topbar .spacer { flex: 1; }

/* ---------- main layout ---------- */
#layout { flex: 1; display: flex; min-height: 0; }
#left, #right {
  background: var(--panel);
  overflow-y: auto;
  flex: none;
}
#left { width: 280px; border-right: 1px solid var(--panel-line); overflow-x: hidden; }
#right { width: 360px; border-left: 1px solid var(--panel-line); padding: 10px 12px 40px; }
body.hide-left #left, body.hide-right #right { display: none; }

.panel-section { padding: 10px 12px; border-bottom: 1px solid var(--panel-line); }
.panel-section h2, #right h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 0 0 6px;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; }

/* search */
.results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 240px; overflow-y: auto; }
.results li { padding: 3px 6px; border-radius: 4px; cursor: pointer; }
.results li:hover, .results li.first { background: #333; }
.results .kind { color: var(--muted); font-size: 11px; margin-right: 6px; }

/* path list */
.path-cat { margin: 8px 0 2px; font-size: 11px; color: var(--muted); }
.path-item {
  display: block;
  width: 100%;
  white-space: normal;
  text-align: left;
  border: 1px solid transparent;
  background: none;
  padding: 3px 6px;
  border-radius: 4px;
}
.path-item:hover { background: #313131; border-color: transparent; }
.path-item.active { background: #4a4122; border-color: var(--accent); }
.path-item .pid { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; }

/* group filters */
.gfilter { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.gfilter .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.gfilter .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gfilter select { padding: 1px 4px; font-size: 12px; }

/* ---------- canvas ---------- */
#canvas-wrap { flex: 1; position: relative; min-width: 0; overflow: hidden; }
#canvas { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
#canvas.panning { cursor: grabbing; }

.group-frame { stroke-width: 1; }
.group-title { font-size: 18px; font-weight: 700; cursor: move; }
.group-summary { font-size: 11px; fill: var(--muted); pointer-events: none; }

.node { cursor: pointer; }
.node .body { fill: var(--node-body); stroke: var(--node-border); stroke-width: 1; }
.node:hover .body { stroke: #6a6a6a; }
.node .title-text { fill: #eeeeee; font-size: 13px; font-weight: 600; pointer-events: none; }
.node .pill { fill: #00000055; stroke: #ffffff30; }
.node .pill-text { fill: #ddd; font-size: 10px; font-family: var(--mono); }
.node .sock-label { fill: #bdbdbd; font-size: 10px; font-variant: small-caps; letter-spacing: 0.04em; pointer-events: none; }
.node .foot { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
.node .foot.link { cursor: pointer; }
.node .foot.link:hover { fill: #cfcfcf; text-decoration: underline; }
.node .outline { fill: none; stroke: none; pointer-events: none; }
.node.selected .outline { stroke: #fff; stroke-width: 2; }
.node.onpath .outline { stroke: var(--accent); stroke-width: 2; }
.node.current .outline { stroke: var(--accent); stroke-width: 3; }
.node.current .body { filter: url(#glow); }
.node.ctxmark .outline { stroke: #63e6be; stroke-width: 2; stroke-dasharray: 5 3; }
.node.dim { opacity: 0.15; }
.node.proxy .body { stroke-dasharray: 6 4; stroke: #888; }

.wire, .hit, .alt-outline { vector-effect: non-scaling-stroke; }
/* Stroke widths are in screen pixels (non-scaling) and are narrowed when
   zoomed out; --wire-idle and --wire-lit are set by setViewTransform(). */
.wire { fill: none; stroke-width: var(--wire-idle, 2px); opacity: 0.55; pointer-events: none; }
.wire.ctl { stroke-dasharray: 6 4; }
.wire.lit { opacity: 1; stroke-width: var(--wire-lit, 3px); stroke-dasharray: 10 6; animation: flow 0.9s linear infinite; }
.wire.dim { opacity: 0.06; }
.wire.alt { opacity: 0.35; stroke-dasharray: 3 5; }
.wire.current { stroke-width: calc(var(--wire-lit, 3px) + 2px); opacity: 1; }
.wire.cmp-both { stroke: #ffffff !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-a { stroke: #ffd43b !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-b { stroke: #4dabf7 !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
@keyframes flow { to { stroke-dashoffset: -32; } }
@media (prefers-reduced-motion: reduce) { .wire.lit { animation: none; } }

.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; pointer-events: stroke; }
.alt-outline { fill: none; stroke: var(--accent); stroke-width: 6; stroke-dasharray: 4 6; opacity: 0.35; pointer-events: none; }

.badge circle { fill: #1f1f1f; stroke: var(--accent); stroke-width: 1.5; }
.badge text { fill: var(--accent); font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.dot { fill: #fff; stroke: var(--accent); stroke-width: 3; }

#caption {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  max-width: min(760px, 90%);
  background: #262626ee;
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  pointer-events: auto;
}
#caption .ref { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }

#legend {
  position: absolute;
  left: 10px;
  bottom: 10px;
  background: #262626e6;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 12px;
}
#legend .head { cursor: pointer; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
#legend.folded .item { display: none; }
#legend.folded .head { margin-bottom: 0; }
#legend .item { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 1px 2px; border-radius: 3px; }
#legend .item:hover { background: #333; }
#legend .item.off { opacity: 0.35; }
#legend .sw { width: 22px; height: 0; border-top: 3px solid; }
#legend .sw.dashed { border-top-style: dashed; }

#minimap {
  position: absolute;
  right: 10px;
  bottom: 10px;
  background: #1a1a1ae6;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  cursor: crosshair;
}

/* ---------- details panel ---------- */
#details h3 { font-size: 16px; margin: 0 0 4px; }
#details .sub { color: var(--muted); margin-bottom: 8px; }
#details section { margin: 12px 0; }
#details ul { margin: 4px 0; padding-left: 0; list-style: none; }
#details li { margin: 3px 0; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid #0006; }
.ref-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.ref-row .sym { font-family: var(--mono); font-size: 12px; }
.ref-row a { font-family: var(--mono); font-size: 11px; }
.ref-row .copy { font-size: 10px; padding: 0 5px; }
.ref-code { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: pre-wrap; word-break: break-all; margin: 0 0 4px 0; }
.io-row { cursor: pointer; padding: 3px 4px; border-radius: 4px; }
.io-row:hover { background: #313131; }
.io-row .other { font-weight: 600; }
.io-row .lbl { color: var(--muted); display: block; font-size: 12px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 11px; }
.tbl td, .tbl th { border-bottom: 1px solid #333; padding: 3px 4px; vertical-align: top; text-align: left; }
.tbl .on { color: var(--accent); }

.transport { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.transport input[type="range"] { width: 90px; padding: 0; }
.alt-select { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 8px; }
.alt-select select { width: 100%; }
.steps { max-height: 46vh; overflow-y: auto; border: 1px solid #333; border-radius: 6px; }
.step { padding: 3px 6px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #2d2d2d; }
.step:hover { background: #303030; }
.step.cur { background: #4a4122; }
.step.skip { opacity: 0.45; padding-left: 20px; }
.step .alt-head { display: block; font-size: 10px; color: var(--accent); }
.step .n { font-family: var(--mono); color: var(--accent); margin-right: 4px; }
.step .side { font-size: 10px; color: #63e6be; margin-left: 4px; }
.step .note { display: block; color: var(--muted); font-style: italic; }

/* ---------- suite navigation ---------- */
#suite-nav { display: inline-flex; align-items: center; gap: 8px; }
#suite-nav select { max-width: 230px; }
#index-link { font-size: 12px; }
.segmented { display: inline-flex; }
.segmented button { border-radius: 0; }
.segmented button:first-child { border-radius: 5px 0 0 5px; }
.segmented button:last-child { border-radius: 0 5px 5px 0; border-left: none; }
.also-link { display: block; }

/* ---------- timeline view ---------- */
#timeline-view {
  position: absolute;
  inset: 0;
  background: var(--canvas);
  overflow: auto;
  padding: 14px 18px 40px;
}
#tl-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
#tl-title { font-size: 16px; font-weight: 650; }
#tl-strip { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.tl-chip {
  border: 1px solid #444;
  background: #2a2a2a;
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 12px;
  cursor: pointer;
  max-width: 240px;
  text-align: left;
}
.tl-chip .txg { font-family: var(--mono); color: var(--accent); margin-right: 5px; }
.tl-chip.cur { border-color: var(--accent); background: #4a4122; }
#tl-caption {
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: #262626;
  padding: 8px 12px;
  margin-bottom: 14px;
}
#tl-caption .cap { font-weight: 600; }
#tl-caption .note { color: var(--muted); display: block; margin-top: 2px; }
#tl-caption .links { margin-top: 4px; font-size: 12px; }
#tl-caption .links a { margin-right: 10px; }
.tl-row { display: grid; grid-template-columns: 200px 1fr; gap: 10px; margin-bottom: 8px; align-items: start; }
.tl-label {
  background: #2b2b2b;
  border: 1px solid #3a3a3a;
  border-radius: 6px;
  padding: 5px 8px;
  cursor: pointer;
}
.tl-label:hover { border-color: #666; }
.tl-label .name { font-family: var(--mono); font-weight: 650; }
.tl-label .kind { color: var(--muted); font-size: 11px; display: block; }
.tl-lanes { display: flex; flex-direction: column; gap: 4px; }
.tl-lane { display: flex; flex-wrap: wrap; gap: 5px; min-height: 40px; align-items: center; padding: 3px 4px; border-radius: 6px; background: #ffffff06; }
.tl-lane.dead { min-height: 30px; background: #8ce99a14; border-left: 3px solid #8CE99A; }
.tl-lane .lane-tag { font-size: 10px; color: var(--muted); margin-right: 4px; }
.tl-tile {
  width: 52px;
  height: 34px;
  border-radius: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 12px;
  color: #111;
  border: 2px solid transparent;
  cursor: default;
  position: relative;
}
.tl-tile .birth { font-size: 9px; opacity: 0.8; }
.tl-tile.small { height: 26px; }
.tl-tile.new { border-color: var(--accent); box-shadow: 0 0 6px var(--accent); }
.tl-tile.changed { border-color: #63e6be; }
.tl-tile.freed { opacity: 0.35; text-decoration: line-through; }
.tl-tile.deferred { border: 2px dashed #ddd; }
.tl-tile.async { border: 2px dotted #ddd; }
.tl-arrow { color: var(--muted); font-size: 11px; display: block; }
#tl-legend { margin-top: 18px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
#tl-legend .tl-tile { width: 38px; height: 22px; font-size: 10px; }
.tl-summary { color: var(--muted); }

/* ---------- tooltip and about ---------- */
#tooltip {
  position: fixed;
  z-index: 50;
  max-width: 520px;
  background: #111;
  border: 1px solid #555;
  border-radius: 6px;
  padding: 6px 9px;
  font-size: 12px;
  pointer-events: none;
  box-shadow: 0 4px 16px #000a;
}
#tooltip .t-ref { font-family: var(--mono); font-size: 11px; margin-top: 4px; }
#tooltip .t-ref .loc { color: #74c0fc; }
#tooltip .t-ref .code { color: #bbb; display: block; white-space: pre; overflow: hidden; text-overflow: ellipsis; }

#about {
  position: fixed;
  inset: 0;
  background: #000a;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.about-box {
  position: relative;
  background: var(--panel);
  border: 1px solid #444;
  border-radius: 10px;
  max-width: 820px;
  max-height: 100%;
  overflow-y: auto;
  padding: 18px 24px;
}
.about-box .close { position: absolute; right: 10px; top: 10px; }
.about-box h2 { font-size: 17px; margin: 4px 0 8px; }
.about-box h3 { font-size: 13px; margin: 16px 0 6px; color: var(--accent); }
.about-box li { margin: 4px 0; }

</style>
</head>
<body>
<header id="topbar">
  <button id="toggle-left" class="icon" title="Show or hide the path panel">&#9776;</button>
  <h1>ZFS Snapshots, Destroy and Rollback</h1>
  <a id="commit-link" target="_blank" rel="noopener"></a>
  <span id="suite-nav" hidden>
    <select id="graph-menu" title="Open another diagram of the suite"></select>
    <a id="index-link" href="index.html" title="All diagrams">All</a>
  </span>
  <span id="view-switch" class="segmented" hidden>
    <button id="btn-view-graph" class="active" title="Node graph">Graph</button><button id="btn-view-timeline" title="Timeline scenarios">Timeline</button>
  </span>
  <span class="spacer"></span>
  <button id="btn-fit" title="Fit everything (F)">Fit</button>
  <button id="btn-reset" title="Restore the default layout">Reset layout</button>
  <button id="btn-export" title="Export layout: save node positions to a JSON file">Export</button>
  <label class="button" title="Import layout: load node positions from a JSON file">Import<input id="file-import" type="file" accept="application/json,.json" hidden></label>
  <button id="btn-about">About</button>
  <button id="toggle-right" class="icon" title="Show or hide the details panel">&#9776;</button>
</header>

<main id="layout">
  <aside id="left">
    <div class="panel-section">
      <input id="search" type="search" placeholder="Search nodes, functions, files, tunables, wires  ( / )" autocomplete="off">
      <ul id="search-results" class="results"></ul>
    </div>
    <div class="panel-section">
      <h2>Paths</h2>
      <div id="path-list"></div>
    </div>
    <div class="panel-section" id="timeline-section" hidden>
      <h2>Timelines</h2>
      <div id="timeline-list"></div>
    </div>
    <div class="panel-section">
      <h2>Filters</h2>
      <label class="row">Context
        <select id="ctx-filter"><option value="">(none)</option></select>
      </label>
      <div id="group-filters"></div>
    </div>
  </aside>

  <section id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="12" cy="12" r="1.3" fill="#2c2c2c"></circle>
        </pattern>
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"></feDropShadow>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="160%">
          <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffd43b" flood-opacity="0.9"></feDropShadow>
        </filter>
      </defs>
      <rect id="grid-rect" x="0" y="0" width="100%" height="100%" fill="url(#grid)"></rect>
      <g id="root">
        <g id="layer-groups"></g>
        <g id="layer-wires"></g>
        <g id="layer-hits"></g>
        <g id="layer-nodes"></g>
        <g id="layer-badges"></g>
        <g id="layer-dot"></g>
      </g>
    </svg>
    <div id="caption" hidden></div>
    <div id="legend"></div>
    <canvas id="minimap" width="220" height="150"></canvas>
    <div id="timeline-view" hidden>
      <div id="tl-head">
        <div id="tl-title"></div>
        <div class="transport" id="tl-transport">
          <button id="tl-first" title="First step (Home)">|◀</button>
          <button id="tl-prev" title="Previous step (Left)">◀</button>
          <button id="tl-play" title="Play or pause (Space)">Play</button>
          <button id="tl-next" title="Next step (Right)">▶</button>
          <button id="tl-last" title="Last step (End)">▶|</button>
        </div>
      </div>
      <div id="tl-strip"></div>
      <div id="tl-caption"></div>
      <div id="tl-panel"></div>
      <div id="tl-legend"></div>
    </div>
  </section>

  <aside id="right">
    <div id="details"><p class="muted">Select a node, a wire or a path.</p></div>
  </aside>
</main>

<div id="tooltip" hidden></div>
<div id="about" hidden>
  <div class="about-box">
    <button id="about-close" class="icon close" title="Close">&#10005;</button>
    <div id="about-body"></div>
  </div>
</div>

ees comes back later).","tunables":[],"props":[]},{"id":"spa_sync","group":"txg","sub":0,"title":"spa_sync()","ctx":"sync","src":"module/zfs/spa.c","fns":[{"name":"spa_sync","ref":{"file":"module/zfs/spa.c","line":11405,"symbol":"spa_sync","code":"spa_sync(spa_t *spa, uint64_t txg)"}},{"name":"spa_sync_iterate_to_convergence","ref":{"file":"module/zfs/spa.c","line":11192,"symbol":"spa_sync_iterate_to_convergence","code":"spa_sync_iterate_to_convergence(spa_t *spa, dmu_tx_t *tx)"}}],"role":"Shared with the I/O flow graph. Each sync pass runs dsl_pool_sync(); after it, dsl_scan_sync() does background frees (in pass 1 only).","tunables":[],"props":[]},{"id":"dsl_pool_sync","group":"txg","sub":0,"title":"dsl_pool_sync()","ctx":"sync","src":"module/zfs/dsl_pool.c","fns":[{"name":"dsl_pool_sync","ref":{"file":"module/zfs/dsl_pool.c","line":700,"symbol":"dsl_pool_sync","code":"dsl_pool_sync(dsl_pool_t *dp, uint64_t txg)"}},{"name":"dsl_dataset_sync","ref":{"file":"module/zfs/dsl_dataset.c","line":2133,"symbol":"dsl_dataset_sync","code":"dsl_dataset_sync(dsl_dataset_t *ds, zio_t *rio, dmu_tx_t *tx)"}},{"name":"dsl_dataset_sync_done","ref":{"file":"module/zfs/dsl_dataset.c","line":2391,"symbol":"dsl_dataset_sync_done","code":"dsl_dataset_sync_done(dsl_dataset_t *ds, dmu_tx_t *tx)"}}],"role":"Shared with the I/O flow graph. Writes the dirty datasets first, then (dsl_dataset_sync_done()) applies their space deltas and moves pending deadlist and livelist entries to disk, and only then runs the queued sync tasks. A snapshot taken in txg N therefore contains every write of txg N.","tunables":[],"props":[]},{"id":"dnode_sync","group":"txg","sub":0,"title":"dnode_sync()","ctx":"sync","src":"module/zfs/dnode_sync.c","fns":[{"name":"dnode_sync","ref":{"file":"module/zfs/dnode_sync.c","line":685,"symbol":"dnode_sync","code":"dnode_sync(dnode_t *dn, dmu_tx_t *tx)"}},{"name":"dnode_sync_free_ranges","ref":{"file":"module/zfs/dnode_sync.c","line":647,"symbol":"dnode_sync_free_ranges","co oy_head_sync_impl","code":"dsl_destroy_head_sync_impl(dsl_dataset_t *ds, dmu_tx_t *tx)"}},{"name":"dsl_destroy_head_check_impl","ref":{"file":"module/zfs/dsl_destroy.c","line":819,"symbol":"dsl_destroy_head_check_impl","code":"dsl_destroy_head_check_impl(dsl_dataset_t *ds, int expected_holds)"}},{"name":"dsl_destroy_head_sync","ref":{"file":"module/zfs/dsl_destroy.c","line":1234,"symbol":"dsl_destroy_head_sync","code":"dsl_destroy_head_sync(void *arg, dmu_tx_t *tx)"}},{"name":"dsl_async_dataset_destroy","ref":{"file":"module/zfs/dsl_destroy.c","line":1015,"symbol":"dsl_async_dataset_destroy","code":"dsl_async_dataset_destroy(dsl_dataset_t *ds, dmu_tx_t *tx)"}},{"name":"dsl_async_clone_destroy","ref":{"file":"module/zfs/dsl_destroy.c","line":956,"symbol":"dsl_async_clone_destroy","code":"dsl_async_clone_destroy(dsl_dataset_t *ds, dmu_tx_t *tx)"}},{"name":"old_synchronous_dataset_destroy","ref":{"file":"module/zfs/dsl_destroy.c","line":790,"symbol":"old_synchronous_dataset_destroy","code":"old_synchronous_dataset_destroy(dsl_dataset_t *ds, dmu_tx_t *tx)"}},{"name":"kill_blkptr","ref":{"file":"module/zfs/dsl_destroy.c","line":761,"symbol":"kill_blkptr","code":"kill_blkptr(spa_t *spa, zilog_t *zilog, const blkptr_t *bp,"}}],"role":"Destroys a head dataset (file system or volume). Refused with EBUSY while it has snapshots of its own, and with EEXIST while it has child datasets. Its deadlist is discarded and its blocks are handed to one of three mechanisms: the bptree (async_destroy feature), the clone's livelist, or, on old pools, a traversal that kills every block in this txg.","tunables":[],"props":[]},{"id":"rollback_sync","group":"ops","sub":0,"title":"Rollback","ctx":"sync","src":"module/zfs/dsl_dataset.c","fns":[{"name":"dsl_dataset_rollback_sync","ref":{"file":"module/zfs/dsl_dataset.c","line":3428,"symbol":"dsl_dataset_rollback_sync","code":"dsl_dataset_rollback_sync(void *arg, dmu_tx_t *tx)"}},{"name":"dsl_dataset_rollback_check","ref":{"file":"module/zfs/dsl_dataset.c","line":3300,"symbol":"dsl_dataset_rollback_check","code":"dsl_dataset_rollback_check(void *arg, dmu_tx_t *tx)"}},{"name":"dsl_dataset_zero_zil","ref":{"file":"module/zfs/dsl_dataset.c","line":1305,"symbol":"dsl_dataset_zero_zil","code":"dsl_dataset_zero_zil(dsl_dataset_t *ds, dmu_tx_t *tx)"}}],"role":"Rolls a head back to its latest snapshot. The check requires the named target to be the latest snapshot (EEXIST otherwise), refuses when a bookmark is newer than it, and refuses a snapshot taken in the current txg (EAGAIN). The sync function never rewinds blocks in place: it builds a temporary clone of the snapshot, swaps it with the head, discards the intent log and destroys the clone.","tunables":[],"props":[]},{"id":"clone_swap","group":"ops","sub":0,"title":"Temporary clone + clone swap","ctx":"sync","src":"module/zfs/dsl_dataset.c","fns":[{"name":"dsl_dataset_clone_swap_sync_impl","ref":{"file":"module/zfs/dsl_dataset.c","line":4338,"symbol":"dsl_dataset_clone_swap_sync_impl","code":"dsl_dataset_clone_swap_sync_impl(dsl_dataset_t *clone,"}},{"name":"dsl_dataset_create_sync","ref":{"file":"module/zfs/dsl_dataset.c","line":1326,"symbol":"dsl_dataset_create_sync","code":"dsl_dataset_create_sync(dsl_dir_t *pdd, const char *lastname,"}},{"name":"dsl_dataset_create_sync_dd","ref":{"file":"module/zfs/dsl_dataset.c","line":1188,"symbol":"dsl_dataset_create_sync_dd","code":"dsl_dataset_create_sync_dd(dsl_dir_t *dd, dsl_dataset_t *origin,"}}],"role":"dsl_dataset_create_sync() creates the clone %rollback, whose root block pointer is the snapshot's and whose deadlist is empty. dsl_dataset_clone_swap_sync_impl() exchanges the two datasets' contents (root block pointers, deadlists, space counters) and drops both livelists, so the head keeps its name but has the snapshot's tree. The same swap finishes a zfs receive into an existing file system.","tunables":[],"props":[]},{"id":"bookmark_sync","group":"ops","sub":0,"title":"Bookmark create","ctx":"sync","src":"module/zfs/dsl_bookmark.c","fns":[{"name":"dsl_bookmark_create_sync","ref":{"file":"module/zfs/dsl_bookmark.c","line":597,"symbol":"dsl_bookmark_create_sync","code":"dsl_bookmark_create_sync(void *arg, dmu_tx_t *tx)"}},{"name":"dsl_bookmark_create_check","ref":{"file":"module/zfs/dsl_bookmark.c","line":287,"symbol":"dsl_bookmark_create_check","code":"dsl_bookmark_create_check(void *arg, dmu_tx_t *tx)"}},{"name":"dsl_bookmark_create_sync_impl_snap","ref":{"file":"module/zfs/dsl_bookmark.c","line":437,"symbol":"dsl_bookmark_create_sync_impl_snap","code":"dsl_bookmark_create_sync_impl_snap(const char *bookmark, const char *snapshot,"}},{"name":"dsl_bookmark_set_phys","ref":{"file":"module/zfs/dsl_bookmark.c","line":341,"symbol":"dsl_bookmark_set_phys","code":"dsl_bookmark_set_phys(zfs_bookmark_phys_t *zbm, dsl_dataset_t *snap)"}}],"role":"Creates bookmarks from snapshots (or copies an existing bookmark, not drawn). dsl_bookmark_set_phys() records the snapshot's guid, creation txg and creation time and, with the bookmark_v2 and bookmark_written features, the IV set guid and space counters. A bookmark keeps no block alive.","tunables":[],"props":[]},{"id":"block_kill","group":"dead","sub":0,"title":"dsl_dataset_block_kill()","ctx":"any","src":"module/zfs/dsl_dataset.c","fns":[{"name":"dsl_dataset_block_kill","ref":{"file":"module/zfs/dsl_dataset.c","line":264,"symbol":"dsl_dataset_block_kill","code":"dsl_dataset_block_kill(dsl_dataset_t *ds, const blkptr_t *bp, dmu_tx_t *tx,"}},{"name":"dsl_dataset_block_born","ref":{"file":"module/zfs/dsl_dataset.c","line":155,"symbol":"dsl_dataset_block_born","code":"dsl_dataset_block_born(dsl_dataset_t *ds, const blkptr_t *bp, dmu_tx_t *tx)"}}],"role":"The rule for a block the head no longer references. Born after the head's latest snapshot (birth > ds_prev_snap_txg): no snapshot can hold it, so it is freed in this txg (gang, dedup and possibly cloned blocks are queued on the pool free list instead). Otherwise the latest snapshot still references it, and it goes on the head's deadlist. dsl_dataset_block_born() does the accounting for the new block.","tunables":[],"props":[]},{"id":"deadlist","group":"dead","sub":0,"title":"Deadlist (dsl_deadlist)","ctx":"sync","src":"module/zfs/dsl_deadlist.c","fns":[{"name":"dsl_deadlist_insert","ref":{"file":"module/zfs/dsl_deadlist.c","line":461,"symbol":"dsl_deadlist_insert","code":"dsl_deadlist_insert(dsl_deadlist_t *dl, const blkptr_t *bp, boolean_t bp_freed,"}},{"name":"dsl_deadlist_insert_alloc_cb","ref":{"file":"module/zfs/dsl_deadlist.c","line":503,"symbol":"dsl_deadlist_insert_alloc_cb","code":"dsl_deadlist_insert_alloc_cb(void *arg, const blkptr_t *bp, dmu_tx_t *tx)"}},{"name":"dsl_deadlist_clone","ref":{"file":"module/zfs/dsl_deadlist.c","line":708,"symbol":"dsl_deadlist_clone","code":"dsl_deadlist_clone(dsl_deadlist_t *dl, uint64_t maxtxg,"}},{"name":"dsl_deadlist_add_key","ref":{"file":"module/zfs/dsl_deadlist.c","line":523,"symbol":"dsl_deadlist_add_key","code":"dsl_deadlist_add_key(dsl_deadlist_t *dl, uint64_t mintxg, dmu_tx_t *tx)"}},{"name":"dsl_deadlist_remove_key","ref":{"file":"module/zfs/dsl_deadlist.c","line":550,"symbol":"dsl_deadlist_remove_key","code":"dsl_deadlist_remove_key(dsl_deadlist_t *dl, uint64_t mintxg, dmu_tx_t *tx)"}},{"name":"dsl_deadlist_free","ref":{"file":"module/zfs/dsl_deadlist.c","line":385,"symbol":"dsl_deadlist_free","code":"dsl_deadlist_free(objset_t *os, uint64_t dlobj, dmu_tx_t *tx)"}}],"role":"Each dataset has one: the blocks its previous snapshot references but it does not. They died after that snapshot was taken, so they were born at or before it, and that snapshot still holds them. It is a ZAP of sub-lists (each a bpobj) keyed by txg; a block goes into the sub-list with the largest key below its birth txg, so each sub-list holds the blocks born in one interval between snapshots. A new snapshot keeps the head's deadlist, and the head starts a new, empty one.","tunables":[],"props":[]},{"id":"deadlist_split","group":"dea sfer_space","code":"dsl_dir_transfer_space(dsl_dir_t *dd, int64_t delta,"}},{"name":"dsl_dir_diduse_space","ref":{"file":"module/zfs/dsl_dir.c","line":1622,"symbol":"dsl_dir_diduse_space","code":"dsl_dir_diduse_space(dsl_dir_t *dd, dd_used_t type, int64_t used,"}},{"name":"dsl_dataset_recalc_head_uniq","ref":{"file":"module/zfs/dsl_dataset.c","line":1408,"symbol":"dsl_dataset_recalc_head_uniq","code":"dsl_dataset_recalc_head_uniq(dsl_dataset_t *ds)"}},{"name":"dsl_get_used","ref":{"file":"module/zfs/dsl_dataset.c","line":2666,"symbol":"dsl_get_used","code":"dsl_get_used(dsl_dataset_t *ds)"}}],"role":"A snapshot's used is its unique bytes: space that only it references, which destroying it alone would free. Deadlisted blocks are charged to the file system's usedbysnapshots instead of usedbydataset. Deltas collected while blocks are killed are applied once per txg by dsl_dataset_apply_deltas().","tunables":[],"props":[{"name":"used","ref":{"file":"module/zcommon/zfs_prop.c","line":626,"symbol":"\"used\"","code":"zprop_register_number(ZFS_PROP_USED, \"used\", 0, PROP_READONLY,"}},{"name":"referenced","ref":{"file":"module/zcommon/zfs_prop.c","line":631,"symbol":"\"referenced\"","code":"zprop_register_number(ZFS_PROP_REFERENCED, \"referenced\", 0,"}},{"name":"usedbydataset","ref":{"file":"module/zcommon/zfs_prop.c","line":650,"symbol":"\"usedbydataset\"","code":"zprop_register_number(ZFS_PROP_USEDDS, \"usedbydataset\", 0,"}},{"name":"usedbysnapshots","ref":{"file":"module/zcommon/zfs_prop.c","line":647,"symbol":"\"usedbysnapshots\"","code":"zprop_register_number(ZFS_PROP_USEDSNAP, \"usedbysnapshots\", 0,"}}]},{"id":"bookmarks","group":"dead","sub":1,"title":"Bookmarks (#name)","ctx":"any","src":"module/zfs/dsl_bookmark.c","fns":[{"name":"dsl_bookmark_node_add","ref":{"file":"module/zfs/dsl_bookmark.c","line":389,"symbol":"dsl_bookmark_node_add","code":"dsl_bookmark_node_add(dsl_dataset_t *hds, dsl_bookmark_node_t *dbn,"}},{"name":"dsl_bookmark_snapshotted","ref":{"file" snapshot,\tHELP_SNAPSHOT\t\t},"}]},{"id":"E076","from":"admin","to":"zfs_cmd","type":"ctl","label":"runs zfs destroy [-d] fs@snap, or zfs destroy fs","refs":[{"file":"cmd/zfs/zfs_main.c","line":195,"symbol":"zfs_do_destroy","code":"{ \"destroy\",\tzfs_do_destroy,\t\tHELP_DESTROY\t\t},"}]},{"id":"E077","from":"admin","to":"zfs_cmd","type":"ctl","label":"runs zfs hold tag fs@snap (and later zfs release)","refs":[{"file":"cmd/zfs/zfs_main.c","line":230,"symbol":"zfs_do_hold","code":"{ \"hold\",\tzfs_do_hold,\t\tHELP_HOLD\t\t},"}]},{"id":"E078","from":"admin","to":"zfs_cmd","type":"ctl","label":"runs zfs rollback [-r] fs@snap","refs":[{"file":"cmd/zfs/zfs_main.c","line":198,"symbol":"zfs_do_rollback","code":"{ \"rollback\",\tzfs_do_rollback,\tHELP_ROLLBACK\t\t},"}]},{"id":"E079","from":"admin","to":"zfs_cmd","type":"ctl","label":"runs zfs bookmark fs@snap fs#mark","refs":[{"file":"cmd/zfs/zfs_main.c","line":202,"symbol":"zfs_do_bookmark","code":"{ \"bookmark\",\tzfs_do_bookmark,\tHELP_BOOKMARK\t\t},"}]}],"paths":[{"id":"snapshot_create","category":"Snapshot","title":"Take a snapshot","summary":"zfs snapshot from the command line to the sync task that creates the snapshot record. No data is copied: the snapshot shares the head's root block pointer, takes over the head's deadlist, and moves the head's ds_prev_snap_txg forward.","ends":"The snapshot exists and the command returns. From the next txg on, every block the head kills is compared against the new ds_prev_snap_txg (path overwrite).","alts":[],"steps":[{"wire":"E075"},{"wire":"E001"},{"wire":"E008"},{"wire":"E015"},{"wire":"E016"},{"wire":"E017"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E021"},{"wire":"E027"},{"wire":"E028"},{"wire":"E029"}]},{"id":"overwrite","category":"Space","title":"Overwrite or delete: free now or deadlist","summary":"What happens to the block the head stops referencing, when copy-on-write replaces it or a file is removed. The comparison birth > ds_prev_snap_txg in dsl_dataset_block_kill() decides between freeing it and keeping it for a snapshot.","ends":"The block is free (reusable two txgs later), queued on the pool free list, or on the head's deadlist where it stays until the snapshots that hold it are destroyed (path destroy_snapshot).","alts":[{"id":"cause","options":[{"id":"overwrite","label":"Block overwritten (its new copy has been written)"},{"id":"delete","label":"File removed or truncated (freed range)"}]},{"id":"birth","options":[{"id":"after_snap","label":"Born after the latest snapshot"},{"id":"before_snap","label":"Born at or before the latest snapshot"},{"id":"after_special","label":"Born after the latest snapshot, but a gang, dedup or cloned block"}]},{"id":"owner","options":[{"id":"plain","label":"Ordinary file system (no extra steps)"},{"id":"clone","label":"Clone with a livelist"}]}],"steps":[{"wire":"E019"},{"wire":"E020"},{"wire":"E030","when":[{"group":"cause","options":["overwrite"]}]},{"wire":"E031","when":[{"group":"cause","options":["overwrite"]}]},{"wire":"E032","when":[{"group":"cause","options":["delete"]}]},{"wire":"E033","when":[{"group":"cause","options":["delete"]}]},{"wire":"E034","when":[{"group":"birth","options":["after_snap"]}]},{"wire":"E042","when":[{"group":"birth","options":["after_snap"]}],"note":"space reusable TXG_DEFER_SIZE txgs later"},{"wire":"E035","when":[{"group":"birth","options":["after_special"]}],"note":"freed by the background thread (path free_drain)"},{"wire":"E036","when":[{"group":"birth","options":["before_snap"]}],"note":"nothing is freed: the snapshot keeps the block"},{"wire":"E037","when":[{"group":"cause","options":["overwrite"]},{"group":"birth","options":["before_snap"]}]},{"wire":"E038"},{"wire":"E039"},{"wire":"E040","when":[{"group":"owner","options":["clone"]}],"note":"only for blocks born after the clone's origin"},{"wire":"E041","when":[{"group":"owner","options":["clone"]}]}]},{"id":"destroy_snapshot","category":"Destroy","title":"Destroy a snapshot","summary":"zfs destroy fs@snap. Next is the following snapshot, or the head if this is the newest snapshot. Next's deadlist is split at the destroyed snapshot's previous-snapshot txg: the newer part (blocks only this snapshot had) goes to the pool free list, the older part stays and receives this snapshot's own deadlist. For the oldest snapshot that txg is the pool origin's (1, or 0 on very old pools), older than any block, so everything on next's deadlist is freed.","ends":"The snapshot is gone and the command has returned, but its unique blocks are only queued on the pool free list; path free_drain frees them over the next txgs.","alts":[],"steps":[{"wire":"E076"},{"wire":"E002"},{"wire":"E009"},{"wire":"E015"},{"wire":"E016"},{"wire":"E017"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E023"},{"wire":"E049"},{"wire":"E050"},{"wire":"E051","note":"oldest snapshot: mintxg is older than any block, the whole deadlist goes"},{"wire":"E052"},{"wire":"E053"},{"wire":"E054"}]},{"id":"holds_defer","category":"Destroy","title":"Hold, deferred destroy and release","summary":"zfs hold keeps a snapshot; zfs destroy -d then only marks it, and the final zfs release destroys it in the same sync task.","ends":"The snapshot is destroyed as in path destroy_snapshot; its unique blocks wait on the pool free list (path free_drain).","alts":[],"steps":[{"wire":"E077"},{"wire":"E006","note":"zfs hold keep fs@s1"},{"wire":"E013"},{"wire":"E015"},{"wire":"E016"},{"wire":"E017"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E022","note":"tag added, ds_userrefs is 1"},{"wire":"E002","note":"zfs destroy -d fs@s1"},{"wire":"E009"},{"wire":"E015"},{"wire":"E016"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E023"},{"wire":"E047","note":"only marked: defer_destroy=on, nothing freed"},{"wire":"E007","note":"zfs release keep fs@s1"},{"wire":"E014"},{"wire":"E015"},{"wire":"E016"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E022","note":"last hold released"},{"wire":"E048"},{"wire":"E050"},{"wire":"E051"},{"wire":"E052"}]},{"id":"free_drain","category":"Free","title":"Background freeing of the pool free list","summary":"Every txg, in sync pass 1, dsl_scan_sync() frees blocks from dp_free_bpobj until its time or block budget runs out. This is where the space of destroyed snapshots and of parked gang, dedup and cloned blocks comes back.","ends":"The freeing pool property drops as blocks are freed; each freed segment is allocatable TXG_DEFER_SIZE txgs after the txg that freed it.","alts":[{"id":"kind","options":[{"id":"plain","label":"Ordinary block"},{"id":"special","label":"Gang, dedup or cloned block (free zio)"}]}],"steps":[{"wire":"E019"},{"wire":"E055"},{"wire":"E056"},{"wire":"E057"},{"wire":"E058"},{"wire":"E042","when":[{"group":"kind","options":["plain"]}]},{"wire":"E043","when":[{"group":"kind","options":["special"]}]},{"wire":"E044","when":[{"group":"kind","options":["special"]}]},{"wire":"E045","when":[{"group":"kind","options":["special"]}],"note":"a clone still references it: nothing is freed"},{"wire":"E046","when":[{"group":"kind","options":["special"]}]},{"wire":"E059","note":"budget used up: continue next txg"}]},{"id":"destroy_filesystem","category":"Destroy","title":"Destroy a file system","summary":"zfs destroy fs, after its snapshots are gone. The destroy itself takes one sync task; the blocks are freed afterwards, a slice per txg.","ends":"The dataset is gone after one txg; its space returns gradually while freeing counts down. Gang, dedup and cloned blocks take the free zio route of path free_drain.","alts":[{"id":"method","options":[{"id":"bptree","label":"async_destroy feature enabled (normal)"},{"id":"livelist","label":"The file system is a clone with a livelist"},{"id":"sync","label":"Old pool without async_destroy"}]}],"steps":[{"wire":"E076"},{"wire":"E003"},{"wire":"E010"},{"wire":"E015"},{"wire":"E016"},{"wire":"E017"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E024"},{"wire":"E060"},{"wire":"E061","when":[{"group":"method","options":["bptree"]}]},{"wire":"E062","when":[{"group":"method","options":["livelist"]}]},{"wire":"E063","when":[{"group":"method","options":["sync"]}]},{"wire":"E034","when":[{"group":"method","options":["sync"]}],"note":"every block is freed in this one txg"},{"wire":"E055","when":[{"group":"method","options":["bptree"]}],"note":"next txgs"},{"wire":"E056","when":[{"group":"method","options":["bptree"]}]},{"wire":"E064","when":[{"group":"method","options":["bptree"]}]},{"wire":"E065","when":[{"group":"method","options":["bptree"]}]},{"wire":"E066","when":[{"group":"method","options":["bptree"]}]},{"wire":"E058","when":[{"group":"method","options":["bptree"]}]},{"wire":"E067","when":[{"group":"method","options":["bptree"]}]},{"wire":"E068","when":[{"group":"method","options":["livelist"]}]},{"wire":"E069","when":[{"group":"method","options":["livelist"]}]},{"wire":"E042"}]},{"id":"rollback","category":"Rollback","title":"Roll back to the latest snapshot","summary":"zfs rollback fs@snap. The head swaps contents with a temporary clone of the snapshot; destroying that clone discards every block born after the snapshot, in the background.","ends":"The file system shows the snapshot's contents as soon as the command returns; the discarded blocks come back over the next txgs. On a pool without async_destroy the clone is destroyed as in the sync option of path destroy_filesystem.","alts":[],"steps":[{"wire":"E078"},{"wire":"E004"},{"wire":"E011"},{"wire":"E015"},{"wire":"E016"},{"wire":"E017"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E025"},{"wire":"E073"},{"wire":"E070"},{"wire":"E071"},{"wire":"E072"},{"wire":"E060","note":"the old head's deadlist: its blocks are still in the snapshot"},{"wire":"E061","note":"only blocks born after the snapshot will be freed"},{"wire":"E055","note":"next txgs"},{"wire":"E056"},{"wire":"E064"},{"wire":"E065"},{"wire":"E066"},{"wire":"E058"},{"wire":"E042"}]},{"id":"bookmark_create","category":"Bookmark","title":"Create a bookmark","summary":"zfs bookmark fs@snap fs#mark records the snapshot's identity without keeping any blocks.","ends":"The bookmark exists. Destroying its snapshot frees the snapshot's blocks as usual (path destroy_snapshot); the bookmark keeps the guid and txg, which is all an incremental zfs send -i fs#mark needs as its source (see `zfs-send-receive:incr_send`).","alts":[],"steps":[{"wire":"E079"},{"wire":"E005"},{"wire":"E012"},{"wire":"E015"},{"wire":"E016"},{"wire":"E017"},{"wire":"E018"},{"wire":"E019"},{"wire":"E020"},{"wire":"E026"},{"wire":"E074"}]}],"stages":[],"pipelines":[],"pipelineRuntimeNote":"","about":{"model":["A snapshot is a copy of one block pointer. Taking it copies no data: the snapshot and the head share every block, and the head remembers the snapshot's txg as `ds_prev_snap_txg`.","When the head stops using a block (overwrite or delete), one comparison decides its fate. Born after the latest snapshot (birth > `ds_prev_snap_txg`): only the head had it, so it is freed now. Otherwise the latest snapshot still has it, and it goes on the head's deadlist. That is why deleting files frees nothing while snapshots hold them.","A dataset's deadlist lists the blocks its previous snapshot references but it does not. It is split into sub-lists by birth txg. Taking a snapshot hands the head's deadlist to the new snapshot and gives the head a new, empty one.","Destroying a snapshot frees exactly the blocks on the next dataset's deadlist that were born after the destroyed snapshot's previous snapshot: only the destroyed snapshot had them. Its own deadlist moves to the next dataset. A snapshot's `used` property is this unique space.","Destroys give space back in the background. Snapshot destroys and file-system destroys only queue blocks (pool free list, bptree, clone livelist); `dsl_scan_sync()` frees a time-limited slice each txg. The pool property `freeing` shows what is left, and freed space is reusable only TXG_DEFER_SIZE (2) txgs later.","Rollback never rewinds blocks in place. The head swaps contents with a temporary clone of the latest snapshot, and that clone, which now holds everything written since the snapshot, is destroyed in the background.","A bookmark is a snapshot's guid and creation txg without any blocks. It costs no space, survives its snapshot and can still be the incremental source of `zfs send`.","All these operations are sync tasks: they run once in syncing context after the txg's data has been written, and the command returns when that txg is on disk."],"simplifications":["Old on-disk formats are not drawn: pre-deadlist pools (process_old_deadlist()) are left out, and pools without async_destroy appear only as the sync option of path destroy_filesystem.","Remap deadlists and obsolete counts (device removal) are left out, although the snapshot, destroy and block-kill code also maintains them.","Recursive commands are drawn for one dataset. zfs snapshot -r is still one sync task; zfs destroy -r issues one request per batch of snapshots and one per file system.","Promote, rename, clone creation and bookmark copy and destroy are not drawn. Clones appear only through their livelist and the rollback clone.","Space accounting is one node. Refreservation, quotas and the roll-up into parent directories are omitted.","The intent log of a destroyed dataset (zil_destroy_sync()) and intent-log blocks found by the old synchronous destroy are not drawn.","dsl_scan_sync() also runs scrubs and resilvers, and dsl_process_async_destroys() also processes the obsolete bpobj; only the free work is drawn.","The deadlist key bookkeeping for bookmarks and clones is summarised in two wires (E029, E054)."]},"timelines":[{"id":"snapshot_overwrite","title":"Snapshot, then overwrite a block twice","summary":"One snapshot and two overwrites of the same block. The first overwrite kills a block the snapshot shares, which goes on the deadlist; the second kills a block born after the snapshot, which is freed at once.","steps":[{"n":1,"txg":100,"caption":"fs holds blocks A and B and has no snapshot yet","path":null,"pathStep":null,"wires":[],"notes":["Without a snapshot, any block fs stops using is freed at once"],"datasets":[{"name":"fs","kind":"head","prev":null,"txg":null,"origin":null}],"blocks":[{"id":"A","birth":90,"in":["fs"],"dead":null,"state":"live"},{"id":"B","birth":95,"in":["fs"],"dead":null,"state":"live"}]},{"n":2,"txg":105,"caption":"zfs snapshot fs@s1 in txg 105","path":"snapshot_create","pathStep":11,"wires":["E027","E028"],"notes":["Nothing is copied. fs@s1 shares the root block pointer of fs, and the ds_prev_snap_txg of fs becomes 105."],"datasets":[{"name":"fs","kind":"head","prev":"fs@s1","txg":null,"origin":null},{"name":"fs@s1","kind":"snapshot","prev":null,"txg":105,"origin":null}],"blocks":[{"id":"A","birth":90,"in":["fs","fs@s1"],"dead":null,"state":"live"},{"id":"B","birth":95,"in":["fs","fs@s1"],"dead":null,"state":"live"}]},{"n":3,"txg":110,"caption":"Overwrite B. Its birth 95 is not greater than 105, so B goes on the deadlist of fs","path":"overwrite","pathStep":10,"wires":["E036","E038"],"notes":["No space comes back. B now counts in the used property of fs@s1 and in the usedbysnapshots property of fs."],"datasets":[{"name":"fs","kind":"head","prev":"fs@s1","txg":null,"origin":null},{"name":"fs@s1","kind":"snapshot","prev":null,"txg":105,"origin":null}],"blocks":[{"id":"A","birth":90,"in":["fs","fs@s1"],"dead":null,"state":"live"},{"id":"B","birth":95,"in":["fs@s1"],"dead":"fs","state":"live"},{"id":"B2","birth":110,"in":["fs"],"dead":null,"state":"live"}]},{"n":4,"txg":115,"caption":"Overwrite B2. Its birth 110 is greater than 105, so B2 is freed in this txg","path":"overwrite","pathStep":7,"wires":["E034","E042"],"notes":["metaslab_free() holds the space back for TXG_DEFER_SIZE (2) txgs"],"datasets":[{"name":"fs","kind":"head","prev":"fs@s1","txg":null,"origin":null},{"name":"fs@s1","kind":"snapshot","prev":nul
