<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZFS Pool Import and Export</title>
<style>
:root {
  --canvas: #1f1f1f;
  --panel: #262626;
  --panel-line: #333;
  --text: #dddddd;
  --muted: #9a9a9a;
  --accent: #ffd43b;
  --node-body: #353535;
  --node-border: #161616;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
  scrollbar-color: #4a4a4a #262626;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
code { font-family: var(--mono); font-size: 0.92em; background: #ffffff12; padding: 0 3px; border-radius: 3px; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--canvas);
  color: var(--text);
  font: 13px/1.4 var(--sans);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

button, .button, select, input {
  font: inherit;
  color: var(--text);
  background: #333;
  border: 1px solid #444;
  border-radius: 5px;
  padding: 3px 9px;
}
button, .button { cursor: pointer; }
button:hover, .button:hover { background: #3d3d3d; border-color: #555; }
button.active { background: #4a4122; border-color: var(--accent); color: #fff; }
button.icon { padding: 2px 7px; }
input[type="search"] { width: 100%; }
a { color: #74c0fc; text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- top bar ---------- */
#topbar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--panel-line);
}
#topbar h1 {
  font-size: 15px;
  margin: 0 6px 0 2px;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex: 0 1 auto;
}
#topbar > * { flex-shrink: 0; }
#topbar > h1 { flex-shrink: 1; }
#topbar button, #topbar .button, #topbar a { white-space: nowrap; }
#commit-link { font-family: var(--mono); font-size: 12px; color: var(--muted); }
#topbar .spacer { flex: 1; }

/* ---------- main layout ---------- */
#layout { flex: 1; display: flex; min-height: 0; }
#left, #right {
  background: var(--panel);
  overflow-y: auto;
  flex: none;
}
#left { width: 280px; border-right: 1px solid var(--panel-line); overflow-x: hidden; }
#right { width: 360px; border-left: 1px solid var(--panel-line); padding: 10px 12px 40px; }
body.hide-left #left, body.hide-right #right { display: none; }

.panel-section { padding: 10px 12px; border-bottom: 1px solid var(--panel-line); }
.panel-section h2, #right h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 0 0 6px;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; }

/* search */
.results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 240px; overflow-y: auto; }
.results li { padding: 3px 6px; border-radius: 4px; cursor: pointer; }
.results li:hover, .results li.first { background: #333; }
.results .kind { color: var(--muted); font-size: 11px; margin-right: 6px; }

/* path list */
.path-cat { margin: 8px 0 2px; font-size: 11px; color: var(--muted); }
.path-item {
  display: block;
  width: 100%;
  white-space: normal;
  text-align: left;
  border: 1px solid transparent;
  background: none;
  padding: 3px 6px;
  border-radius: 4px;
}
.path-item:hover { background: #313131; border-color: transparent; }
.path-item.active { background: #4a4122; border-color: var(--accent); }
.path-item .pid { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; }

/* group filters */
.gfilter { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.gfilter .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.gfilter .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gfilter select { padding: 1px 4px; font-size: 12px; }

/* ---------- canvas ---------- */
#canvas-wrap { flex: 1; position: relative; min-width: 0; overflow: hidden; }
#canvas { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
#canvas.panning { cursor: grabbing; }

.group-frame { stroke-width: 1; }
.group-title { font-size: 18px; font-weight: 700; cursor: move; }
.group-summary { font-size: 11px; fill: var(--muted); pointer-events: none; }

.node { cursor: pointer; }
.node .body { fill: var(--node-body); stroke: var(--node-border); stroke-width: 1; }
.node:hover .body { stroke: #6a6a6a; }
.node .title-text { fill: #eeeeee; font-size: 13px; font-weight: 600; pointer-events: none; }
.node .pill { fill: #00000055; stroke: #ffffff30; }
.node .pill-text { fill: #ddd; font-size: 10px; font-family: var(--mono); }
.node .sock-label { fill: #bdbdbd; font-size: 10px; font-variant: small-caps; letter-spacing: 0.04em; pointer-events: none; }
.node .foot { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
.node .foot.link { cursor: pointer; }
.node .foot.link:hover { fill: #cfcfcf; text-decoration: underline; }
.node .outline { fill: none; stroke: none; pointer-events: none; }
.node.selected .outline { stroke: #fff; stroke-width: 2; }
.node.onpath .outline { stroke: var(--accent); stroke-width: 2; }
.node.current .outline { stroke: var(--accent); stroke-width: 3; }
.node.current .body { filter: url(#glow); }
.node.ctxmark .outline { stroke: #63e6be; stroke-width: 2; stroke-dasharray: 5 3; }
.node.dim { opacity: 0.15; }
.node.proxy .body { stroke-dasharray: 6 4; stroke: #888; }

.wire, .hit, .alt-outline { vector-effect: non-scaling-stroke; }
/* Stroke widths are in screen pixels (non-scaling) and are narrowed when
   zoomed out; --wire-idle and --wire-lit are set by setViewTransform(). */
.wire { fill: none; stroke-width: var(--wire-idle, 2px); opacity: 0.55; pointer-events: none; }
.wire.ctl { stroke-dasharray: 6 4; }
.wire.lit { opacity: 1; stroke-width: var(--wire-lit, 3px); stroke-dasharray: 10 6; animation: flow 0.9s linear infinite; }
.wire.dim { opacity: 0.06; }
.wire.alt { opacity: 0.35; stroke-dasharray: 3 5; }
.wire.current { stroke-width: calc(var(--wire-lit, 3px) + 2px); opacity: 1; }
.wire.cmp-both { stroke: #ffffff !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-a { stroke: #ffd43b !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-b { stroke: #4dabf7 !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
@keyframes flow { to { stroke-dashoffset: -32; } }
@media (prefers-reduced-motion: reduce) { .wire.lit { animation: none; } }

.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; pointer-events: stroke; }
.alt-outline { fill: none; stroke: var(--accent); stroke-width: 6; stroke-dasharray: 4 6; opacity: 0.35; pointer-events: none; }

.badge circle { fill: #1f1f1f; stroke: var(--accent); stroke-width: 1.5; }
.badge text { fill: var(--accent); font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.dot { fill: #fff; stroke: var(--accent); stroke-width: 3; }

#caption {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  max-width: min(760px, 90%);
  background: #262626ee;
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  pointer-events: auto;
}
#caption .ref { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }

#legend {
  position: absolute;
  left: 10px;
  bottom: 10px;
  background: #262626e6;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 12px;
}
#legend .head { cursor: pointer; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
#legend.folded .item { display: none; }
#legend.folded .head { margin-bottom: 0; }
#legend .item { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 1px 2px; border-radius: 3px; }
#legend .item:hover { background: #333; }
#legend .item.off { opacity: 0.35; }
#legend .sw { width: 22px; height: 0; border-top: 3px solid; }
#legend .sw.dashed { border-top-style: dashed; }

#minimap {
  position: absolute;
  right: 10px;
  bottom: 10px;
  background: #1a1a1ae6;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  cursor: crosshair;
}

/* ---------- details panel ---------- */
#details h3 { font-size: 16px; margin: 0 0 4px; }
#details .sub { color: var(--muted); margin-bottom: 8px; }
#details section { margin: 12px 0; }
#details ul { margin: 4px 0; padding-left: 0; list-style: none; }
#details li { margin: 3px 0; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid #0006; }
.ref-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.ref-row .sym { font-family: var(--mono); font-size: 12px; }
.ref-row a { font-family: var(--mono); font-size: 11px; }
.ref-row .copy { font-size: 10px; padding: 0 5px; }
.ref-code { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: pre-wrap; word-break: break-all; margin: 0 0 4px 0; }
.io-row { cursor: pointer; padding: 3px 4px; border-radius: 4px; }
.io-row:hover { background: #313131; }
.io-row .other { font-weight: 600; }
.io-row .lbl { color: var(--muted); display: block; font-size: 12px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 11px; }
.tbl td, .tbl th { border-bottom: 1px solid #333; padding: 3px 4px; vertical-align: top; text-align: left; }
.tbl .on { color: var(--accent); }

.transport { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.transport input[type="range"] { width: 90px; padding: 0; }
.alt-select { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 8px; }
.alt-select select { width: 100%; }
.steps { max-height: 46vh; overflow-y: auto; border: 1px solid #333; border-radius: 6px; }
.step { padding: 3px 6px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #2d2d2d; }
.step:hover { background: #303030; }
.step.cur { background: #4a4122; }
.step.skip { opacity: 0.45; padding-left: 20px; }
.step .alt-head { display: block; font-size: 10px; color: var(--accent); }
.step .n { font-family: var(--mono); color: var(--accent); margin-right: 4px; }
.step .side { font-size: 10px; color: #63e6be; margin-left: 4px; }
.step .note { display: block; color: var(--muted); font-style: italic; }

/* ---------- suite navigation ---------- */
#suite-nav { display: inline-flex; align-items: center; gap: 8px; }
#suite-nav select { max-width: 230px; }
#index-link { font-size: 12px; }
.segmented { display: inline-flex; }
.segmented button { border-radius: 0; }
.segmented button:first-child { border-radius: 5px 0 0 5px; }
.segmented button:last-child { border-radius: 0 5px 5px 0; border-left: none; }
.also-link { display: block; }

/* ---------- timeline view ---------- */
#timeline-view {
  position: absolute;
  inset: 0;
  background: var(--canvas);
  overflow: auto;
  padding: 14px 18px 40px;
}
#tl-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
#tl-title { font-size: 16px; font-weight: 650; }
#tl-strip { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.tl-chip {
  border: 1px solid #444;
  background: #2a2a2a;
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 12px;
  cursor: pointer;
  max-width: 240px;
  text-align: left;
}
.tl-chip .txg { font-family: var(--mono); color: var(--accent); margin-right: 5px; }
.tl-chip.cur { border-color: var(--accent); background: #4a4122; }
#tl-caption {
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: #262626;
  padding: 8px 12px;
  margin-bottom: 14px;
}
#tl-caption .cap { font-weight: 600; }
#tl-caption .note { color: var(--muted); display: block; margin-top: 2px; }
#tl-caption .links { margin-top: 4px; font-size: 12px; }
#tl-caption .links a { margin-right: 10px; }
.tl-row { display: grid; grid-template-columns: 200px 1fr; gap: 10px; margin-bottom: 8px; align-items: start; }
.tl-label {
  background: #2b2b2b;
  border: 1px solid #3a3a3a;
  border-radius: 6px;
  padding: 5px 8px;
  cursor: pointer;
}
.tl-label:hover { border-color: #666; }
.tl-label .name { font-family: var(--mono); font-weight: 650; }
.tl-label .kind { color: var(--muted); font-size: 11px; display: block; }
.tl-lanes { display: flex; flex-direction: column; gap: 4px; }
.tl-lane { display: flex; flex-wrap: wrap; gap: 5px; min-height: 40px; align-items: center; padding: 3px 4px; border-radius: 6px; background: #ffffff06; }
.tl-lane.dead { min-height: 30px; background: #8ce99a14; border-left: 3px solid #8CE99A; }
.tl-lane .lane-tag { font-size: 10px; color: var(--muted); margin-right: 4px; }
.tl-tile {
  width: 52px;
  height: 34px;
  border-radius: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 12px;
  color: #111;
  border: 2px solid transparent;
  cursor: default;
  position: relative;
}
.tl-tile .birth { font-size: 9px; opacity: 0.8; }
.tl-tile.small { height: 26px; }
.tl-tile.new { border-color: var(--accent); box-shadow: 0 0 6px var(--accent); }
.tl-tile.changed { border-color: #63e6be; }
.tl-tile.freed { opacity: 0.35; text-decoration: line-through; }
.tl-tile.deferred { border: 2px dashed #ddd; }
.tl-tile.async { border: 2px dotted #ddd; }
.tl-arrow { color: var(--muted); font-size: 11px; display: block; }
#tl-legend { margin-top: 18px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
#tl-legend .tl-tile { width: 38px; height: 22px; font-size: 10px; }
.tl-summary { color: var(--muted); }

/* ---------- tooltip and about ---------- */
#tooltip {
  position: fixed;
  z-index: 50;
  max-width: 520px;
  background: #111;
  border: 1px solid #555;
  border-radius: 6px;
  padding: 6px 9px;
  font-size: 12px;
  pointer-events: none;
  box-shadow: 0 4px 16px #000a;
}
#tooltip .t-ref { font-family: var(--mono); font-size: 11px; margin-top: 4px; }
#tooltip .t-ref .loc { color: #74c0fc; }
#tooltip .t-ref .code { color: #bbb; display: block; white-space: pre; overflow: hidden; text-overflow: ellipsis; }

#about {
  position: fixed;
  inset: 0;
  background: #000a;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.about-box {
  position: relative;
  background: var(--panel);
  border: 1px solid #444;
  border-radius: 10px;
  max-width: 820px;
  max-height: 100%;
  overflow-y: auto;
  padding: 18px 24px;
}
.about-box .close { position: absolute; right: 10px; top: 10px; }
.about-box h2 { font-size: 17px; margin: 4px 0 8px; }
.about-box h3 { font-size: 13px; margin: 16px 0 6px; color: var(--accent); }
.about-box li { margin: 4px 0; }

</style>
</head>
<body>
<header id="topbar">
  <button id="toggle-left" class="icon" title="Show or hide the path panel">&#9776;</button>
  <h1>ZFS Pool Import and Export</h1>
  <a id="commit-link" target="_blank" rel="noopener"></a>
  <span id="suite-nav" hidden>
    <select id="graph-menu" title="Open another diagram of the suite"></select>
    <a id="index-link" href="index.html" title="All diagrams">All</a>
  </span>
  <span id="view-switch" class="segmented" hidden>
    <button id="btn-view-graph" class="active" title="Node graph">Graph</button><button id="btn-view-timeline" title="Timeline scenarios">Timeline</button>
  </span>
  <span class="spacer"></span>
  <button id="btn-fit" title="Fit everything (F)">Fit</button>
  <button id="btn-reset" title="Restore the default layout">Reset layout</button>
  <button id="btn-export" title="Export layout: save node positions to a JSON file">Export</button>
  <label class="button" title="Import layout: load node positions from a JSON file">Import<input id="file-import" type="file" accept="application/json,.json" hidden></label>
  <button id="btn-about">About</button>
  <button id="toggle-right" class="icon" title="Show or hide the details panel">&#9776;</button>
</header>

<main id="layout">
  <aside id="left">
    <div class="panel-section">
      <input id="search" type="search" placeholder="Search nodes, functions, files, tunables, wires  ( / )" autocomplete="off">
      <ul id="search-results" class="results"></ul>
    </div>
    <div class="panel-section">
      <h2>Paths</h2>
      <div id="path-list"></div>
    </div>
    <div class="panel-section" id="timeline-section" hidden>
      <h2>Timelines</h2>
      <div id="timeline-list"></div>
    </div>
    <div class="panel-section">
      <h2>Filters</h2>
      <label class="row">Context
        <select id="ctx-filter"><option value="">(none)</option></select>
      </label>
      <div id="group-filters"></div>
    </div>
  </aside>

  <section id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="12" cy="12" r="1.3" fill="#2c2c2c"></circle>
        </pattern>
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"></feDropShadow>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="160%">
          <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffd43b" flood-opacity="0.9"></feDropShadow>
        </filter>
      </defs>
      <rect id="grid-rect" x="0" y="0" width="100%" height="100%" fill="url(#grid)"></rect>
      <g id="root">
        <g id="layer-groups"></g>
        <g id="layer-wires"></g>
        <g id="layer-hits"></g>
        <g id="layer-nodes"></g>
        <g id="layer-badges"></g>
        <g id="layer-dot"></g>
      </g>
    </svg>
    <div id="caption" hidden></div>
    <div id="legend"></div>
    <canvas id="minimap" width="220" height="150"></canvas>
    <div id="timeline-view" hidden>
      <div id="tl-head">
        <div id="tl-title"></div>
        <div class="transport" id="tl-transport">
          <button id="tl-first" title="First step (Home)">|◀</button>
          <button id="tl-prev" title="Previous step (Left)">◀</button>
          <button id="tl-play" title="Play or pause (Space)">Play</button>
          <button id="tl-next" title="Next step (Right)">▶</button>
          <button id="tl-last" title="Last step (End)">▶|</button>
        </div>
      </div>
      <div id="tl-strip"></div>
      <div id="tl-caption"></div>
      <div id="tl-panel"></div>
      <div id="tl-legend"></div>
    </div>
  </section>

  <aside id="right">
    <div id="details"><p class="muted">Select a node, a wire or a path.</p></div>
  </aside>
</main>

<div id="tooltip" hidden></div>
<div id="about" hidden>
  <div class="about-box">
    <button id="about-close" class="icon close" title="Close">&#10005;</button>
    <div id="about-body"></div>
  </div>
</div>

ery, the cachefile reader, configuration assembly and the import, export and mount calls."},{"id":"kentry","title":"Kernel entry - ioctls, SPA","color":"#2B8A3E","col":2,"band":"full","subcols":1,"summary":"The pool ioctls, tryimport, import, export, unload and the namespace of imported pools."},{"id":"load","title":"spa_load() - opening the pool","color":"#E67700","col":3,"band":"full","subcols":3,"summary":"Every phase between a configuration nvlist and a usable pool: vdevs, labels, uberblock, host checks, MOS, features, logs, verification."},{"id":"mount","title":"Mount + ZIL","color":"#0C8599","col":6,"band":"top","subcols":2,"summary":"Mounting a file system after import, and the intent log claimed at import and replayed at mount."},{"id":"txg","title":"TXG sync, labels, background threads","color":"#1971C2","col":6,"band":"bottom","subcols":2,"summary":"The sync thread that writes labels and uberblocks, the MMP heartbeat, async work and the cachefile writer."},{"id":"dev","title":"Devices and files","color":"#495057","col":8,"band":"full","subcols":1,"summary":"Leaf devices, their labels, data and log devices, and the cachefile."}],"nodes":[{"id":"admin","group":"user","sub":0,"title":"Administrator","ctx":"user","src":"","fns":[],"role":"The person or script typing the command. Every path in this graph that a command starts begins with a wire from this node; the arrows that come back into a command node are its results, errors and refusals.","tunables":[],"props":[]},{"id":"boot_import","group":"user","sub":0,"title":"Boot import services (systemd)","ctx":"user","src":"etc/systemd/system/zfs-import-cache.service.in","fns":[],"role":"At boot on Linux with systemd, `zfs-import-cache.service` runs `zpool import -c /etc/zfs/zpool.cache -aN`; when the cachefile is missing or empty, `zfs-import-scan.service` runs `zpool import -aN -o cachefile=none` instead. Both import without mounting (`-N`); `zfs-mount.service` later runs `zfs mount -a`. The kernel module itself imports nothing at load time: the cachefile is read only by userspace.","tunables":[],"props":[]},{"id":"zpool_cmd","group":"user","sub":0,"title":"zpool(8) command","ctx":"user","src":"cmd/zpool/zpool_main.c","fns":[{"name":"zpool_do_import","ref":{"file":"cmd/zpool/zpool_main.c","line":4360,"symbol":"zpool_do_import","code":"zpool_do_import(int argc, char **argv)"}},{"name":"import_pools","ref":{"file":"cmd/zpool/zpool_main.c","line":3961,"symbol":"import_pools","code":"import_pools(nvlist_t *pools, nvlist_t *props, char *mntopts, int flags,"}},{"name":"do_import","ref":{"file":"cmd/zpool/zpool_main.c","line":3823,"symbol":"do_import","code":"do_import(nvlist_t *config, const char *newname, const char *mntopts,"}},{"name":"do_import_task","ref":{"file":"cmd/zpool/zpool_main.c","line":3951,"symbol":"do_import_task","code":"do_import_task(void *arg)"}},{"name":"show_import","ref":{"file":"cmd/zpool/zpool_main.c","line":3383,"symbol":"show_import","code":"show_import(nvlist_t *config, boolean_t report_error)"}},{"name":"zpool_do_export","ref":{"file":"cmd/zpool/zpool_main.c","line":2500,"symbol":"zpool_do_export","code":"zpool_do_export(int argc, char **argv)"}},{"name":"zpool_export_one","ref":{"file":"cmd/zpool/zpool_main.c","line":2417,"symbol":"zpool_export_one","code":"zpool_export_one(zpool_handle_t *zhp, void *data)"}}],"role":"`zpool import` builds the search arguments (`-d` directories or `ZPOOL_IMPORT_PATH`, `-c` cachefile, `-s` scan, pool name or numeric guid) and the load policy (`-F` do rewind, `-n` try rewind, `-X` extreme rewind, `-T` txg, `-M` relaxed metadata checks), searches, then lists the pools (no argument), imports all (`-a`, in parallel on a taskq) or the one named. `-o name=value` sets a pool property, `-o opts` gives mount options, `-R` sets altroot and cachefile=none. A failed `-c` import is retried once by scanning the directories named in the cachefile. `zpool export` unmounts and exports each named pool, or all pools in parallel with `-a`.","tunables":[],"props":[]},{"id":"force_check","group":"user","sub":0,"title":"Host check (zfs_force_import_required)","ctx":"user","src":"cmd/zpool/zpool_main.c","fns":[{"name":"zfs_force_import_required","ref":{"file":"cmd/zpool/zpool_main.c","line":3783,"symbol":"zfs_force_import_required","code":"zfs_force_import_required(nvlist_t *config)"}},{"name":"get_system_hostid","ref":{"file":"lib/libspl/os/linux/gethostid.c","line":50,"symbol":"get_system_hostid","code":"get_system_hostid(void)"}}],"role":"The only place the classic `-f` check lives: a pool whose state is not EXPORTED and whose hostid (from the MOS config, via tryimport) differs from this system's needs `-f`. It also refuses, without `-f`, when tryimport saw MMP activity or the pool has multihost=on and this system has no hostid. The kernel never reads the `-f` flag (ZFS_IMPORT_ANY_HOST).","tunables":[],"props":[]},{"id":"mount_lib","group":"user","sub":0,"title":"libzfs mount / unmount","ctx":"user","src":"lib/libzfs/libzfs_mount.c","fns":[{"name":"zpool_enable_datasets","ref":{"file":"lib/libzfs/libzfs_mount.c","line":1314,"symbol":"zpool_enable_datasets","code":"zpool_enable_datasets(zpool_handle_t *zhp, const char *mntopts, int flags,"}},{"name":"zfs_mount_one","ref":{"file":"lib/libzfs/libzfs_mount.c","line":1155,"symbol":"zfs_mount_one","code":"zfs_mount_one(zfs_handle_t *zhp, void *arg)"}},{"name":"zfs_mount_at","ref":{"file":"lib/libzfs/libzfs_mount.c","line":390,"symbol":"zfs_mount_at","code":"zfs_mount_at(zfs_handle_t *zhp, const char *options, int flags,"}},{"name":"zpool_disable_datasets","ref":{"file":"lib/libzfs/libzfs_mount.c","line":1388,"symbol":"zpool_disable_datasets","code":"zpool_disable_datasets(zpool_handle_t *zhp, boolean_t force)"}},{"name":"unmount_one","ref":{"file":"lib/libzfs/libzfs_mount.c","line":579,"symbol":"unmount_one","code":"unmount_one(zfs_handle_t *zhp, const char *mountpoint, int flags)"}}],"role":"After an import, `zpool_enable_datasets()` gathers every file system of the pool, mounts them in mountpoint order with a pool of threads (datasets whose key is not loaded are skipped), then shares them one by one. Before an export, `zpool_disable_datasets()` takes the pool's file systems from the mount table, not from the pool, unshares them, then unmounts them in reverse mountpoint order; `-f` passes MS_FORCE. Volumes are not handled here.","tunables":[],"props":[]},{"id":"libzutil_search","group":"user","sub":0,"title":"Pool search (zpool_search_import)","ctx":"user","src":"lib/libzutil/zutil_import.c","fns":[{"name":"zpool_search_import","ref":{"file":"lib/libzutil/zutil_import.c","line":1987,"symbol":"zpool_search_import","code":"zpool_search_import(libpc_handle_t *hdl, importargs_t *import)"}},{"name":"zpool_find_import","ref":{"file":"lib/libzutil/zutil_import.c","line":1946,"symbol":"zpool_find_import","code":"zpool_find_import(libpc_handle_t *hdl, importargs_t *iarg)"}},{"name":"zpool_find_import_impl","ref":{"file":"lib/libzutil/zutil_import.c","line":1576,"symbol":"zpool_find_import_impl","code":"zpool_find_import_impl(libpc_handle_t *hdl, importargs_t *iarg,"}}],"role":"Chooses between the cachefile and a device search. For a device search it opens every candidate on a taskq (about two threads per CPU), reads its labels, keeps those of the requested pool (by name or guid, spares and cache devices always), drops devices that cannot be opened exclusively (for example multipath members), and hands the labels to configuration assembly.","tunables":[],"props":[]},{"id":"dev_scan","group":"user","sub":0,"title":"Device discovery (blkid / directory scan)","ctx":"user","src":"lib/libzutil/os/linux/zutil_import_os.c","fns":[{"name":"zpool_find_import_blkid","ref":{"file":"lib/libzutil/os/linux/zutil_import_os.c","line":324,"symbol":"zpool_find_import_blkid","code":"zpool_find_import_blkid(libpc_handle_t *hdl, pthread_mutex_t *lock,"}},{"name":"zpool_find_import_scan","ref":{"file":"lib/libzutil/zutil_import.c","line":1511,"symbol":"zpool_find_import_scan","code":"zpool_find_import_scan(libpc_handle_t *hdl, pthread_mutex_t *lock,"}},{"name":"zpool_find_import_scan_dir","ref":{"file":"lib/libzutil/zutil_import.c","line":1410,"symbol":"zpool_find_import_scan_dir","code":"zpool_find_import_scan_dir(libpc_handle_t *hdl, pthread_mutex_t *lock,"}},{"name":"zpool_default_search_paths","ref":{"file":"lib/libzutil/os/linux/zutil_import_os.c","line":276,"symbol":"zpool_default_search_paths","code":"zpool_default_search_paths(size_t *count)"}}],"role":"Produces the list of candidate devices. By default on Linux it asks libblkid for every device of TYPE zfs_member. With `-d`, ZPOOL_IMPORT_PATH or `-s` it lists every entry of the given directories, or of the default search path (/dev/disk/by-vdev, /dev/mapper, by-partlabel, by-partuuid, by-label, by-uuid, by-id, by-path, then /dev). Each candidate gets a preference order, used later to pick the best name for a device found under several paths.","tunables":[],"props":[]},{"id":"cache_read","group":"user","sub":0,"title":"Cachefile reader","ctx":"user","src":"lib/libzutil/zutil_import.c","fns":[{"name":"zpool_find_import_cached","ref":{"file":"lib/libzutil/zutil_import.c","line":1770,"symbol":"zpool_find_import_cached","code":"zpool_find_import_cached(libpc_handle_t *hdl, importargs_t *iarg)"}},{"name":"discover_cached_paths","ref":{"file":"lib/libzutil/zutil_import.c","line":1725,"symbol":"discover_cached_paths","code":"discover_cached_paths(libpc_handle_t *hdl, nvlist_t *nv,"}}],"role":"`zpool import -c <file>`: reads and unpacks the whole cachefile and takes each pool's configuration from it as is, skipping pools already imported. No label is read in userspace, so paths in the cachefile must still be right. In the fallback scan after a failed cachefile import, only the directories that hold the cached device paths are scanned for that pool's guid.","tunables":[],"props":[]},{"id":"label_read_user","group":"user","sub":1,"title":"Label reader (zpool_open_func)","ctx":"user","src":"lib/libzutil/os/linux/zutil_import_os.c","fns":[{"name":"zpool_open_func","ref":{"file":"lib/libzutil/os/linux/zutil_import_os.c","line":141,"symbol":"zpool_open_func","code":"zpool_open_func(void *arg)"}},{"name":"zpool_read_label","ref":{"file":"lib/libzutil/zutil_import.c","line":1136,"symbol":"zpool_read_label","code":"zpool_read_label(int fd, nvlist_t **config, int *num_labels)"}}],"role":"Opens one candidate read-only (O_DIRECT when possible, to avoid stale multipath caches) and reads the configuration nvlist of each of its four labels in one asynchronous batch. The first valid label supplies the config and the others with the same vdev guid are counted; labels with txg 0 (written before the device was in use) are skipped, and a device with no valid label is ignored. When a label names another path or devid for the same vdev, that path is tried too. Uberblocks are not read in userspace.","tunables":[],"props":[]},{"id":"get_configs","group":"user","sub":1,"title":"Configuration assembly (get_configs)","ctx":"user","src":"lib/libzutil/zutil_import.c","fns":[{"name":"add_config","ref":{"file":"lib/libzutil/zutil_import.c","line":396,"symbol":"add_config","code":"add_config(libpc_handle_t *hdl, pool_list_t *pl, const char *path,"}},{"name":"get_configs","ref":{"file":"lib/libzutil/zutil_import.c","line":575,"symbol":"get_configs","code":"get_configs(libpc_handle_t *hdl, pool_list_t *pl, boolean_t active_ok,"}},{"name":"fix_paths","ref":{"file":"lib/libzutil/zutil_import.c","line":266,"symbol":"fix_paths","code":"fix_paths(libpc_handle_t *hdl, nvlist_t *nv, name_entry_t *names,"}}],"role":"Groups the labels by pool guid, then by top-level vdev guid, then by txg. For each top-level vdev the label with the highest txg supplies that vdev's subtree; the pool-wide fields (name, state, hostid, number of top-level vdevs, holes) come from the newest label of all. Missing top-level vdevs become placeholders. Each device's path is set to the best name it was found under. Pools already imported here are dropped, and each remaining configuration is sent to the kernel for a tryimport.","tunables":[],"props":[]},{"id":"libzfs_import","group":"user","sub":1,"title":"libzfs import / tryimport","ctx":"user","src":"lib/libzfs/libzfs_pool.c","fns":[{"name":"refresh_config","ref":{"file":"lib/libzfs/libzfs_import.c","line":60,"symbol":"refresh_config","code":"refresh_config(libzfs_handle_t *hdl, nvlist_t *config)"}},{"name":"zpool_import_props","ref":{"file":"lib/libzfs/libzfs_pool.c","line":2361,"symbol":"zpool_import_props","code":"zpool_import_props(libzfs_handle_t *hdl, nvlist_t *config, const char *newname,"}},{"name":"zpool_explain_recover","ref":{"file":"lib/libzfs/libzfs_pool.c","line":2184,"symbol":"zpool_explain_recover","code":"zpool_explain_recover(libzfs_handle_t *hdl, const char *name, int reason,"}},{"name":"zpool_rewind_exclaim","ref":{"file":"lib/libzfs/libzfs_pool.c","line":2111,"symbol":"zpool_rewind_exclaim","code":"zpool_rewind_exclaim(libzfs_handle_t *hdl, const char *name, nvlist_t *config)"}}],"role":"Wraps the two import ioctls. `refresh_config()` sends a configuration for a tryimport and returns the kernel's version of it. `zpool_import_props()` validates the new name and the `-o` properties, sends the import, and turns the kernel's errors and load information into messages: unsupported features, the host that holds the pool, missing log devices, or what a rewind would cost.","tunables":[],"props":[]},{"id":"libzfs_export","group":"user","sub":1,"title":"libzfs export","ctx":"user","src":"lib/libzfs/libzfs_pool.c","fns":[{"name":"zpool_export","ref":{"file":"lib/libzfs/libzfs_pool.c","line":2095,"symbol":"zpool_export","code":"zpool_export(zpool_handle_t *zhp, boolean_t force, const char *log_str)"}},{"name":"zpool_export_force","ref":{"file":"lib/libzfs/libzfs_pool.c","line":2105,"symbol":"zpool_export_force","code":"zpool_export_force(zpool_handle_t *zhp, const char *log_str)"}},{"name":"zpool_export_common","ref":{"file":"lib/libzfs/libzfs_pool.c","line":2058,"symbol":"zpool_export_common","code":"zpool_export_common(zpool_handle_t *zhp, boolean_t force, boolean_t hardforce,"}}],"role":"Sends ZFS_IOC_POOL_EXPORT. `zpool_export()` passes force (from `zpool export -f`), which only overrides the active shared spare check; `zpool_export_force()` (from `-F`) also passes hardforce. The caller must have unmounted the file systems first.","tunables":[],"props":[]},{"id":"ioc_pool","group":"kentry","sub":0,"title":"Pool ioctls (tryimport, import, export)","ctx":"syscall","src":"module/zfs/zfs_ioctl.c","fns":[{"name":"zfs_ioc_pool_tryimport","ref":{"file":"module/zfs/zfs_ioctl.c","line":1900,"symbol":"zfs_ioc_pool_tryimport","code":"zfs_ioc_pool_tryimport(zfs_cmd_t *zc)"}},{"name":"zfs_ioc_pool_import","ref":{"file":"module/zfs/zfs_ioctl.c","line":1793,"symbol":"zfs_ioc_pool_import","code":"zfs_ioc_pool_import(zfs_cmd_t *zc)"}},{"name":"zfs_ioc_pool_export","ref":{"file":"module/zfs/zfs_ioctl.c","line":1830,"symbol":"zfs_ioc_pool_export","code":"zfs_ioc_pool_export(zfs_cmd_t *zc)"}}],"role":"Kernel entry for ZFS_IOC_POOL_TRYIMPORT, ZFS_IOC_POOL_IMPORT and ZFS_IOC_POOL_EXPORT. Import and tryimport return the configuration, including the load information, in the destination nvlist even when they fail, which is how userspace learns why.","tunables":[],"props":[]},{"id":"spa_tryimport","group":"kentry","sub":0,"title":"spa_tryimport()","ctx":"syscall","src":"module/zfs/spa.c","fns":[{"name":"spa_tryimport","ref":{"file":"module/zfs/spa.c","line":7819,"symbol":"spa_tryimport","code":"spa_tryimport(nvlist_t *tryconfig)"}}],"role":"Loads the pool read-only under a temporary name (`$import-<thread>-<pool>`) with a missing log device tolerated, then generates a full configuration from whatever opened: vdev tree with states, pool state, the loaded uberblock's timestamp, the load information (MMP state, enabled and unsupported features, the MOS hostid and hostname), spares, cache devices and bootfs. Then it unloads and removes the temporary pool. Nothing is written.","tunables":[],"props":[]},{"id":"spa_import","group":"kentry","sub":0,"title":"spa_import()","ctx":"syscall","src":"module/zfs/spa.c","fns":[{"name":"spa_import","ref":{"file":"module/zfs/spa.c","line":7637,"symbol":"spa_import","code":"spa_import(char *pool, nvlist_t *config, nvlist_t *props, uint64_t flags)"}},{"name":"spa_activate","ref":{"file":"module/zfs/spa.c","line":1810,"symbol":"spa_activate","code":"spa_activate(spa_t *spa, spa_mode_t mode)"}},{"name":"spa_configfile_set","ref":{"file":"module/zfs/spa.c","line":956,"symbol":"spa_configfile_set","code":"spa_configfile_set(spa_t *spa, nvlist_t *nvp, boolean_t need_sync)"}}],"role":"Refuses a name already in use, creates the spa_t, activates it read-write or read-only (`readonly=on` in the properties), keeps async work suspended, loads the pool with the rewind policy, and on success applies the properties, refreshes spares and cache devices, updates the config and cachefile (writeable pools only), requests autoexpand, logs the import in the pool history and creates zvol devices. On failure it unloads and removes the spa_t again.","tunables":[],"props":[{"name":"readonly","ref":{"file":"module/zcommon/zpool_prop.c","line":205,"symbol":"\"readonly\"","code":"zprop_register_index(ZPOOL_PROP_READONLY, \"readonly\", 0,"}},{"name":"altroot","ref":{"file":"module/zcommon/zpool_prop.c","line":98,"symbol":"\"altroot\"","code":"zprop_register_string(ZPOOL_PROP_ALTROOT, \"altroot\", NULL, PROP_DEFAULT,"}}]},{"id":"spa_export","group":"kentry","sub":0,"title":"spa_export_common()","ctx":"syscall","src":"module/zfs/spa.c","fns":[{"name":"spa_export","ref":{"file":"module/zfs/spa.c","line":8185,"symbol":"spa_export","code":"spa_export(const char *pool, nvlist_t **oldconfig, boolean_t force,"}},{"name":"spa_export_common","ref":{"file":"module/zfs/spa.c","line":7957,"symbol":"spa_export_common","code":"spa_export_common(const char *pool, int new_state, nvlist_t **oldconfig,"}}],"role":"Export (and, with other states, destroy and reset). Marks the pool as exporting, stops async work, waits for a txg so that objsets held only by dirty data are released, then refuses with EBUSY if anything still holds the pool. Removes zvol devices, refuses an active shared spare unless forced, stops initialize, TRIM, rebuild and L2ARC rebuild, sets the pool state to EXPORTED and dirties every label (unless hardforce), may flush metaslabs to shrink the log space maps, fixes the final txg, unloads, rewrites the cachefile without the pool (unless hardforce) and removes it from the namespace.","tunables":[],"props":[]},{"id":"spa_unload","group":"kentry","sub":0,"title":"spa_unload()","ctx":"syscall","src":"module/zfs/spa.c","fns":[{"name":"spa_unload","ref":{"file":"module/zfs/spa.c","line":2317,"symbol":"spa_unload","code":"spa_unload(spa_t *spa)"}},{"name":"spa_deactivate","ref":{"file":"module/zfs/spa.c","line":1941,"symbol":"spa_deactivate","code":"spa_deactivate(spa_t *spa)"}}],"role":"Tears a loaded pool down: stops the sync threads after the final txgs, stops the MMP thread, waits for outstanding async I/O, closes every vdev, closes the DSL pool and unloads DDT, BRT and the log space maps. Also used between load attempts and after a tryimport.","tunables":[],"props":[]},{"id":"spa_ns","group":"kentry","sub":0,"title":"SPA namespace","ctx":"syscall","src":"module/zfs/spa_misc.c","fns":[{"name":"spa_lookup","ref":{"file":"module/zfs/spa_misc.c","line":757,"symbol":"spa_lookup","code":"spa_lookup(const char *name)"}},{"name":"spa_add","ref":{"file":"module/zfs/spa_misc.c","line":814,"symbol":"spa_add","code":"spa_add(const char *name, nvlist_t *config, const char *altroot)"}},{"name":"spa_remove","ref":{"file":"module/zfs/spa_misc.c","line":956,"symbol":"spa_remove","code":"spa_remove(spa_t *spa)"}}],"role":"The kernel's AVL tree of spa_t by name, under spa_namespace_lock. A pool is \"imported\" exactly while it is in this tree. `spa_add()` also decides the cachefile: the default path unless an altroot is given. A lookup of a pool that is being exported waits until the export finishes.","tunables":[],"props":[]},{"id":"load_best","group":"load","sub":0,"title":"spa_load_best(): rewind loop","ctx":"syscall","src":"module/zfs/spa.c","fns":[{"name":"spa_load_best","ref":{"file":"module/zfs/spa.c","line":6510,"symbol":"spa_load_best","code":"spa_load_best(spa_t *spa, spa_load_state_t state, uint64_t max_request,"}},{"name":"spa_load_retry","ref":{"file":"module/zfs/spa.c","line":6483,"symbol":"spa_load_retry","code":"spa_load_retry(spa_t *spa, spa_load_state_t state)"}}],"role":"Runs `spa_load()` and, when it fails for a reason a rewind could fix, loads again with the maximum txg set just below the uberblock that failed, until a load succeeds or the minimum txg is passed: the newest txg minus TXG_DEFER_SIZE normally, TXG_INITIAL with `-X`. In RECOVER state (`-F`) the first good load is the pool and the intent logs are discarded. Otherwise the original error is returned and the older loads, which wrote nothing, are reported as rewind information. Errors that a rewind cannot fix (another host active, interrupted, no checkpoint) end the search at once.","tunables":[],"props":[]},{"id":"spa_load","group":"load","sub":0,"title":"spa_load() / spa_load_impl()","ctx":"syscall","src":"module/zfs/spa.c","fns":[{"name":"spa_load","ref":{"file":"module/zfs/spa.c","line":3773,"symbol":"spa_load","code":"spa_load(spa_t *spa, spa_load_state_t state, spa_import_type_t type)"}},{"name":"spa_load_impl","ref":{"file":"module/zfs/spa.c","line":6159,"symbol":"spa_load_impl","code":"spa_load_impl(spa_t *spa, spa_import_type_t type, const char **ereport)"}},{"name":"spa_ld_mos_init","ref":{"file":"module/zfs/spa.c","line":5940,"symbol":"spa_ld_mos_init","code":"spa_ld_mos_init(spa_t *spa, spa_import_type_t type)"}},{"name":"spa_ld_mos_with_trusted_config","ref":{"file":"module/zfs/spa. ,"code":"spa_ld_select_uberblock_done(spa_t *spa, uberblock_t *ub)"}}],"role":"Reads every uberblock slot of every trusted label of every readable leaf and keeps the best one not above spa_load_max_txg: highest txg, then latest timestamp, then highest MMP sequence. Each sync writes its uberblock into slot txg modulo the ring size, so the rings hold the most recent txgs. The configuration of that uberblock's txg is then read from the same leaf. Runs the multihost check, refuses an unsupported version or an unknown feature in the label's features_for_read, and sets the first txg the pool will write: normally the loaded txg + 1, but above the newest uberblock seen when an older txg was requested.","tunables":[],"props":[]},{"id":"mmp_check","group":"load","sub":1,"title":"MMP activity check and claim","ctx":"syscall","src":"module/zfs/spa.c","fns":[{"name":"spa_activity_check_required","ref":{"file":"module/zfs/spa.c","line":3939,"symbol":"spa_activity_check_required","code":"spa_activity_check_required(spa_t *spa, uberblock_t *ub, nvlist_t *label)"}},{"name":"spa_ld_activity_check","ref":{"file":"module/zfs/spa.c","line":4499,"symbol":"spa_ld_activity_check","code":"spa_ld_activity_check(spa_t *spa, uberblock_t *ub, nvlist_t *label)"}},{"name":"spa_activity_check_duration","ref":{"file":"module/zfs/spa.c","line":4005,"symbol":"spa_activity_check_duration","code":"spa_activity_check_duration(spa_t *spa, uberblock_t *ub)"}},{"name":"spa_activity_check_tryimport","ref":{"file":"module/zfs/spa.c","line":4228,"symbol":"spa_activity_check_tryimport","code":"spa_activity_check_tryimport(spa_t *spa, uberblock_t *spa_ub,"}},{"name":"spa_activity_verify_config","ref":{"file":"module/zfs/spa.c","line":3859,"symbol":"spa_activity_verify_config","code":"spa_activity_verify_config(spa_t *spa, uberblock_t *ub)"}},{"name":"spa_activity_check_claim","ref":{"file":"module/zfs/spa.c","line":4335,"symbol":"spa_activity_check_claim","code":"spa_activity_check_claim(spa_t *spa)"}},{"name": f":{"file":"module/os/linux/zfs/zpl_super.c","line":839,"symbol":"zpl_get_tree","code":"zpl_get_tree(struct fs_context *fc)"}},{"name":"zfsvfs_setup","ref":{"file":"module/os/linux/zfs/zfs_vfsops.c","line":716,"symbol":"zfsvfs_setup","code":"zfsvfs_setup(zfsvfs_t *zfsvfs, boolean_t mounting)"}}],"role":"mount(2) of a ZFS file system: owns the dataset, sets up the zfsvfs, opens its ZIL and, on a writeable pool, replays it before the mount completes (a read-only mount lifts its read-only flag for the replay). Linux names; FreeBSD has the equivalents in its own zfs_vfsops.c.","tunables":[],"props":[]},{"id":"vfs_umount","group":"mount","sub":0,"title":"Kernel unmount (zfs_umount)","ctx":"syscall","src":"module/os/linux/zfs/zfs_vfsops.c","fns":[{"name":"zfs_umount","ref":{"file":"module/os/linux/zfs/zfs_vfsops.c","line":1612,"symbol":"zfs_umount","code":"zfs_umount(struct super_block *sb)"}},{"name":"zfsvfs_teardown","ref":{"file":"module/os/linux/zfs/zfs_vfsops.c","line":1245,"symbol":"zfsvfs_teardown","code":"zfsvfs_teardown(zfsvfs_t *zfsvfs, boolean_t unmounting)"}}],"role":"umount(2) of a ZFS file system: `zfsvfs_teardown()` closes the ZIL, so outstanding log records are committed, and the dataset is disowned, which drops its hold on the pool. Until every file system of the pool is unmounted this way, the export cannot pass its reference check.","tunables":[],"props":[]},{"id":"zil_replay","group":"mount","sub":1,"title":"zil_claim() / zil_replay()","ctx":"open","src":"module/zfs/zil.c","fns":[{"name":"zil_claim","ref":{"file":"module/zfs/zil.c","line":1169,"symbol":"zil_claim","code":"zil_claim(dsl_pool_t *dp, dsl_dataset_t *ds, void *txarg)"}},{"name":"zil_parse","ref":{"file":"module/zfs/zil.c","line":468,"symbol":"zil_parse","code":"zil_parse(zilog_t *zilog, zil_parse_blk_func_t *parse_blk_func,"}},{"name":"zil_claim_log_block","ref":{"file":"module/zfs/zil.c","line":617,"symbol":"zil_claim_log_block","code":"zil_claim_log_block(zilog_t *zilog, const blkptr_t *b p, so that a crash at any point leaves labels that match a valid uberblock.","tunables":[],"props":[]},{"id":"mmp","group":"txg","sub":1,"title":"MMP heartbeat thread","ctx":"thr","src":"module/zfs/mmp.c","fns":[{"name":"mmp_thread_start","ref":{"file":"module/zfs/mmp.c","line":246,"symbol":"mmp_thread_start","code":"mmp_thread_start(spa_t *spa)"}},{"name":"mmp_thread","ref":{"file":"module/zfs/mmp.c","line":729,"symbol":"mmp_thread","code":"mmp_thread(void *arg)"}},{"name":"mmp_write_uberblock","ref":{"file":"module/zfs/mmp.c","line":454,"symbol":"mmp_write_uberblock","code":"mmp_write_uberblock(spa_t *spa)"}},{"name":"mmp_update_uberblock","ref":{"file":"module/zfs/mmp.c","line":436,"symbol":"mmp_update_uberblock","code":"mmp_update_uberblock(spa_t *spa, uberblock_t *ub)"}},{"name":"mmp_thread_stop","ref":{"file":"module/zfs/mmp.c","line":263,"symbol":"mmp_thread_stop","code":"mmp_thread_stop(spa_t *spa)"}}],"role":"Started with every writeable import, writes only while multihost=on. It keeps rewriting the last synced uberblock, with a fresh timestamp and sequence number, into the reserved MMP slots of the label rings: one leaf every zfs_multihost_interval divided by the number of leaves. This is the heartbeat another host's import watches for. If no write succeeds for zfs_multihost_fail_intervals times the interval it suspends the pool, so it stops writing before an importer's check could end.","tunables":[{"name":"zfs_multihost_interval","ref":{"file":"module/zfs/mmp.c","line":926,"symbol":"interval","code":"ZFS_MODULE_PARAM_CALL(zfs_multihost, zfs_multihost_, interval,"}},{"name":"zfs_multihost_fail_intervals","ref":{"file":"module/zfs/mmp.c","line":930,"symbol":"fail_intervals","code":"ZFS_MODULE_PARAM(zfs_multihost, zfs_multihost_, fail_intervals, UINT, ZMOD_RW,"}}],"props":[{"name":"multihost","ref":{"file":"module/zcommon/zpool_prop.c","line":208,"symbol":"\"multihost\"","code":"zprop_register_index(ZPOOL_PROP_MULTIHOST, \"multihost\", 0,"}}]},{"id":"spa_as ile. `spa_write_cachefile()` writes, for each cachefile this pool uses or used, the configs of every writeable pool that uses it, in place (truncate, write, fsync); a cachefile left with no pools is removed. Read-only pools and pools with cachefile=none (or an altroot) are never written.","tunables":[{"name":"spa_config_path","ref":{"file":"module/zfs/spa_config.c","line":536,"symbol":"config_path","code":"ZFS_MODULE_PARAM(zfs_spa, spa_, config_path, STRING, ZMOD_RD,"}}],"props":[{"name":"cachefile","ref":{"file":"module/zcommon/zpool_prop.c","line":102,"symbol":"\"cachefile\"","code":"zprop_register_string(ZPOOL_PROP_CACHEFILE, \"cachefile\", NULL,"}}]},{"id":"vdev_leaf","group":"dev","sub":0,"title":"Leaf vdev driver","ctx":"any","src":"module/os/linux/zfs/vdev_disk.c","fns":[{"name":"vdev_disk_open","ref":{"file":"module/os/linux/zfs/vdev_disk.c","line":298,"symbol":"vdev_disk_open","code":"vdev_disk_open(vdev_t *v, uint64_t *psize, uint64_t *max_psize,"}},{"name":"vdev_disk_close","ref":{"file":"module/os/linux/zfs/vdev_disk.c","line":542,"symbol":"vdev_disk_close","code":"vdev_disk_close(vdev_t *v)"}},{"name":"vdev_geom_open","ref":{"file":"module/os/freebsd/zfs/vdev_geom.c","line":796,"symbol":"vdev_geom_open","code":"vdev_geom_open(vdev_t *vd, uint64_t *psize, uint64_t *max_psize,"}}],"role":"Shared with the I/O flow graph. Opens a leaf device by the absolute path in the config (Linux `vdev_disk_open()`, which retries for a short while when the device node does not exist yet; FreeBSD `vdev_geom_open()`), and releases it when the vdev is closed.","tunables":[],"props":[]},{"id":"dev_labels","group":"dev","sub":0,"title":"Labels L0-L3 + uberblock ring","ctx":"hw","src":"","fns":[],"role":"Shared with the I/O flow graph. Four labels per leaf, two at the start and two at the end of the device. Each holds the vdev configuration nvlist (pool name and guid, state, txg, hostid and hostname, this vdev's top-level subtree) and a ring of uberblocks; with multihost=on th iscovery","title":"zpool import: listing importable pools","summary":"`zpool import` with no pool name. Userspace reads the labels of every candidate device and assembles one configuration per pool; the kernel test-loads each read-only and reports what it found. Nothing is written anywhere.","ends":"Each pool found is printed with its name, id, state, status and vdev tree, or \"no pools available to import\". The temporary pool is unloaded and removed; no device was written. A pool with `multihost=on` also runs the activity check here (path `mmp`).","alts":[{"id":"src","options":[{"id":"blkid","label":"default: devices libblkid knows as zfs_member"},{"id":"dirs","label":"-d directories, ZPOOL_IMPORT_PATH, or -s (default search path)"}]}],"steps":[{"wire":"E103"},{"wire":"E001"},{"wire":"E002","when":[{"group":"src","options":["blkid"]}],"note":"zpool_find_import_blkid(): every device with TYPE=zfs_member, ranked by zfs_path_order()"},{"wire":"E002","when":[{"group":"src","options":["dirs"]}],"note":"zpool_find_import_scan(): every entry of each directory, ranked by directory order"},{"wire":"E003"},{"wire":"E004"},{"wire":"E005"},{"wire":"E006"},{"wire":"E007"},{"wire":"E008"},{"wire":"E009"},{"wire":"E010"},{"wire":"E011"},{"wire":"E012","note":"config source SPA_CONFIG_SRC_SCAN: zfs_max_missing_tvds_scan (0) missing top-level vdevs allowed at this stage"},{"wire":"E013"},{"wire":"E014"},{"wire":"E015"},{"wire":"E016"},{"wire":"E017"},{"wire":"E018"},{"wire":"E022"},{"wire":"E024"},{"wire":"E025"},{"wire":"E026"},{"wire":"E030","note":"tryimport always runs with ZFS_IMPORT_MISSING_LOG: a missing log device only drops the log here"},{"wire":"E034","note":"for a tryimport the write features are checked too, to tell userspace whether readonly=on would be needed"},{"wire":"E036"},{"wire":"E041"},{"wire":"E042"},{"wire":"E043"}]},{"id":"import","category":"Import","title":"zpool import <pool>: a normal import","summary":"Import by name (or numeric id). After the search and tryimport of path `discover`, zpool(8) checks the host, the kernel loads the pool for real, and a writeable load ends by claiming the logs, starting the sync thread and rewriting labels and cachefile. Then the file systems are mounted.","ends":"The pool is in the namespace and syncing. Every label says ACTIVE with this host's hostid, the cachefile lists the pool, and any resilver or config update runs from the async thread. With `-N` nothing is mounted and the claimed log records wait for the first mount (`zfs mount`); the replay itself is path `zil`.","alts":[{"id":"mnt","options":[{"id":"mount","label":"mount and share the file systems"},{"id":"noimport","label":"-N: import only, mount nothing"}]}],"steps":[{"wire":"E103"},{"wire":"E001","note":"with a name, only labels of that pool are kept; search and tryimport run as in path discover"},{"wire":"E043"},{"wire":"E044"},{"wire":"E046"},{"wire":"E047"},{"wire":"E048"},{"wire":"E049"},{"wire":"E050"},{"wire":"E051"},{"wire":"E011"},{"wire":"E012","note":"config source SPA_CONFIG_SRC_TRYIMPORT: no missing top-level vdev beyond zfs_max_missing_tvds"},{"wire":"E013"},{"wire":"E014"},{"wire":"E015"},{"wire":"E016"},{"wire":"E017"},{"wire":"E018"},{"wire":"E022"},{"wire":"E024"},{"wire":"E025"},{"wire":"E026"},{"wire":"E030"},{"wire":"E034"},{"wire":"E036"},{"wire":"E037"},{"wire":"E038"},{"wire":"E039"},{"wire":"E040"},{"wire":"E058"},{"wire":"E059"},{"wire":"E060"},{"wire":"E061"},{"wire":"E062"},{"wire":"E065"},{"wire":"E052"},{"wire":"E054"},{"wire":"E068"},{"wire":"E070"},{"wire":"E072"},{"wire":"E073"},{"wire":"E074"},{"wire":"E075"},{"wire":"E071"},{"wire":"E066"},{"wire":"E055"},{"wire":"E042"},{"wire":"E057"},{"wire":"E079","when":[{"group":"mnt","options":["mount"]}]},{"wire":"E080","when":[{"group":"mnt","options":["mount"]}]},{"wire":"E081","when":[{"group":"mnt","options":["mount"]}]}]},{"id":"uberblock","category":"Import","title":"Which state is loaded: uberblock selection","summary":"The heart of every import: the best uberblock on any readable device decides the txg the pool returns to, and its root block pointer opens the MOS. If the userspace config missed devices that the MOS knows about, the selection is repeated with the trusted config.","ends":"The pool runs from the loaded txg. Once newer txgs are synced, older uberblocks are overwritten slot by slot, which is why `-F` can only go back a limited number of txgs. The commit itself is `zfs-io-flow:txg_sync`.","alts":[{"id":"cfg","options":[{"id":"match","label":"the provided config has every top-level vdev"},{"id":"reload","label":"the provided config missed top-level vdevs the MOS lists"}]}],"steps":[{"wire":"E017"},{"wire":"E018","note":"each sync writes its uberblock to slot txg modulo the ring size in all four labels of the chosen leaves, so the rings hold the latest txgs"},{"wire":"E022","note":"dsl_pool_init() at the first txg: the pool continues right after the loaded txg"},{"wire":"E024"},{"wire":"E025"},{"wire":"E026"},{"wire":"E027","when":[{"group":"cfg","options":["reload"]}]},{"wire":"E017","when":[{"group":"cfg","options":["reload"]}],"note":"second pass with every top-level vdev of the MOS config open"},{"wire":"E018","when":[{"group":"cfg","options":["reload"]}],"note":"a newer uberblock that lived only on the missed vdevs is found now"},{"wire":"E022","when":[{"group":"cfg","options":["reload"]}]},{"wire":"E025","when":[{"group":"cfg","options":["reload"]}]},{"wire":"E060","note":"writeable import: the first txg is the loaded txg + 1"},{"wire":"E072"},{"wire":"E073"},{"wire":"E074"},{"wire":"E075","note":"the first new uberblock overwrites the ring slot of an older txg"}]},{"id":"features","category":"Refusals","title":"Refused: unsupported feature flags","summary":"A pool that uses a feature this software does not implement. Features needed to read the pool are listed in the label and refuse the import before the MOS is opened; features needed only to write are found in the MOS and refuse only a writeable import.","ends":"The import is refused with the list of features. With only write features unknown, `zpool import -o readonly=on` succeeds (path `readonly`).","alts":[{"id":"feat","options":[{"id":"read","label":"an unknown feature in features_for_read"},{"id":"write","label":"only features_for_write are unknown"}]}],"steps":[{"wire":"E017"},{"wire":"E018"},{"wire":"E023","when":[{"group":"feat","options":["read"]}],"note":"the label of the best uberblock lists a feature for read that zfeature_is_supported() does not know"},{"wire":"E022","when":[{"group":"feat","options":["write"]}]},{"wire":"E025","when":[{"group":"feat","options":["write"]}]},{"wire":"E034","when":[{"group":"feat","options":["write"]}]},{"wire":"E035","when":[{"group":"feat","options":["write"]}]},{"wire":"E052"},{"wire":"E054"},{"wire":"E055"},{"wire":"E042"},{"wire":"E056","note":"'This pool uses the following feature(s) not supported by this system'; for write-only features also 'The pool can be imported using -o readonly=on'"}]},{"id":"hostid_force","category":"Refusals","title":"Last used by another host: the -f check","summary":"A pool with `multihost=off` that was not exported and whose hostid is not this host's, for example after the other host crashed or when a disk is moved without `zpool export`. Only zpool(8) checks this; the kernel imports whatever it is sent.","ends":"Without `-f` nothing reached the kernel. With `-f` the pool is imported and now belongs to this host. If the other host still has the pool imported, both write to it and the pool is damaged: this is what `multihost=on` prevents (path `mmp`).","alts":[{"id":"f","options":[{"id":"nof","label":"zpool import <pool>"},{"id":"f","label":"zpool import -f <pool>"}]}],"steps":[{"wire":"E103"},{"wire":"E044","note":"the hostid comes from the MOS config (ZPOOL_CONFIG_LOAD_INFO of the tryimport), or the label hostid for an older kernel"},{"wire":"E045","when":[{"group":"f","options":["nof"]}],"note":"'cannot import: pool was previously in use from another system', with the last host name, hostid and time"},{"wire":"E046","when":[{"group":"f","options":["f"]}]},{"wire":"E047","when":[{"group":"f","options":["f"]}],"note":"ZFS_IMPORT_ANY_HOST travels in zc_cookie, but the kernel never tests it"},{"wire":"E048","when":[{"group":"f","options":["f"]}]},{"wire":"E050","when":[{"group":"f","options":["f"]}]},{"wire":"E051","when":[{"group":"f","options":["f"]}]},{"wire":"E017","when":[{"group":"f","options":["f"]}],"note":"multihost=off: spa_activity_check_required() finds MMP unused in the uberblock and skips the check"},{"wire":"E052","when":[{"group":"f","options":["f"]}]},{"wire":"E054","when":[{"group":"f","options":["f"]}]},{"wire":"E068","when":[{"group":"f","options":["f"]}]},{"wire":"E070","when":[{"group":"f","options":["f"]}],"note":"the labels now carry this host's hostid: the other host would in turn need -f"},{"wire":"E072","when":[{"group":"f","options":["f"]}]},{"wire":"E073","when":[{"group":"f","options":["f"]}]},{"wire":"E074","when":[{"group":"f","options":["f"]}]},{"wire":"E075","when":[{"group":"f","options":["f"]}]}]},{"id":"mmp","category":"Refusals","title":"multihost=on: activity check and claim","summary":"With `multihost=on` the host that has the pool imported keeps writing MMP uberblocks. An importing host watches the label rings for those writes during tryimport, and during the import writes its own claim and checks that it stays the best. `-f` changes nothing here.","ends":"Active: the import is refused and nothing was written. Idle: the pool is imported after roughly 30 s of checks and this host's MMP thread now protects it (path `mmp_heartbeat`).","alts":[{"id":"other","options":[{"id":"idle","label":"the other host is gone (crashed or powered off)"},{"id":"active","label":"the other host still has the pool imported"}]}],"steps":[{"wire":"E010","note":"every zpool import first runs a tryimport, as in path discover"},{"wire":"E017"},{"wire":"E018"},{"wire":"E019","note":"not exported by this host: the check is required; a system with no hostid is refused here"},{"wire":"E020","note":"tryimport: watch for MMP_FAIL_INT x MMP_INTERVAL x 2 from the uberblock (20 s with defaults), plus up to 25%"},{"wire":"E077","when":[{"group":"other","options":["active"]}],"note":"meanwhile the owning host's heartbeat lands in the rings"},{"wire":"E021"},{"wire":"E041"},{"wire":"E042"},{"wire":"E043"},{"wire":"E044"},{"wire":"E045","when":[{"group":"other","options":["active"]}],"note":"'pool is imported on <host> (hostid ...)': refused; with -f the kernel refuses the same way with EREMOTEIO"},{"wire":"E046","when":[{"group":"other","options":["idle"]}]},{"wire":"E047","when":[{"group":"other","options":["idle"]}]},{"wire":"E048","when":[{"group":"other","options":["idle"]}]},{"wire":"E050","when":[{"group":"other","options":["idle"]}]},{"wire":"E051","when":[{"group":"other","options":["idle"]}]},{"wire":"E017","when":[{"group":"other","options":["idle"]}]},{"wire":"E019","when":[{"group":"other","options":["idle"]}],"note":"import: spa_activity_verify_config(): the uberblock is the one tryimport watched, so no second wait"},{"wire":"E021","when":[{"group":"other","options":["idle"]}]},{"wire":"E025","when":[{"group":"other","options":["idle"]}]},{"wire":"E028","when":[{"group":"other","options":["idle"]}]},{"wire":"E029","when":[{"group":"other","options":["idle"]}],"note":"ten rounds, one MMP interval apart (about 10 s with defaults)"},{"wire":"E020","when":[{"group":"other","options":["idle"]}],"note":"after each write the best uberblock must still be this host's claim"},{"wire":"E060","when":[{"group":"other","options":["idle"]}]},{"wire":"E061","when":[{"group":"other","options":["idle"]}]},{"wire":"E077","when":[{"group":"other","options":["idle"]}],"note":"now this host's heartbeat"}]},{"id":"mmp_heartbeat","category":"Refusals","title":"multihost=on: the owner's heartbeat","summary":"What the importing host is watching for. While the pool is imported with `multihost=on`, the MMP thread writes a fresh copy of the last synced uberblock to some leaf several times per interval. If those writes stop landing, the owner suspends the pool before an importer's check can conclude that it is gone.","ends":"With writes landing, any importing host sees activity within its check. Without, the pool is suspended (`zfs-fault-management:suspend_clear`), and `zpool clear` resumes it only after verifying that no other host imported it in the meantime.","alts":[{"id":"w","options":[{"id":"ok","label":"writes land"},{"id":"fail","label":"no write succeeds for zfs_multihost_fail_intervals intervals"}]}],"steps":[{"wire":"E073"},{"wire":"E076"},{"wire":"E077"},{"wire":"E078","when":[{"group":"w","options":["fail"]}]}]},{"id":"rewind","category":"Recovery","title":"zpool import -F, -nF, -FX: returning to an older txg","summary":"The newest txg cannot be loaded, here because `spa_load_verify()` finds damaged metadata in it. The rewind search loads again below each failed uberblock. With `-F` the first good older txg becomes the pool and the newer txgs and the intent logs are lost; `-X` may go back further and verifies the whole pool; `-n` and a plain import only report.","ends":"`-F` and `-FX`: the pool runs from the older txg; later txgs and every synchronous write still in the intent log are gone, and a scrub is advised. `-nF` and a plain import: nothing was written and the pool is not imported.","alts":[{"id":"mode","options":[{"id":"F","label":"-F: rewind within the last TXG_DEFER_SIZE txgs"},{"id":"n","label":"-nF: report what -F would do"},{"id":"X","label":"-FX: extreme rewind, back to TXG_INITIAL"},{"id":"plain","label":"no -F: the import fails"}]}],"steps":[{"wire":"E050","note":"-F sets state SPA_LOAD_RECOVER; -nF and a plain import stay in SPA_LOAD_IMPORT"},{"wire":"E051"},{"wire":"E017"},{"wire":"E018"},{"wire":"E022"},{"wire":"E025"},{"wire":"E038"},{"wire":"E039"},{"wire":"E040","note":"the newest txg has a metadata error: EIO"},{"wire":"E052"},{"wire":"E053"},{"wire":"E017","note":"the best uberblock below the failed one: an older txg still in the rings"},{"wire":"E018"},{"wire":"E022"},{"wire":"E025"},{"wire":"E038"},{"wire":"E039","when":[{"group":"mode","options":["F","n","plain"]}],"note":"from the loaded txg - TXG_DEFER_SIZE - 1; -nF also reads data blocks to report the data error count"},{"wire":"E039","when":[{"group":"mode","options":["X"]}],"note":"extreme rewind: from TXG_INITIAL - 1, the whole pool; this can take very long"},{"wire":"E040"},{"wire":"E058","when":[{"group":"mode","options":["F","X"]}],"note":"SPA_LOG_CLEAR: every intent log is discarded instead of claimed"},{"wire":"E060","when":[{"group":"mode","options":["F","X"]}],"note":"first txg numbered above the newest uberblock on disk, so the discarded txgs can never be selected again"},{"wire":"E072","when":[{"group":"mode","options":["F","X"]}]},{"wire":"E073","when":[{"group":"mode","options":["F","X"]}]},{"wire":"E074","when":[{"group":"mode","options":["F","X"]}]},{"wire":"E075","when":[{"group":"mode","options":["F","X"]}]},{"wire":"E052","when":[{"group":"mode","options":["n","plain"]}],"note":"a load below the newest txg outside RECOVER skips every write, so it can only report"},{"wire":"E054"},{"wire":"E055"},{"wire":"E042"},{"wire":"E056","when":[{"group":"mode","options":["plain"]}],"note":"'Recovery is possible, but will result in some data loss ... by executing zpool import -F'"},{"wire":"E057","when":[{"group":"mode","options":["F","X"]}],"note":"'Pool returned to its state as of ...', with the time discarded"},{"wire":"E056","when":[{"group":"mode","options":["n"]}],"note":"'Would be able to return ... to its state as of ...', with the time that would be discarded"}]},{"id":"degraded","category":"Recovery","title":"Importing with devices missing","summary":"Some devices of the pool are absent. Redundancy decides: a missing mirror side or raidz child within parity leaves the pool DEGRADED but importable; a missing log device needs `-m`; a missing top-level vdev can only be imported read-only, after raising zfs_max_missing_tvds.","ends":"`leg`: the pool is DEGRADED and writable; writes the missing device misses are recorded in its DTL and resilvered when it comes back (`zfs-fault-management:device_removed`). `log`: imported without the log device or its records. `tvd`: imported read-only with failmode=continue; data on the missing vdev is unreadable.","alts":[{"id":"miss","options":[{"id":"leg","label":"a mirror side or raidz child"},{"id":"log","label":"a log device, imported with -m"},{"id":"tvd","label":"a whole top-level vdev, with zfs_max_missing_tvds and -o readonly=on"}]}],"steps":[{"wire":"E050"},{"wire":"E051"},{"wire":"E012"},{"wire":"E013","note":"the absent device fails to open and its leaf is CANT_OPEN"},{"wire":"E017"},{"wire":"E018","note":"only the leaves that opened are read"},{"wire":"E022"},{"wire":"E025"},{"wire":"E026","note":"a missing top-level vdev under the trusted config: ENXIO for a writeable import, accepted read-only up to zfs_max_missing_tvds"},{"wire":"E030","when":[{"group":"miss","options":["log"]}],"note":"-m given: the log is dropped (SPA_LOG_CLEAR); without -m the import would fail here and libzfs would list the missing log device"},{"wire":"E036","when":[{"group":"miss","options":["tvd"]}],"note":"spa_ld_get_props() forces failmode=continue"},{"wire":"E058","when":[{"group":"miss","options":["log"]}],"note":"the logs are cleared, not claimed: the last synchronous writes are lost"},{"wire":"E060","when":[{"group":"miss","options":["leg","log"]}]},{"wire":"E052"},{"wire":"E054"}]},{"id":"readonly","category":"Import","title":"zpool import -o readonly=on","summary":"A read-only import loads the pool exactly like a normal one but stops before every step that writes: no log claim, no sync thread, no MMP heartbeat, no label or cachefile update. It also accepts a pool whose unknown features are needed only for writing.","ends":"The pool is imported read-only. The labels still show the state and host of the last writeable import, the intent logs are untouched for a later read-write import, and an export writes nothing to the labels because no sync thread runs.","alts":[],"steps":[{"wire":"E103"},{"wire":"E046"},{"wire":"E047"},{"wire":"E048"},{"wire":"E050","note":"readonly=on in the properties: spa_activate(SPA_MODE_READ)"},{"wire":"E051"},{"wire":"E017"},{"wire":"E018"},{"wire":"E022"},{"wire":"E025"},{"wire":"E034","note":"features_for_write are not checked"},{"wire":"E036"},{"wire":"E038"},{"wire":"E039"},{"wire":"E040"},{"wire":"E052","note":"not writeable: the claim, sync start, config update and resilver steps of spa_load_impl() are skipped"},{"wire":"E054","note":"spa_prop_set() and spa_config_update() are skipped: labels and cachefile stay as they were"},{"wire":"E055"},{"wire":"E042"},{"wire":"E057"},{"wire":"E079"},{"wire":"E080","note":"zfsvfs_setup() opens the ZIL but does not replay it on a read-only pool"}]},{"id":"zil","category":"After import","title":"Intent logs: claimed at import, replayed at mount","summary":"Synchronous writes that reached the intent log but not a synced txg survive an unclean shutdown only in the log chains. Import claims their blocks so nothing overwrites them; each file system replays its own log when it is mounted.","ends":"The file system is mounted with every logged synchronous write applied; the log is empty. The replay of one write record is `zfs-io-flow:crash_replay`.","alts":[],"steps":[{"wire":"E058"},{"wire":"E059","note":"claim: log blocks born after the last synced txg are claimed; zil_claim() marks the header ZIL_REPLAY_NEEDED"},{"wire":"E060","note":"txg_wait_synced(spa_claim_max_txg): the claims are synced before the import returns"},{"wire":"E072"},{"wire":"E052"},{"wire":"E054"},{"wire":"E055"},{"wire":"E042"},{"wire":"E057"},{"wire":"E079"},{"wire":"E080"},{"wire":"E081"},{"wire":"E059","note":"replay: the claimed chain is read again and each record re-executed"},{"wire":"E082"}]},{"id":"boot","category":"Boot","title":"Boot: import from the cachefile","summary":"At boot the import service imports every pool in /etc/zfs/zpool.cache without scanning devices and without mounting. If that import fails, zpool(8) retries once by scanning only the directories the cachefile's device paths are in.","ends":"The pools are imported but nothing is mounted (`-N`); `zfs-mount.service` mounts them later with `zfs mount -a`, which also replays their logs. Without a cachefile, `zfs-import-scan.service` imports by scanning (path `discover`, then `import` with `-aN`) and keeps the pools out of any cachefile.","alts":[{"id":"res","options":[{"id":"ok","label":"the cached configs import"},{"id":"fallback","label":"the cachefile import fails and is retried by scanning"}]}],"steps":[{"wire":"E098"},{"wire":"E001"},{"wire":"E099"},{"wire":"E100"},{"wire":"E101"},{"wire":"E007"},{"wire":"E008"},{"wire":"E010","note":"config source SPA_CONFIG_SRC_CACHEFILE: up to zfs_max_missing_tvds_cachefile (2) top-level vdevs may be missing from the cached config"},{"wire":"E041"},{"wire":"E042"},{"wire":"E043","note":"-a: each pool is imported by do_import_task() on a taskq"},{"wire":"E044"},{"wire":"E046"},{"wire":"E047"},{"wire":"E048","note":"the kernel load runs as in path import"},{"wire":"E055"},{"wire":"E042"},{"wire":"E057","when":[{"group":"res","options":["ok"]}]},{"wire":"E056","when":[{"group":"res","options":["fallback"]}],"note":"'cachefile import failed, retrying'"},{"wire":"E001","when":[{"group":"res","options":["fallback"]}],"note":"zpool_search_import() again with scan set"},{"wire":"E099","when":[{"group":"res","options":["fallback"]}]},{"wire":"E102","when":[{"group":"res","options":["fallback"]}]},{"wire":"E003","when":[{"group":"res","options":["fallback"]}]},{"wire":"E004","when":[{"group":"res","options":["fallback"]}]},{"wire":"E005","when":[{"group":"res","options":["fallback"]}]},{"wire":"E006","when":[{"group":"res","options":["fallback"]}]},{"wire":"E046","when":[{"group":"res","options":["fallback"]}]},{"wire":"E057","when":[{"group":"res","options":["fallback"]}]}]},{"id":"export","category":"Export","title":"zpool export","summary":"Unmounts the pool's file systems, then the kernel checks that nothing holds the pool, lets the last txgs sync with every label marked EXPORTED, closes the devices and forgets the pool.","ends":"Normal and `-f`: the labels say EXPORTED, the pool is gone from the kernel and the cachefile, and any host can import it without `-f` (this host also skips the MMP check). `-F`: the pool is gone from the kernel, but labels and cachefile still describe an active pool, as after a crash. `busy`: the pool stays imported, already unmounted.","alts":[{"id":"mode","options":[{"id":"normal","label":"zpool export"},{"id":"f","label":"-f: force the unmounts and ignore an active shared spare"},{"id":"F","label":"-F: hard force, no EXPORTED labels and no cachefile update"},{"id":"busy","label":"refused because the pool is still in use"}]}],"steps":[{"wire":"E104"},{"wire":"E083"},{"wire":"E084"},{"wire":"E085"},{"wire":"E086"},{"wire":"E087"},{"wire":"E088"},{"wire":"E089"},{"wire":"E090"},{"wire":"E091","when":[{"group":"mode","options":["busy"]}]},{"wire":"E092","when":[{"group":"mode","options":["normal","f","F"]}]},{"wire":"E093","when":[{"group":"mode","options":["normal","f","F"]}]},{"wire":"E072","when":[{"group":"mode","options":["normal","f","F"]}]},{"wire":"E073","when":[{"group":"mode","options":["normal","f","F"]}]},{"wire":"E074","when":[{"group":"mode","options":["normal","f"]}],"note":"every label rewritten with POOL_STATE_EXPORTED"},{"wire":"E074","when":[{"group":"mode","options":["F"]}],"note":"nothing dirtied the labels: at most uberblocks are written and the labels still say ACTIVE"},{"wire":"E075","when":[{"group":"mode","options":["normal","f","F"]}]},{"wire":"E094","when":[{"group":"mode","options":["normal","f","F"]}]},{"wire":"E095","when":[{"group":"mode","options":["normal","f","F"]}]},{"wire":"E096","when":[{"group":"mode","options":["normal","f"]}]},{"wire":"E071","when":[{"group":"mode","options":["normal","f"]}]},{"wire":"E097","when":[{"group":"mode","options":["normal","f","F"]}]}]},{"id":"checkpoint","category":"Recovery","title":"zpool import --rewind-to-checkpoint","summary":"A pool with a checkpoint (`zpool checkpoint`) can be imported at the checkpointed state. The checkpointed uberblock saved in the MOS is renumbered to outrank everything on disk, written to the labels, and the load starts over from it.","ends":"`rw`: the pool is back at the checkpoint and everything written after it is gone for good. `ro`: the checkpointed state is imported read-only and the pool on disk is unchanged.","alts":[{"id":"mode","options":[{"id":"rw","label":"rewind for good"},{"id":"ro","label":"with -o readonly=on: inspect the checkpointed state, write nothing"}]}],"steps":[{"wire":"E050"},{"wire":"E051"},{"wire":"E017"},{"wire":"E018"},{"wire":"E022"},{"wire":"E025"},{"wire":"E031"},{"wire":"E032","when":[{"group":"mode","options":["rw"]}]},{"wire":"E074","when":[{"group":"mode","options":["rw"]}]},{"wire":"E075","when":[{"group":"mode","options":["rw"]}]},{"wire":"E033"},{"wire":"E017","when":[{"group":"mode","options":["rw"]}],"note":"the checkpointed uberblock is now the best one on disk"},{"wire":"E018","when":[{"group":"mode","options":["rw"]}]},{"wire":"E017","when":[{"group":"mode","options":["ro"]}],"note":"read-only: the labels were not written, so the checkpointed uberblock in memory is used directly"},{"wire":"E022"},{"wire":"E025"},{"wire":"E058","when":[{"group":"mode","options":["rw"]}],"note":"log blocks from after the checkpoint may have been overwritten: unclaimed chains are cleared"},{"wire":"E060","when":[{"group":"mode","options":["rw"]}]}]},{"id":"async_work","category":"After import","title":"After import: resilver, config update, autoexpand","summary":"Work that the import only requests. Async work stays suspended for the whole load and is started by the end of a later spa_sync(), so the import returns before any of it runs.","ends":"The labels and the cachefile describe the pool as this host imported it, and a resilver of the devices that missed writes is under way (`zfs-scrub-resilver:resilver`).","alts":[],"steps":[{"wire":"E062","note":"for example a disk that was absent while the pool was in use, so its DTL records the txgs it missed"},{"wire":"E063"},{"wire":"E065"},{"wire":"E052"},{"wire":"E054"},{"wire":"E066"},{"wire":"E072"},{"wire":"E067"},{"wire":"E069"},{"wire":"E070"},{"wire":"E071"},{"wire":"E064"}]}],"stages":[],"pipelines":[],"pipelineRuntimeNote":"","about":{"model":["Every device carries four labels, each with a copy of the pool configuration (a name-value list) and a ring of uberblocks. `zpool import` finds pools by reading only the configurations, in userspace, from every candidate device (or by reading the cachefile instead). The kernel never scans devices: it is handed a configuration and checks it.","Every import is done twice. First a tryimport opens the pool read-only under a temporary name to report its health, feature support and the host that uses it, then throws it away; `zpool import` with no pool name stops there. The real import starts again from that configuration.","The state that is loaded is the best uberblock found on any readable device: the highest txg (not above a requested maximum), then the latest timestamp. Its root block pointer opens the meta-object set (MOS), whose own copy of the configuration then replaces the one supplied by userspace. Nothing newer than that uberblock exists as far as the pool is concerned.","An import can be refused for several distinct reasons, checked in different places: zpool(8) itself refuses a pool that was not exported and was last used by another host, unless `-f`; with `multihost=on` the kernel watches the disks for another host's heartbeat and refuses whatever the flags say; unknown features refuse the import (only those needed for reading, with `-o readonly=on`); and missing devices refuse it when no redundancy covers them.","When the newest state cannot be loaded, `-F` walks back through older uberblocks still in the label rings, verifying each, and keeps the first that works, discarding the intent logs; `-X` allows going back further and verifies the whole pool; `-n` only reports what `-F` would do. Even without `-F` a failed import probes older txgs to tell you whether `-F` would help.","A writeable import changes the pool before you can use it: the uncommitted intent-log blocks are claimed so they are not reused, the sync thread starts, every label is rewritten with this host's id and the state ACTIVE, the cachefile is updated, and a resilver starts if any device missed writes. The logged writes themselves are replayed only when each file system is mounted. A read-only import skips all of this.","Export unmounts everything, waits until nothing holds the pool, then lets the last txgs sync with every label marked EXPORTED, closes the devices and removes the pool from the cachefile and from the kernel. A cleanly exported pool imports on any host without `-f`."],"simplifications":["Every `zpool import` runs the search and tryimport of path `discover` before the real import; the import paths show that part as a single step.","`spa_load()` is one node with many outgoing wires; the order of its phases is given in its role text and the paths, not by the layout. Phases with no effect on import decisions (checkpoint txg, indirect vdevs, removals, deferred destroys, initialize and TRIM restart) appear only in role text.","Label and uberblock reads go from the device straight to the code that uses them; the zio pipeline and the leaf driver in between (I/O flow graph) are not drawn. Likewise the MOS and verification reads are single wires to the data disks.","The cachefile and the label rings are
