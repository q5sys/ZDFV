<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZFS Send and Receive</title>
<style>
:root {
  --canvas: #1f1f1f;
  --panel: #262626;
  --panel-line: #333;
  --text: #dddddd;
  --muted: #9a9a9a;
  --accent: #ffd43b;
  --node-body: #353535;
  --node-border: #161616;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
  scrollbar-color: #4a4a4a #262626;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
code { font-family: var(--mono); font-size: 0.92em; background: #ffffff12; padding: 0 3px; border-radius: 3px; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--canvas);
  color: var(--text);
  font: 13px/1.4 var(--sans);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

button, .button, select, input {
  font: inherit;
  color: var(--text);
  background: #333;
  border: 1px solid #444;
  border-radius: 5px;
  padding: 3px 9px;
}
button, .button { cursor: pointer; }
button:hover, .button:hover { background: #3d3d3d; border-color: #555; }
button.active { background: #4a4122; border-color: var(--accent); color: #fff; }
button.icon { padding: 2px 7px; }
input[type="search"] { width: 100%; }
a { color: #74c0fc; text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- top bar ---------- */
#topbar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--panel-line);
}
#topbar h1 {
  font-size: 15px;
  margin: 0 6px 0 2px;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex: 0 1 auto;
}
#topbar > * { flex-shrink: 0; }
#topbar > h1 { flex-shrink: 1; }
#topbar button, #topbar .button, #topbar a { white-space: nowrap; }
#commit-link { font-family: var(--mono); font-size: 12px; color: var(--muted); }
#topbar .spacer { flex: 1; }

/* ---------- main layout ---------- */
#layout { flex: 1; display: flex; min-height: 0; }
#left, #right {
  background: var(--panel);
  overflow-y: auto;
  flex: none;
}
#left { width: 280px; border-right: 1px solid var(--panel-line); overflow-x: hidden; }
#right { width: 360px; border-left: 1px solid var(--panel-line); padding: 10px 12px 40px; }
body.hide-left #left, body.hide-right #right { display: none; }

.panel-section { padding: 10px 12px; border-bottom: 1px solid var(--panel-line); }
.panel-section h2, #right h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 0 0 6px;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12px; }

/* search */
.results { list-style: none; margin: 6px 0 0; padding: 0; max-height: 240px; overflow-y: auto; }
.results li { padding: 3px 6px; border-radius: 4px; cursor: pointer; }
.results li:hover, .results li.first { background: #333; }
.results .kind { color: var(--muted); font-size: 11px; margin-right: 6px; }

/* path list */
.path-cat { margin: 8px 0 2px; font-size: 11px; color: var(--muted); }
.path-item {
  display: block;
  width: 100%;
  white-space: normal;
  text-align: left;
  border: 1px solid transparent;
  background: none;
  padding: 3px 6px;
  border-radius: 4px;
}
.path-item:hover { background: #313131; border-color: transparent; }
.path-item.active { background: #4a4122; border-color: var(--accent); }
.path-item .pid { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; }

/* group filters */
.gfilter { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.gfilter .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.gfilter .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gfilter select { padding: 1px 4px; font-size: 12px; }

/* ---------- canvas ---------- */
#canvas-wrap { flex: 1; position: relative; min-width: 0; overflow: hidden; }
#canvas { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
#canvas.panning { cursor: grabbing; }

.group-frame { stroke-width: 1; }
.group-title { font-size: 18px; font-weight: 700; cursor: move; }
.group-summary { font-size: 11px; fill: var(--muted); pointer-events: none; }

.node { cursor: pointer; }
.node .body { fill: var(--node-body); stroke: var(--node-border); stroke-width: 1; }
.node:hover .body { stroke: #6a6a6a; }
.node .title-text { fill: #eeeeee; font-size: 13px; font-weight: 600; pointer-events: none; }
.node .pill { fill: #00000055; stroke: #ffffff30; }
.node .pill-text { fill: #ddd; font-size: 10px; font-family: var(--mono); }
.node .sock-label { fill: #bdbdbd; font-size: 10px; font-variant: small-caps; letter-spacing: 0.04em; pointer-events: none; }
.node .foot { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
.node .foot.link { cursor: pointer; }
.node .foot.link:hover { fill: #cfcfcf; text-decoration: underline; }
.node .outline { fill: none; stroke: none; pointer-events: none; }
.node.selected .outline { stroke: #fff; stroke-width: 2; }
.node.onpath .outline { stroke: var(--accent); stroke-width: 2; }
.node.current .outline { stroke: var(--accent); stroke-width: 3; }
.node.current .body { filter: url(#glow); }
.node.ctxmark .outline { stroke: #63e6be; stroke-width: 2; stroke-dasharray: 5 3; }
.node.dim { opacity: 0.15; }
.node.proxy .body { stroke-dasharray: 6 4; stroke: #888; }

.wire, .hit, .alt-outline { vector-effect: non-scaling-stroke; }
/* Stroke widths are in screen pixels (non-scaling) and are narrowed when
   zoomed out; --wire-idle and --wire-lit are set by setViewTransform(). */
.wire { fill: none; stroke-width: var(--wire-idle, 2px); opacity: 0.55; pointer-events: none; }
.wire.ctl { stroke-dasharray: 6 4; }
.wire.lit { opacity: 1; stroke-width: var(--wire-lit, 3px); stroke-dasharray: 10 6; animation: flow 0.9s linear infinite; }
.wire.dim { opacity: 0.06; }
.wire.alt { opacity: 0.35; stroke-dasharray: 3 5; }
.wire.current { stroke-width: calc(var(--wire-lit, 3px) + 2px); opacity: 1; }
.wire.cmp-both { stroke: #ffffff !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-a { stroke: #ffd43b !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
.wire.cmp-b { stroke: #4dabf7 !important; opacity: 1; stroke-width: var(--wire-lit, 3px); }
@keyframes flow { to { stroke-dashoffset: -32; } }
@media (prefers-reduced-motion: reduce) { .wire.lit { animation: none; } }

.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; pointer-events: stroke; }
.alt-outline { fill: none; stroke: var(--accent); stroke-width: 6; stroke-dasharray: 4 6; opacity: 0.35; pointer-events: none; }

.badge circle { fill: #1f1f1f; stroke: var(--accent); stroke-width: 1.5; }
.badge text { fill: var(--accent); font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.dot { fill: #fff; stroke: var(--accent); stroke-width: 3; }

#caption {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  max-width: min(760px, 90%);
  background: #262626ee;
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  pointer-events: auto;
}
#caption .ref { font-family: var(--mono); font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }

#legend {
  position: absolute;
  left: 10px;
  bottom: 10px;
  background: #262626e6;
  border: 1px solid var(--panel-line);
  border-radius: 8px;
  padding: 6px 8px;
  font-size: 12px;
}
#legend .head { cursor: pointer; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
#legend.folded .item { display: none; }
#legend.folded .head { margin-bottom: 0; }
#legend .item { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 1px 2px; border-radius: 3px; }
#legend .item:hover { background: #333; }
#legend .item.off { opacity: 0.35; }
#legend .sw { width: 22px; height: 0; border-top: 3px solid; }
#legend .sw.dashed { border-top-style: dashed; }

#minimap {
  position: absolute;
  right: 10px;
  bottom: 10px;
  background: #1a1a1ae6;
  border: 1px solid var(--panel-line);
  border-radius: 6px;
  cursor: crosshair;
}

/* ---------- details panel ---------- */
#details h3 { font-size: 16px; margin: 0 0 4px; }
#details .sub { color: var(--muted); margin-bottom: 8px; }
#details section { margin: 12px 0; }
#details ul { margin: 4px 0; padding-left: 0; list-style: none; }
#details li { margin: 3px 0; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid #0006; }
.ref-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.ref-row .sym { font-family: var(--mono); font-size: 12px; }
.ref-row a { font-family: var(--mono); font-size: 11px; }
.ref-row .copy { font-size: 10px; padding: 0 5px; }
.ref-code { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: pre-wrap; word-break: break-all; margin: 0 0 4px 0; }
.io-row { cursor: pointer; padding: 3px 4px; border-radius: 4px; }
.io-row:hover { background: #313131; }
.io-row .other { font-weight: 600; }
.io-row .lbl { color: var(--muted); display: block; font-size: 12px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 11px; }
.tbl td, .tbl th { border-bottom: 1px solid #333; padding: 3px 4px; vertical-align: top; text-align: left; }
.tbl .on { color: var(--accent); }

.transport { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.transport input[type="range"] { width: 90px; padding: 0; }
.alt-select { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 8px; }
.alt-select select { width: 100%; }
.steps { max-height: 46vh; overflow-y: auto; border: 1px solid #333; border-radius: 6px; }
.step { padding: 3px 6px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #2d2d2d; }
.step:hover { background: #303030; }
.step.cur { background: #4a4122; }
.step.skip { opacity: 0.45; padding-left: 20px; }
.step .alt-head { display: block; font-size: 10px; color: var(--accent); }
.step .n { font-family: var(--mono); color: var(--accent); margin-right: 4px; }
.step .side { font-size: 10px; color: #63e6be; margin-left: 4px; }
.step .note { display: block; color: var(--muted); font-style: italic; }

/* ---------- suite navigation ---------- */
#suite-nav { display: inline-flex; align-items: center; gap: 8px; }
#suite-nav select { max-width: 230px; }
#index-link { font-size: 12px; }
.segmented { display: inline-flex; }
.segmented button { border-radius: 0; }
.segmented button:first-child { border-radius: 5px 0 0 5px; }
.segmented button:last-child { border-radius: 0 5px 5px 0; border-left: none; }
.also-link { display: block; }

/* ---------- timeline view ---------- */
#timeline-view {
  position: absolute;
  inset: 0;
  background: var(--canvas);
  overflow: auto;
  padding: 14px 18px 40px;
}
#tl-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
#tl-title { font-size: 16px; font-weight: 650; }
#tl-strip { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.tl-chip {
  border: 1px solid #444;
  background: #2a2a2a;
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 12px;
  cursor: pointer;
  max-width: 240px;
  text-align: left;
}
.tl-chip .txg { font-family: var(--mono); color: var(--accent); margin-right: 5px; }
.tl-chip.cur { border-color: var(--accent); background: #4a4122; }
#tl-caption {
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: #262626;
  padding: 8px 12px;
  margin-bottom: 14px;
}
#tl-caption .cap { font-weight: 600; }
#tl-caption .note { color: var(--muted); display: block; margin-top: 2px; }
#tl-caption .links { margin-top: 4px; font-size: 12px; }
#tl-caption .links a { margin-right: 10px; }
.tl-row { display: grid; grid-template-columns: 200px 1fr; gap: 10px; margin-bottom: 8px; align-items: start; }
.tl-label {
  background: #2b2b2b;
  border: 1px solid #3a3a3a;
  border-radius: 6px;
  padding: 5px 8px;
  cursor: pointer;
}
.tl-label:hover { border-color: #666; }
.tl-label .name { font-family: var(--mono); font-weight: 650; }
.tl-label .kind { color: var(--muted); font-size: 11px; display: block; }
.tl-lanes { display: flex; flex-direction: column; gap: 4px; }
.tl-lane { display: flex; flex-wrap: wrap; gap: 5px; min-height: 40px; align-items: center; padding: 3px 4px; border-radius: 6px; background: #ffffff06; }
.tl-lane.dead { min-height: 30px; background: #8ce99a14; border-left: 3px solid #8CE99A; }
.tl-lane .lane-tag { font-size: 10px; color: var(--muted); margin-right: 4px; }
.tl-tile {
  width: 52px;
  height: 34px;
  border-radius: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 12px;
  color: #111;
  border: 2px solid transparent;
  cursor: default;
  position: relative;
}
.tl-tile .birth { font-size: 9px; opacity: 0.8; }
.tl-tile.small { height: 26px; }
.tl-tile.new { border-color: var(--accent); box-shadow: 0 0 6px var(--accent); }
.tl-tile.changed { border-color: #63e6be; }
.tl-tile.freed { opacity: 0.35; text-decoration: line-through; }
.tl-tile.deferred { border: 2px dashed #ddd; }
.tl-tile.async { border: 2px dotted #ddd; }
.tl-arrow { color: var(--muted); font-size: 11px; display: block; }
#tl-legend { margin-top: 18px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
#tl-legend .tl-tile { width: 38px; height: 22px; font-size: 10px; }
.tl-summary { color: var(--muted); }

/* ---------- tooltip and about ---------- */
#tooltip {
  position: fixed;
  z-index: 50;
  max-width: 520px;
  background: #111;
  border: 1px solid #555;
  border-radius: 6px;
  padding: 6px 9px;
  font-size: 12px;
  pointer-events: none;
  box-shadow: 0 4px 16px #000a;
}
#tooltip .t-ref { font-family: var(--mono); font-size: 11px; margin-top: 4px; }
#tooltip .t-ref .loc { color: #74c0fc; }
#tooltip .t-ref .code { color: #bbb; display: block; white-space: pre; overflow: hidden; text-overflow: ellipsis; }

#about {
  position: fixed;
  inset: 0;
  background: #000a;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.about-box {
  position: relative;
  background: var(--panel);
  border: 1px solid #444;
  border-radius: 10px;
  max-width: 820px;
  max-height: 100%;
  overflow-y: auto;
  padding: 18px 24px;
}
.about-box .close { position: absolute; right: 10px; top: 10px; }
.about-box h2 { font-size: 17px; margin: 4px 0 8px; }
.about-box h3 { font-size: 13px; margin: 16px 0 6px; color: var(--accent); }
.about-box li { margin: 4px 0; }

</style>
</head>
<body>
<header id="topbar">
  <button id="toggle-left" class="icon" title="Show or hide the path panel">&#9776;</button>
  <h1>ZFS Send and Receive</h1>
  <a id="commit-link" target="_blank" rel="noopener"></a>
  <span id="suite-nav" hidden>
    <select id="graph-menu" title="Open another diagram of the suite"></select>
    <a id="index-link" href="index.html" title="All diagrams">All</a>
  </span>
  <span id="view-switch" class="segmented" hidden>
    <button id="btn-view-graph" class="active" title="Node graph">Graph</button><button id="btn-view-timeline" title="Timeline scenarios">Timeline</button>
  </span>
  <span class="spacer"></span>
  <button id="btn-fit" title="Fit everything (F)">Fit</button>
  <button id="btn-reset" title="Restore the default layout">Reset layout</button>
  <button id="btn-export" title="Export layout: save node positions to a JSON file">Export</button>
  <label class="button" title="Import layout: load node positions from a JSON file">Import<input id="file-import" type="file" accept="application/json,.json" hidden></label>
  <button id="btn-about">About</button>
  <button id="toggle-right" class="icon" title="Show or hide the details panel">&#9776;</button>
</header>

<main id="layout">
  <aside id="left">
    <div class="panel-section">
      <input id="search" type="search" placeholder="Search nodes, functions, files, tunables, wires  ( / )" autocomplete="off">
      <ul id="search-results" class="results"></ul>
    </div>
    <div class="panel-section">
      <h2>Paths</h2>
      <div id="path-list"></div>
    </div>
    <div class="panel-section" id="timeline-section" hidden>
      <h2>Timelines</h2>
      <div id="timeline-list"></div>
    </div>
    <div class="panel-section">
      <h2>Filters</h2>
      <label class="row">Context
        <select id="ctx-filter"><option value="">(none)</option></select>
      </label>
      <div id="group-filters"></div>
    </div>
  </aside>

  <section id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="12" cy="12" r="1.3" fill="#2c2c2c"></circle>
        </pattern>
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"></feDropShadow>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="160%">
          <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#ffd43b" flood-opacity="0.9"></feDropShadow>
        </filter>
      </defs>
      <rect id="grid-rect" x="0" y="0" width="100%" height="100%" fill="url(#grid)"></rect>
      <g id="root">
        <g id="layer-groups"></g>
        <g id="layer-wires"></g>
        <g id="layer-hits"></g>
        <g id="layer-nodes"></g>
        <g id="layer-badges"></g>
        <g id="layer-dot"></g>
      </g>
    </svg>
    <div id="caption" hidden></div>
    <div id="legend"></div>
    <canvas id="minimap" width="220" height="150"></canvas>
    <div id="timeline-view" hidden>
      <div id="tl-head">
        <div id="tl-title"></div>
        <div class="transport" id="tl-transport">
          <button id="tl-first" title="First step (Home)">|◀</button>
          <button id="tl-prev" title="Previous step (Left)">◀</button>
          <button id="tl-play" title="Play or pause (Space)">Play</button>
          <button id="tl-next" title="Next step (Right)">▶</button>
          <button id="tl-last" title="Last step (End)">▶|</button>
        </div>
      </div>
      <div id="tl-strip"></div>
      <div id="tl-caption"></div>
      <div id="tl-panel"></div>
      <div id="tl-legend"></div>
    </div>
  </section>

  <aside id="right">
    <div id="details"><p class="muted">Select a node, a wire or a path.</p></div>
  </aside>
</main>

<div id="tooltip" hidden></div>
<div id="about" hidden>
  <div class="about-box">
    <button id="about-close" class="icon close" title="Close">&#10005;</button>
    <div id="about-body"></div>
  </div>
</div>

d)","color":"#5C5F66","col":0,"band":"full","subcols":1,"summary":"The zfs command, libzfs and libzfs_core: option parsing, resume tokens, replication packages."},{"id":"snd_kern","title":"Send entry (ioctl, dmu_send)","color":"#2B8A3E","col":1,"band":"full","subcols":1,"summary":"The ioctl, the choice of from point and the BEGIN record."},{"id":"snd_pipe","title":"Send thread pipeline","color":"#D9480F","col":2,"band":"top","subcols":3,"summary":"Traversal, merge and reader threads, then the main thread turning ranges into records."},{"id":"snd_io","title":"Block reads (shared with the I/O graph)","color":"#6741D9","col":2,"band":"bottom","subcols":3,"summary":"Where the sender's reads go: the ARC if the block is cached, otherwise a direct zio."},{"id":"stream","title":"Stream and resume token","color":"#0C8599","col":5,"band":"full","subcols":1,"summary":"The bytes between the two machines, and the token that restarts an interrupted transfer."},{"id":"rcv_user","title":"Receiver userspace (zfs receive)","color":"#495057","col":6,"band":"full","subcols":1,"summary":"Reads the BEGIN record, checks the destination, hands the file descriptor to the kernel."},{"id":"rcv_kern","title":"Receive entry, begin and end","color":"#C2255C","col":7,"band":"full","subcols":2,"summary":"The ioctl and the sync tasks that create the receiving dataset and later switch it into place."},{"id":"rcv_pipe","title":"Receive threads and record handlers","color":"#1971C2","col":9,"band":"full","subcols":2,"summary":"The reader in the ioctl thread, the writer thread and one handler per record type."},{"id":"dmu","title":"DMU and txg (shared with the I/O graph)","color":"#E67700","col":11,"band":"full","subcols":2,"summary":"Transactions, dirty records and the txg sync that finally writes the received data."}],"nodes":[{"id":"admin","group":"snd_user","sub":0,"title":"Administrator","ctx":"user","src":"","fns":[],"role":"The person or script typing the command. Every path in this graph that a command starts begins with a wire from this node; the arrows that come back into a command node are its results, errors and refusals.","tunables":[],"props":[]},{"id":"zfs_send_cmd","group":"snd_user","sub":0,"title":"zfs send (cmd/zfs)","ctx":"user","src":"cmd/zfs/zfs_main.c","fns":[{"name":"zfs_do_send","ref":{"file":"cmd/zfs/zfs_main.c","line":4753,"symbol":"zfs_do_send","code":"zfs_do_send(int argc, char **argv)"}}],"role":"Parses the send options: -i / -I name the incremental source (a snapshot with @ or a bookmark with #), -R asks for a replication stream, -c compressed, -w raw (which also sets -c, -e and -L), -L large blocks, -e embedded blocks, -t a resume token. Without -R or -I the send goes through zfs_send_one(); -R and -I go through zfs_send(); -t goes to zfs_send_resume(). -D is accepted but only prints that deduplicated streams are no longer supported.","tunables":[],"props":[]},{"id":"libzfs_send","group":"snd_user","sub":0,"title":"libzfs: zfs_send_one() / zfs_send_resume()","ctx":"user","src":"lib/libzfs/libzfs_sendrecv.c","fns":[{"name":"zfs_send_one","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":2870,"symbol":"zfs_send_one","code":"zfs_send_one(zfs_handle_t *zhp, const char *from, int fd, sendflags_t *flags,"}},{"name":"zfs_send_one_cb_impl","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":2661,"symbol":"zfs_send_one_cb_impl","code":"zfs_send_one_cb_impl(zfs_handle_t *zhp, const char *from, int fd,"}},{"name":"lzc_flags_from_sendflags","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":1600,"symbol":"lzc_flags_from_sendflags","code":"lzc_flags_from_sendflags(const sendflags_t *flags)"}},{"name":"zfs_send_resume","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":2057,"symbol":"zfs_send_resume","code":"zfs_send_resume(libzfs_handle_t *hdl, sendflags_t *flags, int outfd,"}},{"name":"zfs_send_resume_impl_cb_impl","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":1820,"symbol":"zfs_send_resume_impl_cb_impl","code":"zfs_send_resume_impl_cb_impl(libzfs_handle_t *hdl, sendflags_t *flags,"}},{"name":"zfs_send_resume_token_to_nvlist","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":1523,"symbol":"zfs_send_resume_token_to_nvlist","code":"zfs_send_resume_token_to_nvlist(libzfs_handle_t *hdl, const char *token)"}}],"role":"Turns the command flags into lzc_send_flags, runs the optional size estimate and progress thread, then calls libzfs_core. For -t it decodes the token (hex, checked with fletcher-4, zlib-uncompressed into an nvlist), finds the snapshot by the token's toguid, and takes the resume object, offset and the -L / -c / -e / -w flags from the token.","tunables":[],"props":[]},{"id":"libzfs_repl","group":"snd_user","sub":0,"title":"libzfs: replication stream (-R, -I)","ctx":"user","src":"lib/libzfs/libzfs_sendrecv.c","fns":[{"name":"zfs_send","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":2564,"symbol":"zfs_send","code":"zfs_send(zfs_handle_t *zhp, const char *fromsnap, const char *tosnap,"}},{"name":"zfs_send_cb_impl","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":2341,"symbol":"zfs_send_cb_impl","code":"zfs_send_cb_impl(zfs_handle_t *zhp, const char *fromsnap, const char *tosnap,"}},{"name":"send_prelim_records","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":2201,"symbol":"send_prelim_records","code":"send_prelim_records(zfs_handle_t *zhp, const char *from, int fd,"}},{"name":"dump_filesystems","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":1421,"symbol":"dump_filesystems","code":"dump_filesystems(zfs_handle_t *rzhp, send_dump_data_t *sdd)"}},{"name":"dump_snapshot","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":1149,"symbol":"dump_snapshot","code":"dump_snapshot(zfs_handle_t *zhp, void *arg)"}},{"name":"dump_ioctl","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":823,"symbol":"dump_ioctl","code":"dump_ioctl(zfs_handle_t *zhp, const char *fromsnap, uint64_t fromsnap_obj,"}},{"name":"send_conclusion_record","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":2177,"symbol":"send_conclusion_record","code":"send_conclusion_record(int fd, zio_cksum_t *zc)"}}],"role":"Builds a compound stream in userspace: a BEGIN record marked DMU_COMPOUNDSTREAM (with -R its payload lists every filesystem, snapshot and property) closed by its own END, then one ordinary substream per snapshot, each requested from the kernel with the legacy ZFS_IOC_SEND and incremental from the previous snapshot, then a final END. The kernel only ever produces single-snapshot streams.","tunables":[],"props":[]},{"id":"lzc_send","group":"snd_user","sub":0,"title":"libzfs_core: lzc_send_resume_redacted()","ctx":"user","src":"lib/libzfs_core/libzfs_core.c","fns":[{"name":"lzc_send_resume_redacted","ref":{"file":"lib/libzfs_core/libzfs_core.c","line":932,"symbol":"lzc_send_resume_redacted","code":"lzc_send_resume_redacted(const char *snapname, const char *from, int fd,"}},{"name":"lzc_send_redacted","ref":{"file":"lib/libzfs_core/libzfs_core.c","line":850,"symbol":"lzc_send_redacted","code":"lzc_send_redacted(const char *snapname, const char *from, int fd,"}},{"name":"lzc_send_resume_redacted_cb_impl","ref":{"file":"lib/libzfs_core/libzfs_core.c","line":880,"symbol":"lzc_send_resume_redacted_cb_impl","code":"lzc_send_resume_redacted_cb_impl(const char *snapname, const char *from, int fd,"}},{"name":"lzc_send_wrapper","ref":{"file":"lib/libzfs_core/libzfs_core.c","line":764,"symbol":"lzc_send_wrapper","code":"lzc_send_wrapper(int (*func)(int, void *), int orig_fd, void *data)"}}],"role":"Packs the arguments into an nvlist (fd, fromsnap, largeblockok, embedok, compressok, rawok, savedok, resume_object, resume_offset, redactbook) and issues ZFS_IOC_SEND_NEW. On Linux, lzc_send_wrapper() puts a pipe and a copying thread in front of an output that is not already a pipe.","tunables":[],"props":[]},{"id":"ioc_send","group":"snd_kern","sub":0,"title":"Send ioctl","ctx":"syscall","src":"module/zfs/zfs_ioctl.c","fns":[{"name":"zfs_ioc_send_new","ref":{"file":"module/zfs/zfs_ioctl.c","line":7403,"symbol":"zfs_ioc_send_new","code":"zfs_ioc_send_new(const char *snapname, nvlist_t *innvl, nvlist_t *outnvl)"}},{"name":"zfs_ioc_send","ref":{"file":"module/zfs/zfs_ioctl.c","line":6380,"symbol":"zfs_ioc_send","code":"zfs_ioc_send(zfs_cmd_t *zc)"}},{"name":"dump_bytes_init","ref":{"file":"module/zfs/zfs_ioctl.c","line":6333,"symbol":"dump_bytes_init","code":"dump_bytes_init(dump_bytes_arg_t *dba, int fd, dmu_send_outparams_t *out)"}},{"name":"dump_bytes","ref":{"file":"module/zfs/zfs_ioctl.c","line":6312,"symbol":"dump_bytes","code":"dump_bytes(objset_t *os, void *buf, int len, void *arg)"}}],"role":"Kernel entry. Sets the stream output function to dump_bytes(), which writes every header and payload to the caller's file descriptor with zfs_file_write() (through a one-thread z_send taskq where kernel stacks are small), then calls dmu_send(). The legacy zfs_ioc_send(), still used by replication streams, calls dmu_send_obj() with dataset object numbers instead of names.","tunables":[],"props":[]},{"id":"dmu_send","group":"snd_kern","sub":0,"title":"dmu_send() / dmu_send_obj()","ctx":"syscall","src":"module/zfs/dmu_send.c","fns":[{"name":"dmu_send","ref":{"file":"module/zfs/dmu_send.c","line":2836,"symbol":"dmu_send","code":"dmu_send(const char *tosnap, const char *fromsnap, boolean_t embedok,"}},{"name":"dmu_send_obj","ref":{"file":"module/zfs/dmu_send.c","line":2746,"symbol":"dmu_send_obj","code":"dmu_send_obj(const char *pool, uint64_t tosnap, uint64_t fromsnap,"}}],"role":"Holds the pool and the snapshot to send (owning the dataset instead when a filesystem itself is sent). A non-raw send holds it with DS_HOLD_FLAG_DECRYPT, so an encrypted dataset needs its key loaded; a raw send does not. Resolves the incremental source, marks the stream as a clone stream when the source is in another filesystem, then calls dmu_send_impl().","tunables":[],"props":[]},{"id":"send_from","group":"snd_kern","sub":0,"title":"Incremental source: snapshot or bookmark","ctx":"syscall","src":"module/zfs/dmu_send.c","fns":[{"name":"dsl_dataset_is_before","ref":{"file":"module/zfs/dsl_dataset.c","line":5124,"symbol":"dsl_dataset_is_before","code":"dsl_dataset_is_before(dsl_dataset_t *later, dsl_dataset_t *earlier,"}},{"name":"dsl_bookmark_lookup","ref":{"file":"module/zfs/dsl_bookmark.c","line":101,"symbol":"dsl_bookmark_lookup","code":"dsl_bookmark_lookup(dsl_pool_t *dp, const char *fullname,"}}],"role":"Reduces the from point to a zfs_bookmark_phys_t: creation txg, guid and IV set guid. A snapshot must be an earlier snapshot of the same lineage (dsl_dataset_is_before(), otherwise EXDEV); a bookmark is checked the same way by dsl_bookmark_lookup(). Nothing else about the from point is used, so a bookmark, which keeps no blocks, is as good a source as the snapshot it was made from.","tunables":[],"props":[]},{"id":"send_setup","group":"snd_kern","sub":0,"title":"dmu_send_impl(): BEGIN, threads, END","ctx":"syscall","src":"module/zfs/dmu_send.c","fns":[{"name":"dmu_send_impl","ref":{"file":"module/zfs/dmu_send.c","line":2449,"symbol":"dmu_send_impl","code":"dmu_send_impl(struct dmu_send_params *dspp)"}},{"name":"setup_featureflags","ref":{"file":"module/zfs/dmu_send.c","line":2001,"symbol":"setup_featureflags","code":"setup_featureflags(struct dmu_send_params *dspp, objset_t *os,"}},{"name":"create_begin_record","ref":{"file":"module/zfs/dmu_send.c","line":2083,"symbol":"create_begin_record","code":"create_begin_record(struct dmu_send_params *dspp, objset_t *os,"}},{"name":"setup_resume_points","ref":{"file":"module/zfs/dmu_send.c","line":2230,"symbol":"setup_resume_points","code":"setup_resume_points(struct dmu_send_params *dspp,"}},{"name":"setup_to_thread","ref":{"file":"module/zfs/dmu_send.c","line":2125,"symbol":"setup_to_thread","code":"setup_to_thread(struct send_thread_arg *to_arg, objset_t *to_os,"}},{"name":"setup_from_thread","ref":{"file":"module/zfs/dmu_send.c","line":2154,"symbol":"setup_from_thread","code":"setup_from_thread(struct redact_list_thread_arg *from_arg,"}},{"name":"setup_redact_list_thread","ref":{"file":"module/zfs/dmu_send.c","line":2174,"symbol":"setup_redact_list_thread","code":"setup_redact_list_thread(struct redact_list_thread_arg *rlt_arg,"}},{"name":"setup_merge_thread","ref":{"file":"module/zfs/dmu_send.c","line":2194,"symbol":"setup_merge_thread","code":"setup_merge_thread(struct send_merge_thread_arg *smt_arg,"}},{"name":"setup_reader_thread","ref":{"file":"module/zfs/dmu_send.c","line":2215,"symbol":"setup_reader_thread","code":"setup_reader_thread(struct send_reader_thread_arg *srt_arg,"}}],"role":"Chooses the stream's feature flags from the request and from what the dataset uses (LARGE_BLOCKS with -L or -w if large blocks are active, EMBED_DATA with -e unless the dataset is encrypted, COMPRESSED with -c or -w, RAW with -w on an encrypted dataset, LZ4, ZSTD, LARGE_DNODE, RESUMING, REDACTED). Writes BEGIN with an optional nvlist payload, starts the worker threads, then runs the main loop: take a range from the reader queue, do_dump() it, stop on a signal. Ends with END, or with no END at all for a saved send.","tunables":[],"props":[]},{"id":"send_traverse","group":"snd_pipe","sub":0,"title":"to_ds traversal thread","ctx":"thr","src":"module/zfs/dmu_send.c","fns":[{"name":"send_traverse_thread","ref":{"file":"module/zfs/dmu_send.c","line":1215,"symbol":"send_traverse_thread","code":"send_traverse_thread(void *arg)"}},{"name":"send_cb","ref":{"file":"module/zfs/dmu_send.c","line":1082,"symbol":"send_cb","code":"send_cb(spa_t *spa, zilog_t *zilog, const blkptr_t *bp,"}}],"role":"Walks the snapshot being sent with traverse_dataset_resume() and turns every block pointer it is handed into a send_range: OBJECT for a dnode (with a copy of the dnode), OBJECT_RANGE for a meta-dnode data block, DATA for a level-0 block (with a copy of its block pointer), HOLE for a hole, REDACT for a redacted block. Queues them in order and finishes with an end-of-stream marker. The queues between the worker threads are limited in bytes.","tunables":[{"name":"zfs_send_no_prefetch_queue_length","ref":{"file":"module/zfs/dmu_send.c","line":3218,"symbol":"no_prefetch_queue_length","code":"ZFS_MODULE_PARAM(zfs_send, zfs_send_, no_prefetch_queue_length, UINT, ZMOD_RW,"}},{"name":"zfs_send_no_prefetch_queue_ff","ref":{"file":"module/zfs/dmu_send.c","line":3224,"symbol":"no_prefetch_queue_ff","code":"ZFS_MODULE_PARAM(zfs_send, zfs_send_, no_prefetch_queue_ff, UINT, ZMOD_RW,"}}],"props":[]},{"id":"traverse","group":"snd_pipe","sub":0,"title":"traverse_visitbp(): birth-txg pruning","ctx":"thr","src":"module/zfs/dmu_traverse.c","fns":[{"name":"traverse_visitbp","ref":{"file":"module/zfs/dmu_traverse.c","line":226,"symbol":"traverse_visitbp","code":"traverse_visitbp(traverse_data_t *td, const dnode_phys_t *dnp,"}},{"name":"traverse_dataset_resume","ref":{"file":"module/zfs/dmu_traverse.c","line":732,"symbol":"traverse_dataset_resume","code":"traverse_dataset_resume(dsl_dataset_t *ds, uint64_t txg_start,"}},{"name":"traverse_impl","ref":{"file":"module/zfs/dmu_traverse.c","line":629,"symbol":"traverse_impl","code":"traverse_impl(spa_t *spa, dsl_dataset_t *ds, uint64_t objset, blkptr_t *rootbp,"}},{"name":"traverse_prefetch_metadata","ref":{"file":"module/zfs/dmu_traverse.c","line":186,"symbol":"traverse_prefetch_metadata","code":"traverse_prefetch_metadata(traverse_data_t *td, const dnode_phys_t *dnp,"}},{"name":"resume_skip_check","ref":{"file":"module/zfs/dmu_traverse.c","line":163,"symbol":"resume_skip_check","code":"resume_skip_check(const traverse_data_t *td, const dnode_phys_t *dnp,"}}],"role":"Pre-order walk of the block tree. A block pointer whose birth txg is at or before fromtxg is skipped together with everything below it: copy-on-write rewrites every indirect block above a changed block in the same txg, so an old parent proves the whole subtree is unchanged. A raw send of an encrypted dataset compares the physical birth (zfs rewrite -P keeps the logical one); other sends compare the logical birth. Holes carry a birth txg too, so deleted data is found the same way; holes with birth 0 (written before the hole_birth feature) are always visited while send_holes_without_birth_time is 1, its default. Indirect blocks are read through the ARC, with read-ahead of the next few. On a resumed send, resume_skip_check() skips everything before the resume point.","tunables":[{"name":"zfs_traverse_indirect_prefetch_limit","ref":{"file":"module/zfs/dmu_traverse.c","line":827,"symbol":"traverse_indirect_prefetch_limit","code":"ZFS_MODULE_PARAM(zfs, zfs_, traverse_indirect_prefetch_limit, UINT, ZMOD_RW,"}},{"name":"send_holes_without_birth_time","ref":{"file":"module/zfs/dmu_traverse.c","line":830,"symbol":"send_holes_without_birth_time","code":"ZFS_MODULE_PARAM(zfs, , send_holes_without_birth_time, INT, ZMOD_RW,"}}],"props":[]},{"id":"redact_list","group":"snd_pipe","sub":0,"title":"Redaction-list threads","ctx":"thr","src":"module/zfs/dmu_send.c","fns":[{"name":"redact_list_thread","ref":{"file":"module/zfs/dmu_send.c","line":1316,"symbol":"redact_list_thread","code":"redact_list_thread(void *arg)"}},{"name":"redact_list_cb","ref":{"file":"module/zfs/dmu_send.c","line":1187,"symbol":"redact_list_cb","code":"redact_list_cb(redact_block_phys_t *rb, void *arg)"}}],"role":"Two optional inputs to the merge. The from thread always runs: when the source is a redaction bookmark it lists the blocks that the earlier stream left out (so they can be sent now), otherwise it only queues an end-of-stream marker. The redact thread runs only for a redacted send and lists the blocks to leave out.","tunables":[],"props":[]},{"id":"send_merge","group":"snd_pipe","sub":1,"title":"send_merge_thread()","ctx":"thr","src":"module/zfs/dmu_send.c","fns":[{"name":"send_merge_thread","ref":{"file":"module/zfs/dmu_send.c","line":1523,"symbol":"send_merge_thread","code":"send_merge_thread(void *arg)"}},{"name":"find_next_range","ref":{"file":"module/zfs/dmu_send.c","line":1419,"symbol":"find_next_range","code":"find_next_range(struct send_range **ranges, bqueue_t **qs, uint64_t *out_mask)"}}],"role":"Merges the traversal, from and redact queues in (object, block) order. A block that appears in a redaction list is turned into a REDACT range; one already redacted on both sides is dropped. Without redaction it passes the traversal's ranges through unchanged.","tunables":[],"props":[]},{"id":"send_reader","group":"snd_pipe","sub":1,"title":"send_reader_thread()","ctx":"thr","src":"module/zfs/dmu_send.c","fns":[{"name":"send_reader_thread","ref":{"file":"module/zfs/dmu_send.c","line":1800,"symbol":"send_reader_thread","code":"send_reader_thread(void *arg)"}},{"name":"issue_data_read","ref":{"file":"module/zfs/dmu_send.c","line":1623,"symbol":"issue_data_read","code":"issue_data_read(struct send_reader_thread_arg *srta, struct send_range *range)"}},{"name":"dmu_send_read_done","ref":{"file":"module/zfs/dmu_send.c","line":1605,"symbol":"dmu_send_read_done","code":"dmu_send_read_done(zio_t *zio)"}},{"name":"piggyback_unmodified_spill","ref":{"file":"module/zfs/dmu_send.c","line":1766,"symbol":"piggyback_unmodified_spill","code":"piggyback_unmodified_spill(struct send_reader_thread_arg *srta,"}}],"role":"Starts the read of each DATA range as soon as it is known, so the main thread rarely waits. It asks the ARC with ARC_FLAG_CACHED_ONLY and, if the block is not cached, reads it with a direct zio_read() into a private buffer, so a large send does not push other data out of the ARC. With -c it asks for compressed data (ZIO_FLAG_RAW_COMPRESS), except for metadata, embedded blocks, blocks needing a byteswap or blocks split for lack of -L; with -w it asks for the raw on-disk bytes (ZIO_FLAG_RAW). Its output queue is limited by the bytes of data in flight.","tunables":[{"name":"zfs_send_queue_length","ref":{"file":"module/zfs/dmu_send.c","line":3212,"symbol":"queue_length","code":"ZFS_MODULE_PARAM(zfs_send, zfs_send_, queue_length, UINT, ZMOD_RW,"}},{"name":"zfs_send_queue_ff","ref":{"file":"module/zfs/dmu_send.c","line":3221,"symbol":"queue_ff","code":"ZFS_MODULE_PARAM(zfs_send, zfs_send_, queue_ff, UINT, ZMOD_RW,"}}],"props":[]},{"id":"do_dump","group":"snd_pipe","sub":1,"title":"do_dump(): range to record","ctx":"syscall","src":"module/zfs/dmu_send.c","fns":[{"name":"do_dump","ref":{"file":"module/zfs/dmu_send.c","line":888,"symbol":"do_dump","code":"do_dump(dmu_send_cookie_t *dscp, struct send_range *range)"}},{"name":"send_do_embed","ref":{"file":"module/zfs/dmu_send.c","line":830,"symbol":"send_do_embed","code":"send_do_embed(const blkptr_t *bp, uint64_t featureflags)"}}],"role":"Runs in the ioctl thread. Picks the record for each range and, for DATA, waits for its read. A read error fails the send with EIO, unless zfs_send_corrupt_data is set, in which case the block is sent filled with the pattern 0x2f5baddb10c. A block larger than 128K without -L is cut into 128K WRITE records; an embedded block pointer with -e becomes WRITE_EMBEDDED; OBJECT_RANGE ranges are dropped unless the send is raw.","tunables":[{"name":"zfs_send_corrupt_data","ref":{"file":"module/zfs/dmu_send.c","line":3209,"symbol":"corrupt_data","code":"ZFS_MODULE_PARAM(zfs_send, zfs_send_, corrupt_data, INT, ZMOD_RW,"}}],"props":[]},{"id":"dump_obj","group":"snd_pipe","sub":2,"title":"Object records (OBJECT, FREEOBJECTS, OBJECT_RANGE)","ctx":"syscall","src":"module/zfs/dmu_send.c","fns":[{"name":"dump_dnode","ref":{"file":"module/zfs/dmu_send.c","line":700,"symbol":"dump_dnode","code":"dump_dnode(dmu_send_cookie_t *dscp, const blkptr_t *bp, uint64_t object,"}},{"name":"dump_freeobjects","ref":{"file":"module/zfs/dmu_send.c","line":637,"symbol":"dump_freeobjects","code":"dump_freeobjects(dmu_send_cookie_t *dscp, uint64_t firstobj, uint64_t numobjs)"}},{"name":"dump_object_range","ref":{"file":"module/zfs/dmu_send.c","line":795,"symbol":"dump_object_range","code":"dump_object_range(dmu_send_cookie_t *dscp, const blkptr_t *bp,"}}],"role":"OBJECT carries the dnode's type, block size, bonus type and the bonus buffer (block size clamped to 128K without -L). A raw OBJECT also carries nlevels, maxblkid and the whole encrypted bonus area. Unallocated object numbers become FREEOBJECTS records, merged when adjacent. OBJECT_RANGE (raw only) carries the salt, IV and MAC of one block of dnodes. On a resumed send, objects before the resume object are not sent again.","tunables":[],"props":[]},{"id":"dump_data","group":"snd_pipe","sub":2,"title":"Data records (WRITE, WRITE_EMBEDDED, SPILL)","ctx":"syscall","src":"module/zfs/dmu_send.c","fns":[{"name":"dmu_dump_write","ref":{"file":"module/zfs/dmu_send.c","line":445,"symbol":"dmu_dump_write","code":"dmu_dump_write(dmu_send_cookie_t *dscp, dmu_object_type_t type, uint64_t object,"}},{"name":"dump_write_embedded","ref":{"file":"module/zfs/dmu_send.c","line":552,"symbol":"dump_write_embedded","code":"dump_write_embedded(dmu_send_cookie_t *dscp, uint64_t object, uint64_t offset,"}},{"name":"dump_spill","ref":{"file":"module/zfs/dmu_send.c","line":592,"symbol":"dump_spill","code":"dump_spill(dmu_send_cookie_t *dscp, const blkptr_t *bp, uint64_t object,"}}],"role":"WRITE carries object, offset, logical size and the block. For a compressed or raw block it also carries the compression type and compressed size, and for raw the salt, IV, MAC and byteswap flag. When a block pointer is available (not for split, embedded or decrypted blocks) the record also carries its checksum, flagged when that checksum is strong enough for dedup. WRITE_EMBEDDED carries the few bytes decoded from an embedded block pointer. SPILL carries an object's spill block; unmodified spill blocks are also sent, flagged, so old receivers do not drop them.","tunables":[{"name":"zfs_send_unmodified_spill_blocks","ref":{"file":"module/zfs/dmu_send.c","line":3215,"symbol":"unmodified_spill_blocks","code":"ZFS_MODULE_PARAM(zfs_send, zfs_send_, unmodified_spill_blocks, INT, ZMOD_RW,"}}],"props":[]},{"id":"dump_free","group":"snd_pipe","sub":2,"title":"FREE and REDACT records","ctx":"syscall","src":"module/zfs/dmu_send.c","fns":[{"name":"dump_free","ref":{"file":"module/zfs/dmu_send.c","line":318,"symbol":"dump_free","code":"dump_free(dmu_send_cookie_t *dscp, uint64_t object, uint64_t offset,"}},{"name":"dump_redact","ref":{"file":"module/zfs/dmu_send.c","line":398,"symbol":"dump_redact","code":"dump_redact(dmu_send_cookie_t *dscp, uint64_t object, uint64_t offset,"}}],"role":"FREE tells the receiver that a byte range of an object holds no data: holes found by the traversal, and the region past the end of every object sent. Adjacent frees are merged into one pending record. Frees are sent in full streams too (DRR_FLAG_FREERECORDS), so that a full stream can be received as a clone. REDACT marks ranges left out of a redacted stream.","tunables":[],"props":[]},{"id":"dump_record","group":"snd_pipe","sub":2,"title":"dump_record(): checksum and output","ctx":"syscall","src":"module/zfs/dmu_send.c","fns":[{"name":"dump_record","ref":{"file":"module/zfs/dmu_send.c","line":250,"symbol":"dump_record","code":"dump_record(dmu_send_cookie_t *dscp, void *payload, int payload_len)"}}],"role":"Adds the record header to the running fletcher-4 checksum, stores that checksum in the header (every record except BEGIN), adds the payload, and writes header and payload through the stream's output function. The checksum always covers everything before the field it is stored in, so END's checksum covers the whole stream.","tunables":[],"props":[]},{"id":"arc_read","group":"snd_io","sub":0,"title":"arc_read()","ctx":"any","src":"module/zfs/arc.c","fns":[{"name":"arc_read","ref":{"file":"module/zfs/arc.c","line":5905,"symbol":"arc_read","code":"arc_read(zio_t *pio, spa_t *spa, const blkptr_t *bp,"}},{"name":"arc_getbuf_func","ref":{"file":"module/zfs/arc.c","line":5577,"symbol":"arc_getbuf_func","code":"arc_getbuf_func(zio_t *zio, const zbookmark_phys_t *zb, const blkptr_t *bp,"}}],"role":"Shared with the I/O flow graph. Serves the traversal's indirect and dnode blocks, the sender's ARC_FLAG_CACHED_ONLY lookups (a hit hands back a buffer, a miss returns an error instead of reading), the receive prefetches and the corrective receive's check read.","tunables":[],"props":[]},{"id":"zio_create","group":"snd_io","sub":1,"title":"zio create + execute","ctx":"any","src":"module/zfs/zio.c","fns":[{"name":"zio_read","ref":{"file":"module/zfs/zio.c","line":1345,"symbol":"zio_read","code":"zio_read(zio_t *pio, spa_t *spa, const blkptr_t *bp,"}},{"name":"zio_write","ref":{"file":"module/zfs/zio.c","line":1361,"symbol":"zio_write","code":"zio_write(zio_t *pio, spa_t *spa, uint64_t txg, blkptr_t *bp,"}},{"name":"zio_rewrite","ref":{"file":"module/zfs/zio.c","line":1398,"symbol":"zio_rewrite","code":"zio_rewrite(zio_t *pio, spa_t *spa, uint64_t txg, blkptr_t *bp, abd_t *data,"}},{"name":"zio_nowait","ref":{"file":"module/zfs/zio.c","line":2890,"symbol":"zio_nowait","code":"zio_nowait(zio_t *zio)"}},{"name":"zio_wait","ref":{"file":"module/zfs/zio.c","line":2841,"symbol":"zio_wait","code":"zio_wait(zio_t *zio)"}}],"role":"Shared with the I/O flow graph. The sender's direct reads of uncached blocks, the receiver's writes at txg sync, and the corrective receive's in-place rewrite and verification read enter the zio pipeline here.","tunables":[],"props":[]},{"id":"stream_fd","group":"stream","sub":0,"title":"Stream bytes (pipe, file, ssh)","ctx":"user","src":"","fns":[],"role":"Whatever carries the bytes from `zfs send` to `zfs receive`: a pipe, a file, ssh or a network tool. ZFS adds no framing beyond the records themselves, each a fixed-size dmu_replay_record_t header followed by its payload.","tunables":[],"props":[]},{"id":"resume_token","group":"stream","sub":0,"title":"receive_resume_token","ctx":"syscall","src":"module/zfs/dsl_dataset.c","fns":[{"name":"get_receive_resume_token","ref":{"file":"module/zfs/dsl_dataset.c","line":2609,"symbol":"get_receive_resume_token","code":"get_receive_resume_token(dsl_dataset_t *ds)"}},{"name":"get_receive_resume_token_impl","ref":{"file":"module/zfs/dsl_dataset.c","line":2488,"symbol":"get_receive_resume_token_impl","code":"get_receive_resume_token_impl(dsl_dataset_t *ds)"}}],"role":"Read-only property of a dataset whose resumable receive was interrupted. Built on demand from the DS_FIELD_RESUME_* entries of the dataset or of its tofs/%recv child: fromguid, object, offset, bytes, toguid, toname and the -L / -e / -c / -w flags of the original stream, packed as an nvlist, gzip-compressed, checksummed with fletcher-4 and hex-encoded.","tunables":[],"props":[{"name":"receive_resume_token","ref":{"file":"module/zcommon/zfs_prop.c","line":610,"symbol":"\"receive_resume_token\"","code":"\"receive_resume_token\","}}]},{"id":"zfs_recv_cmd","group":"rcv_user","sub":0,"title":"zfs receive (cmd/zfs)","ctx":"user","src":"cmd/zfs/zfs_main.c","fns":[{"name":"zfs_do_receive","ref":{"file":"cmd/zfs/zfs_main.c","line":5165,"symbol":"zfs_do_receive","code":"zfs_do_receive(int argc, char **argv)"}}],"role":"Parses the receive options: -F force, -s resumable, -A abort (destroys the saved resumable state), -c heal an existing snapshot, -o / -x property overrides, -d / -e name mapping, -u no mount. Refuses to read the stream from a terminal.","tunables":[],"props":[]},{"id":"libzfs_recv","group":"rcv_user","sub":0,"title":"libzfs: zfs_receive() / zfs_receive_one()","ctx":"user","src":"lib/libzfs/libzfs_sendrecv.c","fns":[{"name":"zfs_receive","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":5672,"symbol":"zfs_receive","code":"zfs_receive(libzfs_handle_t *hdl, const char *tosnap, nvlist_t *props,"}},{"name":"zfs_receive_impl","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":5528,"symbol":"zfs_receive_impl","code":"zfs_receive_impl(libzfs_handle_t *hdl, const char *tosnap,"}},{"name":"zfs_receive_one","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":4464,"symbol":"zfs_receive_one","code":"zfs_receive_one(libzfs_handle_t *hdl, int infd, const char *tosnap,"}}],"role":"Reads and checks the BEGIN record (magic, byte order, stream type). A compound stream goes to the package code. A single stream goes to zfs_receive_one(), which works out the destination name and enforces the userspace rules: a full stream into an existing dataset needs -F and a dataset without snapshots, -F may not destroy an encrypted dataset, and an existing filesystem that a full stream replaces is unmounted first. Then it passes the BEGIN record and the file descriptor to libzfs_core.","tunables":[],"props":[]},{"id":"libzfs_recv_pkg","group":"rcv_user","sub":0,"title":"libzfs: replication receive","ctx":"user","src":"lib/libzfs/libzfs_sendrecv.c","fns":[{"name":"zfs_receive_package","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":3868,"symbol":"zfs_receive_package","code":"zfs_receive_package(libzfs_handle_t *hdl, int fd, const char *destname,"}},{"name":"recv_incremental_replication","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":3557,"symbol":"recv_incremental_replication","code":"recv_incremental_replication(libzfs_handle_t *hdl, const char *tofs,"}},{"name":"recv_destroy","ref":{"file":"lib/libzfs/libzfs_sendrecv.c","line":3128,"symbol":"recv_destroy","code":"recv_destroy(libzfs_handle_t *hdl, const char *name, int baselen,"}}],"role":"For a compound stream: reads the list of filesystems and snapshots, renames and promotes to match the sender, and with -F destroys snapshots and filesystems that are not in the stream. Then receives each substream in turn through zfs_receive_impl().","tunables":[],"props":[]},{"id":"lzc_recv","group":"rcv_user","sub":0,"title":"libzfs_core: recv_impl()","ctx":"user","src":"lib/libzfs_core/libzfs_core.c","fns":[{"name":"recv_impl","ref":{"file":"lib/libzfs_core/libzfs_core.c","line":1111,"symbol":"recv_impl","code":"recv_impl(const char *snapname, nvlist_t *recvdprops, nvlist_t *localprops,"}},{"name":"lzc_receive_with_cmdprops","ref":{"file":"lib/libzfs_core/libzfs_core.c","line":1420,"symbol":"lzc_receive_with_cmdprops","code":"lzc_receive_with_cmdprops(const char *snapname, nvlist_t *props,"}},{"name":"lzc_receive_with_heal","ref":{"file":"lib/libzfs_core/libzfs_core.c","line":1440,"symbol":"lzc_receive_with_heal","code":"int lzc_receive_with_heal(const char *snapname, nvlist_t *props,"}}],"role":"Issues the receive ioctl. Resumable, healing and raw receives, and streams with a BEGIN payload, use ZFS_IOC_RECV_NEW with an nvlist (snapname, begin_record, input_fd, force, resumable, heal, properties); anything else uses the legacy ZFS_IOC_RECV. The stream itself is never copied through userspace.","tunables":[],"props":[]},{"id":"ioc_recv","group":"rcv_kern","sub":0,"title":"Receive ioctl","ctx":"syscall","src":"module/zfs/zfs_ioctl.c","fns":[{"name":"zfs_ioc_recv_impl","ref":{"file":"module/zfs/zfs_ioctl.c","line":5740,"symbol":"zfs_ioc_recv_impl","code":"zfs_ioc_recv_impl(char *tofs, char *tosnap, const char *origin,"}},{"name":"zfs_ioc_recv_new","ref":{"file":"module/zfs/zfs_ioctl.c","line":6198,"symbol":"zfs_ioc_recv_new","code":"zfs_ioc_recv_new(const char *fsname, nvlist_t *innvl, nvlist_t *outnvl)"}},{"name":"zfs_ioc_recv","ref":{"file":"module/zfs/zfs_ioctl.c","line":6091,"symbol":"zfs_ioc_recv","code":"zfs_ioc_recv(zfs_cmd_t *zc)"}}],"role":"Kernel entry and the order of the whole receive: dmu_recv_begin(), set received and -o / -x properties, dmu_recv_stream(), then for a mounted target suspend the filesystem (or zvol), dmu_recv_end(), and resume it on the new contents. A mounted target stays usable while the stream is applied; it is only suspended for the switch.","tunables":[],"props":[]},{"id":"recv_begin","group":"rcv_kern","sub":0,"title":"dmu_recv_begin()","ctx":"syscall","src":"module/zfs/dmu_recv.c","fns":[{"name":"dmu_recv_begin","ref":{"file":"module/zfs/dmu_recv.c","line":1336,"symbol":"dmu_recv_begin","code":"dmu_recv_begin(const char *tofs, const char *tosnap,"}}],"role":"Checks the BEGIN magic (byteswapped streams are accepted and swapped), starts the stream checksum with the BEGIN record, reads and unpacks the BEGIN payload, and runs the begin sync task: the resume variant when the stream has the RESUMING feature flag. For a full, non-raw receive it also turns -o encryption properties into crypto parameters for the new dataset.","tunables":[],"props":[]},{"id":"recv_end","group":"rcv_kern","sub":0,"title":"dmu_recv_end()","ctx":"syscall","src":"module/zfs/dmu_recv.c","fns":[{"name":"dmu_recv_end","ref":{"file":"module/zfs/dmu_recv.c","line":5731,"symbol":"dmu_recv_end","code":"dmu_recv_end(dmu_recv_cookie_t *drc, void *owner)"}},{"name":"dmu_recv_new_end","ref":{"file":"module/zfs/dmu_recv.c","line":5723,"symbol":"dmu_recv_new_end","code":"dmu_recv_new_end(dmu_recv_cookie_t *drc)"}},{"name":"dmu_recv_existing_end","ref":{"file":"module/zfs/dmu_recv.c","line":5705,"symbol":"dmu_recv_existing_end","code":"dmu_recv_existing_end(dmu_recv_cookie_t *drc)"}}],"role":"Runs the end sync task, the new-dataset or the existing-dataset variant. On failure cleans up as for an interrupted stream. On success creates zvol device nodes for a new volume and its snapshot.","tunables":[],"props":[]},{"id":"recv_cleanup","group":"rcv_kern","sub":0,"title":"dmu_recv_cleanup_ds(): failed receive","ctx":"syscall","src":"module/zfs/dmu_recv.c","fns":[{"name":"dmu_recv_cleanup_ds","ref":{"file":"module/zfs/dmu_recv.c","line":4355,"symbol":"dmu_recv_cleanup_ds","code":"dmu_recv_cleanup_ds(dmu_recv_cookie_t *drc)"}}],"role":"Runs when the stream or the end task fails. Waits for the current txg to sync so the last saved resume state is on disk, then either keeps the inconsistent dataset (resumable receive that got past its first records) or destroys it (the new dataset or tofs/%recv). A corrective receive never destroys its snapshot.","tunables":[],"props":[]},{"id":"sync_task","group":"rcv_kern","sub":1,"title":"dsl_sync_task()","ctx":"syscall","src":"module/zfs/dsl_synctask.c","fns":[{"name":"dsl_sync_task","ref":{"file":"module/zfs/dsl_synctask.c","line":126,"symbol":"dsl_sync_task","code":"dsl_sync_task(const char *pool, dsl_checkfunc_t *checkfunc,"}},{"name":"dsl_sync_task_common","ref":{"file":"module/zfs/dsl_synctask.c","line":34,"symbol":"dsl_sync_task_common","code":"dsl_sync_task_common(const char *pool, dsl_checkfunc_t *checkfunc,"}},{"name":"dsl_sync_task_sync","ref":{"file":"module/zfs/dsl_synctask.c","line":207,"symbol":"dsl_sync_task_sync","code":"dsl_sync_task_sync(dsl_sync_task_t *dst, dmu_tx_t *tx)"}}],"role":"The mechanism for changing the pool's dataset structure. The caller runs the check function in open context, queues the check and sync pair on the open txg and waits for that txg to sync; dsl_pool_sync() then runs the check again and the sync function in syncing context. Everything a sync function changes lands on disk in that one txg.","tunables":[],"props":[]},{"id":"recv_begin_sync","group":"rcv_kern","sub":1,"title":"Begin check and sync","ctx":"sync","src":"module/zfs/dmu_recv.c","fns":[{"name":"dmu_recv_begin_check","ref":{"file":"module/zfs/dmu_recv.c","line":666,"symbol":"dmu_recv_begin_check","code":"dmu_recv_begin_check(void *arg, dmu_tx_t *tx)"}},{"name":"recv_begin_check_existing_impl","ref":{"file":"module/zfs/dmu_recv.c","line":386,"symbol":"recv_begin_check_existing_impl","code":"recv_begin_check_existing_impl(dmu_recv_begin_arg_t *drba, dsl_dataset_t *ds,"}},{"name":"dmu_recv_begin_sync","ref":{"file":"module/zfs/dmu_recv.c","line":882,"symbol":"dmu_recv_begin_sync","code":"dmu_recv_begin_sync(void *arg, dmu_tx_t *tx)"}},{"name":"dmu_recv_resume_begin_check","ref":{"file":"module/zfs/dmu_recv.c","line":1115,"symbol":"dmu_recv_resume_begin_check","code":"dmu_recv_resume_begin_check(void *arg, dmu_tx_t *tx)"}},{"name":"dmu_recv_resume_begin_sync","ref":{"file":"module/zfs/dmu_recv.c","line":1290,"symbol":"dmu_recv_resume_begin_sync","code":"dmu_recv_resume_begin_sync(void *arg, dmu_tx_t *tx)"}}],"role":"Decides where the stream goes. Target missing: the stream must be full or a clone stream, and the dataset is created under its final name. Target present: no tofs/%recv and no resume state may exist, the new snapshot name must be free, and for an incremental stream a snapshot with the stream's fromguid must exist; without -F the target must be unmodified since its latest snapshot, which must be that one (ETXTBSY otherwise), and with -F an older snapshot is accepted. A full stream onto an existing dataset needs -F and is refused for encrypted datasets. Raw streams need the encryption feature and no embedded data.","tunables":[],"props":[]},{"id":"recv_end_sync","group":"rcv_kern","sub":1,"title":"End check and sync (the switch)","ctx":"sync","src":"module/zfs/dmu_recv.c","fns":[{"name":"dmu_recv_end_check","ref":{"file":"module/zfs/dmu_recv.c","line":5456,"symbol":"dmu_recv_end_check","code":"dmu_recv_end_check(void *arg, dmu_tx_t *tx)"}},{"name":"dmu_recv_end_sync","ref":{"file":"module/zfs/dmu_recv.c","line":5535,"symbol":"dmu_recv_end_sync","code":"dmu_recv_end_sync(void *arg, dmu_tx_t *tx)"}},{"name":"dsl_dataset_clone_swap_sync_impl","ref":{"file":"module/zfs/dsl_dataset.c","line":4338,"symbol":"dsl_dataset_clone_swap_sync_impl","code":"dsl_dataset_clone_swap_sync_impl(dsl_dataset_t *clone,"}},{"name":"dsl_dataset_snapshot_sync_impl","ref":{"file":"module/zfs/dsl_dataset.c","line":1736,"symbol":"dsl_dataset_snapshot_sync_impl","code":"dsl_dataset_snapshot_sync_impl(dsl_dataset_t *ds, const char *snapname,"}},{"name":"dsl_destroy_snapshot_sync_impl","ref":{"file":"module/zfs/dsl_destroy.c","line":307,"symbol":"dsl_destroy_snapshot_sync_impl","code":"dsl_destroy_snapshot_sync_impl(dsl_dataset_t *ds, boolean_t defer, dmu_tx_t *tx)"}},{"name":"dsl_destroy_head_sync_impl","ref":{"file":"module/zfs/dsl_destroy.c","line":1064,"symbol":"dsl_destroy_head_sync_impl","code":"dsl_destroy_head_sync_impl(dsl_dataset_t *ds, dmu_tx_t *tx)"}}],"role":"The atomic switch, t the end it replays any deferred records, flushes the last batch and wakes the reader.","tunables":[{"name":"zfs_recv_queue_length","ref":{"file":"module/zfs/dmu_recv.c","line":5771,"symbol":"queue_length","code":"ZFS_MODULE_PARAM(zfs_recv, zfs_recv_, queue_length, UINT, ZMOD_RW,"}},{"name":"zfs_recv_queue_ff","ref":{"file":"module/zfs/dmu_recv.c","line":5774,"symbol":"queue_ff","code":"ZFS_MODULE_PARAM(zfs_recv, zfs_recv_, queue_ff, UINT, ZMOD_RW,"}}],"props":[]},{"id":"recv_resume_state","group":"rcv_pipe","sub":0,"title":"save_resume_state()","ctx":"thr","src":"module/zfs/dmu_recv.c","fns":[{"name":"save_resume_state","ref":{"file":"module/zfs/dmu_recv.c","line":1789,"symbol":"save_resume_state","code":"save_resume_state(struct receive_writer_arg *rwa,"}}],"role":"With -s, records the object and offset of the last OBJECT, WRITE or WRITE_EMBEDDED record applied in a tx, and the stream bytes read so far, in the dataset's in-memory slot for that tx's txg. dsl_dataset_sync() writes the slot to the dataset's ZAP when the txg syncs, so the resume point on disk always matches data that is on disk. While records are deferred the point is held at the first deferred record.","tunables":[],"props":[]},{"id":"recv_object","group":"rcv_pipe","sub":1,"title":"receive_object()","ctx":"thr","src":"module/zfs/dmu_recv.c","fns":[{"name":"receive_object","ref":{"file":"module/zfs/dmu_recv.c","line":3398,"symbol":"receive_object","code":"receive_object(struct receive_writer_arg *rwa, struct drr_object *drro,"}},{"name":"receive_handle_existing_object","ref":{"file":"module/zfs/dmu_recv.c","line":3152,"symbol":"receive_handle_existing_object","code":"receive_handle_existing_object(struct receive_writer_arg *rwa,"}},{"name":"receive_defer_park","ref":{"file":"module/zfs/dmu_recv.c","line":2915,"symbol":"receive_defer_park","code":"receive_defer_park(struct receive_writer_arg *rwa,"}},{"name":"receive_defer_flush","ref":{"file":"module/zfs/dmu_recv.c","line":2955,"symbol":"receive_defer_flush","code":"receive_defer_flush(struct receive_writer_arg *rwa)"}}],"role":"Applies OBJECT: claims a free object number with the stream's type, block size, bonus and dnode size, or reclaims an existing object whose type, block size or bonus changed (freeing its old contents first), sets checksum and compression, copies in the bonus buffer, and for raw streams sets the dnode layout and the dnode block's encryption parameters. When an object number must be reused at a different dnode size, the old dnode's free has to sync first; instead of a txg wait per object the claim and every later record touching those slots are parked and replayed after one txg wait (not for raw or corrective receives).","tunables":[{"name":"zfs_recv_defer_batch_size","ref":{"file":"module/zfs/dmu_recv.c","line":5780,"symbol":"defer_batch_size","code":"ZFS_MODULE_PARAM(zfs_recv, zfs_recv_, defer_batch_size, UINT, ZMOD_RW,"}}],"props":[]},{"id":"recv_freeobjects","group":"rcv_pipe","sub":1,"title":"receive_freeobjects() / receive_free()","ctx":"thr","src":"module/zfs/dmu_recv.c","fns":[{"name":"receive_freeobjects","ref":{"file":"module/zfs/dmu_recv.c","line":3716,"symbol":"receive_freeobjects","code":"receive_freeobjects(struct receive_writer_arg *rwa,"}},{"name":"receive_free","ref":{"file":"module/zfs/dmu_recv.c","line":4265,"symbol":"receive_free","code":"receive_free(struct receive_writer_arg *rwa, struct drr_free *drrf)"}},{"name":"receive_redact","ref":{"file":"module/zfs/dmu_recv.c","line":4343,"symbol":"receive_redact","code":"receive_redact(struct receive_writer_arg *rwa, struct drr_redact *drrr)"}},{"name":"receive_defer_free_object","ref":{"file":"module/zfs/dmu_recv.c","line":2816,"symbol":"receive_defer_free_object","code":"receive_defer_free_object(struct receive_writer_arg *rwa, uint64_t object)"}}],"role":"FREEOBJECTS frees every allocated object in its range (skipping the inner slots of large dnodes). FREE frees a byte range of an object with dmu_free_long_range(), which this txg; earlier txgs wrote theirs the same way as they synced"},{"wire":"E107"},{"wire":"E062"},{"wire":"E111"},{"wire":"E112"},{"wire":"E116"}]},{"id":"incr_recv","category":"Receive","title":"Incremental receive into an existing dataset (with or without -F)","summary":"The records go into tofs/%recv, a clone of the matching snapshot, while tofs stays mounted and unchanged. One sync task then swaps the clone's contents into tofs and takes the new snapshot. With -F the from snapshot may be older than the latest one, and newer snapshots and local changes are discarded in the same txg.","ends":"tofs now has the received contents and the new snapshot, with the sender's guid; tofs/%recv is gone. Readers saw the old contents until the switch txg and the new ones after it.","alts":[{"id":"force","options":[{"id":"plain","label":"Without -F"},{"id":"force","label":"With -F (zfs receive -F)"}]},{"id":"blocks","options":[{"id":"same","label":"Records match the object block sizes"},{"id":"larger","label":"Stream sent with -L into a dataset first received without -L"}]}],"steps":[{"wire":"E125"},{"wire":"E046"},{"wire":"E050"},{"wire":"E051"},{"wire":"E055"},{"wire":"E056"},{"wire":"E057"},{"wire":"E059"},{"wire":"E060"},{"wire":"E061"},{"wire":"E062"},{"wire":"E063","when":[{"group":"force","options":["plain"]}],"note":"tofs must be unmodified since its latest snapshot, and that snapshot must be the from snapshot (ETXTBSY)"},{"wire":"E063","when":[{"group":"force","options":["force"]}],"note":"the from snapshot may be older than the latest; changes since it will be discarded"},{"wire":"E065"},{"wire":"E069","note":"tofs stays mounted and readable; every write goes to the hidden tofs/%recv"},{"wire":"E075"},{"wire":"E072"},{"wire":"E047"},{"wire":"E073"},{"wire":"E076"},{"wire":"E077"},{"wire":"E078","note":"changed objects; an object with a new type or block size is reclaimed and its old contents freed"},{"wire":"E085"},{"wire":"E086"},{"wire":"E087"},{"wire":"E088"},{"wire":"E089"},{"wire":"E080"},{"wire":"E090"},{"wire":"E091","when":[{"group":"blocks","options":["same"]}]},{"wire":"E098","when":[{"group":"blocks","options":["same"]}]},{"wire":"E094","when":[{"group":"blocks","options":["larger"]}],"note":"the object keeps the 128K block size it got from the first stream"},{"wire":"E099","when":[{"group":"blocks","options":["larger"]}]},{"wire":"E104"},{"wire":"E079","note":"data and objects deleted on the sender since the from snapshot"},{"wire":"E096"},{"wire":"E097"},{"wire":"E072"},{"wire":"E073"},{"wire":"E108"},{"wire":"E109","note":"online receive: the filesystem is suspended only for the switch"},{"wire":"E110"},{"wire":"E059"},{"wire":"E060"},{"wire":"E061"},{"wire":"E106"},{"wire":"E107"},{"wire":"E062"},{"wire":"E111"},{"wire":"E114","when":[{"group":"force","options":["force"]}]},{"wire":"E113"},{"wire":"E116"}]},{"id":"raw_recv","category":"Receive","title":"Raw receive (the data stays encrypted)","summary":"A raw stream is stored without ever being decrypted: the wrapped keys go into the dataset's crypto key object, each dnode block keeps the sender's salt, IV and MAC, and each data block is written as the ciphertext it arrived as.","ends":"The dataset holds the sender's ciphertext and wrapped keys. It can be sent on raw, or mounted after zfs load-key with the sender's passphrase or key.","alts":[{"id":"target","options":[{"id":"new","label":"Into a new dataset"},{"id":"existing","label":"Incremental into an existing raw-received dataset"}]}],"steps":[{"wire":"E125"},{"wire":"E046"},{"wire":"E050"},{"wire":"E051"},{"wire":"E055","note":"a raw receive always uses ZFS_IOC_RECV_NEW"},{"wire":"E056"},{"wire":"E057","note":"check: the encryption feature is enabled, the stream has no embedded data and has the spill-block flag"},{"wire":"E059"},{"wire":"E060"},{"wire":"E061"},{"wire":"E062"},{"wire":"E063"},{"wire":"E064","when":[{"group":"target","options":["new"]}],"note":"created without an objset; it is built from the key
